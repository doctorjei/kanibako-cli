# tree is checked against catches the deletion as `declared, produced by
# nothing`, which is the same finding staleness produces and wants the same
# reading -- go and look at the artifact. Measured, not reasoned: control 3 in
# the `[[parity]]` note.
#
# ⇒ ADDING A MODULE UNDER `src/` OR `packages/*/src/` OWES A ROW HERE. Until it
