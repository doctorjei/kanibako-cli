# closed-world half is what makes this a declaration rather than a file listing.
#
# ⚑ THE MIRROR RULE, so a row can be written by hand: everything up to and
# including the first `src` component is dropped, and `.md` is appended.
#   src/kanibako/settings/paths.py                 -> api-docs/kanibako/settings/paths.py.md
#   packages/agent-claude/src/kanibako/plugins/... -> api-docs/kanibako/plugins/claude/target.py.md
# `build/`, `tests/` and `data/base/canon/` are not API surface and mirror
# nothing; `scripts/gen-api-doc.py`'s SCOPE section states that list and owns it.
#
