name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run e2e job (normally tag-gated)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' -e packages/agent-claude/ -e packages/agent-goose/ -e packages/agent-codex/
      - run: ruff check src/ tests/ packages/
      - run: mypy src/kanibako/
      - run: mypy packages/agent-claude/src packages/agent-goose/src packages/agent-codex/src
      - run: pytest tests/ -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' -e packages/agent-claude/
      - run: pytest -m integration tests/ -v

  e2e:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tmux + fuse-overlayfs
        # fuse-overlayfs lets rootless podman use the overlay driver
        # instead of the much slower vfs fallback. Without it,
        # `--userns=keep-id` (used by kanibako) hits "creating an ID-
        # mapped copy of layer" errors on ubuntu-latest runners.
        run: sudo apt-get install -y tmux fuse-overlayfs
      - name: Install kanibako
        run: pip install -e '.[dev]' -e packages/agent-claude/
      - name: Build HEAD-kanibako e2e image (overlay on :latest)
        run: |
          # The published :latest carries all box deps + an OLD in-box kanibako.
          # Overlay the HEAD kanibako-cli under test so the in-box box_supervisor
          # is the code being validated (else the launch's forward-compat
          # fallback runs a bare shell and the supervisor e2e tests can't
          # exercise it). Pull the base, build a HEAD wheel, reinstall it in-box,
          # retag as :latest (the tag the e2e's E2E_IMAGE resolves to).
          set -euo pipefail
          podman pull ghcr.io/doctorjei/kanibako-oci:latest
          podman tag ghcr.io/doctorjei/kanibako-oci:latest kanibako-oci:base
          pip wheel --no-deps -w e2e-wheels .
          podman build -t kanibako-oci:latest -f tests/e2e/Containerfile.head .
          # Fail fast if the in-box supervisor is not actually HEAD.
          podman run --rm --entrypoint python3 kanibako-oci:latest \
            -m kanibako.box_supervisor --help | grep -q -- --panel-watch
          echo "OK: in-box box_supervisor is HEAD (understands --panel-watch)"
      - name: Run e2e tests
        # Explicit `-m e2e` because pyproject.toml's default addopts
        # is `-m 'not integration and not e2e'` — without overriding,
        # the suite would collect 0 tests and exit 5.
        # `--durations` surfaces the slowest tests so a cold first-start vs a
        # pull regression is visible at a glance; the conftest also writes
        # storage diagnostics to the run summary (ensure_image_in_pinned_store).
        run: pytest -m e2e tests/e2e/ -v --durations=15
