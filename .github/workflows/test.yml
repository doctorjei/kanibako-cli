name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run e2e job (normally tag-gated)'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' -e packages/agent-claude/ -e packages/agent-goose/ -e packages/agent-codex/
      - run: ruff check src/ tests/ packages/
      - run: mypy src/kanibako/
      - run: mypy packages/agent-claude/src packages/agent-goose/src packages/agent-codex/src
      # ⚑ This step also runs the KEYSPACE ENFORCEMENT layer. tests/_keystore_census.py
      # is a DEFAULT-ON plugin (registered in tests/conftest.py) that interposes on
      # KeyStore.__setitem__, judges every key path written into a store against the
      # declared keyspace, and FAILS the session on one the spec does not declare
      # (spec §0: the keyspace is CLOSED). It needs no flag and no separate step —
      # arming it by env var is what let it sit unenforced. Set
      # KANI_KEYSTORE_CENSUS=0 to opt out; the only reason to is bisecting the
      # census itself. Measured cost over the whole suite: 399.7 s on vs 325.0 s
      # off (+23%), with identical pass/fail outcomes.
      - run: pytest tests/ -v
      # ⚑⚑ THE PLUGIN PACKAGES NEED THEIR OWN INVOCATIONS — `pytest tests/` above does
      # NOT reach them, and every one of these 253 tests was running nowhere in CI.
      # ONE invocation cannot collect all three: each package ships tests/test_target.py
      # (two also ship tests/test_credentials.py), so under pytest's prepend import mode
      # all three resolve to the same module name and collection dies on
      # "import file mismatch". Adding tests/__init__.py does NOT fix it -- sibling
      # distributions would then each resolve to `tests.test_target` and collide the same
      # way. Separate PROCESSES are what makes the basenames unambiguous, and it is also
      # what each package's own `testpaths` setting assumes.
      - run: pytest -v
        working-directory: packages/agent-claude
      - run: pytest -v
        working-directory: packages/agent-codex
      - run: pytest -v
        working-directory: packages/agent-goose

  # ⚑ THE CONFORMANCE CHECKER IS PINNED TO AN EXACT PUBLISHED VERSION, AND THE
  # WORD THAT CARRIES THE WEIGHT IS EXACT. Never a range, and never `@main` --
  # which is what upstream's own starter workflow installs, and it changes what
  # this job means without changing what it says. A version specifier here names
  # one immutable artifact on PyPI; anything looser hands the job a tool nobody
  # chose. Bump this pin deliberately, as its own commit.
  #
  # ONE config and one baseline, so every command below runs plainly. There were
  # two until 2026-09-14, on the ground that `exclude` is global to a config and
  # the registry scan needed `api-docs/` and `llm-docs/` excluded where the
  # documentation gate must not. That premise was false -- a registry scan reads
  # `.py` and those directories hold none, so the exclusion was inert. The
  # measurement is in the header of `kinemata.toml`.
  conformance:
    runs-on: ubuntu-latest
    steps:
      # ⚑ FULL HISTORY IS REQUIRED, NOT AN OPTIMIZATION TO UNDO. The default
      # shallow clone (depth 1) has no commit objects, so every `commit does not
      # resolve` claim in `llm-docs/` fails here while resolving locally. That is
      # what reddened this job the first time it ever ran: 24 of 1650 claims, all
      # of them true, none of them checkable in a shallow tree.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # ⚑⚑ THIS WAS A GIT SHA UNTIL 2026-09-14, AND THE REASON IT WAS IS SPENT.
      # kinemata's `pyproject.toml` read `0.1.0a1` eighteen commits past that
      # tag, and the published `0.1.0a1` wheel did not contain `parity` at all --
      # so a version string could not tell two builds apart and could install a
      # tool missing the command this gate turns on. What retired the SHA was a
      # published build that does identify itself: `0.1.1`, a final release (not
      # a pre-release, so no `--pre` question applies) whose package tree is
      # file-identical to upstream tag `v0.1.1` = commit `2bd32cb`
      # (`diff -rq -x __pycache__` against `src/kinemata`: no output, rc 0, and
      # non-vacuous -- 32 `.py` files each side, `__init__.py` md5 matching;
      # verified 2026-09-15). The build pinned below carries both `parity` and
      # `shape`, as `0.1.1` did -- verified by running them, not read off a
      # feature list. 🛑 THE PINNED VALUE IS WRITTEN ONCE, ON THE RUN LINE -- and
      # this paragraph named it anyway until the 0.1.2 bump found the second copy
      # still reading `0.1.1`. It was respelled rather than removed there, so the
      # 0.2.0 bump found it again, one version stale again. It names no version
      # at all now, which is the only spelling of it that stays true.
      # ⚑ 0.1.1 REPORTS MORE THAN 0.1.0 ON THE SAME TREE, NEVER LESS: files that
      # a gitignored directory's name was removing from the file index are back.
      # Expect findings to APPEAR on a bump, read them at source, and do not tune
      # them away. The mechanism is in `.kinemata-baseline.json`'s note, residue (4).
      # Measured at the 0.1.2 bump: it produced none, and that was a reading
      # rather than luck. Its two behavior changes were an advisory line no
      # section this config declared could trigger, and an illustration role no
      # document in this tree marked a span with -- so all four commands below
      # printed output byte-identical to 0.1.1's. The record of what that bump
      # decided is in `.kinemata-baseline.json`'s note, residue (3).
      # 🛑 THE 0.2.0 BUMP IS THE ONE THAT EXERCISES THAT RULE, AND IT IS THE FIRST
      # THAT IS NOT BYTE-IDENTICAL. Measured 2026-09-19 on this tree: all four
      # commands below read rc 0, `check`, `parity` and `shape` print exactly what
      # 0.1.2 printed, and `claims` gains one line BY DESIGN --
      # `negated: N path claim(s) read as discussed rather than asserted, a
      # negation being in the same clause` -- with `claims -v` listing every
      # one of them at its site; run it for the current figure.
      # Those are not new findings and not new text: they are path claims that a
      # negation in the same clause had been withdrawing from checking without
      # ever saying so, which is coverage this gate was silently not buying.
      # Upstream called the line out in its changelog for exactly that reason --
      # it is the half of a release an existing config observes and cannot
      # discover from a feature list. Those sites are being read at source by a
      # separate pass, which is what the rule above asks for, and the record of
      # what this bump decided is in `.kinemata-baseline.json`'s note, residue (5).
      # ⚑ THE 0.4.0 BUMP MOVED NO VERDICT AND NO LINE A STEP HERE PRINTS.
      # Measured 2026-09-24 on this tree: all five commands below printed output
      # byte-identical to 0.3.0's, plain and under `-v`, every one rc 0. Its two
      # refusals, a flag that is not a boolean and a list key spelled as a
      # string, found nothing here to refuse. No `exclude` fragment was left
      # removing nothing. The one registry that scans a non-`.py` suffix
      # (`.toml`) lost no comment hit, and no `[[shape]]` rule here uses the
      # pattern keys whose missing-field reading changed. The only output that
      # moved belongs to `kinemata ids`, which no step runs: it now prints a
      # view once.
      # 🛑 THE 0.4.1 BUMP MOVED `check`'s VERDICT, AND THE TREE MOVED WITH IT.
      # A `python-constants` home is now the declaring STATEMENT, not the whole
      # module, so a same-value literal beside its declaration is a finding.
      # Measured 2026-09-24: on the tree before this bump `check` read rc 1 on
      # two real duplicates, both cured in code in the same change; the other
      # four commands printed output byte-identical to 0.4.0's. It is also what
      # lets `kinemata.toml`'s `keyspace` defer filenames to `filenames`
      # without losing a respelling inside a home module.
      # ⚑ DO NOT CARRY A FIGURE OUT OF UPSTREAM'S RELEASE LETTER. It measured a
      # pinned clone of this tree and reported a smaller number; the tree has
      # moved since, and upstream withdrew its own companion figure as a weak
      # proxy. Run the command before quoting one.
      # 🛑 THIS PIN MUST NOT LAG THE TREE WE DEVELOP AGAINST. An older `[[parity]]`
      # did not refuse a key it could not mean, so a config using `field`/`authority`
      # against a build that predates them is SILENTLY DOWNGRADED to membership-only
      # -- green here, checking less than it says. `a365474` was exactly that build.
      # The fix that makes a build refuse by name at rc=2 instead landed before
      # `0.1.0a2.dev1` (verified 2026-09-14); every release from `0.1.0` on carries
      # the fix forward, so lagging is now the only road back into that silence.
      # Raising the pin does not retire this paragraph -- it moves the floor
      # further away.
      # 🛑 AND IT IS A FLOOR, NOT A PREFERENCE. `kinemata.toml`'s `exclude` uses the
      # `/`-anchored spelling, which an earlier build reads as a literal substring
      # matching nothing. The measurement is in that file's version-floor note,
      # above its `exclude`. The floor is now `0.4.1` itself: below `0.4.0` the
      # job reds (`0.3.0` refuses the config at load, rc 2, naming `only`), but
      # `0.4.0` loads it and stays GREEN while exempting a constant's whole home
      # module from `check`, so a respelling there is reported by nothing. The
      # measurement is in the `filenames` registry's note.
      - run: pip install "kinemata[yaml]==0.4.1"
      # ⚑ THE PROJECT ITSELF IS INSTALLED HERE BECAUSE THE PARITY ORACLE IMPORTS
      # IT. `parity` runs a command that prints what the code produces, and an
      # oracle it cannot run is a FAILURE that no baseline can accept -- so a
      # missing install here is a permanently red job, not a quiet skip.
      # Plain `-e .` is enough and the agent plugin packages the `test` job
      # installs are deliberately absent: the oracle imports
      # `settings/settings_categories.py`, which is stdlib-only by invariant.
      # Verified 2026-09-14 in a venv holding only kinemata and this project.
      - run: pip install -e .
      # ⚑ EVERY GATE THE CONFIG DECLARES IS INVOKED HERE. `kinemata.toml` had
      # declared two `[[shape]]` blocks since 2026-09-14 and `shape` ran in no
      # pipeline at all -- a declared gate that executes nowhere is a gate we do
      # not have.
      # 🛑 AND THE CHECK THAT SHOULD HAVE CAUGHT THAT READ GREEN THROUGHOUT.
      # `kinemata claims` prints `gates: N of N declared check(s) run in
      # .github/workflows/test.yml`, but the `[[gate]]` blocks it counts declared
      # only the commands already listed here, so the inventory agreed with
      # itself. That silence was structural at the version we reported it from:
      # a section kind added without BOTH its command below and its `[[gate]]`
      # block went unmentioned by construction. 0.1.2 answers it -- `claims` now
      # prints `ungated: [[shape]] declares checks no [[gate]] row runs` beside
      # the cover line, and the case above is the one that feature was built
      # against.
      # ⚑ BUT IT WARNS, IT NEVER FAILS, so it does not replace the rule. Upstream
      # declines to fail on it because a declaration may be run by hand, and
      # failing would force either real CI wiring or deleting the declaration to
      # satisfy its own inventory. An advisory line is not a gate: `claims` still
      # exits 0 while printing it and this job still reads green, so keep this
      # list and `kinemata.toml`'s `[[gate]]` blocks together.
      - run: kinemata check
      - run: kinemata parity
      - run: kinemata shape
      - run: kinemata undeclared
      - run: kinemata claims

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]' -e packages/agent-claude/ -e packages/agent-goose/ -e packages/agent-codex/
      - run: pytest -m integration tests/ -v

  e2e:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_e2e)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install tmux + fuse-overlayfs
        # fuse-overlayfs lets rootless podman use the overlay driver
        # instead of the much slower vfs fallback. Without it,
        # `--userns=keep-id` (used by kanibako) hits "creating an ID-
        # mapped copy of layer" errors on ubuntu-latest runners.
        run: sudo apt-get install -y tmux fuse-overlayfs
      - name: Install kanibako
        # Install ALL agent plugins the e2e exercises: agent-claude (stub claude
        # tests), agent-goose (the goose cred-sync + kickoff-loader tests, which
        # otherwise fail "Agent 'goose' is not installed"), agent-codex for parity.
        run: pip install -e '.[dev]' -e packages/agent-claude/ -e packages/agent-goose/ -e packages/agent-codex/
      - name: Build HEAD-kanibako e2e image (overlay on :latest)
        run: |
          # The published :latest carries all box deps + an OLD in-box kanibako.
          # Overlay the HEAD kanibako-cli under test so the in-box box_supervisor
          # is the code being validated (else the launch's forward-compat
          # fallback runs a bare shell and the supervisor e2e tests can't
          # exercise it). Pull the base, build a HEAD wheel, reinstall it in-box
          # (as root → system site-packages; see Containerfile.head).
          set -euo pipefail
          podman pull ghcr.io/doctorjei/kanibako-oci:latest
          podman tag ghcr.io/doctorjei/kanibako-oci:latest kanibako-oci:base
          pip wheel --no-deps -w e2e-wheels .
          podman build -t kanibako-oci:latest -f tests/e2e/Containerfile.head .
          # ⚑ The LAUNCH resolves the box's bare `kanibako-oci:latest` image to
          # the OFFICIAL registry ref via resolve_image_reference() — and its
          # top-precedence rule is "official-and-local", so a locally-present
          # ghcr.io/doctorjei/kanibako-oci:latest ALWAYS wins over the bare
          # localhost build.  The base pull put the OLD image at exactly that
          # official ref, so without this retag the launch silently uses the OLD
          # image and the HEAD overlay is built-but-never-used (the supervisor
          # never appears in any launch — the whole e2e "disaster").  Overwrite
          # the official ref with HEAD so the launch actually runs the code under
          # test.  Keep the bare tag too (the pre-warm fixture's existence check).
          podman tag kanibako-oci:latest ghcr.io/doctorjei/kanibako-oci:latest
          # Fail fast if the in-box supervisor is not actually HEAD — and verify
          # it the way the LAUNCH sees it: as root is not enough, because the box
          # bind-mounts its home over /home/agent, shadowing ~/.local.  Mount an
          # empty dir over /home/agent so a user-site-only install (the bug this
          # step guards against) is caught here instead of silently falling back
          # in every launch.
          emptyhome="$(mktemp -d)"
          podman run --rm -v "$emptyhome":/home/agent --entrypoint python3 \
            ghcr.io/doctorjei/kanibako-oci:latest \
            -m kanibako.box_supervisor --help | grep -q -- --panel-watch
          echo "OK: in-box box_supervisor is HEAD + visible under the box-home mount"
      - name: Run e2e tests
        # Explicit `-m e2e` because pyproject.toml's default addopts
        # is `-m 'not integration and not e2e'` — without overriding,
        # the suite would collect 0 tests and exit 5.
        # `--durations` surfaces the slowest tests so a cold first-start vs a
        # pull regression is visible at a glance; the conftest also writes
        # storage diagnostics to the run summary (ensure_image_in_pinned_store).
        run: pytest -m e2e tests/e2e/ -v --durations=15
