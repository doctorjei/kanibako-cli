name: Release

# rc-then-promote release pipeline. One git tag drives a release with
# tested-bits == shipped-bits.
#
#   * rc tag    v<ver>-rc<n>  (e.g. v1.2.5-rc1)
#       validates the PyPI packages (no upload) and creates a DRAFT
#       prerelease. Nothing touches prod PyPI.
#
#   * release tag  v<ver>     (e.g. v1.2.5)
#       builds + publishes the PyPI packages to prod (OIDC) and publishes
#       the GitHub release.
#
# Container images are built and published by the kanibako-images repo,
# not here.
#
# Triggers on ALL v* tags and self-gates by job `if`. No paths: filters.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the pre-release to PyPI (dev off a branch, rc off an rc tag). Build + twine-check always run; upload only when true.'
        type: boolean
        default: false
      agent:
        description: 'Publish ONLY this agent package (agent-goose | agent-codex). Empty = normal dev build.'
        type: string
        default: ''
        required: false

permissions:
  contents: write    # gh release
  id-token: write    # PyPI OIDC

jobs:
  # ---------------------------------------------------------------------------
  # rc path: validate PyPI packages (no upload), draft a prerelease.
  # ---------------------------------------------------------------------------

  rc-pypi-check:
    name: rc - validate PyPI packages (no upload)
    if: ${{ contains(github.ref_name, '-rc') && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is malformed; expected v<MAJOR>.<MINOR>.<PATCH>[-rc<N>]." >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build all distributable packages
        # Mirrors scripts/build-all.sh's package list. agent-goose and
        # agent-codex are built/checked here too; they version independently
        # of the 1.5.x train (currently 0.1.0).
        run: |
          for pkg in . packages/agent-claude packages/agent-goose packages/agent-codex packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Check distributions (NO upload)
        run: twine check dist/*

  rc-release:
    name: rc - draft prerelease
    if: ${{ contains(github.ref_name, '-rc') && github.event_name == 'push' }}
    needs: [rc-pypi-check]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Create draft prerelease
        # Guard so a re-run does not fail on an existing draft.
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
                 --draft \
                 --prerelease \
                 --generate-notes \
                 --target "$GITHUB_SHA" \
                 --title "$GITHUB_REF_NAME"

  # ---------------------------------------------------------------------------
  # release path: build + publish the PyPI packages, publish the GitHub release.
  # Container images are built and published by the kanibako-images repo.
  #
  # NOTE: the PyPI publish step requires a Trusted Publisher configured per
  # project on PyPI with: owner=doctorjei, repo=kanibako-cli, workflow=release.yml,
  # environment=pypi. Without it, the OIDC publish fails with invalid-publisher.
  # ---------------------------------------------------------------------------

  promote:
    name: Publish release
    # ⚑ ANY hyphenated tag is a PRERELEASE and must never reach prod PyPI. This
    # guard used to exclude only '-rc', so v1.8.0-dev2 / -beta / -alpha SATISFIED
    # it: they entered this production job — claiming the `pypi` environment and
    # its Trusted Publisher — and were rejected only later, by the tag-shape
    # check below. Excluding every '-' makes that UNAVAILABLE rather than merely
    # forbidden, and is exactly congruent with the shape this job validates
    # (^v[0-9]+\.[0-9]+\.[0-9]+$ admits no hyphen at all), so no tag can now pass
    # the guard and then fail the shape check.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gate promote on GREEN Tests jobs for this commit
        # STRUCTURAL FIX for the CI-e2e "disaster": release.yml (this promote) and
        # test.yml (the Tests workflow, which owns the test/integration/e2e jobs)
        # are SEPARATE workflows both fired by the v* tag, so a RED Tests job never
        # blocked a prod publish — rc10..rc12 shipped while the e2e had been broken
        # for weeks, and rc15 shipped with a RED `integration` while the gate only
        # checked `e2e`. REFUSE to publish unless EVERY required Tests job SUCCEEDED
        # for THIS exact commit. The required set mirrors test.yml's `jobs:` keys
        # (test, integration, e2e). Both workflows start together on the tag push,
        # so poll the Tests run for this SHA until it concludes, then require each
        # required job == success. Checking per-job (not just the run conclusion)
        # is FAIL-SAFE: a skipped/renamed/missing critical job yields a non-success
        # (or empty) conclusion and REJECTS, rather than a run-level "success" that
        # a skipped critical job could produce.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The Tests jobs that MUST be green before a prod promote. Keep in sync
          # with test.yml's `jobs:` keys (job name defaults to the key).
          REQUIRED_JOBS: "test integration e2e"
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          echo "Requiring green Tests jobs ($REQUIRED_JOBS) for $sha before publishing…"
          deadline=$(( $(date +%s) + 45*60 ))   # e2e ~13m + queue/runner headroom
          while :; do
            run_id=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
              if [ "$status" = "completed" ]; then
                echo "Tests run $run_id completed; checking required job conclusions…"
                all_ok=1
                for job in $REQUIRED_JOBS; do
                  concl=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                    --jq ".jobs[] | select(.name==\"$job\") | .conclusion" | head -n1)
                  echo "  job '$job' conclusion: ${concl:-<none>}"
                  if [ "$concl" != "success" ]; then
                    echo "REFUSING to publish: the '$job' job is '${concl:-missing}', not success." >&2
                    all_ok=0
                  fi
                done
                if [ "$all_ok" = "1" ]; then
                  echo "All required Tests jobs are green — proceeding with the publish."
                  break
                fi
                echo "Fix the failing Tests job(s) (see plans/e2e-restoration-MUSTFIX.md) and re-tag." >&2
                exit 1
              fi
              echo "  Tests run $run_id status=$status; waiting…"
            else
              echo "  no Tests run for $sha yet; waiting…"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for the Tests jobs to conclude." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Validate tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is malformed; expected v<MAJOR>.<MINOR>.<PATCH> (no -rc)." >&2
            exit 1
          fi
          echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Pin meta -> the stamped train to the release version
        # The in-tree meta deps are RANGES so a source checkout / dev flow never
        # breaks; pin them to the EXACT release version ($VER, from the tag) at
        # build time so a stale pair can NEVER install during PyPI index
        # propagation (meta 1.7.0 + cli 1.6.x silently mixed). The in-tree
        # base version already matches the tag (bump2version stamps then tags),
        # so only the dep lines need pinning here.
        #
        # ⚑⚑ BOTH STAMPED PACKAGES, NOT JUST THE CLI. agent-claude is part of
        # the same version-stamped train, and leaving it a RANGE reopened the
        # exact hole this step exists to close — by PEP 440 an rc OUTRANKS a dev
        # (1.8.0rc1 > 1.8.0.dev98), so a meta at .devN resolved agent-claude to
        # the older PUBLISHED 1.8.0rc1 and installed a plugin built against a
        # different cli. MEASURED 2026-08-17 on a real install: ImportError for
        # the removed BindDefault, straight out of a clean `uv tool install`.
        # agent-goose / agent-codex stay RANGES on purpose — they version
        # INDEPENDENTLY of this train and are not stamped.
        run: |
          for pkg in kanibako-cli kanibako-agent-claude; do
            sed -i -E "s|^([[:space:]]*)\"${pkg}[^\"]*\"|\1\"${pkg}==$VER\"|" packages/meta/pyproject.toml
          done
          echo "Pinned meta -> stamped train:"
          grep -nE 'kanibako-cli==|kanibako-agent-claude==' packages/meta/pyproject.toml

      - name: Build all distributable packages
        # Mirrors scripts/build-all.sh's package list. agent-goose and
        # agent-codex are built/published here too; they version independently
        # of the 1.5.x train (currently 0.1.0).
        run: |
          for pkg in . packages/agent-claude packages/agent-goose packages/agent-codex packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Publish to PyPI
        # OIDC trusted publishing — no token. Default packages-dir is dist/.
        # skip-existing lets the independently-versioned agent packages
        # (agent-goose, agent-codex) be skipped when their version is unchanged
        # rather than failing the publish.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release + tidy rc draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
                 --generate-notes \
                 --title "$GITHUB_REF_NAME"
          # Tidy any matching rc draft prerelease(s) left from the rc path.
          for rc in $(gh release list --json tagName --jq \
                ".[] | select(.tagName | startswith(\"${GITHUB_REF_NAME}-rc\")) | .tagName"); do
            gh release delete "$rc" --yes || true
          done

  # ---------------------------------------------------------------------------
  # pre-release path: on-demand (workflow_dispatch) pre-release publish. The
  # dispatch REF decides the version:
  #   * a branch (e.g. main)        -> <base>.dev<run_number>  (dev pre-release)
  #   * an rc tag v<X.Y.Z>-rc<N>    -> the PEP 440 pre-release <X.Y.Z>rc<N>
  # An rc publishes the DISTINCT <X.Y.Z>rcN version, NEVER the bare <X.Y.Z>
  # (that is the gated prod promote; a collision + skip-existing would silently
  # skip the real promote). Stamps and builds the train (cli + agent-claude +
  # meta), and ALSO builds agent-goose + agent-codex at their static pyproject
  # version (not stamped) and publishes them with skip-existing, so a dev/rc
  # meta (which pins those agents >= 0.2.0) is always installable from PyPI.
  # Build + twine-check always; upload only when `publish` is true. Shares this
  # workflow file (and its env `pypi`) so the existing Trusted Publisher
  # applies. The official tag-driven rc->promote flow is untouched.
  # ---------------------------------------------------------------------------

  dev:
    name: build (+ optional publish) a pre-release - dev off a branch, rc off an rc tag
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent == '' }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install build twine

      - name: Compute version
        # The dispatch ref decides the version: an rc tag v<X.Y.Z>-rc<N> builds
        # the PEP 440 pre-release <X.Y.Z>rc<N> (NEVER the bare <X.Y.Z>, which is
        # the gated prod promote). A branch builds <base>.dev<N>, where base =
        # the repo version with any .dev suffix stripped.
        #
        # ⚑⚑ N COUNTS PUBLISHED CUTS, NOT WORKFLOW RUNS. It used to be
        # github.run_number, which increments on EVERY run of this workflow —
        # including build-only validations that upload nothing, and every run of
        # every other job in this file — so the SECOND dev cut of 1.8.0 shipped
        # as 1.8.0.dev98. N is now derived from what PyPI ALREADY SERVES: the
        # highest published <base>.devN for this same base, plus one. The counter
        # is therefore the published index itself, which is the only thing that
        # actually constrains the next usable number.
        #
        # FLOOR of 100. A published version can never be reused and PEP 440
        # ordering only moves forward, so the floor keeps every future cut above
        # the run-number-era versions already on PyPI (1.8.0.dev98 is published).
        # It applies both when nothing is published for this base and when the
        # computed number would land below it.
        #
        # NO FALLBACK, BY DESIGN. If PyPI is unreachable or its JSON will not
        # parse, this step FAILS. A guessed number is worse than a failed build:
        # it either collides with a published release — where `skip-existing`
        # below silently drops the upload — or burns a number out of order.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/next-dev.py" <<'PY'
          """Print the next <base>.devN number for BASE, floored at 100.

          Argv: BASE, path to a PyPI JSON API response. Any malformed response
          raises, which is the intended loud failure -- never a guessed number.
          """
          import json, re, sys

          base, path = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
            releases = json.load(fh)["releases"]
          dev = re.compile(re.escape(base) + r"\.dev(\d+)")
          published = [int(m.group(1)) for m in map(dev.fullmatch, releases) if m]
          print(max(published + [99]) + 1)
          PY
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            VER="${REF#v}"; VER="${VER/-rc/rc}"            # v1.6.0-rc3 -> 1.6.0rc3 (PEP 440 normalized)
          else
            BASE=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/'); BASE=${BASE%%.dev*}
            curl -fsSL --retry 3 --retry-delay 2 --max-time 60 \
                 -o "$RUNNER_TEMP/pypi-kanibako-cli.json" \
                 https://pypi.org/pypi/kanibako-cli/json \
              || { echo "PyPI JSON API unreachable for kanibako-cli; refusing to guess a dev number." >&2; exit 1; }
            N=$(python3 "$RUNNER_TEMP/next-dev.py" "$BASE" "$RUNNER_TEMP/pypi-kanibako-cli.json") \
              || { echo "Could not read a dev number out of the PyPI response for kanibako-cli." >&2; exit 1; }
            VER="${BASE}.dev${N}"                          # branch -> 1.8.0.dev101
          fi
          echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building pre-release version: $VER"

      - name: Stamp pre-release version (no commit)
        # Anchored sed on the package version lines only — NOT bump2version,
        # whose default serialize can't represent a .devN suffix and corrupts
        # the file. `^version = "..."` / `^__version__ = "..."` never match the
        # indented dependency lines, so dep floors stay intact.
        run: |
          for f in pyproject.toml packages/agent-claude/pyproject.toml packages/meta/pyproject.toml; do
            sed -i -E "s/^version = \"[^\"]+\"/version = \"$DEV_VERSION\"/" "$f"
          done
          for f in src/kanibako/__init__.py packages/agent-claude/src/kanibako/plugins/claude/__init__.py; do
            sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"$DEV_VERSION\"/" "$f"
          done
          # Pin the meta's STAMPED-TRAIN dependencies to the EXACT stamped
          # version so a stale pair can NEVER install during the PyPI
          # index-propagation window (meta rcN + cli rcN-1 silently mixed). The
          # in-tree lines stay RANGES (source checkout / dev flow unbroken); we
          # pin only at build time. Each anchor is the indented dep line and
          # never the top-level `version = "..."`. Contract: test_meta_pin.py.
          #
          # ⚑⚑ BOTH kanibako-cli AND kanibako-agent-claude. Pinning only the cli
          # left agent-claude a RANGE, and PEP 440 sorts an rc ABOVE a dev
          # (1.8.0rc1 > 1.8.0.dev98) — so a meta stamped .devN resolved
          # agent-claude to the older PUBLISHED rc and shipped a plugin built
          # against a different cli. MEASURED 2026-08-17: ImportError for the
          # removed BindDefault out of a clean `uv tool install`. The propagation
          # -window argument above was always the SAME argument for agent-claude;
          # it simply was not applied to it.
          # agent-goose / agent-codex stay RANGES — they version INDEPENDENTLY
          # of this train and are never stamped here.
          for pkg in kanibako-cli kanibako-agent-claude; do
            sed -i -E "s|^([[:space:]]*)\"${pkg}[^\"]*\"|\1\"${pkg}==$DEV_VERSION\"|" packages/meta/pyproject.toml
          done
          echo "Stamped version $DEV_VERSION:"
          grep -n '^version = ' pyproject.toml packages/*/pyproject.toml
          echo "Pinned meta -> stamped train:"
          grep -nE 'kanibako-cli==|kanibako-agent-claude==' packages/meta/pyproject.toml

      - name: Build all distributable packages
        # The 1.5.x train (cli + agent-claude + meta) is dev-stamped above and
        # built here. agent-goose and agent-codex version independently and are
        # NOT dev-stamped; they are built below at their static pyproject
        # version into the same dist/ and published with skip-existing, so a
        # dev/rc meta (which pins agent-goose/agent-codex >= 0.2.0) is always
        # installable from PyPI even when those agent versions are unchanged.
        run: |
          for pkg in . packages/agent-claude packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done
          for pkg in packages/agent-goose packages/agent-codex; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Check distributions
        run: twine check dist/*

      - name: Refuse a version collision with different content
        # The independently-versioned agents (agent-goose, agent-codex) build at
        # their STATIC pyproject version, and the upload below runs with
        # `skip-existing: true`. Together those silently drop an upload whenever a
        # package changed without a version bump -- measured 2026-08-17: goose and
        # codex shipped 2026-08-01 wheels carrying `safe_bypass:`/`container_env:`
        # long after both keys were retired, the rebuild was skipped, and the
        # published meta pulled a wheel the cli refuses to load.
        # Runs UNCONDITIONALLY, including when `publish` is false, so a build-only
        # validation run reports the problem before anyone asks for an upload.
        run: python scripts/check-publish-collisions.py dist

      - name: Publish to PyPI (dev pre-release)
        # OIDC trusted publishing via the same release.yml Trusted Publisher.
        # skip-existing lets the independently-versioned agent packages
        # (agent-goose, agent-codex) be skipped when their static version is
        # unchanged rather than failing the publish.
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ---------------------------------------------------------------------------
  # publish-agent path: on-demand (workflow_dispatch with `agent` set) publish
  # of ONE independently-versioned agent package (agent-goose | agent-codex) to
  # prod PyPI. These agents version independently of the 1.5.x train (currently
  # 0.1.0) — the train ships via the tag-driven rc->promote path; this job lets
  # a single agent be published on demand at its static pyproject version, with
  # no version stamping. Only the selected package is built into dist/, so only
  # it is published. Shares this workflow file (env `pypi`) so the existing
  # Trusted Publisher applies.
  # ---------------------------------------------------------------------------

  publish-agent:
    name: publish a single agent package on demand
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Validate agent input
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          case "$AGENT" in
            agent-goose|agent-codex) echo "Publishing packages/$AGENT" ;;
            *) echo "Unknown agent '$AGENT'; expected agent-goose or agent-codex." >&2; exit 1 ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build the agent package
        env:
          AGENT: ${{ inputs.agent }}
        run: python -m build "packages/$AGENT" --outdir "$PWD/dist"

      - name: Refuse a version collision with different content
        # This job is the one that ships the independently-versioned agents at
        # their STATIC version, so it is where "changed but not bumped" bites
        # hardest — and `skip-existing` below would drop the upload in silence.
        # Stdlib-only, so it needs nothing beyond the build tooling above.
        run: python scripts/check-publish-collisions.py dist

      - name: Publish to PyPI
        # OIDC trusted publishing via the per-project Trusted Publisher
        # (workflow=release.yml, environment=pypi). skip-existing tolerates
        # an already-present version.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
