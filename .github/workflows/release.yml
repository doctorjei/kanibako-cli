name: Release

# rc-then-promote release pipeline. One git tag drives a release with
# tested-bits == shipped-bits.
#
#   * rc tag    v<ver>-rc<n>  (e.g. v1.2.5-rc1)
#       validates the PyPI packages (no upload) and creates a DRAFT
#       prerelease. Nothing touches prod PyPI.
#
#   * release tag  v<ver>     (e.g. v1.2.5)
#       builds + publishes the PyPI packages to prod (OIDC) and publishes
#       the GitHub release.
#
# Container images are built and published by the kanibako-images repo,
# not here.
#
# Triggers on ALL v* tags and self-gates by job `if`. No paths: filters.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the pre-release to PyPI (dev off a branch, rc off an rc tag). Build + twine-check always run; upload only when true.'
        type: boolean
        default: false
      agent:
        description: 'Publish ONLY this agent package (agent-goose | agent-codex). Empty = normal dev build.'
        type: string
        default: ''
        required: false

permissions:
  contents: write    # gh release
  id-token: write    # PyPI OIDC

jobs:
  # ---------------------------------------------------------------------------
  # rc path: validate PyPI packages (no upload), draft a prerelease.
  # ---------------------------------------------------------------------------

  rc-pypi-check:
    name: rc - validate PyPI packages (no upload)
    if: ${{ contains(github.ref_name, '-rc') && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is malformed; expected v<MAJOR>.<MINOR>.<PATCH>[-rc<N>]." >&2
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build all distributable packages
        # Mirrors scripts/build-all.sh's package list. agent-goose and
        # agent-codex are built/checked here too; they version independently
        # of the 1.5.x train (currently 0.1.0).
        run: |
          for pkg in . packages/agent-claude packages/agent-goose packages/agent-codex packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Check distributions (NO upload)
        run: twine check dist/*

  rc-release:
    name: rc - draft prerelease
    if: ${{ contains(github.ref_name, '-rc') && github.event_name == 'push' }}
    needs: [rc-pypi-check]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Create draft prerelease
        # Guard so a re-run does not fail on an existing draft.
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
                 --draft \
                 --prerelease \
                 --generate-notes \
                 --target "$GITHUB_SHA" \
                 --title "$GITHUB_REF_NAME"

  # ---------------------------------------------------------------------------
  # release path: build + publish the PyPI packages, publish the GitHub release.
  # Container images are built and published by the kanibako-images repo.
  #
  # NOTE: the PyPI publish step requires a Trusted Publisher configured per
  # project on PyPI with: owner=doctorjei, repo=kanibako-cli, workflow=release.yml,
  # environment=pypi. Without it, the OIDC publish fails with invalid-publisher.
  # ---------------------------------------------------------------------------

  promote:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Validate tag shape
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is malformed; expected v<MAJOR>.<MINOR>.<PATCH> (no -rc)." >&2
            exit 1
          fi
          echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build all distributable packages
        # Mirrors scripts/build-all.sh's package list. agent-goose and
        # agent-codex are built/published here too; they version independently
        # of the 1.5.x train (currently 0.1.0).
        run: |
          for pkg in . packages/agent-claude packages/agent-goose packages/agent-codex packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Publish to PyPI
        # OIDC trusted publishing — no token. Default packages-dir is dist/.
        # skip-existing lets the independently-versioned agent packages
        # (agent-goose, agent-codex) be skipped when their version is unchanged
        # rather than failing the publish.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release + tidy rc draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
                 --generate-notes \
                 --title "$GITHUB_REF_NAME"
          # Tidy any matching rc draft prerelease(s) left from the rc path.
          for rc in $(gh release list --json tagName --jq \
                ".[] | select(.tagName | startswith(\"${GITHUB_REF_NAME}-rc\")) | .tagName"); do
            gh release delete "$rc" --yes || true
          done

  # ---------------------------------------------------------------------------
  # pre-release path: on-demand (workflow_dispatch) pre-release publish. The
  # dispatch REF decides the version:
  #   * a branch (e.g. main)        -> <base>.dev<run_number>  (dev pre-release)
  #   * an rc tag v<X.Y.Z>-rc<N>    -> the PEP 440 pre-release <X.Y.Z>rc<N>
  # An rc publishes the DISTINCT <X.Y.Z>rcN version, NEVER the bare <X.Y.Z>
  # (that is the gated prod promote; a collision + skip-existing would silently
  # skip the real promote). Stamps and builds the train (cli + agent-claude +
  # meta), and ALSO builds agent-goose + agent-codex at their static pyproject
  # version (not stamped) and publishes them with skip-existing, so a dev/rc
  # meta (which pins those agents >= 0.2.0) is always installable from PyPI.
  # Build + twine-check always; upload only when `publish` is true. Shares this
  # workflow file (and its env `pypi`) so the existing Trusted Publisher
  # applies. The official tag-driven rc->promote flow is untouched.
  # ---------------------------------------------------------------------------

  dev:
    name: build (+ optional publish) a pre-release - dev off a branch, rc off an rc tag
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent == '' }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tooling
        run: pip install build twine

      - name: Compute version
        # The dispatch ref decides the version: an rc tag v<X.Y.Z>-rc<N> builds
        # the PEP 440 pre-release <X.Y.Z>rc<N> (NEVER the bare <X.Y.Z>, which is
        # the gated prod promote). A branch builds <base>.dev<run_number>, where
        # base = repo version with any .dev suffix stripped and the run number
        # is monotonic + unique on PyPI.
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            VER="${REF#v}"; VER="${VER/-rc/rc}"            # v1.6.0-rc3 -> 1.6.0rc3 (PEP 440 normalized)
          else
            BASE=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/'); BASE=${BASE%%.dev*}
            VER="${BASE}.dev${{ github.run_number }}"      # branch -> 1.6.0.devN
          fi
          echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building pre-release version: $VER"

      - name: Stamp pre-release version (no commit)
        # Anchored sed on the package version lines only — NOT bump2version,
        # whose default serialize can't represent a .devN suffix and corrupts
        # the file. `^version = "..."` / `^__version__ = "..."` never match the
        # indented dependency lines, so dep floors stay intact.
        run: |
          for f in pyproject.toml packages/agent-claude/pyproject.toml packages/meta/pyproject.toml; do
            sed -i -E "s/^version = \"[^\"]+\"/version = \"$DEV_VERSION\"/" "$f"
          done
          for f in src/kanibako/__init__.py packages/agent-claude/src/kanibako/plugins/claude/__init__.py; do
            sed -i -E "s/^__version__ = \"[^\"]+\"/__version__ = \"$DEV_VERSION\"/" "$f"
          done
          echo "Stamped version $DEV_VERSION:"
          grep -n '^version = ' pyproject.toml packages/*/pyproject.toml

      - name: Build all distributable packages
        # The 1.5.x train (cli + agent-claude + meta) is dev-stamped above and
        # built here. agent-goose and agent-codex version independently and are
        # NOT dev-stamped; they are built below at their static pyproject
        # version into the same dist/ and published with skip-existing, so a
        # dev/rc meta (which pins agent-goose/agent-codex >= 0.2.0) is always
        # installable from PyPI even when those agent versions are unchanged.
        run: |
          for pkg in . packages/agent-claude packages/meta; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done
          for pkg in packages/agent-goose packages/agent-codex; do
            python -m build "$pkg" --outdir "$PWD/dist"
          done

      - name: Check distributions
        run: twine check dist/*

      - name: Publish to PyPI (dev pre-release)
        # OIDC trusted publishing via the same release.yml Trusted Publisher.
        # skip-existing lets the independently-versioned agent packages
        # (agent-goose, agent-codex) be skipped when their static version is
        # unchanged rather than failing the publish.
        if: ${{ inputs.publish }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ---------------------------------------------------------------------------
  # publish-agent path: on-demand (workflow_dispatch with `agent` set) publish
  # of ONE independently-versioned agent package (agent-goose | agent-codex) to
  # prod PyPI. These agents version independently of the 1.5.x train (currently
  # 0.1.0) — the train ships via the tag-driven rc->promote path; this job lets
  # a single agent be published on demand at its static pyproject version, with
  # no version stamping. Only the selected package is built into dist/, so only
  # it is published. Shares this workflow file (env `pypi`) so the existing
  # Trusted Publisher applies.
  # ---------------------------------------------------------------------------

  publish-agent:
    name: publish a single agent package on demand
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent != '' }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6

      - name: Validate agent input
        env:
          AGENT: ${{ inputs.agent }}
        run: |
          case "$AGENT" in
            agent-goose|agent-codex) echo "Publishing packages/$AGENT" ;;
            *) echo "Unknown agent '$AGENT'; expected agent-goose or agent-codex." >&2; exit 1 ;;
          esac

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build the agent package
        env:
          AGENT: ${{ inputs.agent }}
        run: python -m build "packages/$AGENT" --outdir "$PWD/dist"

      - name: Publish to PyPI
        # OIDC trusted publishing via the per-project Trusted Publisher
        # (workflow=release.yml, environment=pypi). skip-existing tolerates
        # an already-present version.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
