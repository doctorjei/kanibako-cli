[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako"
version = "1.7.0"
description = "Run AI coding agents in rootless containers (meta-package: CLI + Claude, Goose, and Codex plugins)"
requires-python = ">=3.11"
dependencies = [
    "kanibako-cli>=1.5.0.dev0,<2.0",
    "kanibako-agent-claude>=1.5.0.dev0,<2.0",
    "kanibako-agent-goose>=0.2.0",
    "kanibako-agent-codex>=0.2.0",
]

[project.scripts]
kanibako = "kanibako.cli:main"
