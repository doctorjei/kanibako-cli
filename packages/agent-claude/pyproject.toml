[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako-agent-claude"
version = "1.6.0"
description = "Claude Code target plugin for kanibako"
requires-python = ">=3.11"
dependencies = ["kanibako-cli"]

[project.entry-points."kanibako.agents"]
claude = "kanibako.plugins.claude:ClaudeTarget"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kanibako.plugins.claude*"]

[tool.setuptools.package-data]
# Curated template content (Phase 9c).  setuptools' glob does NOT recurse into
# hidden directories with ``**/*`` alone, so the dot-dir patterns (.claude/,
# .config/) are listed explicitly to package nested config files.
"kanibako.plugins.claude" = [
    "py.typed",
    # Declarative agent defaults (P6c) — read at import time via importlib.resources.
    "claude-defaults.yaml",
    "template/**/*", "template/**/.*",
    "template/.*/**/*", "template/.*/*",
    "template/**/.*/**/*", "template/**/.*/*",
]
