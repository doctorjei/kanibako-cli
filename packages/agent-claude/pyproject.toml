[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako-agent-claude"
version = "1.7.1"
description = "Claude Code target plugin for kanibako"
requires-python = ">=3.11"
dependencies = ["kanibako-cli"]

[project.entry-points."kanibako.agents"]
claude = "kanibako.plugins.claude:ClaudeTarget"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kanibako.plugins.claude*"]

[tool.setuptools.package-data]
# Curated template content (Phase 9c).  setuptools' glob does NOT recurse into
# hidden directories with ``**/*`` alone, so the dot-dir patterns (.claude/,
# .config/) are listed explicitly to package nested config files.
"kanibako.plugins.claude" = [
    "py.typed",
    # Declarative agent defaults (P6c) — read at import time via importlib.resources.
    "claude-defaults.yaml",
    # Static claude-specific data delivered by descriptor binds — the KICKOFF.md
    # SEED (data/KICKOFF.md), the future-use rom/ placeholder, and the per-agent
    # seeded template (data/template/, incl. nested dot-dirs .claude/ + the
    # .claude.json dot-file) — read via importlib.resources at load.  Nested
    # dot-dir content needs the recursive dot-dir patterns (a plain data/* /
    # data/**/* would miss it).
    "data/*", "data/**/*", "data/**/.*",
    "data/.*/**/*", "data/.*/*",
    "data/**/.*/**/*", "data/**/.*/*",
]
