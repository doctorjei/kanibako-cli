# claude AGENT defaults — the declarative source of truth for the claude plugin's
# default-set (P6c coalesce; settings-keyspace-1.6.0-target.md §2d agent.claude.*).
#
# This file holds claude's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery binds, launch grammar, settings routing, container env, cred-file
# lifecycle, host_prep/init_dirs) PLUS its AGENT-scope `shared` defaults.  It is
# read by the thin loader :mod:`kanibako.agent_defaults`, which builds the
# PluginDescriptor / default_shares exactly as the old hand-written `target.py`
# values did — so core start.py still assembles claude's argv / env / delivery
# mounts / credential lifecycle from the descriptor.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below: the binding ORIGIN selectors (which detected
#     install field supplies the host source — a declarative NAME, not a probed
#     value), box-side destinations, the mode/operations grammar, settings flags,
#     container env, cred-file specs, host_prep/init_dirs, the agent-share
#     box_dests.  In-box destinations are `$GUEST_HOME` EXPRESSIONS expanded by the
#     loader from the single GUEST_HOME constant (no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary/launcher/install paths stay in
#     `target.py` `detect()` (the `_LAUNCHER`/`_INSTALL_DIR` contract constants):
#     `$PATH` must never choose a binary we exec on the host AND bind into the box.
#     The file only names, declaratively, WHICH detected field each binding's host
#     source comes from (`origin`); the probed path is filled in by
#     `descriptor_mounts` from the AgentInstall.

descriptor:
  command: ["claude"]

  # Binary delivery — TWO AS-IS host binds (identity dest), AGENT_CRITICAL (claude
  # is the only 2-bind agent).  `origin` selects the detected install field:
  #   share    -> install_dir  (~/.local/share/claude)
  #   launcher -> launcher      (~/.local/bin/claude, resolved real file)
  bindings:
    - key: share
      origin: install_dir
      box_dest: "$GUEST_HOME/.local/share/claude"
      kind: dir
      scope: agent_critical
      ro: true
    - key: launcher
      origin: launcher
      box_dest: "$GUEST_HOME/.local/bin/claude"
      kind: file
      scope: agent_critical
      ro: true
    # STEP 2b — the claude LOADER.  A tiny plugin-shipped static file (constant,
    # claude-specific — NOT an @system.instructions keyspace source) delivered RO
    # to ~/.claude/CLAUDE.md (claude's user-memory slot, loaded every session).  Its
    # whole content is two RELATIVE imports, `@KANIBAKO.md` + `@AGENTS.md`, which
    # claude resolves next to this file in ~/.claude/ — so it loads the box guide
    # that STEP 2a binds RO to ~/.claude/KANIBAKO.md AND the user's editable
    # ~/.claude/AGENTS.md (seeded once).  (The earlier managed /etc/claude-code
    # pointer was dropped: its @import only expanded under skip-permissions and not
    # for ~ — the native user-memory slot with relative imports works in both modes.)
    # `origin: literal` + `literal_src_pkg` names a package-relative resource
    # (resolved to its shipped host path by the loader via importlib.resources).
    # scope `agent` = BEST-EFFORT: a missing/unresolvable source is SKIPPED, never
    # raised (unlike agent_critical), so a failed loader can NOT crash a launch —
    # mirrors 2a's best-effort bind.
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/claude-md-loader"
      box_dest: "$GUEST_HOME/.claude/CLAUDE.md"
      kind: file
      scope: agent
      ro: true

  # mode is {start, continue} only — resume intentionally NOT offered (user
  # decision 2026-06-17: -R/--resume falls through to --continue).
  mode:
    start: []
    continue: ["--continue"]

  operations:
    exec:
      fragment: ["-p"]

  # safe-bypass is the FLAG --dangerously-skip-permissions; persisted default via
  # the "auto_approve" agent-scope key (spec §2d L556, default true/PERMISSIVE;
  # claude is default-safe so no secure_flag needed).
  safe_bypass:
    channel: flag
    flag: ["--dangerously-skip-permissions"]
    setting_key: auto_approve

  settings:
    - setting_key: model
      channel: flag
      flag: ["--model"]
    # endpoint (persona): the alternate harness base-URL.  ENV channel -> the
    # harness-specific ANTHROPIC_BASE_URL (env-var name is HARNESS-specific, so it
    # lives in the descriptor).  Unset (<None>) emits nothing (bare/harness-default);
    # set = point claude at a third-party endpoint (paired with the OAuth-suppress
    # cred fork so the Anthropic token is never sent there).
    - setting_key: endpoint
      channel: env
      env_var: "ANTHROPIC_BASE_URL"

  # BOTH claude env vars: DISABLE_AUTOUPDATER (also set by apply_state) AND
  # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC.
  container_env:
    DISABLE_AUTOUPDATER: "1"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # Only auth remains host-sourced (.claude.json import removed in 1.6.0): the
  # synced .credentials.json (filtered -> transform_cred merges claudeAiOauth).
  cred_files:
    - home_rel: ".claude/.credentials.json"
      host_rel: ".claude/.credentials.json"
      cadence: sync
      mtime_gate: true
      filtered: true

  host_prep: true
  init_dirs: [".claude"]
  # Credential-SHARING CAPABILITY (spec §2d): claude supports shared creds
  # (per-agent host login). RO / plugin-set → meta.agent.claude.auth.share_support.
  auth_share_support: true

  # VS Code Marketplace extension id auto-installed into the box on `kanibako
  # code` attach, so claude's in-box `/ide` integration works out of the box.
  # goose/codex leave this UNSET (→ None) until their Phase-5 support lands.
  vscode_extension: anthropic.claude-code

# AGENT-scope shared dirs (plugins + cache), rooted under the per-agent store dir
# @meta.agent.claude.path = @system.agents/claude (core's agent.shared scope-root).
# The relative host_src (the key name) joins under that root; box_dest is a
# $GUEST_HOME expression.
shares:
  - key: agent.shared.plugins
    host_src: plugins
    box_dest: "$GUEST_HOME/.claude/plugins"
  - key: agent.shared.cache
    host_src: cache
    box_dest: "$GUEST_HOME/.claude/cache"

# AGENT-scope @-ref-sourced category binds (spec §2d L608).  Each entry becomes an
# `agent.<category>.<key>` default whose VALUE is the structured bind tuple
# (<@-ref host_src>, <box_dest>, <options>) — the AGENT-scope mirror of
# core-defaults.yaml's `meta_ref` bind shape.  `meta_ref` is emitted VERBATIM as the
# host_src (NOT a fixed path), which the launch category cascade / `expand` resolves
# from the snapshot floor — so the plugin declares its harness slot WITHOUT any
# per-harness path knowledge leaking into core.  Read by the thin loader
# `kanibako.agent_defaults.load_category_binds`.
category_binds:
  # Instructions bind: the shared box-guidance doc delivered RO into claude's config
  # dir at ~/.claude/KANIBAKO.md (uniform namespaced slot w/ goose; discoverable).
  # STEP 2a delivers the CONTENT only — the ~/.claude/CLAUDE.md loader that makes
  # claude @import this file is the descriptor `managed_pointer` bind above (STEP
  # 2b).  Source = the single shared @system.instructions.
  - key: instructions
    category: bindings.ro
    meta_ref: "@system.instructions"
    box_dest: "~/.claude/KANIBAKO.md"
    ro: true
