# claude AGENT defaults — the declarative source of truth for the claude plugin's
# default-set (P6c coalesce; settings-keyspace-1.8.0.md §2d agent.claude.*).
#
# This file holds claude's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery binds, launch grammar, settings routing, cred-file
# lifecycle, host_prep/init_dirs) PLUS its AGENT-scope `common` defaults.  It is
# read by the thin loader :mod:`kanibako.settings.agent_defaults`, which builds the
# PluginDescriptor / default_common exactly as the old hand-written `target.py`
# values did — so core start.py still assembles claude's argv / env / delivery
# mounts / credential lifecycle from the descriptor.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below: the binding ORIGIN selectors (which detected
#     install field supplies the host source — a declarative NAME, not a probed
#     value), box-side destinations, the mode/operations grammar, settings flags,
#     cred-file specs, host_prep/init_dirs, the AGENT-scope `env:` keys, the agent-share
#     box_dests.  In-box destinations are `$GUEST_HOME` EXPRESSIONS expanded by the
#     loader from the single GUEST_HOME constant (no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary/launcher/install paths stay in
#     `target.py` `detect()` (the `_LAUNCHER`/`_INSTALL_DIR` contract constants):
#     `$PATH` must never choose a binary we exec on the host AND bind into the box.
#     The file only names, declaratively, WHICH detected field each binding's host
#     source comes from (`origin`); the probed path is filled in by
#     `descriptor_mounts` from the AgentInstall.

descriptor:
  command: ["claude"]

  # Binary delivery — TWO AS-IS host binds (identity dest), AGENT_CRITICAL (claude
  # is the only 2-bind agent).  `origin` selects the detected install field:
  #   share    -> install_dir  (~/.local/share/claude)
  #   launcher -> launcher      (~/.local/bin/claude, resolved real file)
  bindings:
    - key: share
      origin: install_dir
      box_dest: "$GUEST_HOME/.local/share/claude"
      kind: dir
      scope: agent_critical
      ro: true
    - key: launcher
      origin: launcher
      box_dest: "$GUEST_HOME/.local/bin/claude"
      kind: file
      scope: agent_critical
      ro: true
    # The KICKOFF-LOADER (the flattener SEED).  A tiny plugin-shipped static file
    # (constant, claude-specific — NOT an @system.instructions keyspace source)
    # delivered RO to ~/.config/kanibako/kickoff.md.  Its content is the canon entry
    # import `@~/canon/COLLECTION.md`, and since M-12 that is the ONLY import it
    # carries (the pre-canon transition line is gone) — the entrypoint the
    # box-start flattener resolves (following the @import chain) into the flattened
    # per-agent FINAL file at claude's native user-memory slot ~/.claude/CLAUDE.md
    # (named by KANIBAKO_DIRECTIVE_FINAL in the `env:` section below).  The start-time
    # flatten + hook is a LATER increment; this declaration only ships the SEED and
    # the FINAL-slot env.  `origin: literal` + `literal_src_pkg` names a
    # package-relative resource (resolved to its shipped host path by the loader via
    # importlib.resources).  scope `agent` = BEST-EFFORT: a missing/unresolvable
    # source is SKIPPED, never raised (unlike agent_critical), so a missing SEED can
    # NOT crash a launch.  (Key name kept `managed_pointer` to avoid a keystore-key
    # rename.)
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/KICKOFF.md"
      box_dest: "$GUEST_HOME/.config/kanibako/kickoff.md"
      kind: file
      scope: agent
      ro: true

  # mode is {start, continue} only — resume intentionally NOT offered (user
  # decision 2026-06-17: -R/--resume falls through to --continue).
  mode:
    start: []
    continue: ["--continue"]

  operations:
    exec:
      fragment: ["-p"]

  # The `access` permission TIER (spec §2d, R-41) — claude realizes all three on
  # the FLAG channel.  VERIFIED against the installed binary (claude 2.1.220,
  # 2026-08-02): `--help` lists `--dangerously-skip-permissions` ("Bypass all
  # permission checks") and `--permission-mode <mode>` with the choices
  # "acceptEdits", "auto", "bypassPermissions", "manual", "dontAsk", "plan".
  #   full       -> --dangerously-skip-permissions (today's bypass, unchanged)
  #   editing    -> --permission-mode acceptEdits  (edits free, boundaries ask)
  #   restricted -> EMIT NOTHING: claude's own default already prompts for
  #                 everything, so the empty row is the correct realization (and
  #                 it is byte-identical to the pre-R-41 `-S` behaviour, which
  #                 declared no secure_flag).
  access_realization:
    channel: flag
    setting_key: access
    tiers:
      restricted: {}
      editing: {flag: ["--permission-mode", "acceptEdits"]}
      full: {flag: ["--dangerously-skip-permissions"]}

  settings:
    - setting_key: model
      channel: flag
      flag: ["--model"]
    # endpoint (persona): the alternate harness base-URL.  ENV channel -> the
    # harness-specific ANTHROPIC_BASE_URL (env-var name is HARNESS-specific, so it
    # lives in the descriptor).  Unset (<None>) emits nothing (bare/harness-default);
    # set = point claude at a third-party endpoint (paired with the OAuth-suppress
    # cred fork so the Anthropic token is never sent there).
    - setting_key: endpoint
      channel: env
      env_var: "ANTHROPIC_BASE_URL"

  # PERSONA endpoint/token delivery (claude).  env = the endpoint rides the
  # `endpoint` -> ANTHROPIC_BASE_URL SettingArg above; the bearer token rides the
  # FIXED ANTHROPIC_AUTH_TOKEN secret_path key (declared here rather than left to
  # the preflight's per-field fallback, which now covers only out-of-tree plugins
  # and version skew).  No model_required veto: a claude persona that names no
  # model needs none (its model rides its own channels / the harness default).
  persona:
    endpoint_delivery: env
    token_var: ANTHROPIC_AUTH_TOKEN

  # Only auth remains host-sourced (.claude.json import removed in 1.6.0): the
  # synced .credentials.json (filtered -> transform_cred merges claudeAiOauth).
  cred_files:
    - home_rel: ".claude/.credentials.json"
      host_rel: ".claude/.credentials.json"
      cadence: sync
      mtime_gate: true
      filtered: true

  host_prep: true
  init_dirs: [".claude"]
  # Credential-SHARING CAPABILITY (spec §2d): claude supports shared creds
  # (per-agent host login). RO / plugin-set → meta.agent.claude.auth.share_support.
  auth_share_support: true

  # VS Code Marketplace extension id auto-installed into the box on `kanibako
  # code` attach, so claude's in-box `/ide` integration works out of the box.
  # goose/codex leave this UNSET (→ None) until their Phase-5 support lands.
  vscode_extension: anthropic.claude-code

# AGENT-scope BEHAVIOR defaults -> the `agent.claude.<key>` FLOOR (spec §2d), read
# by the launch off `setting_descriptors()` and laid UNDER the whole cascade, so a
# user overrides one by writing the SAME key in any settings file.  `default:` is
# MANDATORY on every row (an empty one is written `""`) and its value is a STRING.
#
# ⚑ This is a SEPARATE section from `descriptor.settings:` above, and the two key
# sets are not the same one: `settings:` says HOW a value is realized (which flag /
# which env var), and `transform` below is realized on NO channel at all — kanibako's
# own patch pipeline consumes it, so it has a floor here and no row there.
behavior:
  - key: model
    description: Claude model to use
    default: opus
  - key: endpoint
    description: "Alternate base-URL endpoint (persona); unset uses the harness
      default and syncs the OAuth login"
    default: ""
  - key: transform
    description: "Binary transform applied to the agent binary (tweakcc); empty
      = none"
    # WHICH transform claude runs (spec §2d `agent.claude.transform | tweakcc`).
    # ⚑ Not "" — an empty floor here means NOTHING is patched.
    default: tweakcc

# AGENT-scope declared env DEFAULTS -> `agent.claude.env.<VAR>` (spec §2d).  These
# are ordinary settings keys, not a private channel: a user overrides one by writing
# the SAME key in a nearer file, and naming the same VAR at a second scope (say
# `box.env.DISABLE_AUTOUPDATER`) REFUSES the launch naming both keys.  Values are
# STRINGS (quote them); `$GUEST_HOME` is expanded by the loader.
env:
  # Disable the in-box self-updater: a mid-session update would repoint the writable
  # ~/.local/bin/claude to a version the read-only host bind cannot have.
  DISABLE_AUTOUPDATER: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  # The native instruction slot the box-start flattener writes the flattened
  # per-agent FINAL file to (claude's user-memory slot, loaded every session).
  KANIBAKO_DIRECTIVE_FINAL: "$GUEST_HOME/.claude/CLAUDE.md"

# AGENT-scope common dirs (plugins + cache), stored under the per-agent store dir
# @meta.agent.claude.path = @config.agents/claude — spec §2a's agent DECLARATION
# ROOT.  ROOTED AT DECLARATION: the bare `host_src` leaf written here is turned by
# the loader into the full self-resolving `@meta.agent.claude.path/common/<leaf>`,
# so the STORED value needs no later prepend (§2a) and the dirs live at
# `agents/claude/common/{plugins,cache}`.  An already-self-resolving host_src
# (absolute / ~ / $var / @-ref) is stored verbatim instead (§2a).
# box_dest is a $GUEST_HOME expression (kanibako owns the HOST layout only — the
# guest dest is always spelled out) and it is the ENTRY'S IDENTITY: the loader
# emits ONE discriminated TERMINAL key `agent.claude.common` whose value is the
# whole map `{box_dest: (host_src,)}`.
# ⚑ THERE IS NO `key:` FIELD ANY MORE (dropped 2026-08-08c; the `bindings` arms
# went the same way 2026-08-06c).  The destination names the entry, so a `key:`
# line would name nothing — the loader REFUSES one rather than ignoring it.
# `host_src` and `box_dest` remain INDEPENDENT: `host_src` is the store leaf that
# gets rooted (and, being rooted, is what tells the persona symlink shim which
# store dir to share), `box_dest` is where it lands in the box.
common:
  - host_src: plugins
    box_dest: "$GUEST_HOME/.claude/plugins"
  - host_src: cache
    box_dest: "$GUEST_HOME/.claude/cache"

# The former Route-A `category_binds:` `instructions` entry (@system.instructions →
# ~/.claude/KANIBAKO.md) is RETIRED: the box guide now reaches the box INSIDE the RO
# whole-dir canon bind at `~/canon/bible` + the flattened per-agent FINAL file (seeded by the
# `managed_pointer` kickoff-loader above), not a per-agent native-slot bind.
