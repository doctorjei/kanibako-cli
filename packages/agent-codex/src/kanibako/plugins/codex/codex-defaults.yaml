# codex AGENT defaults — the declarative source of truth for the codex plugin's
# default-set (P6c coalesce; settings-keyspace-1.6.0-target.md §2d agent.codex.*).
#
# This file holds codex's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery bind, launch grammar, settings routing, cred-file lifecycle,
# init_dirs).  codex declares NO container env and NO agent shares.  It is read by
# the thin loader :mod:`kanibako.agent_defaults`, which builds the PluginDescriptor
# exactly as the old hand-written `target.py` values did.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below (in-box destinations are `$GUEST_HOME`
#     expressions the loader expands; no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary path is runtime-PROBED in
#     `target.py` `detect()`: codex has no fixed contract path, so detect resolves
#     a directly-bindable ELF on `$PATH` (PRIMARY) or the npm-vendored native
#     binary (FALLBACK) per the host-binary preference order.  The file only names,
#     declaratively, that the binary bind's host source is the detected `binary`
#     field (`origin: binary`); the box destination is fixed below.

descriptor:
  command: ["codex"]

  # binary bind — single AS-IS host bind (no separate launcher/share),
  # AGENT_CRITICAL.  origin: binary -> install.binary (the resolved real native
  # musl static-pie ELF; binds standalone, no node in-box).
  bindings:
    - key: binary
      origin: binary
      box_dest: "$GUEST_HOME/.local/bin/codex"
      kind: file
      scope: agent_critical
      ro: true
    # The KICKOFF-LOADER (the flattener SEED).  A tiny plugin-shipped static file
    # delivered RO to ~/.config/kanibako/kickoff.md.  Its whole content is a single
    # `@~/playbook/kanibako/directives/KANIBAKO.md` import — the entrypoint the
    # box-start flattener resolves into the flattened per-agent FINAL file at codex's
    # native slot ~/.codex/AGENTS.md (named by KANIBAKO_DIRECTIVE_FINAL below).  The
    # start-time flatten + hook is a LATER increment; this declaration only ships the
    # SEED and the FINAL-slot env.  `origin: literal` + `literal_src_pkg` names a
    # package-relative resource (resolved to its shipped host path via
    # importlib.resources).  scope `agent` = BEST-EFFORT: a missing/unresolvable
    # source is SKIPPED, never raised, so a missing SEED can NOT crash a launch.
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/KICKOFF.md"
      box_dest: "$GUEST_HOME/.config/kanibako/kickoff.md"
      kind: file
      scope: agent
      ro: true

  # codex 0.140.0: new session = bare `codex` (start -> []); continue-last =
  # `codex resume --last`.  No dedicated resume picker (-R falls through to
  # continue).
  mode:
    start: []
    continue: ["resume", "--last"]

  operations:
    exec:
      fragment: ["exec"]

  # safe-bypass is the FLAG --dangerously-bypass-approvals-and-sandbox; persisted
  # default via the "auto_approve" agent-scope key (spec §2d L630, default
  # true/PERMISSIVE; codex persists uniformly per the 2026-06-27 collapse ruling).
  # codex is default-safe, so no secure_flag.
  safe_bypass:
    channel: flag
    flag: ["--dangerously-bypass-approvals-and-sandbox"]
    setting_key: auto_approve

  settings:
    - setting_key: model
      channel: flag
      flag: ["--model"]
    # NOTE: endpoint is DELIBERATELY not a SettingArg here.  A codex persona's
    # alternate endpoint is delivered via the ~/.codex/config.toml
    # [model_providers.<id>] block (see `persona:` below + vscode_config's
    # merge_codex_model_provider), NOT an env var — so it must not be emitted as a
    # flag/env by the launch arg assembler.  It is a first-class SETTABLE key via
    # setting_descriptors() (target.py) so `config set agent.<node>℘codex.endpoint`
    # validates + resolves through the behavior cascade.

  # PERSONA endpoint/token delivery (codex; INC 2 harness-aware persona resolution).
  # config_file = the endpoint is written into ~/.codex/config.toml's model-provider
  # block (not ANTHROPIC_BASE_URL); token_var EMPTY = DYNAMIC (the single configured
  # secret_path key IS the provider env_key + the in-box bearer var).  config_file
  # also disables the claude-shaped B3 host-dir auto-adopt (MVP keyspace-config only).
  persona:
    endpoint_delivery: config_file
    # Codex removed the "chat" wire (openai/codex#7782); "responses" is the only
    # value current Codex accepts.  NaviGator serves both wires.
    wire_api: responses
    # config_file delivery already excludes codex from the ENV-only B3 host-dir
    # adopt gate; host_dir_adopt=false is declared for correctness/clarity (codex
    # resolves its endpoint from the KEYSPACE only, never a claude-shaped host dir).
    host_dir_adopt: false

  # The native instruction slot the box-start flattener writes the flattened
  # per-agent FINAL file to (codex reads ~/.codex/AGENTS.md natively).
  container_env:
    KANIBAKO_DIRECTIVE_FINAL: "$GUEST_HOME/.codex/AGENTS.md"

  # filtered=False (wholesale copy) is an E2E gate (Phase 10): flip to
  # filtered=True + add a transform_cred allowlist ONLY if E2E proves auth.json
  # carries non-portable machine-id/installation fields.  The host config.toml
  # IMPORT was removed in 1.6.0 (config comes from the curated agent template).
  cred_files:
    - home_rel: ".codex/auth.json"
      host_rel: ".codex/auth.json"
      cadence: sync
      mtime_gate: true
      filtered: false

  host_prep: false
  init_dirs: [".codex"]
  # Credential-SHARING CAPABILITY (spec §2d): codex supports shared creds.
  # RO / plugin-set → meta.agent.codex.auth.share_support.
  auth_share_support: true

  # VS Code Marketplace extension id auto-installed into the box on `kanibako
  # code` attach (FF-4).  The official OpenAI extension is branded "Codex" but
  # its id is `openai.chatgpt` (NOT `openai.codex`; the numerous `*.codex`
  # lookalikes are unofficial).  Present on BOTH the MS Marketplace and Open VSX,
  # so it also installs under a code-server/Open-VSX attach flow.  It bundles its
  # own codex binary (spawns `codex app-server`) and runs container-side; panel
  # auth is container-side (`~/.codex/auth.json`, shared with the CLI) and its
  # approval_policy/sandbox_mode come from `~/.codex/config.toml` (kanibako's
  # config manager seeds approval_policy from the box's auto_approve and forces
  # sandbox_mode = "danger-full-access" as a box invariant — the container IS the
  # sandbox, so the panel app-server must not attempt a nested one).
  vscode_extension: openai.chatgpt

# The former Route-A `category_binds:` `instructions` entry (@system.instructions →
# ~/.codex/AGENTS.md) is RETIRED: the box guide now reaches the box via the RO
# `~/playbook/kanibako/` bundle + the flattened per-agent FINAL file (seeded by the
# `managed_pointer` kickoff-loader above), not a per-agent native-slot bind.
