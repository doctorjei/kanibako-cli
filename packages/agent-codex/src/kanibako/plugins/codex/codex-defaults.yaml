# codex AGENT defaults — the declarative source of truth for the codex plugin's
# default-set (P6c coalesce; settings-keyspace-1.8.0.md §2d agent.codex.*).
#
# This file holds codex's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery bind, launch grammar, settings routing, cred-file lifecycle,
# init_dirs) plus its AGENT-scope declared `env:` keys.  codex declares no agent
# shares.  It is read by
# the thin loader :mod:`kanibako.settings.agent_defaults`, which builds the PluginDescriptor
# exactly as the old hand-written `target.py` values did.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below (in-box destinations are `$GUEST_HOME`
#     expressions the loader expands; no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary path is runtime-PROBED in
#     `target.py` `detect()`: codex has no fixed contract path, so detect resolves
#     a directly-bindable ELF on `$PATH` (PRIMARY) or the npm-vendored native
#     binary (FALLBACK) per the host-binary preference order.  The file only names,
#     declaratively, that the binary bind's host source is the detected `binary`
#     field (`origin: binary`); the box destination is fixed below.

descriptor:
  command: ["codex"]

  # binary bind — single AS-IS host bind (no separate launcher/share),
  # AGENT_CRITICAL.  origin: binary -> install.binary (the resolved real native
  # musl static-pie ELF; binds standalone, no node in-box).
  bindings:
    - key: binary
      origin: binary
      box_dest: "$GUEST_HOME/.local/bin/codex"
      kind: file
      scope: agent_critical
      ro: true
    # The KICKOFF-LOADER (the flattener SEED).  A tiny plugin-shipped static file
    # delivered RO to ~/.config/kanibako/kickoff.md.  Its content is the canon entry
    # import `@~/canon/COLLECTION.md` (plus, for ONE transition release, the
    # pre-canon `@~/playbook/kanibako/directives/KANIBAKO.md`) — the entrypoint the
    # box-start flattener resolves into the flattened per-agent FINAL file at codex's
    # native slot ~/.codex/AGENTS.md (named by KANIBAKO_DIRECTIVE_FINAL below).  The
    # start-time flatten + hook is a LATER increment; this declaration only ships the
    # SEED and the FINAL-slot env.  `origin: literal` + `literal_src_pkg` names a
    # package-relative resource (resolved to its shipped host path via
    # importlib.resources).  scope `agent` = BEST-EFFORT: a missing/unresolvable
    # source is SKIPPED, never raised, so a missing SEED can NOT crash a launch.
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/KICKOFF.md"
      box_dest: "$GUEST_HOME/.config/kanibako/kickoff.md"
      kind: file
      scope: agent
      ro: true

  # codex 0.140.0: new session = bare `codex` (start -> []); continue-last =
  # `codex resume --last`.  No dedicated resume picker (-R falls through to
  # continue).
  mode:
    start: []
    continue: ["resume", "--last"]

  operations:
    exec:
      fragment: ["exec"]

  # The `access` permission TIER (spec §2d, R-41) — codex realizes all three on
  # the FLAG channel.  Vocabulary VERIFIED against the real CLI (codex-cli
  # 0.141.0; evidence: plans/ratification-implementation-b7b-codex-surface.md):
  #   full       -> --dangerously-bypass-approvals-and-sandbox  (verbatim in
  #                 `--help`: "Skip all confirmation prompts and execute commands
  #                 without sandboxing … solely for … externally sandboxed"; a
  #                 kanibako box IS that outer sandbox)
  #   editing    -> -s workspace-write, the MIDDLE step of the verified sandbox
  #                 enum [read-only | workspace-write | danger-full-access]
  #   restricted -> EMIT NOTHING on the argv — the pre-R-41 `-S` behaviour,
  #                 unchanged.
  # ⚑ The APPROVAL axis is deliberately NOT on the argv: `-a/--ask-for-approval`
  # is ABSENT from `codex exec` (verified: "error: unexpected argument '-a'"),
  # and the launch appends these flags to the exec fragment too, so emitting it
  # would break the standalone op path.  Approval is carried by the PROJECTED
  # surface instead (~/.codex/config.toml approval_policy) — codex persists
  # uniformly, per the 2026-06-27 collapse ruling carried over to `access`.
  # ⚑ FLAG FOR THE LIVE MATRIX (`restricted`): with nothing on the argv, what the
  # CLI does at this tier rests on codex's OWN default approval/sandbox policy —
  # and that default is stated NOWHERE in 0.141.0's local help.  The scout
  # captured the flag/value VOCABULARY, never the defaults, so "codex's own
  # default already prompts" is UNVERIFIED and is no longer asserted here.  The
  # tier's actual guarantee comes from the PROJECTED surface, which SETS
  # `approval_policy = "untrusted"` EXPLICITLY rather than trusting that unknown
  # default (vscode_config `_CODEX_APPROVAL_BY_TIER`); the bifrost matrix must
  # still confirm what the bare CLI does.
  # ⚑ NEVER emit `--full-auto` / `--yolo` — but NOT because they are absent or
  # undocumented.  Verified on 0.141.0 (2026-08-02): neither appears in
  # `codex --help` or `codex exec --help`, yet BOTH parse (`--yolo` at the top
  # level, `--full-auto` on `exec`), and OpenAI's own documentation prose
  # references `--yolo` as ordinary usage
  # (learn.chatgpt.com/docs/config-file/config-basic: "when using `--yolo` or
  # another full access sandbox setting").  So `--yolo` is a real, user-facing
  # spelling — it is simply not the one we emit.  The REASON is positive: it is
  # `--dangerously-bypass-approvals-and-sandbox` that appears in `--help` with an
  # unambiguous description, so the argv kanibako emits SAYS WHAT IT DOES to
  # anyone reading a process list, a log, or a `ps`.  A self-describing flag is
  # the right thing on a permission-granting command line.  (`--full-auto`'s
  # documentation status beyond "not present in 0.141.0's help" is unverified,
  # and no claim is made about earlier codex versions.)
  # ⚑ FLAG FOR THE LIVE MATRIX (`editing`): `workspace-write`'s exact semantics
  # are name-only in local help (no per-value description); "writable workspace,
  # rest read-only" is plausible but UNVERIFIED — the bifrost matrix must confirm
  # the editing row.
  access_realization:
    channel: flag
    setting_key: access
    tiers:
      restricted: {}
      editing: {flag: ["-s", "workspace-write"]}
      full: {flag: ["--dangerously-bypass-approvals-and-sandbox"]}

  settings:
    - setting_key: model
      channel: flag
      flag: ["--model"]
    # NOTE: endpoint is DELIBERATELY not a SettingArg here.  A codex persona's
    # alternate endpoint is delivered via the ~/.codex/config.toml
    # [model_providers.<id>] block (see `persona:` below + vscode_config's
    # merge_codex_model_provider), NOT an env var — so it must not be emitted as a
    # flag/env by the launch arg assembler.  It is a first-class SETTABLE key via
    # setting_descriptors() (target.py) so `config set agent.<node>℘codex.endpoint`
    # validates + resolves through the behavior cascade.

  # PERSONA endpoint/token delivery (codex; INC 2 harness-aware persona resolution).
  # config_file = the endpoint is written into ~/.codex/config.toml's model-provider
  # block (not ANTHROPIC_BASE_URL); token_var EMPTY = DYNAMIC (the single configured
  # secret_path key IS the provider env_key + the in-box bearer var).
  persona:
    endpoint_delivery: config_file
    # Codex removed the "chat" wire (openai/codex#7782); "responses" is the only
    # value current Codex accepts.  NaviGator serves both wires.
    wire_api: responses
    # model_required: a missing model is NOT automatically invalid — some endpoints
    # need no model spec — so the RULE is that absence in the persona store means
    # "this persona does not need one", and THIS declaration is the per-harness veto.
    # Codex vetoes, because a config-file harness cannot express "no model": codex
    # types `model` as Option<String> and resolves it with `model.or(cfg.model)` and
    # NO unwrap_or (codex-rs/core/src/config/mod.rs:621,3832), so an omitted key does
    # not send a model-less request — selection falls through to the model catalog's
    # RECOMMENDED default, which MOVES over time ("If you don't specify a model, [it]
    # uses a recommended model").  Against a third-party provider that id typically
    # 401/404s inside the box at request time (cf. openai/codex#11592).  Refusing at
    # the pre-flight with an actionable message is the cheaper failure.
    model_required: true

  # filtered=False (wholesale copy) is an E2E gate (Phase 10): flip to
  # filtered=True + add a transform_cred allowlist ONLY if E2E proves auth.json
  # carries non-portable machine-id/installation fields.  The host config.toml
  # IMPORT was removed in 1.6.0 (config comes from the curated agent template).
  cred_files:
    - home_rel: ".codex/auth.json"
      host_rel: ".codex/auth.json"
      cadence: sync
      mtime_gate: true
      filtered: false

  host_prep: false
  init_dirs: [".codex"]
  # Credential-SHARING CAPABILITY (spec §2d): codex supports shared creds.
  # RO / plugin-set → meta.agent.codex.auth.share_support.
  auth_share_support: true

  # VS Code Marketplace extension id auto-installed into the box on `kanibako
  # code` attach (FF-4).  The official OpenAI extension is branded "Codex" but
  # its id is `openai.chatgpt` (NOT `openai.codex`; the numerous `*.codex`
  # lookalikes are unofficial).  Present on BOTH the MS Marketplace and Open VSX,
  # so it also installs under a code-server/Open-VSX attach flow.  It bundles its
  # own codex binary (spawns `codex app-server`) and runs container-side; panel
  # auth is container-side (`~/.codex/auth.json`, shared with the CLI) and its
  # approval_policy/sandbox_mode come from `~/.codex/config.toml` (kanibako's
  # config manager seeds approval_policy from the box's `access` tier and forces
  # sandbox_mode = "danger-full-access" as a box invariant — the container IS the
  # sandbox, so the panel app-server must not attempt a nested one).
  vscode_extension: openai.chatgpt

# The former Route-A `category_binds:` `instructions` entry (@system.instructions →
# ~/.codex/AGENTS.md) is RETIRED: the box guide now reaches the box INSIDE the RO
# whole-dir canon bind at `~/canon/bible` + the flattened per-agent FINAL file (seeded by the
# `managed_pointer` kickoff-loader above), not a per-agent native-slot bind.

# AGENT-scope BEHAVIOR defaults -> the `agent.codex.<key>` FLOOR (spec §2d), read by
# the launch off `setting_descriptors()` and laid UNDER the whole cascade, so a user
# overrides one by writing the SAME key in any settings file.  `default:` is MANDATORY
# on every row (an empty one is written `""`) and its value is a STRING.
#
# ⚑ This is a SEPARATE section from `descriptor.settings:` above, and the two key sets
# are not the same one: `settings:` says HOW a value is realized, and `endpoint` below
# is DELIBERATELY not a SettingArg (a codex persona's endpoint is written into
# ~/.codex/config.toml, not emitted as a flag/env), so it has a floor here and no row
# there.  Declaring it keeps `config set agent.<node>℘codex.endpoint` a first-class
# settable, cascade-resolved key.
behavior:
  - key: model
    description: Model to use
    default: gpt-5.5
  - key: endpoint
    description: "Alternate model-provider base-URL (persona); unset uses the
      harness default and syncs the codex login"
    default: ""

# AGENT-scope declared env DEFAULTS -> `agent.codex.env.<VAR>` (spec §2d).  These are
# ordinary settings keys, not a private channel: a user overrides one by writing the
# SAME key in a nearer file, and naming the same VAR at a second scope (say
# `box.env.KANIBAKO_DIRECTIVE_FINAL`) REFUSES the launch naming both keys.  Values
# are STRINGS (quote them); `$GUEST_HOME` is expanded by the loader.
env:
  # The native instruction slot the box-start flattener writes the flattened
  # per-agent FINAL file to (codex reads ~/.codex/AGENTS.md natively).
  KANIBAKO_DIRECTIVE_FINAL: "$GUEST_HOME/.codex/AGENTS.md"
