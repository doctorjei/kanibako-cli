[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako-agent-codex"
version = "0.2.4"
description = "Codex (OpenAI Codex CLI) agent target plugin for kanibako"
requires-python = ">=3.11"
dependencies = ["kanibako-cli"]

[project.entry-points."kanibako.agents"]
codex = "kanibako.plugins.codex:CodexTarget"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kanibako.plugins.codex*"]

[tool.setuptools.package-data]
# Curated template content (Phase 9c).  setuptools' glob does NOT recurse into
# hidden directories with ``**/*`` alone, so the dot-dir patterns (.codex/) are
# listed explicitly to package nested config files.
"kanibako.plugins.codex" = [
    "py.typed",
    # Declarative agent defaults (P6c) — read at import time via importlib.resources.
    "codex-defaults.yaml",
    # Static codex-specific data — the KICKOFF.md SEED (data/KICKOFF.md, a
    # descriptor bind), the plugin's BIBLE CHAPTER (data/rom/directives/ROM_AGENT.md,
    # the whole-dir source of core's ``canon_bible_agent`` bind — C-CANON R2), and
    # the AGENT-STORE payload (data/base/, RENAMED from data/template/ — D4 — since it is
    # stamped into the agent STORE root, of which template/ is only one entry; incl. the
    # nested dot-dir .codex/) — read via
    # importlib.resources.  Nested dot-dir content needs the recursive dot-dir
    # patterns (a plain data/* / data/**/* would miss it).
    "data/*", "data/**/*", "data/**/.*",
    "data/.*/**/*", "data/.*/*",
    "data/**/.*/**/*", "data/**/.*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
