[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako-agent-codex"
version = "0.2.1"
description = "Codex (OpenAI Codex CLI) agent target plugin for kanibako"
requires-python = ">=3.11"
dependencies = ["kanibako-cli"]

[project.entry-points."kanibako.agents"]
codex = "kanibako.plugins.codex:CodexTarget"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kanibako.plugins.codex*"]

[tool.setuptools.package-data]
# Curated template content (Phase 9c).  setuptools' glob does NOT recurse into
# hidden directories with ``**/*`` alone, so the dot-dir patterns (.codex/) are
# listed explicitly to package nested config files.
"kanibako.plugins.codex" = [
    "py.typed",
    # Declarative agent defaults (P6c) — read at import time via importlib.resources.
    "codex-defaults.yaml",
    # Static codex-specific data delivered by descriptor binds (the kickoff-loader
    # SEED under data/kickoff-loader/.codex/) — read via importlib.resources.  The
    # SEED lives in a nested dot-dir, so the same recursive dot-dir patterns as
    # template/ are needed (data/* would miss it).
    "data/*", "data/**/*", "data/**/.*",
    "data/.*/**/*", "data/.*/*",
    "data/**/.*/**/*", "data/**/.*/*",
    "template/**/*", "template/**/.*",
    "template/.*/**/*", "template/.*/*",
    "template/**/.*/**/*", "template/**/.*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
