# goose AGENT defaults — the declarative source of truth for the goose plugin's
# default-set (P6c coalesce; settings-keyspace-1.8.0.md §2d agent.goose.*).
#
# This file holds goose's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery bind, launch grammar, settings routing, container env, cred-file
# lifecycle, init_dirs).  goose declares NO agent shares.  It is read by the thin
# loader :mod:`kanibako.settings.agent_defaults`, which builds the PluginDescriptor exactly
# as the old hand-written `target.py` values did.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below (in-box destinations are `$GUEST_HOME`
#     expressions the loader expands; no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary path stays in `target.py`
#     `detect()` (the `_BINARY` = ~/.local/bin/goose contract constant; `$PATH`
#     must never choose a binary we bind into the box).  The file only names,
#     declaratively, that the binary bind's host source is the detected `binary`
#     field (`origin: binary`).

descriptor:
  command: ["goose"]

  # binary bind — single AS-IS host bind (no separate launcher), AGENT_CRITICAL.
  # origin: binary -> install.binary (the resolved real ELF).
  bindings:
    - key: binary
      origin: binary
      box_dest: "$GUEST_HOME/.local/bin/goose"
      kind: file
      scope: agent_critical
      ro: true
    # The KICKOFF-LOADER (the flattener SEED).  A tiny plugin-shipped static file
    # delivered RO to ~/.config/kanibako/kickoff.md.  Its content is the canon entry
    # import `@~/canon/COLLECTION.md` (plus, for ONE transition release, the
    # pre-canon `@~/playbook/kanibako/directives/KANIBAKO.md`) — the entrypoint the
    # box-start flattener resolves into the flattened per-agent FINAL file at goose's
    # native slot ~/.config/goose/AGENTS.md (named by KANIBAKO_DIRECTIVE_FINAL below;
    # goose loads it via CONTEXT_FILE_NAMES, which lists AGENTS.md).  The start-time
    # flatten + hook is a LATER increment; this declaration only ships the SEED and
    # the FINAL-slot env.  `origin: literal` + `literal_src_pkg` names a
    # package-relative resource (resolved to its shipped host path via
    # importlib.resources).  scope `agent` = BEST-EFFORT: a missing/unresolvable
    # source is SKIPPED, never raised, so a missing SEED can NOT crash a launch.
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/KICKOFF.md"
      box_dest: "$GUEST_HOME/.config/kanibako/kickoff.md"
      kind: file
      scope: agent
      ro: true

  # goose 1.37.0: bare `session` (new) / `session --resume` (continue-last).
  # The removed `session start`/`session resume` subcommands are NOT used.
  mode:
    start: ["session"]
    continue: ["session", "--resume"]

  operations:
    exec:
      fragment: ["run", "--no-session", "-t"]

  # The `access` permission TIER (spec §2d, R-41) — goose realizes it on the ENV
  # channel GOOSE_MODE (goose exposes no permission CLI flag; verified against
  # 1.38.0 `--help`).  BOTH rows are MANDATORY, not optional: goose's own unset
  # GOOSE_MODE default is `auto` (permissive), so a missing value is not "safe by
  # default" — it is the bypass.
  #   full       -> auto     ("Automatically approve tool calls")
  #   restricted -> approve  ("Ask before every tool call")
  #
  # ⚑ NO `editing` ROW — goose CANNOT render that tier, and the launch REFUSES it
  # by name (naming restricted/full as goose's legal tiers) rather than
  # substituting a neighbour.  Source-verified at pinned tag v1.38.0 (evidence:
  # plans/ratification-implementation-b7b-goose-smartapprove.md): the mode ladder
  # is auto > smart_approve > approve > chat, and `smart_approve` auto-approves
  # READ-ONLY tools while PROMPTING for write/edit/shell — the INVERSE of claude's
  # acceptEdits, i.e. the analog of claude's DEFAULT mode, not of `editing`.
  # Mapping `editing` onto it would silently deliver prompt-on-every-edit; mapping
  # it onto `auto` would silently deliver the full bypass.  Ruled (Jei,
  # 2026-08-02): REFUSE.  A future goose that gains an edits-auto mode adds the
  # row here and nothing else changes.
  access_realization:
    channel: env
    env_var: GOOSE_MODE
    setting_key: access
    tiers:
      restricted: {env_value: approve}
      full: {env_value: auto}

  # provider/model route via the ENV channel (GOOSE_MODEL/GOOSE_PROVIDER); the
  # SettingArg only wires the env-var NAME — there is deliberately NO default
  # value (setting_descriptors declares empty defaults so goose falls back to its
  # own config.yaml from `goose configure`).
  settings:
    - setting_key: model
      channel: env
      env_var: GOOSE_MODEL
    - setting_key: provider
      channel: env
      env_var: GOOSE_PROVIDER
    # endpoint (persona): the alternate OpenAI-compatible base-URL.  ENV channel ->
    # goose's built-in `openai` provider reads OPENAI_HOST as the endpoint origin
    # (paired with GOOSE_PROVIDER=openai + OPENAI_API_KEY + GOOSE_MODEL).  Unset
    # (<None>) emits nothing (bare/harness-default); set = point goose at a
    # third-party endpoint (paired with the OAuth-suppress cred fork).  MIRRORS
    # claude's endpoint->ANTHROPIC_BASE_URL declaration (env-var name is
    # HARNESS-specific, so it lives in the descriptor).
    - setting_key: endpoint
      channel: env
      env_var: OPENAI_HOST

  # PERSONA endpoint/token delivery (goose; INC G1 harness-aware persona resolution).
  # env = the endpoint rides the descriptor's endpoint->OPENAI_HOST ENV SettingArg
  # (NOT config_file); token_var=OPENAI_API_KEY is the FIXED secret_path key / in-box
  # bearer var goose's `openai` provider reads.  host_dir_adopt=false: goose is NOT
  # claude, so it must NOT auto-adopt from the claude-shaped ~/.config/claude/<persona>/
  # host dir — an unset endpoint resolves from the KEYSPACE only (goose-worded error).
  # provider_pin forces GOOSE_PROVIDER=openai (via the `provider` setting) whenever a
  # goose persona endpoint is active, so the openai provider can't be forgotten.
  # model_required: a third-party endpoint has no meaningful default model → require one.
  persona:
    endpoint_delivery: env
    token_var: OPENAI_API_KEY
    host_dir_adopt: false
    model_required: true
    provider_pin:
      provider: openai

  # GOOSE_DISABLE_KEYRING is ALWAYS set for goose boxes (static): the in-box OS
  # keyring/D-Bus secret-service is unavailable, so goose stores secrets in the
  # file ~/.config/goose/secrets.yaml instead (the file kanibako syncs).
  #
  # CONTEXT_FILE_NAMES makes goose load the flattened per-agent FINAL guidance file
  # the box-start flattener writes to ~/.config/goose/.additionalContext.md
  # (KANIBAKO_DIRECTIVE_FINAL below) — goose only reads the filenames in this list, so
  # `.additionalContext.md` must be listed.  The value is a JSON array STRING (goose's
  # expected format); AGENTS.md / .goosehints stay so a user's own context files still
  # load alongside ours.
  container_env:
    GOOSE_DISABLE_KEYRING: "true"
    CONTEXT_FILE_NAMES: '[".additionalContext.md","AGENTS.md",".goosehints"]'
    # The native instruction slot the box-start flattener writes the flattened
    # per-agent FINAL file to.  goose reads it via CONTEXT_FILE_NAMES.
    # ⚑ STOPGAP + breadcrumb: goose CANNOT inject additionalContext from a hook today
    # (its hooks only do `{decision,reason}` deny — verified block/goose v1.42; the
    # capability is open/unmerged in aaif-goose/goose#10361).  So we deliver directives
    # as a context FILE and name it `.additionalContext.md` DELIBERATELY so it sticks
    # out: once goose gains hook additionalContext injection, migrate goose to the
    # claude/codex SessionStart-hook path and drop this file + its CONTEXT_FILE_NAMES entry.
    KANIBAKO_DIRECTIVE_FINAL: "$GUEST_HOME/.config/goose/.additionalContext.md"

  # Two-way SYNC of three things so in-box `goose configure` persists to the host
  # (host check_auth then passes -> no re-prompt):
  #   secrets.yaml + custom_providers/ (unfiltered, key-by-NAME) and config.yaml
  #   (FILTERED via transform_cred so the box-local panel-parity GOOSE_MODE is not
  #   written back over the host's own GOOSE_MODE).
  cred_files:
    - home_rel: ".config/goose/secrets.yaml"
      host_rel: ".config/goose/secrets.yaml"
      cadence: sync
      mtime_gate: true
      filtered: false
    # config.yaml is a two-way SYNC file (in-box `goose configure` -> host), BUT it
    # is FILTERED (transform_cred) so the box-local panel-parity GOOSE_MODE
    # (seeded by GooseTarget.deliver_panel_permissions for the VS Code panel's yolo) is
    # NOT written back over the host's own GOOSE_MODE.  On writeback the host's
    # GOOSE_MODE is preserved; every other key the user changed in-box still flows.
    - home_rel: ".config/goose/config.yaml"
      host_rel: ".config/goose/config.yaml"
      cadence: sync
      mtime_gate: true
      filtered: true
    - home_rel: ".config/goose/custom_providers"
      host_rel: ".config/goose/custom_providers"
      cadence: sync
      mtime_gate: true
      filtered: false
      is_dir: true

  host_prep: false
  init_dirs: [".config/goose", ".local/share/goose/sessions"]
  # Credential-SHARING CAPABILITY (spec §2d): goose supports shared creds.
  # RO / plugin-set → meta.agent.goose.auth.share_support.
  auth_share_support: true

  # VS Code Marketplace extension id auto-installed into the box on `kanibako
  # code` attach (FF-4).  `block.vscode-goose` is Block's official ACP-based
  # extension (supersedes the older `michaelneale.goose-vscode`); it is a thin
  # ACP client that spawns the in-container `goose` CLI (requires goose >= 1.16.0
  # in the box) and runs container-side, with auth in `~/.config/goose/config.yaml`
  # shared with the CLI.
  # ⚑ CAVEATS (still EXPERIMENTAL upstream):
  #   - Marketplace ONLY — NOT published to Open VSX (verified 404), so a
  #     code-server / Open-VSX-based attach flow CANNOT auto-install it; that path
  #     falls back to running `goose` in the integrated terminal (a VSIX sideload
  #     is the manual alternative).  Under an MS-Marketplace attach the id installs
  #     normally like claude/codex.
  #   - `GOOSE_MODE` (permission parity) is seeded into the box's config.yaml from
  #     the box's `access` tier so the panel-spawned goose reflects it (goose
  #     renders restricted|full only — `editing` is refused, see access_realization).
  vscode_extension: block.vscode-goose

# The former Route-A `category_binds:` `instructions` entry (@system.instructions →
# ~/.config/goose/KANIBAKO.md) is RETIRED: the box guide now reaches the box INSIDE
# the RO whole-dir canon bind at `~/canon/bible` + the flattened per-agent FINAL file (seeded by
# the `managed_pointer` kickoff-loader above), arriving at ~/.config/goose/AGENTS.md
# (still listed in CONTEXT_FILE_NAMES), not a per-agent KANIBAKO.md native-slot bind.
