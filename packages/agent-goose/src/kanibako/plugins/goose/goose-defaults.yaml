# goose AGENT defaults — the declarative source of truth for the goose plugin's
# default-set (P6c coalesce; settings-keyspace-1.6.0-target.md §2d agent.goose.*).
#
# This file holds goose's complete DECLARATIVE default-set: its PluginDescriptor
# data (delivery bind, launch grammar, settings routing, container env, cred-file
# lifecycle, init_dirs).  goose declares NO agent shares.  It is read by the thin
# loader :mod:`kanibako.agent_defaults`, which builds the PluginDescriptor exactly
# as the old hand-written `target.py` values did.
#
# What lives here (DECLARATIVE) vs what stays code-resolved in target.py:
#   * DECLARATIVE — everything below (in-box destinations are `$GUEST_HOME`
#     expressions the loader expands; no `/home/agent` literal here).
#   * CODE-RESOLVED — the CRITICAL host binary path stays in `target.py`
#     `detect()` (the `_BINARY` = ~/.local/bin/goose contract constant; `$PATH`
#     must never choose a binary we bind into the box).  The file only names,
#     declaratively, that the binary bind's host source is the detected `binary`
#     field (`origin: binary`).

descriptor:
  command: ["goose"]

  # binary bind — single AS-IS host bind (no separate launcher), AGENT_CRITICAL.
  # origin: binary -> install.binary (the resolved real ELF).
  bindings:
    - key: binary
      origin: binary
      box_dest: "$GUEST_HOME/.local/bin/goose"
      kind: file
      scope: agent_critical
      ro: true
    # The KICKOFF-LOADER (the flattener SEED).  A tiny plugin-shipped static file
    # delivered RO to ~/.config/kanibako/kickoff.md.  Its whole content is a single
    # `@~/playbook/kanibako/directives/KANIBAKO.md` import — the entrypoint the
    # box-start flattener resolves into the flattened per-agent FINAL file at goose's
    # native slot ~/.config/goose/AGENTS.md (named by KANIBAKO_DIRECTIVE_FINAL below;
    # goose loads it via CONTEXT_FILE_NAMES, which lists AGENTS.md).  The start-time
    # flatten + hook is a LATER increment; this declaration only ships the SEED and
    # the FINAL-slot env.  `origin: literal` + `literal_src_pkg` names a
    # package-relative resource (resolved to its shipped host path via
    # importlib.resources).  scope `agent` = BEST-EFFORT: a missing/unresolvable
    # source is SKIPPED, never raised, so a missing SEED can NOT crash a launch.
    - key: managed_pointer
      origin: literal
      literal_src_pkg: "data/kickoff-loader/.config/goose/AGENTS.md"
      box_dest: "$GUEST_HOME/.config/kanibako/kickoff.md"
      kind: file
      scope: agent
      ro: true

  # goose 1.37.0: bare `session` (new) / `session --resume` (continue-last).
  # The removed `session start`/`session resume` subcommands are NOT used.
  mode:
    start: ["session"]
    continue: ["session", "--resume"]

  operations:
    exec:
      fragment: ["run", "--no-session", "-t"]

  # safe-bypass is the SYMMETRIC ENV channel GOOSE_MODE (no --approve-all flag in
  # 1.37.0): safe-OFF -> auto; safe-ON -> approve.  The secure value is MANDATORY
  # because goose's unset GOOSE_MODE default is itself `auto`.  Persisted default
  # via the "auto_approve" agent-scope key (spec §2d L655, default true/PERMISSIVE).
  safe_bypass:
    channel: env
    env_var: GOOSE_MODE
    env_value: auto
    secure_env_value: approve
    setting_key: auto_approve

  # provider/model route via the ENV channel (GOOSE_MODEL/GOOSE_PROVIDER); the
  # SettingArg only wires the env-var NAME — there is deliberately NO default
  # value (setting_descriptors declares empty defaults so goose falls back to its
  # own config.yaml from `goose configure`).
  settings:
    - setting_key: model
      channel: env
      env_var: GOOSE_MODEL
    - setting_key: provider
      channel: env
      env_var: GOOSE_PROVIDER

  # GOOSE_DISABLE_KEYRING is ALWAYS set for goose boxes (static): the in-box OS
  # keyring/D-Bus secret-service is unavailable, so goose stores secrets in the
  # file ~/.config/goose/secrets.yaml instead (the file kanibako syncs).
  #
  # CONTEXT_FILE_NAMES makes goose load the flattened per-agent FINAL guidance file
  # the box-start flattener writes to ~/.config/goose/.additionalContext.md
  # (KANIBAKO_DIRECTIVE_FINAL below) — goose only reads the filenames in this list, so
  # `.additionalContext.md` must be listed.  The value is a JSON array STRING (goose's
  # expected format); AGENTS.md / .goosehints stay so a user's own context files still
  # load alongside ours.
  container_env:
    GOOSE_DISABLE_KEYRING: "true"
    CONTEXT_FILE_NAMES: '[".additionalContext.md","AGENTS.md",".goosehints"]'
    # The native instruction slot the box-start flattener writes the flattened
    # per-agent FINAL file to.  goose reads it via CONTEXT_FILE_NAMES.
    # ⚑ STOPGAP + breadcrumb: goose CANNOT inject additionalContext from a hook today
    # (its hooks only do `{decision,reason}` deny — verified block/goose v1.42; the
    # capability is open/unmerged in aaif-goose/goose#10361).  So we deliver directives
    # as a context FILE and name it `.additionalContext.md` DELIBERATELY so it sticks
    # out: once goose gains hook additionalContext injection, migrate goose to the
    # claude/codex SessionStart-hook path and drop this file + its CONTEXT_FILE_NAMES entry.
    KANIBAKO_DIRECTIVE_FINAL: "$GUEST_HOME/.config/goose/.additionalContext.md"

  # Two-way SYNC of three things so in-box `goose configure` persists to the host
  # (host check_auth then passes -> no re-prompt).  All unfiltered (key-by-NAME):
  #   secrets.yaml + config.yaml (files) and custom_providers/ (dir).
  cred_files:
    - home_rel: ".config/goose/secrets.yaml"
      host_rel: ".config/goose/secrets.yaml"
      cadence: sync
      mtime_gate: true
      filtered: false
    - home_rel: ".config/goose/config.yaml"
      host_rel: ".config/goose/config.yaml"
      cadence: sync
      mtime_gate: true
      filtered: false
    - home_rel: ".config/goose/custom_providers"
      host_rel: ".config/goose/custom_providers"
      cadence: sync
      mtime_gate: true
      filtered: false
      is_dir: true

  host_prep: false
  init_dirs: [".config/goose", ".local/share/goose/sessions"]
  # Credential-SHARING CAPABILITY (spec §2d): goose supports shared creds.
  # RO / plugin-set → meta.agent.goose.auth.share_support.
  auth_share_support: true

# The former Route-A `category_binds:` `instructions` entry (@system.instructions →
# ~/.config/goose/KANIBAKO.md) is RETIRED: the box guide now reaches the box via the
# RO `~/playbook/kanibako/` bundle + the flattened per-agent FINAL file (seeded by
# the `managed_pointer` kickoff-loader above), arriving at ~/.config/goose/AGENTS.md
# (still listed in CONTEXT_FILE_NAMES), not a per-agent KANIBAKO.md native-slot bind.
