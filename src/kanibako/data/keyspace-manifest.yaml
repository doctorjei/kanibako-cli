## kanibako keyspace registry — RATIFIED 2026-08-01
## (ratification record: plans/manifest-ratification-RULINGS.md)
##
## AUTHORITY is specs/settings-keyspace-1.8.0.md. This file is its
## MACHINE-READABLE projection: the single table from which the Key
## set, Scope enums, defaults and directional rules are GENERATED, and against which
## a conformance test asserts code == registry.
##
## CONVENTION: every entry carries `spec:` = the section it is traced from.

registry:                       # about this DOCUMENT (inert; never read by resolution)
  schema: 1                     # format version of this file
  keyspace: "1.8.0rc"           # flipped to "1.8.0" in-tree before the promoted rc (Part-4-as-amended)
  authority: "specs/settings-keyspace-1.8.0.md"
  authority_read: "2026-08-01 (1300 lines, full)"
  status: ratified              # ratification record: plans/manifest-ratification-RULINGS.md

## ---------------------------------------------------------------------------
## POLICY — the rules of the keyspace. Every field traces to a ratified clause.
## No knob without a clause.
## ---------------------------------------------------------------------------
policy:

  # Override PRECEDENCE. Box wins. NOT the same axis as containment below.
  # AUTHORITY TIERS — the actual sources of a value, in precedence order:
  cascade: [base, system, agent, workset, box]
  cascade_spec: "§2 (authority tiers), as clarified by Jei 2026-07-27"

  # R-17: the manifest carries BOTH forms — one alone generates the wrong
  # resolver. The IMPLEMENTATION BRACKET writes the agent tier's intra-tier
  # fallback as an explicit linear level; §2 rules this EQUIVALENT for scalars
  # AND for per-name category merges (`_MISSING` is tested per name — no nested
  # mini-cascade). Do NOT count agent.default as a separate authority level.
  # Token mapping: the spec (§2) spells the active-agent level `agent.<active>`; this file spells it `agent.active`.
  cascade_bracket: [base, system, agent.default, agent.active, workset, box]
  cascade_bracket_spec: "§2 (FULL bracket; R-17)"

  # `agent.default` is NOT an authority tier. It is the agent tier's INTRA-TIER
  # FALLBACK: the values automatically part of EVERY agent unless overridden.
  #   agent tier value = agent.<active>.<key> if provided, else agent.default.<key>
  # [Jei 2026-07-27: "It's not really its own level; rather, those are the values
  #  until and unless the plugin provides a different value."]
  agent_tier_fallback: "agent.<agent>.<key> -> agent.default.<key>"
  agent_tier_fallback_spec: "§2d; clarified Jei 2026-07-27; R-17 ratified the framing"

  # (R-17 also RESOLVES the draft's "SPEC RECONCILIATION NEEDED" flag that stood
  #  here: the spec ruled the fallback framing 2026-07-27 and the flag is DELETED.)

  # PARAMETRIC EXPANSION — makes the closed set closed WITHOUT enumerating it.
  # The keyspace is closed but NOT flat: these rules generate the legal key set.
  parametric_expansion:
    - "every agent.default.<key> ALSO exists as agent.<agent>.<key> (same type,
       same default, resolved via agent_tier_fallback)"
    - "every category in `categories` exists at every scope in categories.scopes"
    - "meta.box.agent.<key> MIRRORS (RO) the ACTIVE agent's whole subtree (§2b;
       R-4 — the settable box.agent.<key> form is RETIRED; a box tweaks its
       agent via pref.agent.<agent>.<key>, §2h)"
  parametric_expansion_spec: "§2a / §2b / §2d"

  # The baked-in code defaults are NOT a tier either — they are each key's `default:`
  # field below, which IS the defaults source §2a's assemble step reads.

  # GLOB CONVENTION (R-22) — the notation a key FAMILY/pattern is written in
  # (the §2h pref allowlist is written in it, so it cannot be generated without
  # this convention being data here).
  glob:
    "*": one_segment          # matches exactly ONE segment
    "**": remaining_tail      # matches the remaining tail at any depth.
                              # ONE-or-more by construction, not by rule: the
                              # separator is part of the pattern, so a
                              # zero-length tail on `agent.*.**` would yield the
                              # malformed `agent.foo.` (trailing dot).
  glob_spec: "§0 (GLOB CONVENTION; R-22)"

  # CONTAINMENT. Governs WHERE a key may be WRITTEN and which way an @-ref points.
  # Orthogonal to cascade (§0: "Distinct from the cascade").
  containment: [system, agent, workset, box]      # system ⊃ agent ⊃ workset ⊃ box
  containment_spec: "§0 (directional view/set)"

  write_rule: command_scope_ge_key_scope    # may write own scope + scopes it CONTAINS
  write_rule_spec: "§2a (scope-direction guard); R2 2026-06-29 + Jei 2026-07-02"

  ref_direction: up_only          # @-refs view UP (read-only); never point DOWN
  ref_direction_spec: "§0"

  # REFERENCE FORMS (R-23) — how an @-ref is SPELLED. The bare form is the
  # normal spelling; braces exist because the bare reference-name pattern is
  # GREEDY over dot-separated segments (a bare `@meta.box.name.jsonl` parses the
  # ref name as `meta.box.name.jsonl`, swallowing the extension, resolving
  # ABSENT, and coercing to "" — silently yielding a path with no filename).
  reference_forms:
    bare: "@a.b.c"              # UNCHANGED, the normal spelling
    braced: "@{a.b.c}x"         # delimits the ref name explicitly so a LITERAL
                                # SUFFIX may follow: resolves ref a.b.c, appends x.
                                # Needed only where the character after the ref
                                # would otherwise be eaten by the name (`.`, and
                                # any other segment-legal character).
    equivalence: "both forms resolve identically where both are expressible"
    positions: "WHOLE-VALUE and EMBEDDED alike; set-time validation treats a
                dangling braced ref exactly as a dangling bare one"
    motivating_row: "box.bindings.ro.helper_log — (@workset.logs/@{meta.box.name}.jsonl, …);
                     the retired workaround SPELLING meta.box.helper_log was never
                     a key (not_keys.never_a_key; R-23/R-36)"
  reference_forms_spec: "§2c (BRACE FORM `@{name}`; R-23, ruled 2026-07-30b)"

  enforce_at: resolve             # containing-scope key in a lower file is DROPPED + warned
  enforce_at_spec: "§0 (clause 4 bless, Jei 2026-07-02)"

  read_verbs:                     # clause 5
    get: stored_at_scope          # what THIS scope's file says; else "(not set)"; never fabricate
    get_effective: cascade        # what will actually apply
  read_verbs_spec: "§2a (clause 5 bless, Jei 2026-07-02)"

  # Files store entries UNRESOLVED — no code path writes a resolved value back.
  files_store_unresolved: true
  files_store_unresolved_spec: "§0"

  # TUPLE DIRECTION (R-20) — every pair is (source, destination), left→right.
  # Destination SPACE differs by delivery kind: a mount's dest is a GUEST path
  # (that is what a mount is for — a bind always carries an explicit in-box
  # location); a COPY's dest is a HOST path under the box's storage, because a
  # copy runs BEFORE any guest exists (the box seed happens at `create`), so it
  # can only ever write host-side.
  tuple_direction: source_then_destination
  tuple_dest_space:
    mounts: guest               # bindings.ro · bindings.rw · caches · common
                                # (masks is dest-KEYED, not a tuple — its dests
                                #  are guest paths all the same)
    copies: host                # seeded · synced
  tuple_direction_spec: "§0 (Tuple direction; R-20, ruled 2026-07-30)"

  # -------------------------------------------------------------------------
  # TWO LAYERS (R-19) — the categories are NOT peers; `bindings` is the SOURCE
  # OF TRUTH and the rest EXTEND it. This classification + the collision table
  # below REPLACE the retired flat D-B1 authority order (`category_precedence`)
  # — superseded 2026-07-29; the runtime already implements this model
  # (M-7, _RULE_CHANGE_RELEASE = "1.8.0"), so R-19 changes no behavior.
  # -------------------------------------------------------------------------
  category_layers:
    bindings.ro: concrete       # a mount is emitted from NOTHING ELSE —
    bindings.rw: concrete       #   this is what makes bindings the source of truth
    masks: concrete_separate    # a COUSIN of bindings.{ro,rw}, not a sibling:
                                #   bindings.* says PUT THIS HERE, masks says
                                #   NOTHING MAY BE HERE. Different shape (dest-
                                #   keyed 3-state), different conflict rule.
    common: abstract            # ROOTED declarations (declaration_roots below)
    caches: abstract            #   that EXTEND bindings.rw. Still real, declared,
    seeded: abstract            #   settable keys; seeded derives a COPY, not a mount.
    synced: derived             # derives a binding PLUS extra lifecycle (file
                                #   COPY, credential-delivery gate, inode-swap
                                #   writeback); takes NO root — both sides fully spelled.
  abstract_extends: bindings.rw
  # The derived binding is MATERIALISED beside the declaration (--effective shows
  # BOTH, so a user can see WHY a mount exists) — but the derivation is NOT a
  # key: it rides in the launch snapshot as the reserved internal node
  # `binding_derivations` (see not_keys.reserved_internal; R-8).
  category_layers_spec: "§0 (TWO LAYERS; R-19)"

  # CATEGORY COLLISIONS (R-19) — keyed on the resolved `box_dest`, NEVER on the
  # name: different names at one dest collide; one name at two dests does not.
  category_collisions:
    keyed_on: resolved_box_dest
    table:
      - case: "bindings.{ro,rw} vs bindings.{ro,rw} at one dest"
        outcome: error
        qualifier: "always — any scope, any mode. ro/rw is the serious case: two
                    bindings at one dest disagreeing on MODE is a semantic
                    disagreement, not just a source disagreement — silently
                    picking one hands the user a read-only mount where they
                    expected writable, invisibly."
      - case: "masks at a dest a binding occupies"
        outcome: override
        qualifier: "by design — hiding a bound path is the whole job"
      - case: "an abstraction EXTENDING onto a dest the base already occupies"
        outcome: error
        qualifier: "refuse the EXTENSION. The explicit bindings.* are the BASE
                    and abstractions apply AFTER, so the explicit binding
                    survives and the colliding extension is what is refused —
                    'I wrote it down literally' wins. The error names the
                    extending entry, the occupant, and the dest."
      - case: "abstraction vs abstraction, DIFFERENT scopes"
        outcome: scope_precedence
        qualifier: "silent"
      - case: "abstraction vs abstraction, SAME scope (same or different category)"
        outcome: proceed_and_warn
        qualifier: "proceed on the existing ordering + WARN, EVERY LAUNCH (not
                    deduplicated, not once-ever — a same-scope collision is a
                    real ambiguity and stays visible until fixed)"
        winning_scope_qualifier: "The warn applies to the WINNING scope's own
                    ambiguity: a LOSING scope's internal tie is wholly masked by
                    the cross-scope rule above — its 'winner' changed nothing —
                    and warning about a decision with no consequence trains the
                    user to ignore the warning that matters. (Qualified 2026-07-31.)"
    # With conflicts strict, present-None-ing the inherited entry and then
    # declaring the new one is the ONLY way to change what occupies a dest.
    # That is the non-obvious part — so the refusal must teach it.
    error_text_must_point_at: suppress_then_add
  category_collisions_spec: "§0 (Category collisions; R-19, qualified 2026-07-31)"

  # The assembler's two reconciliations — the halves of D-B1 that STAND (its
  # flat authority ORDER is what R-19 retired).
  category_reconcile:
    nested_paths: deepest_wins        # depth-ordered, matches podman mount depth-sort
    copies: [seeded, synced]          # file COPIES, not mounts; mounts physically
                                      #   shadow a copied file at the same path
                                      #   regardless of order
    synced_vs_binding_same_dest: error   # a copy can't override a live mount —
                                         #   the assembler flags a config error,
                                         #   not a silent no-op
  category_reconcile_spec: "§0 (Two reconciliations for the assembler)"

  # Collision-safety floor on the resolved data structure.
  # R-25 (RECORD, acknowledged 2026-08-01): checked at ratification — this
  # entry, spec §0 and code AGREE; code pins the agreement at import time
  # (settings_keyspace asserts equality with settings_store._RESERVED_KEY_NAMES).
  reserved_leaf_names: [get, keys, values, items, pop, popitem, setdefault,
                        update, clear, copy, fromkeys]
  reserved_dunder: true             # a leaf key may not match __x__
  key_match: case_sensitive
  reserved_spec: "§0 (Reserved key names) / §2a (R-25: recorded as checked)"

  # XDG: use the env var iff set AND absolute, else the spec default. ONE canonical
  # map builder supplies $XDG_* to EVERY host-side resolution context.
  xdg:
    canonical_builder_required: true
    defaults:
      XDG_DATA_HOME: "~/.local/share"
      XDG_CONFIG_HOME: "~/.config"
      XDG_STATE_HOME: "~/.local/state"
      XDG_CACHE_HOME: "~/.cache"
      XDG_RUNTIME_DIR: null           # NO spec default — fall back + WARN, never silent
    box_side_deferred: true           # host pass MUST NOT expand a box-side $XDG/~
    escapes:                          # deferred residue escape contract
      carried_verbatim: ['\$', '\~', '\\']
      unescaped_by_host: ['\@']
  xdg_spec: "§1 (clause 3′ bless, Jei 2026-07-02)"

  # CLI LEVEL (§1A; R-11): the command line is its OWN level — the highest, above
  # every settings file and every pref. ANY flag that shadows a key overrides that
  # key for the launch (a GENERAL rule, not a carve-out for particular flags).
  cli_level:
    level: own_highest              # NOT a cascade scope and NOT a pref: a separate
                                    #   input level outranking every settings file
                                    #   AND every pref
    level_spec: "§1A (R-11)"
    generality: any_shadowing_flag  # the flag table below ENUMERATES the declared
                                    #   instances; it does not LIMIT the rule
    generality_spec: "§1A (R-11)"
    # Per-launch CLI flags are EPHEMERAL: override for that launch, never mutate
    # an EXISTING stored value (create_exception below is the ONE exception).
    # Absorbed from the former top-level `cli_flags_ephemeral` field — one
    # spelling of one policy.
    flags_ephemeral: true
    flags_ephemeral_spec: "§1A (Jei ratified 2026-07-08)"
    # CREATE EXCEPTION (R-11a, Jei 2026-08-01): at box CREATION only, a shadowing
    # flag's value PERSISTS — it INITIALIZES the box's stored config (e.g.
    # `create -i` durably writes box.image). Ephemerality governs every other
    # invocation; ALL shadowing flags act UNIFORMLY; create is the ONLY exception.
    create_exception: true
    create_exception_spec: "§1A (CREATE EXCEPTION)"
    # PROJECTED-SURFACE EXCEPTION stands as a STRUCTURAL CLASS RULE (R-11a
    # collision RULED (i)) — not counted as a flag exception; where it applies it
    # WINS over the CLI level (-S/-A; -M barred from the codex projection resolve).
    # Backlogged fix: per-launch idempotent projections would dissolve it.
    projected_surface_exception: structural_class_rule
    projected_surface_exception_spec: "§1A (PROJECTED-SURFACE EXCEPTION)"
    # THE WIRED-FLAG TABLE AS DATA (R-11). `status:` is the A4-time truth:
    #   wired                      — installed at its canonical key name, level-
    #                                tagged, inside the resolve (settings_cli_level)
    #   pending_wire               — RULED a CODE GAP (R-11a(a)): the spec's general
    #                                rule stands; wiring is implementation work on
    #                                this version's plate (plan step B6). Listing an
    #                                unwired entry as `wired` would assert a contract
    #                                the code does not honour — hence the marker.
    #                                (B6 LANDED: no entry carries this status now;
    #                                the marker is kept for any future ruled gap.)
    #   projected_surface_excluded — folded at its EPHEMERAL consumer (the launch
    #                                argv); never enters the CLI level, because the
    #                                projection outlives the launch (the structural
    #                                class rule above).
    shadowed_flags:
      "--agent":
        key: system.agent
        status: wired
      "-M/--model":
        key: "agent.<agent>.model"
        status: wired
        note: "spelled against the ACTIVE agent. Barred from the codex
               config-projection RESOLVE (that consumer reads the cascade, not
               the CLI level — projected-surface class, §1A)."
      "-N/-C/-R":
        key: "agent.<agent>.continue_mode"
        status: wired
      "--image":
        key: box.image
        status: wired               # B6 (R-11a(a)): keyspace-resolved via the
                                    #   box-scalar resolve (config.load_merged_config)
      "--share-images":
        key: box.share_images
        status: wired               # B6 (R-11a(a)): same resolve; store_true, so
                                    #   only a GIVEN flag installs (True)
      "-S/-A":
        key: "agent.<agent>.access"
        status: projected_surface_excluded
        note: "R-41 successor spelling (supersedes auto_approve). The access
               projection is written onto the box's persisted agent-config
               surfaces; a level entry would make an ephemeral flag mutate
               persisted state."
    shadowed_flags_spec: "§1A (flag enumeration; R-11 + R-11a)"

  # DECLARATION ROOTS (R-21) — the ABSTRACT categories (common/caches/seeded)
  # let an author write a bare LEAF; the root is supplied at DECLARATION-LOAD
  # time, so what is STORED is the full self-resolving @-ref (author writes
  # `plugins`; the loader stores `@meta.<scope>.path/common/plugins`).
  # Assembly-time prepend is FORBIDDEN — a stored bare relative that only works
  # because a layer prepends a root is the retired `scope_roots` defect (code
  # deleted; absence pinned by tests). Author ergonomics are identical; only
  # the ARTIFACT differs — which is the whole of the difference.
  declaration_roots:
    applies_to: [common, caches, seeded]   # synced takes NO root; bindings take NO root
    rooted_at: declaration_load            # REQUIRED
    assembly_prepend: forbidden            # `scope_roots` — no longer exists
    subdir_pattern: "<scope-root>/<category>/<name>"
    roots:
      system: "@config.data"
      agent: "@meta.agent.<agent>.path"    # = @config.agents/<agent>
      workset: "@meta.workset.path"
      box: "@meta.box.path"                # per mode (§2c) — so standalone roots too
    # An ABSOLUTE host_src in an abstract category is LEGAL — it is simply NOT
    # root-joined. The root is a DEFAULT FOR RELATIVE SOURCES, not a universal law.
    absolute_host_src: legal_not_root_joined
    # HOST root ONLY — the guest dest is ALWAYS spelled out (kanibako owns the
    # host layout, never the guest layout). The root dirname is FIXED MACHINERY,
    # not a key: every "override it" want is served better by a concrete
    # bindings.rw entry (one entry elsewhere) or by moving the SCOPE ROOT, which
    # is already a key (config.agents, workset.boxes).
    guest_root: none
    root_dirname_is_a_key: false
  declaration_roots_spec: "§2a (DECLARATION ROOTS; R-21, ruled 2026-08-01)"

  # SEED WHITELISTS (R-24) — per-scope, DENY BY DEFAULT: anything not listed is
  # refused. The enumeration IS an allowlist — a correctness property, not a
  # style choice (a wholesale template copy could plant settings.yaml — the LAST
  # cascade level — or a templated registry.yaml corrupting box membership).
  # Severity is recorded ONLY where the spec states it: correctness = silently
  # override the cascade / corrupt box membership; user_data_and_secrets = the
  # user's credentials/code. STANDALONE is where this matters most: the workset
  # root IS the user's project directory.
  seed_whitelists:
    default: deny
    box:
      root: "<box_dir>"                    # @meta.box.path
      allow: ["home/", "canon/handbook/"]
      deny:
        "settings.yaml": "correctness — = meta.box.settings, the LAST cascade level"
        "<box_name>.jsonl": "standalone helper log"
    agent:
      root: "agents/<agent>"               # @meta.agent.<agent>.path
      allow: ["template/", "canon/handbook/", "common/"]
      deny:
        "settings.yaml": "correctness — = meta.agent.<agent>.settings"
        "caches/": "denied by default"
    workset:
      root: "<workset_path>"               # @meta.workset.path
      allow: ["template/", "canon/handbook/"]
      deny:
        "settings.yaml": "correctness — = meta.workset.settings"
        "registry.yaml": "correctness — = workset.registry, the AUTHORITATIVE
                          store of box membership + names"
        "auth/": "user_data_and_secrets — CREDENTIALS"
        "vault/": "user_data_and_secrets"
        "workspaces/": "user_data_and_secrets — THE USER'S CODE"
        "boxes/": "denied by default"
        "logs/": "denied by default"
        "channels/": "denied by default"
    # ONLY canon/handbook/ is seedable, never canon/ wholesale: no other canon
    # subtree has a justified seed today, and deny-by-default means any future
    # one needs an explicit decision rather than inheriting permission.
    # The whitelists are NOT one uniform rule — common/ is allowed at agent
    # scope (there are use cases) and behaves differently from its siblings:
    # canon/ is delivered RO and template/ is inert until a box is created,
    # whereas common/ is bound RW, SHARED by every box running that agent, and
    # box-writable — seeded starter content there is live data, not a template
    # (create-if-absent still applies, so it cannot clobber).
    # ENFORCEMENT: dests are fixed by keys, so a template cannot CHOOSE where it
    # writes. The residual escape is traversal in template CONTENT — the copier
    # MUST reject `..` components and MUST NOT follow symlinks out of the
    # destination subtree. Those TRAVERSAL DEFENCES are an algorithm, not a
    # table: they stay in CODE (R-24's explicit split).
    traversal_defences: code
  seed_whitelists_spec: "§2a (seed whitelists, ruled Jei 2026-07-30; R-24 — data
                         into the manifest, defences stay code)"

  # SEEDED-SEEDS (R-24) — the HOST STORE is itself seeded from the PACKAGES:
  # the step before the box seed, filling the store the box layers copy from.
  # ONE mechanism (the same layered create-if-absent copy), fired at FOUR
  # lifecycle moments:
  seeded_seeds_moments:
    - moment: "install / setup"
      from: "core package"
      into: ["global/template/*", "agents/default", "global/canon/handbook"]
    - moment: "agent install"
      from: "plugin package + global/template/agent (the PLUGIN wins)"
      into: ["agents/<agent>"]
    - moment: "workset create"
      from: "global/template/workset"
      into: ["<workset_path>"]
    - moment: "box create"
      from: "the three */template/box/* layers"
      into: ["<box_dir>/home", "<box_dir>/canon/handbook"]
  # Create-if-absent per FILE, never overwrite — once a file exists it belongs
  # to whoever owns that store; a package upgrade must not silently revert their
  # edits. Report a skip ONLY where the packaged file DIFFERS from the one on
  # disk. The whitelists and the (code-side) traversal defences apply here too.
  seeded_seeds_moments_spec: "§2a (SEEDED-SEEDS, four lifecycle moments; R-24)"

  # Set-time validation: full resolution in error-collecting/lenient mode.
  set_validation:
    mode: full_resolution_lenient
    error: [malformed_syntax, colon_src_dest_notation, type_mismatch,
            edited_value_upstream_unresolvable]
    allow: [unrelated_defect, downstream_defect, defect_the_edit_resolves]
    warn: [host_source_path_missing]
    rule: "allow iff the edited value resolves cleanly post-edit"
  set_validation_spec: "§2a (ruling 2026-06-29, E3)"

  # ANTI-FABRICATION GATE — the reason this file exists.
  # A key not in this table cannot be read, set, or resolved; an unrecognized
  # `policy:` field is likewise refused (keeps this block from becoming a junk drawer).
  unknown_key: error
  unknown_policy_field: error
  unknown_spec: "§0 \"The keyspace is CLOSED — an undeclared key is NOT a key\" (folded into the
                 spec 2026-07-28). Rulings: 2026-06-27 walkthrough + Jei 2026-07-27."

## ---------------------------------------------------------------------------
## CATEGORIES — the unified primitive (§2a). Available at EVERY scope, so they are
## declared ONCE here rather than enumerated scope×category (would be 4×9 entries).
## Each expands to `<scope>.<category>.<name>`.
## ---------------------------------------------------------------------------
categories:
  scopes: [system, agent.default, agent.active, workset, box]
  scopes_spec: "§2a"

  masks:
    value: "dict[box_dest -> bool|None]"
    tri_state: {present: mask, "null": unmask, absent: inherit}
    cli_set: false              # YAML only — list/dict mutation via set is awkward
    default: {}
    spec: "§2a (KeyStore fold-in 2026-06-27)"
  bindings.ro:
    value: bind                 # [host_src, box_dest] | [host_src, box_dest, options]
    mount_options: "ro"
    cli_set: source_only
    spec: "§2a"
  bindings.rw:
    value: bind
    mount_options: "Z,U"
    cli_set: source_only
    spec: "§2a"
  caches:
    value: bind
    mount_options: "Z,U"
    cli_set: source_only
    note: "GLOBAL at system, per-agent at agent.<agent>; absorbed the old scalar `transform`"
    spec: "§2a / §2d"
  seeded:
    value: bind
    kind: copy                  # one-time copy at init, NOT a mount
    cli_set: source_only
    spec: "§2a"
  common:
    value: bind
    mount_options: "Z,U"
    cli_set: source_only
    note: "RENAMED from `shared` (2026-07-29; R-5). Category `common` vs channel
           type-root `common` is unambiguous — the `channels.` segment is the
           discriminator. Host dirs move to agents/<agent>/common/<name>:
           migration M-3."
    spec: "§2a (R-5; migration M-3)"
  synced:
    value: bind
    kind: copy                  # two-way synced by the agent plugin; mtime-gated
    cli_set: source_only
    suppressed_when: "box shares no credentials (auth tier private)"
    spec: "§2a (D-M4; auth-level redesign 2026-07-01)"
  env:
    value: scalar               # env.<VAR>
    parametric: [VAR]
    cli_set: true
    reserved_names_apply: true
    spec: "§2a"
  secret_path:
    value: path                 # secret_path.<VAR> — a PATH to secret material
    parametric: [VAR]
    cli_set: true               # scalar ⇒ full set/create (unlike source-only binds)
    never_read_by_kanibako: true    # value NEVER enters snapshot/keystore/argv/logs
    fail_soft: true                 # missing/unreadable/empty ⇒ WARN + VAR unset
    agent_independent: true
    spec: "§2a (2026-07-06, Jei)"

# The bind VALUE shape is load-bearing (§2a REPRESENTATION): a YAML list / Python
# tuple, NEVER a colon-joined "host:box" string. 2 elements = (host_src, box_dest);
# 3 elements = (host_src, box_dest, options) overriding the category default.
bind_shape:
  form: list
  min_elements: 2
  max_elements: 3
  colon_string: forbidden
  spec: "§2a (REPRESENTATION — do NOT re-derive)"

## ---------------------------------------------------------------------------
## KEYS
##
## `set:` — cli+file (normal) · file (human-edited only) · never (derived/RO)
##   Design property (§0, 2026-07-04): set == never IFF the key is `meta.*`.
##   The conformance test should ASSERT that property rather than trust each entry.
## `scope:` — the key's OWN scope, for the directional write rule.
## `default:` — a mapping keyed by mode when the default is mode-dependent.
## ---------------------------------------------------------------------------
keys:

  ## ---- LAYER 1: config keys (§1) -----------------------------------------
  ## Bootstrap paths, resolved by the FLAT foundation (not the KeyStore pipeline).
  ## Live ONLY in kanibako_config.yaml / /etc/kanibako/config_base.yaml.
  ## NOT CLI-settable from ANY command scope — refused BEFORE the scope guard.
  config.data:
    layer: 1
    type: path
    set: file
    default: "$XDG_DATA_HOME/kanibako"
    why: "root of the persistent data tree; @-referenced across the keyspace"
    spec: "§1"
  config.settings:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/settings.yaml"
    why: "THE system settings FILE — the cascade `system` level input"
    spec: "§1"
  config.agents:
    layer: 1
    type: path
    set: file
    default: "@config.data/agents"
    why: "per-agent store; agent cascade files at <agent>/settings.yaml"
    spec: "§1"
  config.primary_workset:
    layer: 1
    type: path
    set: file
    default: "@config.data/primary_workset"
    why: "PRIMARY workset root"
    spec: "§1"
  config.registry:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/registry.yaml"
    why: "name→path resolution; needed before loading named workset/box files"
    spec: "§1"
  config.journal:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/journal.yaml"
    why: "lifecycle journal (crash-recovery write-ahead log); normally EMPTY"
    spec: "§1 (added 2026-06-30b)"
    # ⚑ DRIFT RESOLVED (Jei 2026-07-27): §1 prose claimed the Layer-1 set was
    #   'finalized at FIVE config keys' while the table listed SIX. Ruling: strike
    #   the count — it is a moving target. Spec edited; the 1.6.0 spec is archived
    #   at ~/canon/notebook/archives/specs/settings-keyspace-1.6.0-target.md (the
    #   pre-strike .bak-2026-07-27-pre-five-strike snapshot sits in archives/reference/).

  ## ---- LAYER 2: system.* settings keys (§2g) ------------------------------
  system.channelroot:
    scope: system
    type: path
    set: cli+file
    default: "@config.data/channels"
    spec: "§2g"
  system.channels.common:
    scope: system
    type: path
    set: cli+file
    default: "@system.channelroot/common"
    note: "shared-scratch type-root. RENAMED from system.channels.commons (R-6)
           — a GUEST path in every box and named in the packaged agent guide:
           migration M-9 (the first guest-path migration in this set)."
    spec: "§2g (R-6; migration M-9)"
  system.channels.chat:
    scope: system
    type: path
    set: cli+file
    default: "@system.channelroot/chat"
    spec: "§2g"
  system.channels.broadcast:
    scope: system
    type: path
    set: cli+file
    default: "@system.channels.chat/broadcast.md"
    spec: "§2g"
  system.channels.mailboxes:
    scope: system
    type: path
    set: cli+file
    default: "@system.channelroot/mailboxes"
    spec: "§2g"
  system.channels.share:
    scope: system
    type: path
    set: cli+file
    default: "@system.channelroot/share"
    spec: "§2g"
  system.template:
    scope: system
    type: path
    set: cli+file
    default: "@config.data/global/template"
    note: "the system TEMPLATE ROOT. RENAMED from system.base_template (R-1;
           default global/base_template → global/template; migration M-11).
           Holding the ROOT leaves room for further template subtrees without
           new keys — same indirection as <scope>.canon. ⮕ The box-home seed is
           box/home (@system.template/box/home, §2a layer 1), NOT the root and
           NOT box/ — box/ is the box TEMPLATE root, holding home/ beside
           canon/handbook/ (§2a layers 4-6)."
    spec: "§2g (R-1)"
  system.canon:
    scope: system
    type: path
    set: cli+file
    default: "@config.data/global/canon"
    note: "the SYSTEM-level CANON CONTRIBUTION ROOT — the user's own directives;
           its handbook/ subtree is bound in-box at ~/canon/handbook/. Names a
           per-scope CONTRIBUTION root, NOT a copy of the assembled canon:
           ~/canon (guest) is the assembled tree, @<scope>.canon (host) is what
           this scope contributes to it. Root-not-leaf leaves room for further
           canon subtrees without new keys. Supplies SYS_CONTENTS.md + the
           general chapter; MAY supply the agent/workset/box chapters too (a
           scope key SHADOWS it where present — §0 depth-sort). A Layer-2
           SETTINGS key, NOT config.* — it fails §1's locate-and-load test."
    spec: "§2g (R-9)"
  system.backup:
    scope: system
    type: path
    set: cli+file
    default: "@config.data/backup"
    spec: "§2g"
  system.cache:
    scope: system
    type: path
    set: cli+file
    default: "$XDG_CACHE_HOME/kanibako"
    spec: "§2g"
  system.runtime:
    scope: system
    type: path
    set: cli+file
    default: "$XDG_RUNTIME_DIR/kanibako"
    note: "helper sockets; XDG_RUNTIME_DIR has NO spec default — fall back + WARN"
    spec: "§2g / §1"
  system.agent:
    scope: system
    type: str
    set: cli+file
    default: null                 # (unset)
    note: "the CURRENT agent's NAME — starts as, and holds, the default
           until/unless changed. Behavior, not a path. RENAMED from
           system.default_agent (R-2 — D-M2 SUPERSEDED 2026-07-29: the one-char
           clash expired when the agent store dir became config.agents). A box
           or workset requests a different one with pref.system.agent (§2h);
           the CLI --agent beats both (§1A). Unset/<None> ⇒ NO-AGENT
           plain-shell box (D-M6)."
    spec: "§2g (R-2)"
  system.setup_completed:
    scope: system
    type: version_marker          # R-34: the VALUE is the version that completed setup
    set: cli+file
    default: null                 # unset ⇒ setup has never run; the bool `false` spelling is DEAD
    note: "PERSISTS, user-resettable; drives the 5-band staleness gate against
           SETUP_BCV/SETUP_FCV. Since R-38 also the packaged-template protection:
           template CONTENT change ⇒ FCV bump (nudge) · STRUCTURAL change ⇒ BCV
           bump (hard block); CI compares the packaged-template digest against
           the previous tag and REQUIRES the bump."
    spec: "§2g (R-34 + R-38)"
  system.auth.share_allowed:
    scope: system
    type: bool
    set: cli+file
    default: true
    note: "the single host-wide GLOBAL-share gate; top of the auth 3-tier chain"
    spec: "§1 / §2b (auth-level 2026-07-01)"

  ## ---- LAYER 2: workset.* settings keys (§2c/§2e) -------------------------
  ## Mode-dependent: PRIMARY + NAMED share the ALL WORKSETS definitions.

  # Per-mode defaults CORRECTED as ONE BLOCK (R-26..R-30; R-30's entry lives in
  # the meta.* block below): NOT all standalone sub-keys are <None> — the
  # blanket claim was false (spec §2e, corrected 2026-07-29). THE SPEC'S REASON
  # rides here: the per-mode variation lives in meta.box.path AND NOWHERE
  # DOWNSTREAM, which is what lets box.bindings.rw.home (and every rooted box
  # key) be a SINGLE declaration for every mode. Standalone's SET values are
  # what give a lone box a real @meta.box.path to root against.
  workset.workspaces:
    scope: workset
    type: path
    set: cli+file
    default: {primary: null, named: "@meta.workset.path/workspaces",
              standalone: "@meta.workset.path/workspace"}
    note: "standalone: just the one box; changeable from workset level (R-26).
           ⚑ PRIMARY arm: the spec default is null, but the CODE composes and
           HONORS a `workspaces` leaf at primary (a set value repoints member
           workspace composition). Behavior-preserving divergence — do NOT
           'conform' the code to the null (that relocation would be an M-3-shaped
           migration, not a conformance fix). B2-Editor S-1, 2026-08-02."
    spec: "§2c / §2e (R-26)"
  workset.boxes:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/boxes", named: "@meta.workset.path/boxes",
              standalone: "@meta.workset.path/box_data"}
    note: "standalone: just the one box; changeable from workset level (R-27)"
    spec: "§2c / §2e (R-27)"
  workset.logs:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/logs", named: "@meta.workset.path/logs",
              standalone: "@meta.box.path"}
    note: "standalone: the box root IS the log home (R-28); helper_log stays a
           SINGLE row for all modes because this key carries the variation"
    spec: "§2c / §2e (R-28)"
  workset.vault_ro:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/vault/ro"
    note: "ALL PROJECTS — defined ONCE for EVERY mode (R-29); only the box BIND
           differs per mode (the per-box /@meta.box.name subdir a lone box does
           not need)"
    spec: "§2c (ALL PROJECTS; R-29)"
  workset.vault_rw:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/vault/rw"
    note: "ALL PROJECTS — defined ONCE for EVERY mode (R-29); see vault_ro"
    spec: "§2c (ALL PROJECTS; R-29)"
  workset.canon:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/canon"
    note: "the WORKSET's CANON CONTRIBUTION ROOT; its handbook/ subtree supplies
           the handbook's WORKSET chapter, bound at ~/canon/handbook/workset/.
           UNIFORM IN EVERY MODE (ALL PROJECTS) — deliberately NOT per-mode:
           chapter binds are SKIP-IF-ABSENT (§2c), which is what lets
           workset.canon/box.canon avoid per-mode <None> carve-outs entirely.
           The workset.template <None> carve-out does NOT transfer (a template
           seeds FUTURE boxes; a handbook is directives for the box that exists
           now — same shape, different reason)."
    spec: "§2c (ALL PROJECTS; R-9)"
  workset.registry:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/registry.yaml",
              named: "@meta.workset.path/registry.yaml", standalone: null}
    note: "PER-WORKSET box registry; a NORMAL key, NOT a config-locate key.
           Its entry KEYS yield the RO meta.box.name anchors."
    spec: "§2c (2026-07-04)"
  workset.template:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/template",
              named: "@meta.workset.path/template", standalone: null}
    note: "seed layer 3; the layer is SKIPPED when the source dir is absent
           (ruled 2026-07-09, was <None>). standalone: <None> — a lone box has
           no template tier (the spec's STANDALONE block states it explicitly:
           'workset.{registry,template} | <None>'; per-mode shape ruled F-1/5a,
           2026-08-02)"
    spec: "§2c / §2a (F-1/5a)"
  workset.kuid:
    scope: workset
    type: str
    set: cli+file
    format: "Crockford-base32 25-bit = 24 data + 1 parity → 5 chars, lowercased"
    default: {primary: "00000", named: "00000", standalone: "<generated at creation>"}
    spec: "§2c (2026-07-04)"
  workset.skip_kuid_check:
    scope: workset
    type: bool
    set: cli+file
    default: true
    note: "default true = the advisory 'invalid KUID' warning is opt-in strictness"
    spec: "§2c"
  workset.auth.share_allowed:
    scope: workset
    type: bool
    set: cli+file
    default: {primary: "@system.auth.share_allowed", named: "@system.auth.share_allowed",
              standalone: false}
    note: "standalone: a lone box has no workset group → WORKSET-share unavailable"
    spec: "§2c (auth-level 2026-07-01)"
  workset.auth.global_sync:
    scope: workset
    type: bool
    set: cli+file
    default: {primary: "@system.auth.share_allowed", named: "@system.auth.share_allowed",
              standalone: false}
    spec: "§2c"
  workset.auth.path:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/auth", named: "@meta.workset.path/auth",
              standalone: null}
    note: "the SETTABLE source for meta.box.auth.workset_path"
    spec: "§2c"
  workset.channelroot:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/channels", named: "@meta.workset.path/channels",
              standalone: null}
    spec: "§2c"
  workset.channels.common:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/common", named: "@workset.channelroot/common",
              standalone: null}
    note: "RENAMED from workset.channels.commons (R-6); guest path in every box
           — migration M-9"
    spec: "§2c (R-6; migration M-9)"
  workset.channels.chat:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/chat", named: "@workset.channelroot/chat",
              standalone: null}
    spec: "§2c"
  workset.channels.broadcast:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channels.chat/broadcast.md",
              named: "@workset.channels.chat/broadcast.md", standalone: null}
    spec: "§2c"
  workset.channels.share:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/share", named: "@workset.channelroot/share",
              standalone: null}
    spec: "§2c"
  workset.channels.mailboxes:
    scope: workset
    type: path
    set: cli+file
    default: "@system.channels.mailboxes/@meta.workset.name"
    note: "ALL PROJECTS — mailboxes aggregate at SYSTEM, partitioned by workset name"
    spec: "§2c (ALL PROJECTS)"
  workset.channels.share_global:
    scope: workset
    type: path
    set: cli+file
    default: "@system.channels.share/@meta.workset.name"
    spec: "§2c (ALL PROJECTS)"

  ## ---- LAYER 2: box.* settings keys (§2b) ---------------------------------
  box.image:
    scope: box
    type: str
    set: cli+file
    default: "ghcr.io/doctorjei/kanibako-oci:latest"
    spec: "§2b"
  box.share_images:
    scope: box
    type: bool
    set: cli+file
    default: false
    spec: "§2b (CONFIRMED false, Jei 2026-06-19b)"
  box.images_store:
    scope: box
    type: path
    set: cli+file
    default: "<runtime-probed podman graphroot>"
    note: "consulted ONLY when share_images is true; cascade-able to system for a
           machine-wide repoint. The GENERATED storage.conf (images_conf) is an
           INTERNAL bind, NOT a key."
    spec: "§2b (D-M8)"
  box.canon:
    scope: box
    type: path
    set: cli+file
    default: "@meta.box.path/canon"
    note: "the BOX's CANON CONTRIBUTION ROOT; its handbook/ subtree supplies the
           handbook's BOX chapter, bound at ~/canon/handbook/box/. Resolves in
           EVERY mode now that meta.box.path is uniform (§2c), standalone
           included. Also the dest of the §2a handbook seed layers (the seed
           writes precisely what the canon_hb_box bind reads, spelled once)."
    spec: "§2b (R-9)"
  box.shell:
    scope: box
    type: str
    set: cli+file
    default: null                 # auto-detect
    note: "means ONLY the login shell (the template-variant axis was DROPPED)"
    spec: "§2b / §3"
  box.auth.global_enabled:
    scope: box
    type: bool
    set: cli+file
    default: true
    effective: "meta.box.agent.auth.share_support AND system.auth.share_allowed AND this"
    spec: "§2b (auth-level 2026-07-01)"
  box.auth.workset_enabled:
    scope: box
    type: bool
    set: cli+file
    default: true
    effective: "meta.box.agent.auth.share_support AND workset.auth.share_allowed AND this"
    spec: "§2b"
  box.enable_vault:
    scope: box
    type: bool
    set: cli+file
    default: true
    note: "sparse — only a non-default false is ever written. Read-compat maps the
           legacy project.enable_vault → this key."
    spec: "§2b (renamed 2026-07-04)"
  box.masks:
    scope: box
    type: dict
    set: file                     # YAML only — matches the category (cli_set: false)
    default: {}
    note: "dict[box_dest -> bool|None], tri-state present=mask / null=unmask /
           absent=inherit (§2a masks category)"
    spec: "§2c (ALL PROJECTS) / §2a (R-16)"

  ## ---- LAYER 2: agent.* settings keys (§2d) -------------------------------
  ## agent.default.* is the all-agents FALLBACK layer; agent.<agent>.<key> falls
  ## back to agent.default.<key>. Both are cascade levels (§2).
  # R-41: `access` supersedes the boolean auto_approve (tombstoned in not_keys.renamed
  # with its value mapping). The pre-07-06 code-only `access` spelling (retired at
  # e7b4aea) returns as the successor key — both code_residue entries for it are gone.
  agent.default.access:
    scope: agent
    type: enum
    choices: [restricted, editing, full]
    set: cli+file
    default: full
    note: "permission TIER (R-41). Default full preserves today's behaviour — the
           box is the containment boundary. Per-agent realization is DESCRIPTOR-
           declared (R-37 pattern). Flags -S→restricted / -A→full, ephemeral
           (projected-surface class, §1A). An UNKNOWN stored value is REJECTED
           LOUDLY, naming the key and the legal values — never treated as
           permissive."
    spec: "§2d (access subsection, R-41)"
  agent.<agent>.access:
    scope: agent
    parametric: [agent]
    type: enum
    choices: [restricted, editing, full]
    set: cli+file
    fallback: "agent.default.access"
    note: "per-agent permission tier; the VALUES stay the universal enum — the
           per-agent piece is the descriptor-declared REALIZATION (how the
           harness renders each tier), never new values."
    spec: "§2d (access subsection, R-41)"
  agent.default.allow_helpers:
    scope: agent
    type: bool
    set: cli+file
    default: true
    spec: "§2d"
  agent.default.continue_mode:
    scope: agent
    type: bool
    set: cli+file
    default: true
    note: "continue vs fresh; resume removed. -N/-C/-R override per launch."
    spec: "§2d"
  agent.default.bootstrap:
    scope: agent
    type: str
    set: cli+file
    default: "tmux"
    note: "multiplexer; `none` ⇒ ephemeral / no reattach"
    spec: "§2d"
  agent.default.model:
    scope: agent
    type: str
    set: cli+file
    default: null                 # "use the harness's built-in default"
    note: "-M overrides per launch"
    spec: "§2d"
  agent.default.endpoint:
    scope: agent
    type: str
    set: cli+file
    default: null                 # bare/harness-default — no env emitted
    note: "UNIVERSAL (R-12; moved from the claude-specific row — no claude entry
           exists here, agent specifics are plugin-contributed): agent backend
           endpoint URL, user-settable per-node. All three shipped plugins declare
           its env realization in their descriptors; set ⇒ SUPPRESS the
           OAuth/credential sync — enforced in CORE, not per-plugin."
    spec: "§2d (default tier, R-12)"
  agent.default.run_args:
    scope: agent
    type: str
    set: cli+file
    default: null
    note: "raw-argv passthrough escape hatch"
    spec: "§2d"
  agent.default.transform_settings:
    scope: agent
    type: dict
    set: cli+file
    default: {}
    note: "binary-transform SETTINGS consumed by the plugin's transform pipeline
           (the INPUT; agent.<agent>.caches.transform is the OUTPUT cache)"
    spec: "§2d (added 2026-07-14)"
  agent.default.canon:
    scope: agent
    type: path
    set: cli+file
    default: "@config.agents/default/canon"
    note: "the all-agents fallback CANON CONTRIBUTION ROOT (= the parametric
           default with meta.agent.default.name = \"default\") — a plain dir in
           the agents store, CORE-owned: there is NO default plugin package
           (§0 'the base system owns agent.default.*')."
    spec: "§2d (R-13)"
  agent.<agent>.<key>:
    scope: agent
    parametric: [agent, key]
    set: cli+file
    fallback: "agent.default.<key>"
    note: "the generic per-agent contract SHAPE. Core owns the shape ONLY; every
           agent-SPECIFIC value is PLUGIN-declared (§0 universal-vs-specific) and
           therefore NOT enumerated in this core registry — see plugin_contributed."
    spec: "§2d"
  agent.<agent>.template:
    scope: agent
    parametric: [agent]
    type: path
    set: cli+file
    default: "@meta.agent.<agent>.path/template"
    note: "per-agent template SOURCE; seed layer 2"
    spec: "§2d"
  agent.<agent>.canon:
    scope: agent
    parametric: [agent]
    type: path
    set: cli+file
    default: "@meta.agent.<agent>.path/canon"
    fallback: "agent.default.canon"
    note: "the AGENT's CANON CONTRIBUTION ROOT; its handbook/ subtree supplies
           the handbook's AGENT chapter, bound at ~/canon/handbook/agent/.
           PLUGIN-provided or the default — the ordinary §2d fallback picks
           exactly ONE to bind (OVERRIDE, not additive: no per-file merge).
           ⚑ The plural/singular split is LOAD-BEARING and must not be
           'normalised' (R-9/R-13): STORAGE IS VARIED, BINDING IS NOT — the
           HOST stores N per-agent variants (agents/<agent>/…, plural, each
           settable incl. for an agent this box is not running, §2h); the BOX
           gets ONE chapter at a FIXED dest with NO agent segment (agent/…,
           singular). The discriminator lives on the HOST side of the bind
           tuple, never the guest side."
    spec: "§2d (R-9 + R-13)"

  ## ---- meta.* — TOP-LEVEL protected RO namespace (§0) ---------------------
  ## Materialized ONLY by construct-time / plugin / runtime derivation.
  ## Design property: set == never IFF meta.*.
  meta.runtime.ws_root:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "standalone=<runtime project dir> · primary=@config.primary_workset ·
            named=<detected workset root>"
    spec: "§1A (L0.2)"
  meta.runtime.ws_name:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "standalone=__STANDALONE__ · primary=__PRIMARY__ · named=<detected name>"
    note: "the workset PARTITION token; reserved names may not be user-chosen"
    spec: "§1A / §3 (D-B3)"
  meta.runtime.project_type:
    namespace: meta
    set: never
    origin: runtime_treewalk
    type: enum
    choices: [standalone, primary, named]
    spec: "§1A"
  meta.workset.path:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.runtime.ws_root"
    spec: "§2c / §1A"
  meta.workset.name:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.runtime.ws_name"
    spec: "§2c / §1A"
  meta.workset.settings:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.workset.path/settings.yaml"
    note: "the §1A SINGLE-SOURCE canonical spelling; the former
           @meta.runtime.ws_settings anchor is CUT (unified path; R-36)"
    spec: "§2c / §1A"
  meta.box.name:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "<construct-time>", named: "<construct-time>",
            standalone: "<@workset.kuid>_%leaf(@meta.workset.path)%"}
    note: "AUTHORITATIVE source = the workset registry's entry KEYS; no literal
           meta.box.name field is stored. Standalone: regen the KUID on WHOLE-NAME
           collision; SANITIZE + LENGTH-CAP the leaf (D-M12/13)."
    spec: "§2c"
  meta.box.path:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "@workset.boxes/@meta.box.name",
            named: "@workset.boxes/@meta.box.name",
            standalone: "@workset.boxes"}
    note: "the RO per-mode BOX ROOT — the declaration root every rooted box key
           spells itself against (§2a table). STANDALONE is the EMPTY LEAF:
           workset.boxes IS the box root, so the value is a BARE whole-value ref
           (no join, no trailing separator). The per-mode variation lives HERE and
           nowhere downstream, which is what lets box.bindings.rw.home be a single
           declaration for every mode. NOT settable: relocate box data one level up
           via the settable workset.boxes."
    spec: "§2c / §2a"
  meta.box.workspace:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "<the user's real project dir>",
            named: "@workset.workspaces/@meta.box.name",
            standalone: "@workset.workspaces"}
    note: "standalone: the whole-value ref (no /@meta.box.name join — one box);
           spelled against the KEY so a repointed workset.workspaces carries it
           (a literal here would be the copy-that-drifts §0 forbids). R-26 rider."
    spec: "§2c"
  meta.box.settings:
    namespace: meta
    set: never
    origin: construct_time
    value: "@meta.box.path/settings.yaml"
    note: "UNIFORM — ALL PROJECTS, every mode (R-30): standalone HAS a box tier
           whose file is merely ABSENT by default; box values then resolve from
           the workset tier @meta.workset.settings as R2 downward defaults
           (2026-07-04). The old 'standalone: null — SUBSUMED, box tier empty'
           reading is the RETIRED model."
    spec: "§2c (ALL PROJECTS; R-30)"
  meta.box.mode:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "@meta.runtime.project_type"
    note: "mode is IDENTITY, not behavior — was the settable box.mode"
    spec: "§2c"
  meta.box.inbox:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.mailboxes/@meta.box.name"
    spec: "§2c (ALL PROJECTS)"
  meta.box.share_global:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.share_global/@meta.box.name"
    spec: "§2c (ALL PROJECTS)"
  meta.box.share_workset:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.share/@meta.box.name"    # <None> for standalone
    spec: "§2c"
  meta.box.auth.workset_path:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.auth.path/@system.agent"          # <None> for standalone
    note: "reclassified from the old SETTABLE box.auth.workset_path (2026-07-04):
           being meta means it can't be set to a dangling @-ref. Respelled from
           @box.agent_name (R-31, with R-3)."
    spec: "§2c (R-31)"
  meta.box.agent.<key>:
    namespace: meta
    parametric: [key]
    set: never
    origin: derived
    mirror_of: "agent.<@system.agent>.<key>"
    note: "READ-BACK RO MIRROR of the effective agent subtree for this box
           (R-4; was the SETTABLE box.agent.<key> — that entry's 'ordinary
           same-scope write' argument INVERTED under R-3's retirement). Values
           are READABLE here, never SETTABLE; a box tweaks its agent with
           pref.agent.<agent>.<key> (§2h) instead. Re-materialized whenever the
           effective agent changes. Impl: COPY (pure) or shared REF (equivalent
           — one box per process). Restores 'set == never IFF meta.*'."
    spec: "§2b (R-4)"
  meta.box.agent.auth.share_support:
    namespace: meta
    set: never
    origin: plugin
    value: "@meta.agent.<@system.agent>.auth.share_support"
    note: "box-immutable capability MIRROR — the hard RO floor a box cannot
           fake. Respelled from <@box.agent_name> (R-32, with R-3)."
    spec: "§2c / §2d (R-32)"
  meta.box.helper_num:
    namespace: meta
    set: never
    origin: spawn
    type: int
    note: "UNSET for a top-level box; travels as a STRUCTURED field in helper
           messages — never recovered by string-splitting the container name"
    spec: "§2c"
  meta.box.container_name:
    namespace: meta
    set: never
    origin: derived
    value: "kanibako-@meta.box.name%if @meta.box.helper_num: -helper-@meta.box.helper_num%"
    note: "a RENDERING of the identity pair, NEVER a source to parse back from"
    spec: "§2c (F5)"
  meta.agent.default.name:
    namespace: meta
    set: never
    origin: plugin
    value: "default"
    spec: "§2d"
  meta.agent.<agent>.name:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    required: true
    note: "REQUIRED whenever an agent exists; identifies the store dir + cascade key"
    spec: "§2d"
  meta.agent.<agent>.path:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    value: "@config.agents/@meta.agent.<agent>.name"
    note: "META so agent/workset/box cascade CANNOT override it (D-2026-06-22)"
    spec: "§2d"
  meta.agent.<agent>.settings:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    value: "@meta.agent.<agent>.path/settings.yaml"
    spec: "§2d"
  meta.agent.<agent>.mode:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: dict            # {mode_key -> argv fragment}
    note: "the harness's INTERACTIVE launch grammar; a NON-EDITABLE key — plugin
           invocation syntax, not a user preference. RENAMED from agent.<agent>.mode
           (Jei 2026-07-28, D-4)."
    spec: "§2d"
  meta.agent.<agent>.exec:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: str             # argv fragment; carried in the descriptor's `operations` dict
    note: "the STANDALONE (one-shot/headless) invocation; MUTUALLY EXCLUSIVE with mode at
           the same argv slot. RENAMED from agent.<agent>.exec (Jei 2026-07-28, D-4)."
    spec: "§2d"
  meta.agent.<agent>.auth.share_support:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: bool
    note: "PluginDescriptor field auth_share_support — a CAPABILITY, not a setting"
    spec: "§2d (auth-level 2026-07-01)"

## ---------------------------------------------------------------------------
## DECLARED INSTANCES (R-10, R-14; R-16 rode to `keys:`) — the NAMED instances of
## parametric category families that the SPEC ITSELF names. Enumerated because
## the `user_key:` property is real, machine-checkable, spec-stated and
## INEXPRESSIBLE in a bare family pattern — and `config show` needs it (R-10).
## ONLY spec-named instances appear here; any other name inside a declared
## family remains legal by the family pattern (§0: closed but NOT flat).
##
## `user_key:` semantics (R-10 — "user_key: false where the spec says so"):
##   true  — an ORDINARY settable declared key instance: it has a settable
##           default (`default:`), participates in the set-time floor, and is
##           user-repointable through the ordinary config verbs.
##   false — INTERNAL / generated (spec: "not a user key, not repointable"):
##           the bind still routes through the single binding route, but the
##           name is NOT user-addressable — config set/get REFUSE it; `config
##           show` displays it as an internal bind (`value:`, not `default:`).
## Field convention: user_key true ⇒ `default:` (the out-of-box value of a
## settable key); user_key false ⇒ `value:` (fixed, generated — nothing to set).
## Tuples are spelled exactly as the spec spells them: (host_src, box_dest);
## dests are GUEST paths for mounts, HOST paths for copies (§0 / R-20).
## ---------------------------------------------------------------------------
declared_instances:

  ## ---- CANON BOOKS + KICKOFF — the 12 named §2c binds (R-10) --------------
  ## 7 INTERNAL (canon_collection, the five canon_bible_*, kickoff) — the
  ## package-sourced ones; 5 USER KEYS (the canon_hb_* chapters) — the spec's
  ## own LOAD-BEARING distinction: the handbook is sourced from the
  ## `<scope>.canon` keys "or wherever the user redirects it, because it IS a
  ## settings key" (§2c). Do NOT flatten the two classes into one.
  box.bindings.ro.canon_collection:
    user_key: false
    value: "(<packaged rom COLLECTION.md>, ~/canon/COLLECTION.md)"
    note: "INTERNAL — the canon index; FILE bind over the pre-created box-skeleton
           mountpoint. Stays a BIND (rom truth: a seeded copy would freeze at
           create and drift from the package). Not repointable: the index defines
           the canon's shape and load order, so a redirect could silently replace
           the canon wholesale."
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_bible_contents:
    user_key: false
    value: "(<packaged rom bible/ROM_CONTENTS.md>, ~/canon/bible/ROM_CONTENTS.md)"
    note: "INTERNAL, FILE bind (same pre-created-mountpoint rule)"
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_bible_general:
    user_key: false
    value: "(<packaged rom bible/general>, ~/canon/bible/general)"
    note: "INTERNAL, dir ro. Successor delivery of the retired system.instructions
           box guide: the packaged rom's general chapter (directives/ROM_GENERAL.md
           — verified against the packaged tree, A3/D-8) arrives here; no
           host-editable copy, no repoint."
    spec: "§2c (CANON books; R-10) / §3 (system.instructions row)"
  box.bindings.ro.canon_bible_workset:
    user_key: false
    value: "(<packaged rom bible/workset>, ~/canon/bible/workset)"
    note: "INTERNAL, dir ro"
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_bible_box:
    user_key: false
    value: "(<packaged rom bible/box>, ~/canon/bible/box)"
    note: "INTERNAL, dir ro"
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_bible_agent:
    user_key: false
    value: "(<plugin pkg data/rom>, ~/canon/bible/agent)"
    note: "INTERNAL, dir ro — the PLUGIN's bible chapter, emitted by CORE from the
           RESOLVED target (emission gate: rom_root exists AND contains
           directives/ROM_AGENT.md). bible/agent = per-HARNESS (packaged);
           handbook/agent = per-AGENT-NODE (host, agent.<agent>.canon) — two
           books, two cardinalities, no overlap. Not a user key, not repointable,
           no floor (§0: the one book a user cannot edit is the one they cannot
           repoint)."
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_hb_contents:
    user_key: true
    default: "(@system.canon/handbook/SYS_CONTENTS.md, ~/canon/handbook/SYS_CONTENTS.md)"
    note: "FILE bind; system store — user-editable on the HOST, ro in-box. NOT
           skip-if-absent: install/setup materialises the system store, so a
           missing source is a genuine defect. The blessed repoint ROUTE is the
           SOURCE key system.canon (the bind spells itself against it)."
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_hb_general:
    user_key: true
    default: "(@system.canon/handbook/general, ~/canon/handbook/general)"
    note: "dir ro; system store — the global handbook IS the general chapter (the
           system store ships NO agent/workset/box chapter stubs). NOT
           skip-if-absent (same rule as canon_hb_contents)."
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_hb_agent:
    user_key: true
    optional: skip_if_absent
    default: "(@agent.<active>.canon/handbook, ~/canon/handbook/agent)"
    note: "source per the §2d fallback (agent.<agent>.canon -> agent.default.canon;
           exactly ONE is bound — override, not additive); dest carries NO agent
           segment (the plural/singular split is LOAD-BEARING, R-9/R-13). The
           <active> discriminator is the ACTIVE AGENT NODE, interpolated at the
           seam; the whole entry is OMITTED for a NO-AGENT box."
    spec: "§2c (CANON books; R-10) / §2d (R-9 + R-13)"
  box.bindings.ro.canon_hb_workset:
    user_key: true
    optional: skip_if_absent
    default: "(@workset.canon/handbook, ~/canon/handbook/workset)"
    note: "repoint route = workset.canon (R-9)"
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.canon_hb_box:
    user_key: true
    optional: skip_if_absent
    default: "(@box.canon/handbook, ~/canon/handbook/box)"
    note: "repoint route = box.canon (R-9); also the dest of the §2a handbook seed
           layers — the seed writes precisely what this bind reads, spelled once"
    spec: "§2c (CANON books; R-10)"
  box.bindings.ro.kickoff:
    user_key: false
    value: "(<packaged core KICKOFF.md>, ~/.config/kanibako/kickoff.md)"
    note: "INTERNAL, like kani_pkg — the directive-chain entry slot; kickoff
           CONTENT lives in CORE, delivered by this unconditional bind. Not a user
           key, not repointable. TRANSITION: emitted ONLY when the resolved target
           does not itself deliver a kickoff at the same dest (yield gate; the
           plugins' own KICKOFF.md deletions land ONE RELEASE LATER, after which
           'unconditional' becomes literal — the FOLLOW-UP RELEASE plan)."
    spec: "§2c (kanibako CLI delivery; R-10)"

  ## ---- CORE NAMED BINDS — the ~17 §2c instances (R-10 via packet C5) ------
  ## The spec's own §2c rows, one entry per (category, name) instance. `vault`
  ## is TWO instances (ro + rw). Per-mode variation is spelled mode-keyed,
  ## exactly like the manifest's per-mode `default:` house style.
  box.bindings.rw.home:
    user_key: true
    default: "(@meta.box.path/home, ~/)"
    note: "the box HOME bind — ONE declaration for every mode: the per-mode
           variation lives in meta.box.path and nowhere downstream (§2c ALL
           PROJECTS). ⚑ core-defaults spells the dest `~` (deliberately, 'no
           trailing slash'); the spec row spells `~/` — flagged, unresolved;
           spec spelling carried here."
    spec: "§2c (ALL PROJECTS)"
  box.bindings.rw.workspace:
    user_key: true
    default: "(@meta.box.workspace, ~/workspace)"
    spec: "§2c"
  box.bindings.ro.vault:
    user_key: true
    default: {primary: "(@workset.vault_ro/@meta.box.name, ~/vault/ro)",
              named: "(@workset.vault_ro/@meta.box.name, ~/vault/ro)",
              standalone: "(@workset.vault_ro, ~/vault/ro)"}
    note: "both arms root at the UNIFORM @workset.vault_ro (§2c ALL PROJECTS);
           only the per-box /@meta.box.name subdir is per-mode (a lone box does
           not need it). Gated on box.enable_vault; source created if missing."
    spec: "§2c (ALL WORKSETS / STANDALONE; R-29)"
  box.bindings.rw.vault:
    user_key: true
    default: {primary: "(@workset.vault_rw/@meta.box.name, ~/vault/rw)",
              named: "(@workset.vault_rw/@meta.box.name, ~/vault/rw)",
              standalone: "(@workset.vault_rw, ~/vault/rw)"}
    note: "see box.bindings.ro.vault — same shape, rw arm"
    spec: "§2c (ALL WORKSETS / STANDALONE; R-29)"
  box.bindings.ro.images:
    user_key: true
    default: "%if @box.share_images: (@box.images_store, <box_image_dir>) else None%"
    note: "conditional on @box.share_images (D-M8); the settable INPUTS are
           box.share_images + box.images_store (the USER KEY host store root).
           The GENERATED storage.conf companion (images_conf) is an INTERNAL bind
           and NOT a key (not_keys.never_a_key) — the store mount is INERT
           without it. RESOLVED by B3: core-defaults' bind entry is `images`
           (renamed from `images_store` — the bind row and the scalar no longer
           share a name); the shipped host_src is the @-ref `@box.images_store`,
           whose runtime-probed-graphroot DEFAULT enters as a floor scalar at
           the launch seam (core_defaults.image_default_categories). The %if%
           condition is realized by the caller's conditional gate (the image
           table is only injected when image sharing is active)."
    spec: "§2c (ALL PROJECTS; D-M8) / §2b (box.images_store)"
  box.bindings.ro.helper_log:
    user_key: true
    default: "(@workset.logs/@{meta.box.name}.jsonl, $XDG_STATE_HOME/kanibako/helpers.jsonl)"
    note: "a SINGLE row for all modes — workset.logs carries the per-mode
           variation (R-28). ⚑ THE BRACES ARE LOAD-BEARING (policy.reference_forms
           / R-23): the bare form would greedily parse `meta.box.name.jsonl` and
           coerce to ''. There is NO meta.box.helper_log key
           (not_keys.never_a_key)."
    spec: "§2c (ALL PROJECTS; R-23 / R-28)"
  box.bindings.rw.helper_sock:
    user_key: true
    default: "(@system.runtime/@{meta.box.name}-@{meta.workset.name}.sock, $XDG_STATE_HOME/kanibako/helper.sock)"
    note: "mount options MUST stay empty ('') — a LIVE unix socket; Z/U
           relabel/chown would break the shared socket topology (core-defaults
           carries the empty 3rd slot). ⚑ THE BRACES ARE LOAD-BEARING (R-23 /
           ruling 9a, 2026-08-02): a bare workset-name ref would greedily eat
           the `.sock` suffix as one absent ref name (cf. helper_log)."
    spec: "§2c (ALL PROJECTS)"
  box.bindings.ro.kani_pkg:
    user_key: false
    value: "(<host pkg>, /opt/kanibako/kanibako)"
    note: "kanibako CLI delivery. INTERNAL per the spec's own references — the
           kickoff row reads 'INTERNAL, like kani_pkg' and the images_conf note
           reads 'like the kani_pkg binds — not a settable keyspace path' (§2c).
           ⚑ user_key: false — confirmed: two independent spec statements; the
           plan lists kani_pkg among the core binds without a class marker."
    spec: "§2c (kanibako CLI delivery)"
  box.bindings.ro.kani_bin:
    user_key: false
    value: "(<entry script>, ~/.local/bin/kanibako)"
    note: "kanibako CLI delivery; same class as kani_pkg (same flag applies)"
    spec: "§2c (kanibako CLI delivery)"
  box.bindings.ro.secret_export:
    user_key: false
    value: "(<packaged kanibako-secrets.sh>, /etc/profile.d/kanibako-secrets.sh)"
    note: "INTERNAL, like kani_pkg — the secrets-into-shell-profile machinery:
           an RO bind delivering the generic self-adapting profile.d snippet
           every LOGIN shell sources, exporting each mounted secret from
           SECRET_MOUNT_DIR (/run/kanibako/secrets) in-box (the paths the PID-1
           _secret_export_shim cannot reach — non-login execs never inherit its
           env). UNCONDITIONAL/universal: the snippet no-ops when nothing is
           mounted. Only the snippet PATH is bound, never a token (arm's-length
           preserved). Spec row added per ruling 8a (2026-08-02) — resolves the
           former A6-era 'no spec §2c row' flag."
    spec: "§2c (kanibako CLI delivery; ruled 8a, 2026-08-02)"
  box.bindings.rw.global_common:
    user_key: true
    default: "(@system.channels.common, ~/channels/common)"
    note: "system channel guest mount, option (A) — perms aspirational"
    spec: "§2c (ALL PROJECTS; R-6 name)"
  box.bindings.rw.global_chat:
    user_key: true
    default: "(@system.channels.chat, ~/channels/chat)"
    spec: "§2c (ALL PROJECTS)"
  box.bindings.rw.global_share:
    user_key: true
    default: "(@system.channels.share, ~/channels/share)"
    note: "rw* -> ro under future (C)"
    spec: "§2c (ALL PROJECTS)"
  box.bindings.rw.mailboxes:
    user_key: true
    default: "(@system.channels.mailboxes, ~/channels/mailboxes)"
    note: "rw* -> ro under future (C)"
    spec: "§2c (ALL PROJECTS)"
  box.bindings.rw.inbox:
    user_key: true
    default: "(@meta.box.inbox, ~/channels/inbox)"
    note: "own inbox; the (C)-stable path"
    spec: "§2c (ALL PROJECTS)"
  box.bindings.rw.workset_common:
    user_key: true
    default: "(@workset.channels.common, ~/channels/workset/common)"
    note: "workset-LOCAL channel — PRIMARY/NAMED only; a standalone box has no
           workset channels, so the entry is OMITTED there (gated at the seam)"
    spec: "§2c (ALL WORKSETS; R-6 name)"
  box.bindings.rw.workset_chat:
    user_key: true
    default: "(@workset.channels.chat, ~/channels/workset/chat)"
    note: "PRIMARY/NAMED only (see workset_common)"
    spec: "§2c (ALL WORKSETS)"
  box.bindings.rw.workset_share:
    user_key: true
    default: "(@workset.channels.share, ~/channels/workset/share)"
    note: "PRIMARY/NAMED only; rw* -> ro under future (C)"
    spec: "§2c (ALL WORKSETS)"
  ## ---- THE SIX SEED LAYERS — `{system, agent.<agent>, workset}.seeded.
  ## {template,handbook}` (R-14; same class as R-10) -------------------------
  ## COPIES, not mounts: dests are HOST paths (§0 / R-20). Ordered layers,
  ## later-wins per file, SEED-ONCE at create (§2a / §5). The layer numbers
  ## below are the spec's own (§2a layers 1-6).
  system.seeded.template:
    user_key: true
    default: "(@system.template/box/home, @meta.box.path/home)"
    note: "layer 1 — base BOX template (global); source = the box/home subtree of
           the system template ROOT (R-1: system.template, NOT the root itself)"
    spec: "§2a (seed layer 1; R-14)"
  agent.<agent>.seeded.template:
    parametric: [agent]
    user_key: true
    default: "(@agent.<agent>.template/box/home, @meta.box.path/home)"
    note: "layer 2 — per-agent (agent = persona + harness); template holds
           settings.json / CLAUDE.md / dirs; SUBSUMES all per-file agent seeds"
    spec: "§2a (seed layer 2; R-14) / §2d"
  workset.seeded.template:
    user_key: true
    optional: skip_if_absent
    default: "(@workset.template/box/home, @meta.box.path/home)"
    note: "layer 3 — per-workset; the layer is SKIPPED when the source dir is
           absent (cf. workset.template)"
    spec: "§2a (seed layer 3; R-14)"
  system.seeded.handbook:
    user_key: true
    default: "(@system.template/box/canon/handbook, @box.canon/handbook)"
    note: "layer 4 — seeds the box's CANON CONTRIBUTION (outside home, then bound
           RO by canon_hb_box); dest is the KEY @box.canon, spelled once"
    spec: "§2a (seed layer 4; R-14)"
  agent.<agent>.seeded.handbook:
    parametric: [agent]
    user_key: true
    default: "(@agent.<agent>.template/box/canon/handbook, @box.canon/handbook)"
    note: "layer 5 — per-agent handbook contribution"
    spec: "§2a (seed layer 5; R-14)"
  workset.seeded.handbook:
    user_key: true
    optional: skip_if_absent
    default: "(@workset.template/box/canon/handbook, @box.canon/handbook)"
    note: "layer 6 — per-workset handbook contribution (skip-if-absent)"
    spec: "§2a (seed layer 6; R-14)"

## ---------------------------------------------------------------------------
## PREF — requests (§2h; R-7 / R-7a / R-7b). NOT a key list: the family is
## pref.<target-key>, governed by the entries + filters below. A pref is a
## REQUEST consumed during resolution — not a value of its own; it lives in the
## file where it was written, NEVER mutates another settings file, and is
## re-applied on every resolution (concurrent boxes cannot fight).
## ---------------------------------------------------------------------------
pref:

  # THE ALLOWLIST — exactly two ENTRIES (§0's closed keyspace applies).
  # Membership alone is NOT sufficient: the three filters below still apply.
  allowlist:
    "system.agent":
      kind: single_key
      role: "SELECTION — 'I want to use this agent, by name.' The first thing a
             box on a non-default agent sets."
    "agent.*.**":
      kind: key_set               # written in R-22's glob notation (policy.glob):
                                  #   `*` = exactly ONE segment · `**` = the
                                  #   remaining tail, any depth
      role: "CONFIGURATION — values for that agent, targeting AGENT scope (a
             bare agent.<agent>.<key> in a box file would be an upward write;
             the pref is the mediator)"
      segment_validation: "the `*` segment is an AGENT NAME — INVALID unless a
                           VALID agent or `default`"

  # R-7b — stated here EXPLICITLY because the manifest GENERATES the validator:
  # the agent test is "is it a VALID agent", NOT "is it the ACTIVE agent".
  # `pref.agent.goose.x` while claude is active is LEGAL — pre-configuring an
  # agent you may switch to is allowed.
  agent_test: valid_agent_not_active_agent
  agent_test_spec: "§2h (R-7b)"

  # THREE INDEPENDENT FILTERS — ALL must pass.
  # Checker order: valid_key ∧ allowlist ∧ forbidden_tiers.
  filters:
    - valid_key                   # target matches a declared key or a declared
                                  #   PARAMETRIC FAMILY (§0: closed but not flat).
                                  #   VALIDITY, not EXISTENCE: a NEW name inside
                                  #   a family is legal
                                  #   (pref.agent.claude.bindings.rw.boooooo);
                                  #   fabrication still errors
                                  #   (pref.agent.zippity.wibble matches no
                                  #   family → §0 error).
    - allowlist                   # requestable in principle (the table above)
    - forbidden_tiers             # and not barred by any of:
                                  #   STRUCTURAL — the target must resolve
                                  #     STRICTLY EARLIER than the requesting
                                  #     level (a later-resolving key needs no
                                  #     pref: set it directly);
                                  #   CATEGORICAL — never meta.* / config.* /
                                  #     pref.* itself (meta is RO by contract —
                                  #     a pref targeting it would be a backdoor;
                                  #     config is the foundation;
                                  #     request-of-request has no termination
                                  #     argument. Meta VALUES still change
                                  #     downstream — only DIRECT targeting is
                                  #     barred);
                                  #   LOCATOR CLOSURE — below.
                                  #   The check returns a REASON, never a bare
                                  #   boolean.

  # LEGAL WRITE LEVELS — workset (L3.2) + box (L4.2) ONLY; never base, system
  # or agent. This is what BOUNDS the pref recursion, so it is a HARD rule, not
  # a convenience: `config set pref.<key> <value>` at any other scope RAISES —
  # never a silently-dead entry.
  levels: [workset, box]

  # LOCATOR CLOSURE (R-7a) — the TERMINATION guarantee, not tidiness: prefs are
  # applied once each, so the pass terminates PROVIDED no pref changes WHICH
  # FILES feed the cascade. The barred set is the transitive closure of the
  # cascade-input anchors' inputs — RATIFIED as TODAY'S HAND LIST; the
  # derivation is a POST-RATIFICATION item.
  locator_closure:
    - config.data
    - config.primary_workset
    - meta.workset.path
    - workset.boxes
    - meta.box.path
    - meta.box.name
    - workset.kuid
  # ⚑ R-7a's RECORDED WARNING (carried so the derivation item inherits it):
  #   "a naive derivation of this closure would capture system.agent and break
  #   the headline feature." The hand list and code's shorter literal list
  #   ({workset.boxes, workset.kuid}) are NOT in conflict — the other five are
  #   already barred by the CATEGORICAL tier (config.* / meta.*); the filters
  #   are independent.
  # Accepted consequence: workset.boxes stays SETTABLE in a workset FILE —
  #   only REQUESTING it from a lower level is barred.

  # VALUES ARE INSTALLED VERBATIM — INCLUDING present-None. A None pref lands
  # on the target key and is classified by the ORDINARY present-None rule:
  # OMIT for a bind / category / masks leaf (no mount / unmask), KEPT None for
  # a scalar leaf (consumer default) — so pref.system.agent: null requests the
  # NO-AGENT plain-shell box, and pref.agent.<agent>.<category>.<name>: null is
  # the box's ONLY channel to drop something its agent declares. The pref layer
  # MUST NOT interpret emptiness AT ALL: present-None, terminal "", and the
  # COPY-disable sentinel all forward untouched (it must not become a FOURTH
  # place deciding what "empty" means).
  values_verbatim: true

  # A FAILED PREF IS AN ERROR — the launch FAILS rather than proceeding with a
  # partially-applied request; the error NAMES which key, at which level, and
  # WHY (forbidden target / not settable at this level / invalid value /
  # undeclared). Never a silent skip.
  failed_pref: error

  # Expansion order (for the generated resolver): each level's prefs expand at
  # the START of that level — L3.2 then L4.2, each expansion RECOMPUTING the
  # preceding levels — so BOX BEATS WORKSET on the same pref by assignment
  # order. RECOMPUTE, not delta; each level's prefs expand ONCE; pref.* keys
  # never participate in resolution as derivable keys.
  expansion: recompute_box_beats_workset

  spec: "§2h (R-7 / R-7a / R-7b)"

## ---------------------------------------------------------------------------
## NOT KEYS / RETIRED NAMES — recorded so nobody re-adds or fabricates them.
## ⚑ A fabricated key is very often a RETIRED name. This block is the defence:
##   `unknown_key: error` refuses it, and this table says WHAT TO USE INSTEAD.
## Names sourced from §2c/§2d/§3 rulings + the AS-IS audit
## (reference/keyspace-phase2/SUMMARY-key-lists.md, 2026-06-26f). ⚑ That audit is a
## MONTH old and many of its FINDINGS are since resolved — only its NAMES are
## imported here, each re-checked against the CURRENT spec.
## ---------------------------------------------------------------------------
not_keys:

  reserved_internal:              # NOT keys and may never BECOME keys — reserved
                                  # internal node names, protected here so they
                                  # cannot be re-claimed as keys (R-8 option 2 /
                                  # plan decision D-4)
    "binding_derivations": "INTERNAL reserved node inside the per-launch snapshot,
                            carrying the materialised binding each ABSTRACT
                            declaration derives. NOT a key, not user-addressable;
                            the closed head dispatch refuses it. Replaces the CUT
                            meta.derived.<declaration-key> family (R-8); the
                            materialisation requirement is unchanged. ENFORCED at
                            assembly: a file-borne top-level `binding_derivations:`
                            table is DROPPED at assembly with a warning
                            (settings_assemble._drop_upward_scopes; landed at the
                            B4 fix round, 2026-08-02 — B4-Editor S-3).
                            spec: §0 (TWO LAYERS — the reservation clause)"

  never_a_key:                    # plugin/descriptor variables or CLI-only surfaces
    "critical":     "PluginDescriptor field, passed function-to-function (2026-06-27)"
    "init_dirs":    "PluginDescriptor field (2026-06-27)"
    "agent.<agent>.critical":  "same — the namespaced form is equally NOT a key"
    "agent.<agent>.init_dirs": "same — the namespaced form is equally NOT a key"
    "images_conf":  "GENERATED storage.conf; INTERNAL bind, fixed location (D-M8)"
    "browser":      "CLI-only flag + BROWSER_WS_ENDPOINT; out-of-keyspace (D-M5)"
    "meta.box.helper_log": "workaround SPELLING that was NEVER a key (R-23/R-36) —
                            the key is box.bindings.ro.helper_log; the brace form
                            @{meta.box.name} exists precisely so this spelling is
                            not needed (§2c; policy.reference_forms)"
    "config.handbook": "draft name REJECTED in favour of system.canon (R-36; §2g)
                        — the handbook root is the canon key's handbook/ subtree,
                        not a config.* key (fails §1's locate-and-load test)"

  illegal_shapes:               # shapes CODE currently accepts/spells that are
                                # NOT legal key shapes — recorded so the closed
                                # keyspace refuses them and the defect cannot be
                                # copied as precedent (Code Convention 0: an
                                # undiscriminated variant is NOT a key)
    "agent.secret_path.<VAR>":
      status: illegal_shape
      note: "R-40 (RATIFIED as recommended): settings_categories.SECRET_KEY_RE
             spells its scope alternation `system|agent|workset|box` — a bare,
             UNDISCRIMINATED `agent.` scope token — where every sibling category
             regex uses the discriminated `agent\\.[^.]+` (_AGENT_SCOPE). The
             legal shapes are the scope-discriminated
             `agent.default.secret_path.<VAR>` and
             `agent.<agent>.secret_path.<VAR>` (§2a secret_path category ×
             categories.scopes); the bare form matches NO declared scope and is
             NOT a key. The constant is confirmed DEAD (zero consumers in src/,
             tests/, packages/ — packet C11), so this is record-not-behavior:
             the CODE FIX lands at the KeyKind rewrite (deferred; this entry
             is RECORD-ONLY)."
      spec: "§2a (secret_path; R-40)"

  renamed:                        # was a key; the NEW name is authoritative
    "box.crab":                "-> pref.system.agent (§2h) — chain: was renamed to
                                box.agent_name (D-M6), which R-3 then RETIRED"
    "box.agent":               "-> pref.system.agent (§2h) — same chain (D-M6, R-3)"
    "box.agent_name":          "-> pref.system.agent (§2h) (R-3, migration M-4) —
                                RETIRED outright; removes the last settable key at
                                the level a meta anchor derives from. R-31/R-32
                                respell the two derived values it anchored."
    "box.agent.<key>":         "-> meta.box.agent.<key> (RO read-back, R-4); a box
                                tweaks its agent via pref.agent.<agent>.<key> (§2h)"
    "system.default_agent":    "-> system.agent (R-2 — D-M2 SUPERSEDED 2026-07-29;
                                this line FLIPS the draft's inverted entry, which
                                refused the correct name)"
    "system.base_template":    "-> system.template (R-1; default moves
                                global/base_template -> global/template;
                                migration M-11)"
    "system.channels.commons": "-> system.channels.common (R-6; guest-path
                                migration M-9)"
    "workset.channels.commons": "-> workset.channels.common (R-6; migration M-9)"
    "<scope>.shared.<name>":   "-> <scope>.common.<name> (R-5, category renamed
                                2026-07-29; host dirs migration M-3)"
    "box.vault_enabled":       "-> box.enable_vault (2026-07-04)"
    "box.mode":                "-> meta.box.mode (RO identity anchor; mode is identity)"
    "env_file":                "-> secret_path.<VAR>, promoted to a §2a category (2026-07-06)"
    "agent.<agent>.env_file.<VAR>": "-> agent.<agent>.secret_path.<VAR> (R-36; the
                                     namespaced twin of the bare env_file row)"
    "box.group_auth":          "-> box.auth.{global,workset}_enabled (2026-07-01)"
    "group_auth_on":           "-> box.auth.{global,workset}_enabled (2026-07-01)"
    "box.bootstrap_program":   "-> agent.default.bootstrap (multiplexer is agent-tier)"
    "agent.<agent>.transform": "-> agent.<agent>.caches.transform (FOLDED, 2026-06-27)"
    "agent.<agent>.mode":      "-> meta.agent.<agent>.mode (non-editable key, Jei 2026-07-28)"
    "agent.<agent>.exec":      "-> meta.agent.<agent>.exec (non-editable key, Jei 2026-07-28)"
    "agent.default.auto_approve": "-> agent.default.access (R-41, 2026-08-01; values map
                                    true→full, false→restricted)"
    "agent.<agent>.auto_approve": "-> agent.<agent>.access (R-41; same value mapping)"
    "agent.default.default_agent": "-> system.agent (R-18 — MOVED from code_residue:
                                    the deferred code sweep is DONE; it is a
                                    RETIRED_FILE_KEY that hard-refuses with a cure
                                    naming system.agent)"
    "workset.meta.*":          "-> meta.workset.* (top-level meta namespace, 2026-06-29f)"
    "box.meta.*":              "-> meta.box.* (2026-06-29f)"
    "agent.<agent>.meta.*":    "-> meta.agent.<agent>.* (2026-06-29f)"

  deleted:                        # was a key; SUBSUMED, no same-named replacement
    "system.boxes":       "-> @workset.boxes (primary roots at @config.primary_workset)"
    "system.logs":        "-> @workset.logs"
    "system.vault_ro":    "-> @workset.vault_ro"
    "system.vault_rw":    "-> @workset.vault_rw"
    "system.instructions": "RETIRED 2026-07-28 (spec conformed to code) — the box guide ships
                            INSIDE the package under rom/ as the bible general chapter and
                            arrives via the canon_bible_general bind at ~/canon/bible/general/
                            (§2c; path conformed to the canon-books model, D-8);
                            no key, no repoint"
    "system.templates_stamp": "RETIRED (R-38, Jei 2026-08-01) — was a LIVE, UNDECLARED key in
                               shipped code (a §0 violation: read/written by the setup gate,
                               never declared). Retired, not declared: delete the
                               reader/writer/gate (code step B8); a stored leaf is
                               orphaned-ignored (projects:-section
                               precedent). Protection folds into R-34's setup_completed
                               version-marker mechanism (content⇒FCV nudge · structural⇒BCV
                               hard block · CI digest-vs-previous-tag requires the bump).
                               ACCEPTED LOSS: same-version dev-build drift detection.
                               ⚑ load-bearing rider at the code step: SETUP_BCV→1.8.0 in the
                               SAME change (RULINGS R-38)."
    "meta.runtime.ws_settings": "CUT (R-36) — 'no longer needed (unified path)': §1A's
                                 meta.runtime block is ws_root/ws_name/project_type ONLY;
                                 meta.workset.settings spells @meta.workset.path/settings.yaml
                                 directly (the SINGLE-SOURCE list). The draft's live key
                                 entry was a clause-4 violation and is deleted."
    "meta.box.project_dir": "RETIRED (R-36) — there is no project-dir key: the project dir
                             is @meta.workset.path (standalone) or meta.box.workspace
                             (primary) (§2c)"
    "box.bindings.ro.canon_bible": "RETIRED 2026-07-31 (R-36) — the whole-dir bible bind;
                                    undeclared from that edit forward. The bible ships as
                                    per-chapter INTERNAL binds (canon_bible_*, §2c)."
    "box.bindings.ro.canon_handbook": "RETIRED 2026-07-31 (R-36) — the whole-dir
                                       handbook-base bind; the handbook is per-chapter
                                       binds (canon_hb_*, §2c) sourced from the
                                       <scope>.canon keys (R-9)."
    "config.global":      "ELIMINATED 2026-06-29f; children inline @config.data/global/..."
    "resource.<path>":    "DEAD; subsumed by the category keys (D-M7)"
    "resource_overrides": "DEAD (0 callers)"
    "start_mode":         "fully covered by continue_mode + access (§3)"
    "autonomous":         "DEAD; autonomy is the -A/-S launch flags"
    "agent.<agent>.start_mode":  "DEAD (stored, no launch reader) — see start_mode"
    "agent.<agent>.autonomous":  "DEAD — see autonomous"
    "agent.default.start_mode":  "DEAD — see start_mode"
    "agent.default.autonomous":  "DEAD — see autonomous"
    "required":           "the non-overridable ceiling TIER was CUT (Jei 2026-06-29f)"
    ".env":               "global/workset/project .env FILES were DROPPED (2026-06-27) — a
                           duplicate shared channel for env; use <scope>.env.<VAR> instead"
    "agent.<agent>.<anyleaf>": "free-form leaf passthrough — the keyspace is CLOSED (spec §0)"

  code_residue:                   # appeared in CODE only, never spec-sanctioned
    "system._boxes":            "surrogate for the DELETED system.boxes"
    "system._primary_vault_ro": "residue surrogate"
    "system._primary_vault_rw": "residue surrogate"
    "system._primary_logs":     "residue surrogate"
    "agent.<agent>.binding.<key>": "singular host-source-ONLY override; the spec has
                                    ONLY the plural name-bearing bindings.<ro|rw>.<name>"
    # (the two `access` code_residue entries are GONE — R-41 made the name a real
    #  key; see agent.default.access / agent.<agent>.access above)
    "agent.<agent>.name":       "flat identity form -> meta.agent.<agent>.name"
    # (agent.default.default_agent MOVED to not_keys.renamed — R-18: the sweep is done)
    "agent.default.provider":   "NOT a key at the DEFAULT tier — `provider` is a
                                 PLUGIN-CONTRIBUTED member (goose's descriptor),
                                 legal only as agent.<agent>.provider; see
                                 plugin_contributed (R-37)"
    "agent.default.binding.<key>": "singular residue — see agent.<agent>.binding.<key>"
    # (agent.<agent>.provider MOVED to plugin_contributed — R-37: goose declares it
    #  via setting_descriptors(), so it IS a legal descriptor-contributed member)
    "paths_project_toml":       "residue field"
    "project.*":                "the [project] table is a pre-box-rename artifact
                                 (read-compat ONLY: project.enable_vault -> box.enable_vault)"
    "resolved.*":               "core-derived [resolved] table, not keys"

## ---------------------------------------------------------------------------
## PLUGIN-CONTRIBUTED KEYS (R-37, R-15).
## Agent-SPECIFIC keys (agent.claude.* / agent.codex.* / agent.goose.*) are
## deliberately ABSENT from the core registry: §0 "Agent specifics are
## PLUGIN-declared … never hardcoded in core".
## ---------------------------------------------------------------------------
plugin_contributed:
  namespace: "agent.<agent>.*  and  meta.agent.<agent>.*"
  source: PluginDescriptor
  validated_against: policy

  # R-37 (RATIFIED): the SHAPE/MEMBER split. The MANIFEST declares the plugin
  # key SHAPE (the agent.<agent>.<key> contract + the category families at the
  # agent leaf) and the VALIDATION RULES; the DESCRIPTORS supply the MEMBERS,
  # unioned into the valid agent-leaf set at load
  # (settings_keyspace descriptor union) and validated against the SAME rules
  # as core keys. A descriptor-declared leaf (e.g. agent.goose.provider) is
  # therefore a LEGAL key — see `member_census` below and the code_residue move.
  shape: manifest_declares
  members: descriptors_supply
  # ⚑ THE CONFORMANCE REQUIREMENT (R-37, stated here because the manifest
  # generates the conformance test): conformance MUST consult the plugin
  # DESCRIPTORS when validating plugin keys — a conformance pass that reads
  # ONLY this file will FALSE-POSITIVE on EVERY plugin key (each
  # descriptor-declared member would be reported as an undeclared key).
  conformance_must_consult_descriptors: true
  shape_spec: "§0 (universal vs agent-specific) / §2d (R-37)"

  # R-15 (RATIFIED, follows R-10): the spec-NAMED plugin `synced` credential
  # instances live HERE, not in the core declared_instances list — they are
  # PLUGIN-declared (each is materialised from its plugin's cred_files
  # descriptor entries). Same entry semantics as declared_instances.
  declared_instances:
    agent.claude.synced.credentials:
      user_key: true
      default: "(~/.claude/.credentials.json, @meta.box.path/home/.claude/.credentials.json)"
      note: "SYNC, mtime-gate, FILTERED (transform_cred merges claudeAiOauth).
             COPY dest = HOST path under the box store (§0 / R-20). Suppressed
             when the box shares no credentials (auth tier private, D-M4)."
      spec: "§2d (claude; R-15)"
    agent.codex.synced.auth:
      user_key: true
      default: "(~/.codex/auth.json, @meta.box.path/home/.codex/auth.json)"
      note: "SYNC, mtime-gate, filtered=False (Q2: allowlist iff install-bound
             fields)"
      spec: "§2d (codex; R-15)"
    agent.goose.synced.secrets:
      user_key: true
      default: "(~/.config/goose/secrets.yaml, @meta.box.path/home/.config/goose/secrets.yaml)"
      note: "SYNC, mtime-gate, chmod 0600"
      spec: "§2d (goose; R-15)"

  # MEMBER CENSUS — INFORMATIVE ONLY, a point-in-time record (2026-08-01, the
  # shipped descriptors at manifest HEAD 63ea33c). The AUTHORITATIVE member
  # list is ALWAYS the installed descriptors (that is R-37's whole point);
  # this census exists so a reader knows what class of thing descriptors
  # contribute, and MUST NOT be used as a validation source.
  member_census:
    claude: "synced.credentials · common.{plugins,cache} · binary binds
             {share, launcher} (agent_critical) + managed_pointer (kickoff seed)
             · settings {model (flag), endpoint (env ANTHROPIC_BASE_URL)}
             · caches.transform (binary-patch cache)"
    codex: "synced.auth · binary bind {binary} + managed_pointer · settings
            {model (flag), endpoint (SettingArg; config-file delivery via the
            config.toml [model_providers] projection, not env)}"
    goose: "synced.secrets (+ descriptor-only sync members config.yaml
            [filtered: GOOSE_MODE preserved] and custom_providers/ — descriptor
            MEMBERS, not spec-named instances) · binary bind {binary} +
            managed_pointer · settings {provider (env GOOSE_PROVIDER), model
            (env GOOSE_MODEL), endpoint (env OPENAI_HOST)} — provider/model
            default '' (never pinned by kanibako)"
  member_census_spec: "§2d (claude/codex/goose sections) / plugin *-defaults.yaml"

  # `agent.<agent>.provider` — MOVED OUT of not_keys.code_residue (R-37): goose
  # declares `provider` through setting_descriptors() and the loader unions
  # descriptor keys into the valid agent-leaf set, so agent.goose.provider IS a
  # legal key today — the old residue entry asserted otherwise and was wrong.
  # Core still declares NO standard provider key (it stays out of `keys:` and
  # out of the agent.default.* tier); legality flows from the descriptor, which
  # is exactly the shape/member split above.
  provider_disposition: "agent.<agent>.provider = descriptor-contributed member
                         (goose); NOT a core key; agent.default.provider remains
                         not-a-key (no default-tier declaration — see
                         code_residue retext)"
  provider_disposition_spec: "§2d (goose section; R-37)"
