  system.canon:
    scope: system
    type: path
    set: cli+file
    default: "@config.data/global/canon"
    note: "the SYSTEM-level CANON CONTRIBUTION ROOT — the user's own directives;
           its handbook/ subtree is bound in-box at ~/canon/handbook/. Names a
           per-scope CONTRIBUTION root, NOT a copy of the assembled canon:
           ~/canon (guest) is the assembled tree, @<scope>.canon (host) is what
           this scope contributes to it. Root-not-leaf leaves room for further
           canon subtrees without new keys. Supplies SYS_CONTENTS.md + the
           general chapter; MAY supply the agent/workset/box chapters too (a
           scope key SHADOWS it where present — §0 depth-sort). A Layer-2
           SETTINGS key, NOT config.* — it fails §1's locate-and-load test."
