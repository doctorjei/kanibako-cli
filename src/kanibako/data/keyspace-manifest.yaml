    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/auth", named: "@meta.workset.path/auth",
              standalone: null}
    note: "the SETTABLE source for meta.box.auth.workset_path"
    spec: "§2c"
  workset.channelroot:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/channels", named: "@meta.workset.path/channels",
              standalone: null}
    spec: "§2c"
  workset.channels.common:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/common", named: "@workset.channelroot/common",
              standalone: null}
    note: "RENAMED from workset.channels.commons (R-6); guest path in every box
