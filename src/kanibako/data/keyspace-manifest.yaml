    spec: "§2c (ALL PROJECTS) / §2a (R-16)"

  ## ---- LAYER 2: agent.* settings keys (§2d) -------------------------------
  ## agent.default.* is the all-agents FALLBACK layer; agent.<agent>.<key> falls
  ## back to agent.default.<key>. Both are cascade levels (§2).
  # R-41: `access` supersedes the boolean auto_approve (tombstoned in not_keys.renamed
  # with its value mapping). The pre-07-06 code-only `access` spelling (retired at
  # e7b4aea) returns as the successor key — both code_residue entries for it are gone.
  agent.default.access:
    scope: agent
    type: enum
    choices: [restricted, editing, full]
    set: cli+file
    default: full
    note: "permission TIER (R-41). Default full preserves today's behaviour — the
           box is the containment boundary. Per-agent realization is DESCRIPTOR-
           declared (R-37 pattern). Flags -S→restricted / -A→full, ephemeral
           (projected-surface class, §1A). An UNKNOWN stored value is REJECTED
           LOUDLY, naming the key and the legal values — never treated as
           permissive."
    spec: "§2d (access subsection, R-41)"
  agent.<agent>.access:
    scope: agent
    parametric: [agent]
    type: enum
    choices: [restricted, editing, full]
    set: cli+file
    fallback: "agent.default.access"
    note: "per-agent permission tier; the VALUES stay the universal enum — the
           per-agent piece is the descriptor-declared REALIZATION (how the
           harness renders each tier), never new values."
    spec: "§2d (access subsection, R-41)"
  agent.default.allow_helpers:
    scope: agent
    type: bool
    set: cli+file
    default: true
    spec: "§2d"
  agent.default.continue_mode:
    scope: agent
    type: bool
    set: cli+file
    default: true
    note: "continue vs fresh; resume removed. -N/-C/-R override per launch."
    spec: "§2d"
  agent.default.bootstrap:
    scope: agent
    type: str
    set: cli+file
    default: "tmux"
    note: "multiplexer; `none` ⇒ ephemeral / no reattach"
    spec: "§2d"
  agent.default.model:
    scope: agent
    type: str
    set: cli+file
    default: null                 # "use the harness's built-in default"
    note: "-M overrides per launch"
    spec: "§2d"
  agent.default.endpoint:
    scope: agent
    type: str
    set: cli+file
    default: null                 # bare/harness-default — no env emitted
    note: "UNIVERSAL (R-12; moved from the claude-specific row — no claude entry
           exists here, agent specifics are plugin-contributed): agent backend
           endpoint URL, user-settable per-node. All three shipped plugins declare
           its env realization in their descriptors; set ⇒ SUPPRESS the
           OAuth/credential sync — enforced in CORE, not per-plugin."
    spec: "§2d (default tier, R-12)"
  agent.default.run_args:
    scope: agent
    type: str
    set: cli+file
    default: null
    note: "raw-argv passthrough escape hatch"
    spec: "§2d"
  agent.default.transform:
    scope: agent
    type: str
    set: cli+file
    default: null
    note: "WHICH binary transform this agent uses (claude's is `tweakcc`); null = none.
           ⚑ THREE THINGS SHARE THE WORD, keep them apart (spec §2d): THIS key NAMES the
           transform · `transform_settings` is its CONFIG INPUT · the patched binary in
           `agent.<agent>.caches` is its OUTPUT (an ENTRY of a terminal dest-keyed key,
           never a key of its own).
           ⚑⚑ DECLARED 2026-08-08c by Jei, RE-declared here 2026-08-08e — it had been
           filed under not_keys.renamed as folded-into-caches (2026-06-27). That fold is
           SUPERSEDED; do not re-file it there.
           ✅ WIRED 2026-08-09: the launch gate (`start._effective_transform` ->
           `_apply_tweakcc`) runs the transform this key NAMES; the claude PLUGIN declares
           the value through `setting_descriptors()` (spec §0 — agent specifics are
           plugin-established) and core only RECOGNIZES it as
           `kanibako.tweakcc.TRANSFORM_NAME`. `transform_settings` is no longer the switch.
           ⏳ STILL BOARDED: moving the tweakcc IMPLEMENTATION (`tweakcc.py`,
           `tweakcc_cache.py`, `_apply_tweakcc`) out of core into the claude plugin."
    spec: "§2d (declared 2026-08-08c)"
  agent.default.transform_settings:
    scope: agent
    type: dict
    set: cli+file
    default: {}
    note: "binary-transform SETTINGS consumed by the plugin's transform pipeline — the
           INPUT. Its OUTPUT is the patched binary held as an ENTRY of the terminal
           dest-keyed key `agent.<agent>.caches` (an entry has no NAME; the DESTINATION
           is the identity, cf. the `caches` shape block). WHICH transform runs is
           `agent.<agent>.transform`, a key in its own right."
    spec: "§2d (added 2026-07-14)"
  agent.default.canon:
    scope: agent
    type: path
    set: cli+file
    default: "@config.agents/default/canon"
    note: "the all-agents fallback CANON CONTRIBUTION ROOT (= the parametric
           default with meta.agent.default.name = \"default\") — a plain dir in
           the agents store, CORE-owned: there is NO default plugin package
           (§0 'the base system owns agent.default.*')."
    spec: "§2d (R-13)"
  agent.<agent>.<key>:
    scope: agent
    parametric: [agent, key]
    set: cli+file
    fallback: "agent.default.<key>"
    note: "the generic per-agent contract SHAPE. Core owns the shape ONLY; every
           agent-SPECIFIC value is PLUGIN-declared (§0 universal-vs-specific) and
           therefore NOT enumerated in this core registry — see plugin_contributed."
    spec: "§2d"
  agent.<agent>.template:
    scope: agent
    parametric: [agent]
    type: path
    set: cli+file
    default: "@meta.agent.<agent>.path/template"
    note: "per-agent template SOURCE; seed layer 2"
    spec: "§2d"
  agent.<agent>.canon:
    scope: agent
    parametric: [agent]
    type: path
    set: cli+file
    default: "@meta.agent.<agent>.path/canon"
    fallback: "agent.default.canon"
    note: "the AGENT's CANON CONTRIBUTION ROOT; its handbook/ subtree supplies
           the handbook's AGENT chapter, bound at ~/canon/handbook/agent/.
           PLUGIN-provided or the default — the ordinary §2d fallback picks
           exactly ONE to bind (OVERRIDE, not additive: no per-file merge).
           ⚑ The plural/singular split is LOAD-BEARING and must not be
           'normalised' (R-9/R-13): STORAGE IS VARIED, BINDING IS NOT — the
           HOST stores N per-agent variants (agents/<agent>/…, plural, each
           settable incl. for an agent this box is not running, §2h); the BOX
           gets ONE chapter at a FIXED dest with NO agent segment (agent/…,
           singular). The discriminator lives on the HOST side of the bind
           tuple, never the guest side."
    spec: "§2d (R-9 + R-13)"

  ## ---- meta.* — TOP-LEVEL protected RO namespace (§0) ---------------------
  ## Materialized ONLY by construct-time / plugin / runtime derivation.
  ## Design property: set == never IFF meta.*.
  meta.runtime.ws_root:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "standalone=<runtime project dir> · primary=@config.primary_workset ·
            named=<detected workset root>"
    spec: "§1A (L0.2)"
  meta.runtime.ws_name:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "standalone=__STANDALONE__ · primary=__PRIMARY__ · named=<detected name>"
    note: "the workset PARTITION token; reserved names may not be user-chosen"
    spec: "§1A / §3 (D-B3)"
  meta.runtime.project_type:
    namespace: meta
    set: never
    origin: runtime_treewalk
    type: enum
    choices: [standalone, primary, named]
    spec: "§1A"
  ## meta.assembly.* — the COLLAPSE outputs (ratified 2026-08-08f; MOVED out of
  ## meta.runtime on 2026-08-09). Their own group because they sit at the OPPOSITE
  ## END OF THE LIFECYCLE from the three rows above: the treewalk answers where the
  ## workset is, what it is called and what mode is this BEFORE anything else
  ## resolves (L0.2), while these are folded AFTER every scope has, and they
  ## ASSEMBLE THE BOX. ⚑ `origin: derived` is the honest token, NOT
  ## `runtime_treewalk` — nothing walks a tree to get them; they fold from the
  ## declared category families, exactly like every other derived meta row.
  ## ⚑ NO PRODUCER EXISTS for any of the three yet.
  meta.assembly.bindings:
    namespace: meta
    set: never
    origin: derived
    type: dict
    value: "dict[guest_dest -> (host_src, opts)]"
    note: "COLLAPSED BIND MAP — the grand-unification output (§0/§2). ONE entry per
           dest BY CONSTRUCTION: a second bind at a live dest is the double-bind
           ERROR. src = None marks a MASK. Home is pid 0 and is seeded here BEFORE
           any scope folds (A9, @meta.box.home). Produced by the collapse, which has
           not landed — declared so the closed keyspace admits the name."
    spec: "§1A"
  meta.assembly.copies:
    namespace: meta
    set: never
    origin: derived
    type: dict
    value: "dict[guest_dest -> list[(host_src, opts)]]"
    note: "COLLAPSED COPY MAP, DEST-ORDERED. A dest may carry SEVERAL copies (hence
           a list), unlike bindings. Ordering is load-bearing, not cosmetic: the
           prefix scan that prunes copies INSIDE a bound dest walks this map in dest
           order. Same producer as meta.assembly.bindings, and equally absent."
    spec: "§1A"
  meta.assembly.backup:
    namespace: meta
    set: never
    origin: derived
    type: dict
    note: "RESERVED — guest->host, the only reverse-direction member. NO PRODUCER
           EXISTS; declared with the pair above so the triple ratifies once. ⚑ The
           `origin` here states the CLASS it will belong to, not a claim that
           anything derives it today."
    spec: "§1A"
  meta.workset.path:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.runtime.ws_root"
    spec: "§2c / §1A"
  meta.workset.name:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.runtime.ws_name"
    spec: "§2c / §1A"
  meta.workset.settings:
    namespace: meta
    set: never
    origin: bootstrap
    value: "@meta.workset.path/settings.yaml"
    note: "the §1A SINGLE-SOURCE canonical spelling; the former
           @meta.runtime.ws_settings anchor is CUT (unified path; R-36)"
    spec: "§2c / §1A"
  meta.box.name:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "<construct-time>", named: "<construct-time>",
            standalone: "<@workset.kuid>_%leaf(@meta.workset.path)%"}
    note: "AUTHORITATIVE source = the workset registry's entry KEYS; no literal
           meta.box.name field is stored. Standalone: regen the KUID on WHOLE-NAME
           collision; SANITIZE + LENGTH-CAP the leaf (D-M12/13)."
    spec: "§2c"
  meta.box.path:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "@workset.boxes/@meta.box.name",
            named: "@workset.boxes/@meta.box.name",
            standalone: "@workset.boxes"}
    note: "the RO per-mode BOX ROOT — the declaration root every rooted box key
           spells itself against (§2a table). STANDALONE is the EMPTY LEAF:
           workset.boxes IS the box root, so the value is a BARE whole-value ref
           (no join, no trailing separator). The per-mode variation lives HERE and
           nowhere downstream, which is what lets meta.box.home be a single
           declaration for every mode. NOT settable: relocate box data one level up
           via the settable workset.boxes."
    spec: "§2c / §2a"
  meta.box.home:
    namespace: meta
    set: never
    origin: derived
    value: "@meta.box.path/home"
    note: "RO DERIVED box-home SOURCE — the pid-0 FOUNDATION bind's src_path,
           seeded into the collapse before any other entry (§0). It does NOT route
           through bindings.rw: home is the base plate, not one bind among many
           (2026-08-08; the box.bindings.rw entry at `~/` is DELETED, see
           bind_default_entries). UNIFORM in every mode, like meta.box.settings —
           the per-mode variation lives in meta.box.path. Derived, never user-set;
           being meta means it can't be set to a dangling @-ref. MOUNT OPTIONS ARE
           SEAM MACHINERY, not part of the key: this is a path scalar like every
           other meta.* row. Settable SOURCE = the chain under meta.box.path."
    spec: "§2c (ALL PROJECTS)"
  meta.box.workspace:
    namespace: meta
    set: never
    origin: construct_time
    value: {primary: "<the user's real project dir>",
            named: "@workset.workspaces/@meta.box.name",
            standalone: "@workset.workspaces"}
    note: "standalone: the whole-value ref (no /@meta.box.name join — one box);
           spelled against the KEY so a repointed workset.workspaces carries it
           (a literal here would be the copy-that-drifts §0 forbids). R-26 rider."
    spec: "§2c"
  meta.box.settings:
    namespace: meta
    set: never
    origin: construct_time
    value: "@meta.box.path/settings.yaml"
    note: "UNIFORM — ALL PROJECTS, every mode (R-30): standalone HAS a box tier
           whose file is merely ABSENT by default; box values then resolve from
           the workset tier @meta.workset.settings as R2 downward defaults
           (2026-07-04). The old 'standalone: null — SUBSUMED, box tier empty'
           reading is the RETIRED model."
    spec: "§2c (ALL PROJECTS; R-30)"
  meta.box.mode:
    namespace: meta
    set: never
    origin: runtime_treewalk
    value: "@meta.runtime.project_type"
    note: "mode is IDENTITY, not behavior — was the settable box.mode"
    spec: "§2c"
  meta.box.inbox:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.mailboxes/@meta.box.name"
    spec: "§2c (ALL PROJECTS)"
  meta.box.share_global:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.share_global/@meta.box.name"
    spec: "§2c (ALL PROJECTS)"
  meta.box.share_workset:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.channels.share/@meta.box.name"    # <None> for standalone
    spec: "§2c"
  meta.box.auth.workset_path:
    namespace: meta
    set: never
    origin: derived
    value: "@workset.auth.path/@system.agent"          # <None> for standalone
    note: "reclassified from the old SETTABLE box.auth.workset_path (2026-07-04):
           being meta means it can't be set to a dangling @-ref. Respelled from
           @box.agent_name (R-31, with R-3)."
    spec: "§2c (R-31)"
  meta.box.agent.<key>:
    namespace: meta
    parametric: [key]
    set: never
    origin: derived
    mirror_of: "agent.<@system.agent>.<key>"
    note: "READ-BACK RO MIRROR of the effective agent subtree for this box
           (R-4; was the SETTABLE box.agent.<key> — that entry's 'ordinary
           same-scope write' argument INVERTED under R-3's retirement). Values
           are READABLE here, never SETTABLE; a box tweaks its agent with
           pref.agent.<agent>.<key> (§2h) instead. Re-materialized whenever the
           effective agent changes. Impl: COPY (pure) or shared REF (equivalent
           — one box per process). Restores 'set == never IFF meta.*'."
    spec: "§2b (R-4)"
  meta.box.agent.auth.share_support:
    namespace: meta
    set: never
    origin: plugin
    value: "@meta.agent.<@system.agent>.auth.share_support"
    note: "box-immutable capability MIRROR — the hard RO floor a box cannot
           fake. Respelled from <@box.agent_name> (R-32, with R-3)."
    spec: "§2c / §2d (R-32)"
  meta.box.helper_num:
    namespace: meta
    set: never
    origin: spawn
    type: int
    note: "UNSET for a top-level box; travels as a STRUCTURED field in helper
           messages — never recovered by string-splitting the container name"
    spec: "§2c"
  meta.box.container_name:
    namespace: meta
    set: never
    origin: derived
    value: "kanibako-@meta.box.name%if @meta.box.helper_num: -helper-@meta.box.helper_num%"
    note: "a RENDERING of the identity pair, NEVER a source to parse back from"
    spec: "§2c (F5)"
  meta.agent.default.name:
    namespace: meta
    set: never
    origin: plugin
    value: "default"
    spec: "§2d"
  meta.agent.<agent>.name:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    required: true
    note: "REQUIRED whenever an agent exists; identifies the store dir + cascade key"
    spec: "§2d"
  meta.agent.<agent>.path:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    value: "@config.agents/@meta.agent.<agent>.name"
    note: "META so agent/workset/box cascade CANNOT override it (D-2026-06-22)"
    spec: "§2d"
  meta.agent.<agent>.settings:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    value: "@meta.agent.<agent>.path/settings.yaml"
    spec: "§2d"
  meta.agent.<agent>.mode:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: dict            # {mode_key -> argv fragment}
    note: "the harness's INTERACTIVE launch grammar; a NON-EDITABLE key — plugin
           invocation syntax, not a user preference. RENAMED from agent.<agent>.mode
           (Jei 2026-07-28, D-4)."
    spec: "§2d"
  meta.agent.<agent>.exec:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: str             # argv fragment; carried in the descriptor's `operations` dict
    note: "the STANDALONE (one-shot/headless) invocation; MUTUALLY EXCLUSIVE with mode at
           the same argv slot. RENAMED from agent.<agent>.exec (Jei 2026-07-28, D-4)."
    spec: "§2d"
  meta.agent.<agent>.auth.share_support:
    namespace: meta
    parametric: [agent]
    set: never
    origin: plugin
    type: bool
    note: "PluginDescriptor field auth_share_support — a CAPABILITY, not a setting"
    spec: "§2d (auth-level 2026-07-01)"

## ---------------------------------------------------------------------------
## DEFAULT BIND ENTRIES (dest-keyed; ruled 2026-08-06c, R-3/R-5/R-9/R-10)
##
## ⚑ THESE ARE NOT KEYS. `box.bindings.ro` and `box.bindings.rw` are TERMINAL
## keys (see `categories:` above); the rows below are the DOCUMENTED DEFAULT
## ENTRIES of those two BindMaps, indexed by their DESTINATION. A destination is
## DATA — never a keyspace segment — so `box.bindings.ro.<name>` is NOT a key and
## MUST be refused (policy.unknown_key).
##
## DEMOTED, NOT DELETED: until 2026-08-06c these were 30 `declared_instances`
## rows keyed by NAME. Binding entry names are GONE (R-10 — the destination is
## the identity), but the rows are kept because their `note:` fields carry
## reasons nothing else records ("Not repointable: the index defines the canon's
## shape and load order", the brace-form rule, the empty-options socket rule, …).
## ⚑ EVERY `note:` BELOW IS PRESERVED VERBATIM from its pre-demotion row. Where a
## note refers to a sibling by its retired NAME the quoted text is left intact and
## the current spelling is given beside it in `see:` — do not edit inside a note.
##
## `user_key:` semantics are UNCHANGED and still real (R-10):
##   true  — an ORDINARY user-facing entry with a settable default (`default:`)
##           that participates in the set-time floor. ⚑ It is no longer
##           REPOINTABLE FROM THE CLI: bindings are YAML-only since 2026-08-06c
##           (categories.bindings.*.cli_set: false; R-9, a KNOWN ACCEPTED LOSS).
##   false — INTERNAL / generated (spec: "not a user key, not repointable"): the
##           bind still routes through the single binding route, but nothing about
##           it is user-addressable; `config show` displays it as an internal bind
##           (`value:`, not `default:`).
## Field convention: user_key true ⇒ `default:`; user_key false ⇒ `value:`.
## Entry values are spelled as the spec spells them — `(host_src)`, or
## `(host_src, options)` where the entry overrides the category mount options
## (bindmap_shape). Dests here are GUEST paths (§0 / R-20 — mounts).
##
## ⚑⚑ A DEST SPELLING IS NOW AN IDENTITY. Two spellings of one path would be two
## dict entries, which was cosmetic under name-keying and is not cosmetic now. It
## is SETTLED by R-11 (Jei, 2026-08-06c) — a binding DEST is normalized to an
## ABSOLUTE guest path (`~` expanded), so `~` and `~/` ARE one entry; the SRC is
## NEVER canonicalized (a host `~` is the invoking user's home). See spec §2a
## REPRESENTATION, "A MOUNT DESTINATION IS CANONICALIZED; THE SOURCE IS NOT".
## (R-11 was recorded on the box HOME entry, which LEFT this map 2026-08-08 —
## the rule is general and is restated here so it did not leave with it.)
## ---------------------------------------------------------------------------
bind_default_entries:

  box.bindings.ro:

    ## ---- CANON BOOKS + KICKOFF — the 12 §2c book/kickoff entries ----------
    ## 7 INTERNAL (the canon index, the five bible chapters, kickoff) — the
    ## package-sourced ones; 5 USER KEYS (the handbook chapters) — the spec's
    ## own LOAD-BEARING distinction: the handbook is sourced from the
    ## `<scope>.canon` keys "or wherever the user redirects it, because it IS a
    ## settings key" (§2c). Do NOT flatten the two classes into one.
    "~/canon/COLLECTION.md":
      user_key: false
      value: "(<packaged rom COLLECTION.md>)"
      note: "INTERNAL — the canon index; FILE bind over the pre-created box-skeleton
             mountpoint. Stays a BIND (rom truth: a seeded copy would freeze at
             create and drift from the package). Not repointable: the index defines
             the canon's shape and load order, so a redirect could silently replace
             the canon wholesale."
      spec: "§2c (CANON books; R-10)"
    "~/canon/bible/ROM_CONTENTS.md":
      user_key: false
      value: "(<packaged rom bible/ROM_CONTENTS.md>)"
      note: "INTERNAL, FILE bind (same pre-created-mountpoint rule)"
      spec: "§2c (CANON books; R-10)"
    "~/canon/bible/general":
      user_key: false
      value: "(<packaged rom bible/general>)"
      note: "INTERNAL, dir ro. Successor delivery of the retired system.instructions
             box guide: the packaged rom's general chapter (directives/ROM_GENERAL.md
             — verified against the packaged tree, A3/D-8) arrives here; no
             host-editable copy, no repoint."
      spec: "§2c (CANON books; R-10) / §3 (system.instructions row)"
    "~/canon/bible/workset":
      user_key: false
      value: "(<packaged rom bible/workset>)"
      note: "INTERNAL, dir ro"
      spec: "§2c (CANON books; R-10)"
    "~/canon/bible/box":
      user_key: false
      value: "(<packaged rom bible/box>)"
      note: "INTERNAL, dir ro"
      spec: "§2c (CANON books; R-10)"
    "~/canon/bible/agent":
      user_key: false
      value: "(<plugin pkg data/rom>)"
      note: "INTERNAL, dir ro — the PLUGIN's bible chapter, emitted by CORE from the
             RESOLVED target (emission gate: rom_root exists AND contains
             directives/ROM_AGENT.md). bible/agent = per-HARNESS (packaged);
             handbook/agent = per-AGENT-NODE (host, agent.<agent>.canon) — two
             books, two cardinalities, no overlap. Not a user key, not repointable,
             no floor (§0: the one book a user cannot edit is the one they cannot
             repoint)."
      spec: "§2c (CANON books; R-10)"
    "~/canon/handbook/SYS_CONTENTS.md":
      user_key: true
      default: "(@system.canon/handbook/SYS_CONTENTS.md)"
      note: "FILE bind; system store — user-editable on the HOST, ro in-box. NOT
             skip-if-absent: install/setup materialises the system store, so a
             missing source is a genuine defect. The blessed repoint ROUTE is the
             SOURCE key system.canon (the bind spells itself against it)."
      spec: "§2c (CANON books; R-10)"
    "~/canon/handbook/general":
      user_key: true
      default: "(@system.canon/handbook/general)"
      note: "dir ro; system store — the global handbook IS the general chapter (the
             system store ships NO agent/workset/box chapter stubs). NOT
             skip-if-absent (same rule as canon_hb_contents)."
      see: "the note's `canon_hb_contents` is the retired NAME of this arm's
            ~/canon/handbook/SYS_CONTENTS.md entry"
      spec: "§2c (CANON books; R-10)"
    "~/canon/handbook/agent":
      user_key: true
      optional: skip_if_absent
      default: "(@agent.<active>.canon/handbook)"
      note: "source per the §2d fallback (agent.<agent>.canon -> agent.default.canon;
             exactly ONE is bound — override, not additive); dest carries NO agent
             segment (the plural/singular split is LOAD-BEARING, R-9/R-13). The
             <active> discriminator is the ACTIVE AGENT NODE, interpolated at the
             seam; the whole entry is OMITTED for a NO-AGENT box."
      spec: "§2c (CANON books; R-10) / §2d (R-9 + R-13)"
    "~/canon/handbook/workset":
      user_key: true
      optional: skip_if_absent
      default: "(@workset.canon/handbook)"
      note: "repoint route = workset.canon (R-9)"
      spec: "§2c (CANON books; R-10)"
    "~/canon/handbook/box":
      user_key: true
      optional: skip_if_absent
      default: "(@box.canon/handbook)"
      note: "repoint route = box.canon (R-9); the SOURCE is filled at box create by
             the host-side box-handbook template copy (NOT a seed layer — those were
             retired 2026-08-07g), so repointing box.canon moves the fill and this
             bind together, spelled once"
      spec: "§2c (CANON books; R-10)"
    "~/.config/kanibako/kickoff.md":
      user_key: false
      value: "(<packaged core KICKOFF.md>)"
      note: "INTERNAL, like kani_pkg — the directive-chain entry slot; kickoff
             CONTENT lives in CORE, delivered by this unconditional bind. Not a user
             key, not repointable. TRANSITION: emitted ONLY when the resolved target
             does not itself deliver a kickoff at the same dest (yield gate; the
             plugins' own KICKOFF.md deletions land ONE RELEASE LATER, after which
             'unconditional' becomes literal — the FOLLOW-UP RELEASE plan)."
      see: "the note's `kani_pkg` is the retired NAME of this arm's
            /opt/kanibako/kanibako entry"
      spec: "§2c (kanibako CLI delivery; R-10)"

    ## ---- CORE ro ENTRIES — the §2c instances (R-10 via packet C5) ---------
    ## The spec's own §2c rows, one entry per (arm, destination). The vault is
    ## TWO entries, one in each arm. Per-mode variation is spelled mode-keyed,
    ## exactly like the manifest's per-mode `default:` house style.
    "~/vault/ro":
      user_key: true
      default: {primary: "(@workset.vault_ro/@meta.box.name)",
                named: "(@workset.vault_ro/@meta.box.name)",
                standalone: "(@workset.vault_ro)"}
      note: "both arms root at the UNIFORM @workset.vault_ro (§2c ALL PROJECTS);
             only the per-box /@meta.box.name subdir is per-mode (a lone box does
             not need it). Gated on box.enable_vault; source created if missing."
      spec: "§2c (ALL WORKSETS / STANDALONE; R-29)"
    "<box_image_dir>":
      user_key: true
      default: "%if @box.share_images: (@box.images_store) else None%"
      note: "conditional on @box.share_images (D-M8); the settable INPUTS are
             box.share_images + box.images_store (the USER KEY host store root).
             The GENERATED storage.conf companion (images_conf) is an INTERNAL bind
             and NOT a key (not_keys.never_a_key) — the store mount is INERT
             without it. RESOLVED by B3: core-defaults' bind entry is `images`
             (renamed from `images_store` — the bind row and the scalar no longer
             share a name); the shipped host_src is the @-ref `@box.images_store`,
             whose runtime-probed-graphroot DEFAULT enters as a floor scalar at
             the launch seam (core_defaults.image_default_categories). The %if%
             condition is realized by the caller's conditional gate (the image
             table is only injected when image sharing is active)."
      see: "⚑ the note's naming discussion is HISTORY as of 2026-08-06c — entry
            names no longer exist at all, so `images` vs `images_store` can no
            longer collide. The dest is a RESOLVED placeholder, not a literal."
      spec: "§2c (ALL PROJECTS; D-M8) / §2b (box.images_store)"
    "~/.kanibako/state/helpers.jsonl":
      user_key: true
      default: "(@workset.logs/@{meta.box.name}.jsonl)"
      note: "a SINGLE row for all modes — workset.logs carries the per-mode
             variation (R-28). ⚑ THE BRACES ARE LOAD-BEARING (policy.reference_forms
             / R-23): the bare form would greedily parse `meta.box.name.jsonl` and
             coerce to ''. There is NO meta.box.helper_log key
             (not_keys.never_a_key)."
      spec: "§2c (ALL PROJECTS; R-23 / R-28)"
    "/opt/kanibako/kanibako":
      user_key: false
      value: "(<host pkg>)"
      note: "kanibako CLI delivery. INTERNAL per the spec's own references — the
             kickoff row reads 'INTERNAL, like kani_pkg' and the images_conf note
             reads 'like the kani_pkg binds — not a settable keyspace path' (§2c).
             ⚑ user_key: false — confirmed: two independent spec statements; the
             plan lists kani_pkg among the core binds without a class marker."
      see: "`kani_pkg` was THIS entry's retired name"
      spec: "§2c (kanibako CLI delivery)"
    "~/.local/bin/kanibako":
      user_key: false
      value: "(<entry script>)"
      note: "kanibako CLI delivery; same class as kani_pkg (same flag applies)"
      see: "the note's `kani_pkg` is the retired NAME of the
            /opt/kanibako/kanibako entry above"
      spec: "§2c (kanibako CLI delivery)"
    "/etc/profile.d/kanibako-secrets.sh":
      user_key: false
      value: "(<packaged kanibako-secrets.sh>)"
      note: "INTERNAL, like kani_pkg — the secrets-into-shell-profile machinery:
             an RO bind delivering the generic self-adapting profile.d snippet
             every LOGIN shell sources, exporting each mounted secret from
             SECRET_MOUNT_DIR (/run/kanibako/secrets) in-box (the paths the PID-1
             _secret_export_shim cannot reach — non-login execs never inherit its
             env). UNCONDITIONAL/universal: the snippet no-ops when nothing is
             mounted. Only the snippet PATH is bound, never a token (arm's-length
             preserved). Spec row added per ruling 8a (2026-08-02) — resolves the
             former A6-era 'no spec §2c row' flag."
      see: "the note's `kani_pkg` is the retired NAME of the
            /opt/kanibako/kanibako entry above"
      spec: "§2c (kanibako CLI delivery; ruled 8a, 2026-08-02)"

  box.bindings.rw:

    ## ⚑ THE BOX HOME ENTRY IS GONE FROM THIS MAP (2026-08-08). Home LEFT
    ## `bindings.rw` and is now the RO DERIVED key `meta.box.home` (see `keys:`
    ## above) — the pid-0 FOUNDATION bind's source, seeded into the collapse
    ## before any other entry. Do NOT re-add a `~/` entry here: a second bind at
    ## home is a same-dest collision (category_collisions row 1).
    "~/workspace":
      user_key: true
      default: "(@meta.box.workspace)"
      spec: "§2c"
    "~/vault/rw":
      user_key: true
      default: {primary: "(@workset.vault_rw/@meta.box.name)",
                named: "(@workset.vault_rw/@meta.box.name)",
                standalone: "(@workset.vault_rw)"}
      note: "see box.bindings.ro.vault — same shape, rw arm"
      see: "the note's `box.bindings.ro.vault` is the retired KEY spelling of the
            ro arm's ~/vault/ro entry"
      spec: "§2c (ALL WORKSETS / STANDALONE; R-29)"
    "~/.kanibako/state/helper.sock":
      user_key: true
      default: "(@system.runtime/@{meta.box.name}-@{meta.workset.name}.sock, \"\")"
      note: "mount options MUST stay empty ('') — a LIVE unix socket; Z/U
             relabel/chown would break the shared socket topology (core-defaults
             carries the empty 3rd slot). ⚑ THE BRACES ARE LOAD-BEARING (R-23 /
             ruling 9a, 2026-08-02): a bare workset-name ref would greedily eat
             the `.sock` suffix as one absent ref name (cf. helper_log)."
      see: "the note's 'empty 3rd slot' is the OLD arity — under bindmap_shape the
            options are the SECOND element, and this entry is the one place the
            2-element form is exercised. `helper_log` is the retired NAME of the
            ro arm's $XDG_STATE_HOME/kanibako/helpers.jsonl entry."
      spec: "§2c (ALL PROJECTS)"
    "~/channels/common":
      user_key: true
      default: "(@system.channels.common)"
      note: "system channel guest mount, option (A) — perms aspirational"
      spec: "§2c (ALL PROJECTS; R-6 name)"
    "~/channels/chat":
      user_key: true
      default: "(@system.channels.chat)"
      spec: "§2c (ALL PROJECTS)"
    "~/channels/share":
      user_key: true
      default: "(@system.channels.share)"
      note: "rw* -> ro under future (C)"
      spec: "§2c (ALL PROJECTS)"
    "~/channels/mailboxes":
      user_key: true
      default: "(@system.channels.mailboxes)"
      note: "rw* -> ro under future (C)"
      spec: "§2c (ALL PROJECTS)"
    "~/channels/inbox":
      user_key: true
      default: "(@meta.box.inbox)"
      note: "own inbox; the (C)-stable path"
      spec: "§2c (ALL PROJECTS)"
    "~/channels/workset/common":
      user_key: true
      default: "(@workset.channels.common)"
      note: "workset-LOCAL channel — PRIMARY/NAMED only; a standalone box has no
             workset channels, so the entry is OMITTED there (gated at the seam)"
      spec: "§2c (ALL WORKSETS; R-6 name)"
    "~/channels/workset/chat":
      user_key: true
      default: "(@workset.channels.chat)"
      note: "PRIMARY/NAMED only (see workset_common)"
      see: "the note's `workset_common` is the retired NAME of this arm's
            ~/channels/workset/common entry"
      spec: "§2c (ALL WORKSETS)"
    "~/channels/workset/share":
      user_key: true
      default: "(@workset.channels.share)"
      note: "PRIMARY/NAMED only; rw* -> ro under future (C)"
      spec: "§2c (ALL WORKSETS)"

## ---------------------------------------------------------------------------
## CATEGORY DEFAULT ENTRIES (dest-keyed; ruled 2026-08-07f — same class as the
## 2026-08-06c bindings demotion above)
##
## ⚑ THESE ARE NOT KEYS. `system.seeded`, `agent.<agent>.seeded` and
## `workset.seeded` are TERMINAL keys (see `categories:` above); the rows below
## are the DOCUMENTED DEFAULT ENTRIES of those three maps, indexed by their
## DESTINATION. A destination is DATA — never a keyspace segment — so
## `<scope>.seeded.<name>` is NOT a key and MUST be refused (policy.unknown_key).
##
## ⚑ `declared_instances:` IS DELETED (2026-08-07f), not left empty. It held ONLY
## these six rows after the 2026-08-06c bindings demotion; with entry names gone
## from every bind-shaped category there is no NAMED category instance left for it
## to hold, and the <VAR>-parametric families (env, secret_path) were never in it.
## Its `user_key:` semantics are carried forward verbatim below, unchanged.
##
## DEMOTED, NOT DELETED: until 2026-08-07f these were six `declared_instances`
## rows keyed by NAME (`{system, agent.<agent>, workset}.seeded.{template,
## handbook}`, R-14). The names are GONE (the destination is the identity), but the
## rows are kept because their `note:` fields carry the SPEC'S OWN LAYER NUMBERS
## (§2a layers 1-3) and reasons nothing else records.
##
## ⚑⚑ AND THEN THERE WERE THREE. The `handbook` half (layers 4-6, all at
## `@box.canon/handbook`) was RETIRED 2026-08-07g on Jei's ruling: the handbook
## templates *"do not DIRECTLY interact with the box itself … They are HOST
## templates, not GUEST templates"*, so they left the `seeded` category entirely.
## The ratified §2a declares THREE layers, and the keyspace declares NO `seeded`
## entry at `@box.canon/handbook` at any scope. (`<scope>.seeded.handbook` is not a
## key for the separate, older reason recorded above: since 2026-08-07f the name
## segment is not keyspace at all.) What fills the box's handbook chapter now is
## `launch.templates.install_box_handbook_template`, a
## host-side copy at create modelled on `install_workset_template`; its three layer
## SOURCES are still the ordinary keys `{system, agent.<agent>, workset}.template`,
## so the user's repoint route is unchanged. Single-route composes: a host template
## never enters a box — the ro `box.bindings.ro[~/canon/handbook/box]` bind does,
## and that bind is untouched.
## ⚑ EVERY `note:` BELOW IS PRESERVED VERBATIM from its pre-demotion row.
##
## `user_key:` semantics are UNCHANGED and still real:
##   true  — an ORDINARY user-facing entry with a settable default (`default:`)
##           that participates in the set-time floor. ⚑ It is no longer
##           REPOINTABLE FROM THE CLI: every bind-shaped category is YAML-only
##           since 2026-08-07f (categories.seeded.cli_set: false; DS-BL1 (a), a
##           KNOWN ACCEPTED LOSS).
##   false — INTERNAL / generated: the delivery still routes through the single
##           binding route, but nothing about it is user-addressable.
## Field convention: user_key true ⇒ `default:`; user_key false ⇒ `value:`.
## Entry values are spelled as the spec spells them: `(host_src)`. ⚑ NO entry
## below carries a second element, and none could mean anything by it — `seeded`
## is a COPY, so there is no mount to carry options and the slot is RESERVED with
## no meaning today (bindmap_shape.second_element). ⚑ Dests here are GUEST paths,
## RESOLVED to the host store when the copy runs (§0 / R-20 /
## policy.tuple_dest_space, 2026-08-08). `seeded` is and remains a COPY category:
## the respell changed the SPELLING and who resolves it, never the delivery.
##
## ⚑⚑ THE THREE SCOPES ARE THREE DISTINCT TERMINAL KEYS AND DO NOT COLLIDE.
## `system.seeded`, `agent.<agent>.seeded` and `workset.seeded` each hold the same
## ONE destination; nothing unions them, so all three layers still apply, in order.
## Cascade merge (six FILE levels) and realization (four SCOPE tokens) are
## ORTHOGONAL axes — collapsing the layers to one winner is only reachable by
## conflating them. The ordered later-wins-PER-FILE overlay of §2a is unchanged.
## ---------------------------------------------------------------------------
category_default_entries:

  ## ⚑ METADATA ABOUT THE KEYS BELOW — DELIBERATELY NOT A CHILD OF ONE.
  ## EVERY child of a key below is a DESTINATION (these maps are indexed by their
  ## DESTINATION), so a metadata field parked among them would put TWO SHAPES in
  ## ONE MAP — one child whose value is a list of parameter names, the rest entry
  ## mappings — which is the ambiguity Code Convention 0 forbids. It is recorded
  ## here instead, keyed by the KEY it describes, in the same `[<param>]` spelling
  ## the `keys:` table uses for its own `parametric:` field.
  ## `<agent>` in a key name below is therefore a PLACEHOLDER: the row stands for
  ## one terminal key per installed agent, not for a key literally spelled
  ## `agent.<agent>.seeded`.
  parametric_keys:
    "agent.<agent>.seeded": [agent]

  ## ---- THE THREE SEED LAYERS (R-14, dest-keyed 2026-08-07f) ---------------
  ## COPIES, not mounts: the dest is a GUEST path, RESOLVED to the host store when
  ## the copy runs (§0 / R-20; respelled 2026-08-08, was "@meta.box.path/home").
  ## Ordered layers, later-wins per file, SEED-ONCE at create (§2a / §5). The layer
  ## numbers in the notes are the spec's own (§2a layers 1-3).
  system.seeded:
    "~/":
      user_key: true
      default: "(@system.template/box/home)"
      note: "layer 1 — base BOX template (global); source = the box/home subtree of
             the system template ROOT (R-1: system.template, NOT the root itself)"
      spec: "§2a (seed layer 1; R-14)"
  agent.<agent>.seeded:               # parametric in <agent> — see parametric_keys above
    "~/":
      user_key: true
      default: "(@agent.<agent>.template/box/home)"
      note: "layer 2 — per-agent (agent = persona + harness); template holds
             settings.json / CLAUDE.md / dirs; SUBSUMES all per-file agent seeds"
      spec: "§2a (seed layer 2; R-14) / §2d"
  workset.seeded:
    "~/":
      user_key: true
      optional: skip_if_absent
      default: "(@workset.template/box/home)"
      note: "layer 3 — per-workset; the layer is SKIPPED when the source dir is
             absent (cf. workset.template)"
      spec: "§2a (seed layer 3; R-14)"

## ---------------------------------------------------------------------------
## PREF — requests (§2h; R-7 / R-7a / R-7b). NOT a key list: the family is
## pref.<target-key>, governed by the entries + filters below. A pref is a
## REQUEST consumed during resolution — not a value of its own; it lives in the
## file where it was written, NEVER mutates another settings file, and is
## re-applied on every resolution (concurrent boxes cannot fight).
## ---------------------------------------------------------------------------
pref:

  # THE ALLOWLIST — exactly two ENTRIES (§0's closed keyspace applies).
  # Membership alone is NOT sufficient: the three filters below still apply.
  allowlist:
    "system.agent":
      kind: single_key
      role: "SELECTION — 'I want to use this agent, by name.' The first thing a
             box on a non-default agent sets."
    "agent.*.**":
      kind: key_set               # written in R-22's glob notation (policy.glob):
                                  #   `*` = exactly ONE segment · `**` = the
                                  #   remaining tail, any depth
      role: "CONFIGURATION — values for that agent, targeting AGENT scope (a
             bare agent.<agent>.<key> in a box file would be an upward write;
             the pref is the mediator)"
      segment_validation: "the `*` segment is an AGENT NAME — INVALID unless a
                           VALID agent or `default`"

  # R-7b — stated here EXPLICITLY because the manifest GENERATES the validator:
  # the agent test is "is it a VALID agent", NOT "is it the ACTIVE agent".
  # `pref.agent.goose.x` while claude is active is LEGAL — pre-configuring an
  # agent you may switch to is allowed.
  agent_test: valid_agent_not_active_agent
  agent_test_spec: "§2h (R-7b)"

  # THREE INDEPENDENT FILTERS — ALL must pass.
  # Checker order: valid_key ∧ allowlist ∧ forbidden_tiers.
  filters:
    - valid_key                   # target matches a declared key or a declared
                                  #   PARAMETRIC FAMILY (§0: closed but not flat).
                                  #   VALIDITY, not EXISTENCE: a NEW name inside
                                  #   a family is legal
                                  #   (pref.agent.claude.env.BOOOOO). ⚑ NOT the
                                  #   BIND-SHAPED categories: bindings.{ro,rw}
                                  #   and masks since 2026-08-06c, and caches /
                                  #   seeded / common / synced since
                                  #   2026-08-07f, are each ONE TERMINAL key, so
                                  #   pref.<...>.bindings.rw.<anything> and
                                  #   pref.<...>.seeded.<anything> alike are
                                  #   INVALID — only the bare key is a target.
                                  #   The dotted form is a FAMILY only for
                                  #   env.<VAR> and secret_path.<VAR>.
                                  #   Fabrication still errors
                                  #   (pref.agent.zippity.wibble matches no
                                  #   family → §0 error).
    - allowlist                   # requestable in principle (the table above)
    - forbidden_tiers             # and not barred by any of:
                                  #   STRUCTURAL — the target must resolve
                                  #     STRICTLY EARLIER than the requesting
                                  #     level (a later-resolving key needs no
                                  #     pref: set it directly);
                                  #   CATEGORICAL — never meta.* / config.* /
                                  #     pref.* itself (meta is RO by contract —
                                  #     a pref targeting it would be a backdoor;
                                  #     config is the foundation;
                                  #     request-of-request has no termination
                                  #     argument. Meta VALUES still change
                                  #     downstream — only DIRECT targeting is
                                  #     barred);
                                  #   LOCATOR CLOSURE — below.
                                  #   The check returns a REASON, never a bare
                                  #   boolean.

  # LEGAL WRITE LEVELS — workset (L3.2) + box (L4.2) ONLY; never base, system
  # or agent. This is what BOUNDS the pref recursion, so it is a HARD rule, not
  # a convenience: `config set pref.<key> <value>` at any other scope RAISES —
  # never a silently-dead entry.
  levels: [workset, box]

  # LOCATOR CLOSURE (R-7a) — the TERMINATION guarantee, not tidiness: prefs are
  # applied once each, so the pass terminates PROVIDED no pref changes WHICH
  # FILES feed the cascade. The barred set is the transitive closure of the
  # cascade-input anchors' inputs — RATIFIED as TODAY'S HAND LIST; the
  # derivation is a POST-RATIFICATION item.
  locator_closure:
    - config.data
    - config.primary_workset
    - meta.workset.path
    - workset.boxes
    - meta.box.path
    - meta.box.name
    - workset.kuid
  # ⚑ R-7a's RECORDED WARNING (carried so the derivation item inherits it):
  #   "a naive derivation of this closure would capture system.agent and break
  #   the headline feature." The hand list and code's shorter literal list
  #   ({workset.boxes, workset.kuid}) are NOT in conflict — the other five are
  #   already barred by the CATEGORICAL tier (config.* / meta.*); the filters
  #   are independent.
  # Accepted consequence: workset.boxes stays SETTABLE in a workset FILE —
  #   only REQUESTING it from a lower level is barred.

  # VALUES ARE INSTALLED VERBATIM — INCLUDING present-None. A None pref lands
  # on the target key and is classified by the ORDINARY present-None rule:
  # OMIT for a bind / category / masks leaf (no mount / unmask), KEPT None for
  # a scalar leaf (consumer default) — so pref.system.agent: null requests the
  # NO-AGENT plain-shell box. The box's ONLY channel to drop something its agent
  # declares is still the pref, but since 2026-08-07f EVERY bind-shaped category
  # is dest-keyed, so the null moves INSIDE the value for all six:
  # `pref.agent.<agent>.<category>: {<box_dest>: null}` drops one destination and
  # `pref.agent.<agent>.<category>: null` omits the whole category. The dotted
  # `pref.agent.<agent>.<category>.<name>` spelling is INVALID for a bind-shaped
  # category; it survives only for the <VAR>-parametric env / secret_path. The
  # POWER is unchanged; only the spelling is. The pref layer
  # MUST NOT interpret emptiness AT ALL: present-None, terminal "", and the
  # COPY-disable sentinel all forward untouched (it must not become a FOURTH
  # place deciding what "empty" means).
  values_verbatim: true

  # A FAILED PREF IS AN ERROR — the launch FAILS rather than proceeding with a
  # partially-applied request; the error NAMES which key, at which level, and
  # WHY (forbidden target / not settable at this level / invalid value /
  # undeclared). Never a silent skip.
  failed_pref: error

  # Expansion order (for the generated resolver): each level's prefs expand at
  # the START of that level — L3.2 then L4.2, each expansion RECOMPUTING the
  # preceding levels — so BOX BEATS WORKSET on the same pref by assignment
  # order. RECOMPUTE, not delta; each level's prefs expand ONCE; pref.* keys
  # never participate in resolution as derivable keys.
  expansion: recompute_box_beats_workset

  spec: "§2h (R-7 / R-7a / R-7b)"

## ---------------------------------------------------------------------------
## NOT KEYS / RETIRED NAMES — recorded so nobody re-adds or fabricates them.
## ⚑ A fabricated key is very often a RETIRED name. This block is the defence:
##   `unknown_key: error` refuses it, and this table says WHAT TO USE INSTEAD.
## Names sourced from §2c/§2d/§3 rulings + the AS-IS audit
## (reference/keyspace-phase2/SUMMARY-key-lists.md, 2026-06-26f). ⚑ That audit is a
## MONTH old and many of its FINDINGS are since resolved — only its NAMES are
## imported here, each re-checked against the CURRENT spec.
## ---------------------------------------------------------------------------
not_keys:

  reserved_internal:              # NOT keys and may never BECOME keys — reserved
                                  # internal node names, protected here so they
                                  # cannot be re-claimed as keys (R-8 option 2 /
                                  # plan decision D-4)
    "binding_derivations": "INTERNAL reserved node inside the per-launch snapshot,
                            carrying the materialised binding each ABSTRACT
                            declaration derives. NOT a key, not user-addressable;
                            the closed head dispatch refuses it. Replaces the CUT
                            meta.derived.<declaration-key> family (R-8); the
                            materialisation requirement is unchanged. ENFORCED at
                            assembly: a file-borne top-level `binding_derivations:`
                            table is DROPPED at assembly with a warning
                            (settings_assemble._drop_upward_scopes; landed at the
                            B4 fix round, 2026-08-02 — B4-Editor S-3).
                            spec: §0 (TWO LAYERS — the reservation clause)"

  never_a_key:                    # plugin/descriptor variables or CLI-only surfaces
    "critical":     "PluginDescriptor field, passed function-to-function (2026-06-27)"
    "init_dirs":    "PluginDescriptor field (2026-06-27)"
    "agent.<agent>.critical":  "same — the namespaced form is equally NOT a key"
    "agent.<agent>.init_dirs": "same — the namespaced form is equally NOT a key"
    "images_conf":  "GENERATED storage.conf; INTERNAL bind, fixed location (D-M8)"
    "browser":      "CLI-only flag + BROWSER_WS_ENDPOINT; out-of-keyspace (D-M5)"
    "meta.box.helper_log": "workaround SPELLING that was NEVER a key (R-23/R-36) —
                            the key is box.bindings.ro (the entry at
                            $XDG_STATE_HOME/kanibako/helpers.jsonl); the brace form
                            @{meta.box.name} exists precisely so this spelling is
                            not needed (§2c; policy.reference_forms)"
    "config.handbook": "draft name REJECTED in favour of system.canon (R-36; §2g)
                        — the handbook root is the canon key's handbook/ subtree,
                        not a config.* key (fails §1's locate-and-load test)"

  illegal_shapes:               # shapes CODE currently accepts/spells that are
                                # NOT legal key shapes — recorded so the closed
                                # keyspace refuses them and the defect cannot be
                                # copied as precedent (Code Convention 0: an
                                # undiscriminated variant is NOT a key)
    "<scope>.bindings.<ro|rw>.<name>":
      status: illegal_shape
      note: "RETIRED 2026-08-06c (R-5/R-10). Each ARM is a TERMINAL key whose
             value is a BindMap keyed by box_dest; the inner dict's keys are
             DATA, not keyspace segments, so NOTHING may follow `bindings.ro` /
             `bindings.rw` in a key. This was a LEGAL, DECLARED shape until that
             date — 30 box-scope instances plus the agent-tier plugin overrides —
             so it is recorded here rather than merely deleted: code that still
             spells it must be REFUSED LOUDLY, naming the key, never silently
             re-interpreted as a dest. Applies at every scope, both arms, and to
             the pref form `pref.agent.<agent>.bindings.<ro|rw>.<name>`.
             Its default entries live at bind_default_entries."
      spec: "§2a (REPRESENTATION) / §0 (closed keyspace)"
    "<scope>.<caches|common|seeded|synced>.<name>":
      status: illegal_shape
      note: "RETIRED 2026-08-07f. Each of the four is now a TERMINAL key whose
             value is a BindMap keyed by box_dest; the inner dict's keys are DATA,
             not keyspace segments, so NOTHING may follow the category in a key.
             This was a LEGAL, DECLARED shape until that date — the six spec-named
             seed layers plus the three plugin credential instances plus every
             plugin-declared common/caches entry — so it is recorded here rather
             than merely deleted: code that still spells it must be REFUSED
             LOUDLY, naming the key, never silently re-interpreted as a dest.
             Applies at every scope, all four categories, and to the pref form
             `pref.agent.<agent>.<category>.<name>`. ⚑ This retires the KEY SHAPE
             only: `seeded` and `synced` are still COPIES (categories.*.kind).
             The retired VALUE form (the 3-element
             `name -> (host_src, box_dest[, options])` list, and a name-keyed
             sub-dict under the category) is refused by bindmap_shape.refuse_stale.
             The spec-named default entries live at category_default_entries;
             the plugin-declared ones at plugin_contributed."
      spec: "§2a (REPRESENTATION) / §0 (closed keyspace)"
    "agent.secret_path.<VAR>":
      status: illegal_shape
      note: "R-40 (RATIFIED as recommended): settings_categories.SECRET_KEY_RE
             spells its scope alternation `system|agent|workset|box` — a bare,
             UNDISCRIMINATED `agent.` scope token — where every sibling category
             regex uses the discriminated `agent\\.[^.]+` (_AGENT_SCOPE). The
             legal shapes are the scope-discriminated
             `agent.default.secret_path.<VAR>` and
             `agent.<agent>.secret_path.<VAR>` (§2a secret_path category ×
             categories.scopes); the bare form matches NO declared scope and is
             NOT a key. The constant is confirmed DEAD (zero consumers in src/,
             tests/, packages/ — packet C11), so this is record-not-behavior:
             the CODE FIX lands at the KeyKind rewrite (deferred; this entry
             is RECORD-ONLY)."
      spec: "§2a (secret_path; R-40)"

  renamed:                        # was a key; the NEW name is authoritative
    "box.crab":                "-> pref.system.agent (§2h) — chain: was renamed to
                                box.agent_name (D-M6), which R-3 then RETIRED"
    "box.agent":               "-> pref.system.agent (§2h) — same chain (D-M6, R-3)"
    "box.agent_name":          "-> pref.system.agent (§2h) (R-3, migration M-4) —
                                RETIRED outright; removes the last settable key at
                                the level a meta anchor derives from. R-31/R-32
                                respell the two derived values it anchored."
    "box.agent.<key>":         "-> meta.box.agent.<key> (RO read-back, R-4); a box
                                tweaks its agent via pref.agent.<agent>.<key> (§2h)"
    "system.default_agent":    "-> system.agent (R-2 — D-M2 SUPERSEDED 2026-07-29;
                                this line FLIPS the draft's inverted entry, which
                                refused the correct name)"
    "system.base_template":    "-> system.template (R-1; default moves
                                global/base_template -> global/template;
                                migration M-11)"
    "system.channels.commons": "-> system.channels.common (R-6; guest-path
                                migration M-9)"
    "workset.channels.commons": "-> workset.channels.common (R-6; migration M-9)"
    "<scope>.shared.<name>":   "-> an ENTRY of the terminal key <scope>.common
                                (R-5, category renamed 2026-07-29; host dirs
                                migration M-3). ⚑ The successor is NOT
                                `<scope>.common.<name>`: entry names are gone
                                since 2026-08-07f — see illegal_shapes"
    "box.vault_enabled":       "-> box.enable_vault (2026-07-04)"
    "box.mode":                "-> meta.box.mode (RO identity anchor; mode is identity)"
    "env_file":                "-> secret_path.<VAR>, promoted to a §2a category (2026-07-06)"
    "agent.<agent>.env_file.<VAR>": "-> agent.<agent>.secret_path.<VAR> (R-36; the
                                     namespaced twin of the bare env_file row)"
    "box.group_auth":          "-> box.auth.{global,workset}_enabled (2026-07-01)"
    "group_auth_on":           "-> box.auth.{global,workset}_enabled (2026-07-01)"
    "box.bootstrap_program":   "-> agent.default.bootstrap (multiplexer is agent-tier)"
    # ⚑ `agent.<agent>.transform` was HERE and is NOT a retired name — it is a LIVE
    #   DECLARED key (spec `agent.default.transform` / `agent.claude.transform | tweakcc`),
    #   re-declared by Jei 2026-08-08c. Its 2026-06-27 fold into `caches` was superseded.
    #   Removed from not_keys 2026-08-08e on his word: "It should not be in 'not_keys'."
    #   ⚑ Do NOT re-add it here: the 2026-06-27 fold is HISTORY, not the current model.
    "agent.<agent>.mode":      "-> meta.agent.<agent>.mode (non-editable key, Jei 2026-07-28)"
    "agent.<agent>.exec":      "-> meta.agent.<agent>.exec (non-editable key, Jei 2026-07-28)"
    "agent.default.auto_approve": "-> agent.default.access (R-41, 2026-08-01; values map
                                    true→full, false→restricted). A STORED one HARD-REFUSES
                                    the launch with a level-appropriate cure naming access
                                    and quoting the user's value through that mapping (RQ-2,
                                    ruled 2026-08-02 — an undeclared key is SILENT, and
                                    silence on a permission axis resolves PERMISSIVE)"
    "agent.<agent>.auto_approve": "-> agent.<agent>.access (R-41; same value mapping, same
                                    launch refusal)"
    "agent.default.default_agent": "-> system.agent (R-18 — MOVED from code_residue:
                                    the deferred code sweep is DONE; it is a
                                    RETIRED_FILE_KEY that hard-refuses with a cure
                                    naming system.agent)"
    "workset.meta.*":          "-> meta.workset.* (top-level meta namespace, 2026-06-29f)"
    "box.meta.*":              "-> meta.box.* (2026-06-29f)"
    "agent.<agent>.meta.*":    "-> meta.agent.<agent>.* (2026-06-29f)"

  deleted:                        # was a key; SUBSUMED, no same-named replacement
    "system.boxes":       "-> @workset.boxes (primary roots at @config.primary_workset)"
    "system.logs":        "-> @workset.logs"
    "system.vault_ro":    "-> @workset.vault_ro"
    "system.vault_rw":    "-> @workset.vault_rw"
    "system.instructions": "RETIRED 2026-07-28 (spec conformed to code) — the box guide ships
                            INSIDE the package under rom/ as the bible general chapter and
                            arrives via the bible general chapter bind at ~/canon/bible/general/
                            (§2c; path conformed to the canon-books model, D-8);
                            no key, no repoint"
    "system.templates_stamp": "RETIRED (R-38, Jei 2026-08-01) — was a LIVE, UNDECLARED key in
                               shipped code (a §0 violation: read/written by the setup gate,
                               never declared). Retired, not declared: delete the
                               reader/writer/gate (code step B8); a stored leaf is
                               orphaned-ignored (projects:-section
                               precedent). Protection folds into R-34's setup_completed
                               version-marker mechanism (content⇒FCV nudge · structural⇒BCV
                               hard block · CI digest-vs-previous-tag requires the bump).
                               ACCEPTED LOSS: same-version dev-build drift detection.
                               ⚑ load-bearing rider at the code step: SETUP_BCV→1.8.0 in the
                               SAME change (RULINGS R-38)."
    "meta.runtime.ws_settings": "CUT (R-36) — 'no longer needed (unified path)': the §1A
                                 meta.runtime block is ws_root/ws_name/project_type ONLY (the
                                 collapse outputs it briefly sat beside became their own
                                 meta.assembly group on 2026-08-09);
                                 meta.workset.settings spells @meta.workset.path/settings.yaml
                                 directly (the SINGLE-SOURCE list). The draft's live key
                                 entry was a clause-4 violation and is deleted."
    "meta.box.project_dir": "RETIRED (R-36) — there is no project-dir key: the project dir
                             is @meta.workset.path (standalone) or meta.box.workspace
                             (primary) (§2c)"
    "box.bindings.ro.canon_bible": "RETIRED 2026-07-31 (R-36) — the whole-dir bible bind;
                                    undeclared from that edit forward. The bible ships as
                                    per-chapter INTERNAL binds (canon_bible_*, §2c).
                                    ⚑ DOUBLY DEAD since 2026-08-06c (R-5/R-10): the whole
                                    NAME-BEARING binding spelling is gone, so this key
                                    could not exist even if the bind returned. The bible
                                    chapters are now dest-keyed ENTRIES of box.bindings.ro
                                    (~/canon/bible/*) — see bind_default_entries."
    "box.bindings.ro.canon_handbook": "RETIRED 2026-07-31 (R-36) — the whole-dir
                                       handbook-base bind; the handbook is per-chapter
                                       binds (canon_hb_*, §2c) sourced from the
                                       <scope>.canon keys (R-9).
                                       ⚑ DOUBLY DEAD since 2026-08-06c — same reason as
                                       box.bindings.ro.canon_bible above; the chapters are
                                       entries at ~/canon/handbook/*."
    "config.global":      "ELIMINATED 2026-06-29f; children inline @config.data/global/..."
    "resource.<path>":    "DEAD; subsumed by the category keys (D-M7)"
    "resource_overrides": "DEAD (0 callers)"
    "start_mode":         "fully covered by continue_mode + access (§3)"
    "autonomous":         "DEAD; autonomy is the -A/-S launch flags"
    "agent.<agent>.start_mode":  "DEAD (stored, no launch reader) — see start_mode"
    "agent.<agent>.autonomous":  "DEAD — see autonomous"
    "agent.default.start_mode":  "DEAD — see start_mode"
    "agent.default.autonomous":  "DEAD — see autonomous"
    "required":           "the non-overridable ceiling TIER was CUT (Jei 2026-06-29f)"
    ".env":               "global/workset/project .env FILES were DROPPED (2026-06-27) — a
                           duplicate shared channel for env; use <scope>.env.<VAR> instead"
    "env.<VAR>":          "the BARE, UNSCOPED env KEY spelling — RETIRED (R-39): it wrote the
                           .env files above, which are themselves dropped. The env family is
                           SCOPED (§2a), so use <scope>.env.<VAR>; the three CONFIG nouns
                           (box / workset / system) refuse the bare form BY NAME with that
                           cure at set, get and reset.
                           ⚑ The `agent` NOUN is OUTSIDE that refusal and always was: its
                           verbs take the key TAIL under an already-named node, not a whole
                           key, so `agent set <node> env.FOO=bar` routes through
                           agent_file_route() and writes the DECLARED agent.<node>.env.FOO.
                           No bare key is ever formed there, and nothing is refused"
    "agent.<agent>.<anyleaf>": "free-form leaf passthrough — the keyspace is CLOSED (spec §0)"

  code_residue:                   # appeared in CODE only, never spec-sanctioned
    "system._boxes":            "surrogate for the DELETED system.boxes"
    "system._primary_vault_ro": "residue surrogate"
    "system._primary_vault_rw": "residue surrogate"
    "system._primary_logs":     "residue surrogate"
    "agent.<agent>.binding.<key>": "singular host-source-ONLY override; the spec has
                                    ONLY the plural ARMS bindings.<ro|rw>. ⚑ RE-TENSED
                                    2026-08-06c: the spec had the name-bearing
                                    bindings.<ro|rw>.<name> form until R-10 dropped entry
                                    names; NEITHER the singular residue NOR the retired
                                    plural name form is a key now — each arm is TERMINAL
                                    and its entries are keyed by DESTINATION"
    # (the two `access` code_residue entries are GONE — R-41 made the name a real
    #  key; see agent.default.access / agent.<agent>.access above)
    "agent.<agent>.name":       "flat identity form -> meta.agent.<agent>.name"
    # (agent.default.default_agent MOVED to not_keys.renamed — R-18: the sweep is done)
    "agent.default.provider":   "NOT a key at the DEFAULT tier — `provider` is a
                                 PLUGIN-CONTRIBUTED member (goose's descriptor),
                                 legal only as agent.<agent>.provider; see
                                 plugin_contributed (R-37)"
    "agent.default.binding.<key>": "singular residue — see agent.<agent>.binding.<key>"
    # (agent.<agent>.provider MOVED to plugin_contributed — R-37: goose declares it
    #  via setting_descriptors(), so it IS a legal descriptor-contributed member)
    "paths_project_toml":       "residue field"
    "project.*":                "the [project] table is a pre-box-rename artifact
                                 (read-compat ONLY: project.enable_vault -> box.enable_vault)"
    "resolved.*":               "core-derived [resolved] table, not keys"

## ---------------------------------------------------------------------------
## PLUGIN-CONTRIBUTED KEYS (R-37, R-15).
## Agent-SPECIFIC keys (agent.claude.* / agent.codex.* / agent.goose.*) are
## deliberately ABSENT from the core registry: §0 "Agent specifics are
## PLUGIN-declared … never hardcoded in core".
## ---------------------------------------------------------------------------
plugin_contributed:
  namespace: "agent.<agent>.*  and  meta.agent.<agent>.*"
  source: PluginDescriptor
  validated_against: policy

  # R-37 (RATIFIED): the SHAPE/MEMBER split. The MANIFEST declares the plugin
  # key SHAPE (the agent.<agent>.<key> contract + the category families at the
  # agent leaf) and the VALIDATION RULES; the DESCRIPTORS supply the MEMBERS,
  # unioned into the valid agent-leaf set at load
  # (settings_keyspace descriptor union) and validated against the SAME rules
  # as core keys. A descriptor-declared leaf (e.g. agent.goose.provider) is
  # therefore a LEGAL key — see `member_census` below and the code_residue move.
  shape: manifest_declares
  members: descriptors_supply
  # ⚑ THE CONFORMANCE REQUIREMENT (R-37, stated here because the manifest
  # generates the conformance test): conformance MUST consult the plugin
  # DESCRIPTORS when validating plugin keys — a conformance pass that reads
  # ONLY this file will FALSE-POSITIVE on EVERY plugin key (each
  # descriptor-declared member would be reported as an undeclared key).
  conformance_must_consult_descriptors: true
  shape_spec: "§0 (universal vs agent-specific) / §2d (R-37)"

  # R-15 (RATIFIED, follows R-10): the spec-NAMED plugin `synced` credential
  # entries live HERE, not in the core table — they are PLUGIN-declared (each is
  # materialised from its plugin's cred_files descriptor entries).
  # ⚑ DEMOTED 2026-08-07f, same class as the core seed layers: `agent.<a>.synced`
  # is a TERMINAL key and these are its DEFAULT ENTRIES, indexed by DESTINATION.
  # `agent.claude.synced.credentials` and its two siblings are NOT keys — the
  # retired names are kept in the row headings ONLY as `was:` provenance.
  # ⚑ Dests are GUEST paths, RESOLVED to the host store when the copy runs (§0 /
  # R-20; respelled 2026-08-08, were "@meta.box.path/home/..."). `synced` is and
  # remains a COPY category — the respell changed the SPELLING, never the delivery.
  # ⚑⚑ EACH ROW BELOW NOW READS `X | (X)` AND IS *NOT* AN IDENTITY ENTRY (contrast
  # the genuine identity `caches` mounts at §2d, where dest == source host-side):
  # the KEY's `~` is the GUEST home, element 0's `~` is the HOST user's home.
  category_default_entries:
    agent.claude.synced:
      "~/.claude/.credentials.json":
        was: "agent.claude.synced.credentials (name retired 2026-08-07f)"
        user_key: true
        default: "(~/.claude/.credentials.json)"
        note: "SYNC, mtime-gate, FILTERED (transform_cred merges claudeAiOauth).
               COPY dest = GUEST path, resolved to the box store when the copy runs
               (§0 / R-20). NOT an identity entry — the key's `~` is the GUEST
               home, element 0's is the HOST user's. Suppressed when the box shares
               no credentials (auth tier private, D-M4)."
        spec: "§2d (claude; R-15)"
    agent.codex.synced:
      "~/.codex/auth.json":
        was: "agent.codex.synced.auth (name retired 2026-08-07f)"
        user_key: true
        default: "(~/.codex/auth.json)"
        note: "SYNC, mtime-gate, filtered=False (Q2: allowlist iff install-bound
               fields). NOT an identity entry — the key's `~` is the GUEST home,
               element 0's is the HOST user's."
        spec: "§2d (codex; R-15)"
    agent.goose.synced:
      "~/.config/goose/secrets.yaml":
        was: "agent.goose.synced.secrets (name retired 2026-08-07f)"
        user_key: true
        default: "(~/.config/goose/secrets.yaml)"
        note: "SYNC, mtime-gate, chmod 0600. NOT an identity entry — the key's `~`
               is the GUEST home, element 0's is the HOST user's."
        spec: "§2d (goose; R-15)"

  # MEMBER CENSUS — INFORMATIVE ONLY, a point-in-time record (2026-08-01, the
  # shipped descriptors at manifest HEAD 63ea33c). The AUTHORITATIVE member
  # list is ALWAYS the installed descriptors (that is R-37's whole point);
  # this census exists so a reader knows what class of thing descriptors
  # contribute, and MUST NOT be used as a validation source.
  # ⚑ The dotted `synced.credentials` / `common.{plugins,cache}` / `caches.transform`
  # spellings below are the PRE-2026-08-07f entry NAMES, kept because the census is
  # a point-in-time record of what each plugin contributes. They are NOT keys: each
  # is an ENTRY of the terminal dest-keyed category key. Do not read a key spelling
  # off this census.
  member_census:
    claude: "synced.credentials · common.{plugins,cache} · binary binds
             {share, launcher} (agent_critical) + managed_pointer (kickoff seed)
             · settings {model (flag), endpoint (env ANTHROPIC_BASE_URL)}
             · caches.transform (binary-patch cache)"
    codex: "synced.auth · binary bind {binary} + managed_pointer · settings
            {model (flag), endpoint (SettingArg; config-file delivery via the
            config.toml [model_providers] projection, not env)}"
    goose: "synced.secrets (+ descriptor-only sync members config.yaml
            [filtered: GOOSE_MODE preserved] and custom_providers/ — descriptor
            MEMBERS, not spec-named instances) · binary bind {binary} +
            managed_pointer · settings {provider (env GOOSE_PROVIDER), model
            (env GOOSE_MODEL), endpoint (env OPENAI_HOST)} — provider/model
            default '' (never pinned by kanibako)"
  member_census_spec: "§2d (claude/codex/goose sections) / plugin *-defaults.yaml"

  # `agent.<agent>.provider` — MOVED OUT of not_keys.code_residue (R-37): goose
  # declares `provider` through setting_descriptors() and the loader unions
  # descriptor keys into the valid agent-leaf set, so agent.goose.provider IS a
  # legal key today — the old residue entry asserted otherwise and was wrong.
  # Core still declares NO standard provider key (it stays out of `keys:` and
  # out of the agent.default.* tier); legality flows from the descriptor, which
  # is exactly the shape/member split above.
  provider_disposition: "agent.<agent>.provider = descriptor-contributed member
                         (goose); NOT a core key; agent.default.provider remains
                         not-a-key (no default-tier declaration — see
                         code_residue retext)"
  provider_disposition_spec: "§2d (goose section; R-37)"
