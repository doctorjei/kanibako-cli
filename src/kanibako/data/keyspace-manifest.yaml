    spec: "§2c (ALL PROJECTS) / §2a (R-5/R-10)"
  box.bindings.rw:
    scope: box
    type: dict
    set: file                     # YAML only — matches the category (cli_set: false)
    default: {}                   # the documented entries live in bind_default_entries
    note: "TERMINAL dest-keyed BindMap, dict[box_dest -> [host_src] |
           [host_src, options]]; the inner keys are DATA, not keyspace (§2a
           bindings category)"
    spec: "§2c (ALL PROJECTS) / §2a (R-5/R-10)"
  box.masks:
    scope: box
    type: dict
    set: file                     # YAML only — matches the category (cli_set: false)
