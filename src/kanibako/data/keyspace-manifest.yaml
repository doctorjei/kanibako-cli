    type: path
    set: cli+file
    default: "$XDG_RUNTIME_DIR/kanibako"
    note: "helper sockets; XDG_RUNTIME_DIR has NO spec default — fall back + WARN"
    spec: "§2g / §1"
  system.agent:
    scope: system
    type: str
    set: cli+file
    default: null                 # (unset)
    note: "the CURRENT agent's NAME — starts as, and holds, the default
           until/unless changed. Behavior, not a path. RENAMED from
           system.default_agent (R-2 — D-M2 SUPERSEDED 2026-07-29: the one-char
           clash expired when the agent store dir became config.agents). A box
           or workset requests a different one with pref.system.agent (§2h);
           the CLI --agent beats both (§1A). Unset/<None> ⇒ NO-AGENT
           plain-shell box (D-M6)."
    spec: "§2g (R-2)"
  system.setup_completed:
    scope: system
    type: version_marker          # R-34: the VALUE is the version that completed setup
    set: cli+file
    default: null                 # unset ⇒ setup has never run; the bool `false` spelling is DEAD
    note: "PERSISTS, user-resettable; drives the 5-band staleness gate against
           SETUP_BCV/SETUP_FCV. Since R-38 also the packaged-template protection:
           template CONTENT change ⇒ FCV bump (nudge) · STRUCTURAL change ⇒ BCV
           bump (hard block); CI compares the packaged-template digest against
           the previous tag and REQUIRES the bump."
    spec: "§2g (R-34 + R-38)"
  system.auth.share_allowed:
    scope: system
    type: bool
    set: cli+file
    default: true
    note: "the single host-wide GLOBAL-share gate; top of the auth 3-tier chain"
    spec: "§1 / §2b (auth-level 2026-07-01)"

  ## ---- LAYER 2: workset.* settings keys (§2c/§2e) -------------------------
  ## Mode-dependent: PRIMARY + NAMED share the ALL WORKSETS definitions.

  # Per-mode defaults CORRECTED as ONE BLOCK (R-26..R-30; R-30's entry lives in
  # the meta.* block below): NOT all standalone sub-keys are <None> — the
  # blanket claim was false (spec §2e, corrected 2026-07-29). THE SPEC'S REASON
  # rides here: the per-mode variation lives in meta.box.path AND NOWHERE
  # DOWNSTREAM, which is what lets meta.box.home and every rooted box key be a
  # SINGLE declaration for every mode. Standalone's SET values are
  # what give a lone box a real @meta.box.path to root against.
  workset.workspaces:
    scope: workset
    type: path
    set: cli+file
    default: {primary: null, named: "@meta.workset.path/workspaces",
              standalone: "@meta.workset.path/workspace"}
    note: "standalone: just the one box; changeable from workset level (R-26).
           ⚑ PRIMARY arm: the spec default is null, but the CODE composes and
           HONORS a `workspaces` leaf at primary (a set value repoints member
           workspace composition). Behavior-preserving divergence — do NOT
           'conform' the code to the null (that relocation would be an M-3-shaped
           migration, not a conformance fix). B2-Editor S-1, 2026-08-02."
    spec: "§2c / §2e (R-26)"
  workset.boxes:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/boxes", named: "@meta.workset.path/boxes",
              standalone: "@meta.workset.path/box_data"}
    note: "standalone: just the one box; changeable from workset level (R-27)"
    spec: "§2c / §2e (R-27)"
  workset.logs:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/logs", named: "@meta.workset.path/logs",
              standalone: "@meta.box.path"}
    note: "standalone: the box root IS the log home (R-28); the helper-log bind
           stays a SINGLE row for all modes because this key carries the variation"
    spec: "§2c / §2e (R-28)"
  workset.vault_ro:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/vault/ro"
    note: "ALL PROJECTS — defined ONCE for EVERY mode (R-29); only the box BIND
           differs per mode (the per-box /@meta.box.name subdir a lone box does
           not need)"
    spec: "§2c (ALL PROJECTS; R-29)"
  workset.vault_rw:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/vault/rw"
    note: "ALL PROJECTS — defined ONCE for EVERY mode (R-29); see vault_ro"
    spec: "§2c (ALL PROJECTS; R-29)"
  workset.canon:
    scope: workset
    type: path
    set: cli+file
    default: "@meta.workset.path/canon"
    note: "the WORKSET's CANON CONTRIBUTION ROOT; its handbook/ subtree supplies
           the handbook's WORKSET chapter, bound at ~/canon/handbook/workset/.
           UNIFORM IN EVERY MODE (ALL PROJECTS) — deliberately NOT per-mode:
           chapter binds are SKIP-IF-ABSENT (§2c), which is what lets
           workset.canon/box.canon avoid per-mode <None> carve-outs entirely.
           The workset.template <None> carve-out does NOT transfer (a template
           seeds FUTURE boxes; a handbook is directives for the box that exists
           now — same shape, different reason)."
    spec: "§2c (ALL PROJECTS; R-9)"
  workset.registry:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/registry.yaml",
              named: "@meta.workset.path/registry.yaml", standalone: null}
    note: "PER-WORKSET box registry; a NORMAL key, NOT a config-locate key.
           Its entry KEYS yield the RO meta.box.name anchors."
    spec: "§2c (2026-07-04)"
  workset.template:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@meta.workset.path/template",
              named: "@meta.workset.path/template", standalone: null}
    note: "seed layer 3; the layer is SKIPPED when the source dir is absent
           (ruled 2026-07-09, was <None>). standalone: <None> — a lone box has
           no template tier (the spec's STANDALONE block states it explicitly:
           'workset.{registry,template} | <None>'; per-mode shape ruled F-1/5a,
           2026-08-02)"
    spec: "§2c / §2a (F-1/5a)"
  workset.kuid:
    scope: workset
    type: str
    set: cli+file
    format: "Crockford-base32 25-bit = 24 data + 1 parity → 5 chars, lowercased"
    default: {primary: "00000", named: "00000", standalone: "<generated at creation>"}
    spec: "§2c (2026-07-04)"
  workset.skip_kuid_check:
    scope: workset
    type: bool
    set: cli+file
    default: true
    note: "default true = the advisory 'invalid KUID' warning is opt-in strictness"
