## ---------------------------------------------------------------------------
## POLICY — the rules of the keyspace. Every field traces to a ratified clause.
## No knob without a clause.
## ---------------------------------------------------------------------------
policy:

  # Override PRECEDENCE. Box wins. NOT the same axis as containment below.
  # AUTHORITY TIERS — the actual sources of a value, in precedence order:
  cascade: [base, system, agent, workset, box]
  cascade_spec: "§2 (authority tiers), as clarified by Jei 2026-07-27"

  # R-17: the manifest carries BOTH forms — one alone generates the wrong
  # resolver. The IMPLEMENTATION BRACKET writes the agent tier's intra-tier
  # fallback as an explicit linear level; §2 rules this EQUIVALENT for scalars
  # AND for per-ENTRY category merges (`_MISSING` is tested per entry key — no nested
  # mini-cascade). Do NOT count agent.default as a separate authority level.
  # Token mapping: the spec (§2) spells the active-agent level `agent.<active>`; this file spells it `agent.active`.
  cascade_bracket: [base, system, agent.default, agent.active, workset, box]
  cascade_bracket_spec: "§2 (FULL bracket; R-17)"

  # `agent.default` is NOT an authority tier. It is the agent tier's INTRA-TIER
  # FALLBACK: the values automatically part of EVERY agent unless overridden.
  #   agent tier value = agent.<active>.<key> if provided, else agent.default.<key>
  # [Jei 2026-07-27: "It's not really its own level; rather, those are the values
  #  until and unless the plugin provides a different value."]
  agent_tier_fallback: "agent.<agent>.<key> -> agent.default.<key>"
  agent_tier_fallback_spec: "§2d; clarified Jei 2026-07-27; R-17 ratified the framing"

  # (R-17 also RESOLVES the draft's "SPEC RECONCILIATION NEEDED" flag that stood
  #  here: the spec ruled the fallback framing 2026-07-27 and the flag is DELETED.)

  # PARAMETRIC EXPANSION — makes the closed set closed WITHOUT enumerating it.
  # The keyspace is closed but NOT flat: these rules generate the legal key set.
  parametric_expansion:
    - "every agent.default.<key> ALSO exists as agent.<agent>.<key> (same type,
       same default, resolved via agent_tier_fallback)"
    - "every category in `categories` exists at every scope in categories.scopes"
    - "meta.box.agent.<key> MIRRORS (RO) the ACTIVE agent's whole subtree (§2b;
       R-4 — the settable box.agent.<key> form is RETIRED; a box tweaks its
       agent via pref.agent.<agent>.<key>, §2h)"
  parametric_expansion_spec: "§2a / §2b / §2d"

  # The baked-in code defaults are NOT a tier either — they are each key's `default:`
  # field below, which IS the defaults source §2a's assemble step reads.

  # GLOB CONVENTION (R-22) — the notation a key FAMILY/pattern is written in
  # (the §2h pref allowlist is written in it, so it cannot be generated without
  # this convention being data here).
  glob:
    "*": one_segment          # matches exactly ONE segment
    "**": remaining_tail      # matches the remaining tail at any depth.
                              # ONE-or-more by construction, not by rule: the
                              # separator is part of the pattern, so a
                              # zero-length tail on `agent.*.**` would yield the
                              # malformed `agent.foo.` (trailing dot).
  glob_spec: "§0 (GLOB CONVENTION; R-22)"

  # CONTAINMENT. Governs WHERE a key may be WRITTEN and which way an @-ref points.
  # Orthogonal to cascade (§0: "Distinct from the cascade").
  containment: [system, agent, workset, box]      # system ⊃ agent ⊃ workset ⊃ box
  containment_spec: "§0 (directional view/set)"

  write_rule: command_scope_ge_key_scope    # may write own scope + scopes it CONTAINS
  write_rule_spec: "§2a (scope-direction guard); R2 2026-06-29 + Jei 2026-07-02"

  ref_direction: up_only          # @-refs view UP (read-only); never point DOWN
  ref_direction_spec: "§0"

  # REFERENCE FORMS (R-23) — how an @-ref is SPELLED. The bare form is the
  # normal spelling; braces exist because the bare reference-name pattern is
  # GREEDY over dot-separated segments (a bare `@meta.box.name.jsonl` parses the
  # ref name as `meta.box.name.jsonl`, swallowing the extension, resolving
  # ABSENT, and coercing to "" — silently yielding a path with no filename).
  reference_forms:
    bare: "@a.b.c"              # UNCHANGED, the normal spelling
    braced: "@{a.b.c}x"         # delimits the ref name explicitly so a LITERAL
                                # SUFFIX may follow: resolves ref a.b.c, appends x.
                                # Needed only where the character after the ref
                                # would otherwise be eaten by the name (`.`, and
                                # any other segment-legal character).
    equivalence: "both forms resolve identically where both are expressible"
    positions: "WHOLE-VALUE and EMBEDDED alike; set-time validation treats a
                dangling braced ref exactly as a dangling bare one"
    motivating_row: "the helper-log bind — box.bindings.ro entry at
                     $XDG_STATE_HOME/kanibako/helpers.jsonl, source
                     (@workset.logs/@{meta.box.name}.jsonl); the retired workaround
                     SPELLING meta.box.helper_log was never a key
                     (not_keys.never_a_key; R-23/R-36). ⚑ The former entry NAME
                     `helper_log` is gone with all binding names (2026-08-06c R-10)."
  reference_forms_spec: "§2c (BRACE FORM `@{name}`; R-23, ruled 2026-07-30b)"

  enforce_at: resolve             # containing-scope key in a lower file is DROPPED + warned
  enforce_at_spec: "§0 (clause 4 bless, Jei 2026-07-02)"

  read_verbs:                     # clause 5
    get: stored_at_scope          # what THIS scope's file says; else "(not set)"; never fabricate
    get_effective: cascade        # what will actually apply
  read_verbs_spec: "§2a (clause 5 bless, Jei 2026-07-02)"

  # Files store entries UNRESOLVED — no code path writes a resolved value back.
  files_store_unresolved: true
  files_store_unresolved_spec: "§0"

  # TUPLE DIRECTION (R-20) — every pair is (source, destination), left→right.
  # ONE DEST SPACE, TWO DELIVERIES (2026-08-08): the destination is a GUEST path
  # for EVERY bind-shaped category. For a MOUNT that is what a mount is for — a
  # bind always carries an explicit in-box location. For a COPY the guest path is
  # the SPELLING; the copy is RESOLVED to the host store WHEN IT RUNS. A copy runs
  # BEFORE any guest exists (the box seed happens at `create`), so it can only ever
  # write host-side — which is precisely why the resolution step exists.
  # ⚑ "copies write into the guest" is FALSE. `kind: copy` is unchanged.
  tuple_direction: source_then_destination
  tuple_dest_space:
    mounts: guest               # bindings.ro · bindings.rw · caches · common
                                # (EVERY bind-shaped category is dest-KEYED since
                                #  2026-08-07f — masks and bindings.{ro,rw} from
                                #  2026-08-06c, caches/common/seeded/synced from
                                #  2026-08-07f. The dest is the dict KEY, not a
                                #  tuple element.)
    copies: guest               # seeded · synced — SPELLED guest, RESOLVED to the
                                #  host store when the copy runs (2026-08-08; was
                                #  `host` until then).
  tuple_direction_spec: "§0 (Tuple direction; R-20, ruled 2026-07-30)"

  # -------------------------------------------------------------------------
  # TWO LAYERS (R-19) — the categories are NOT peers; `bindings` is the SOURCE
  # OF TRUTH and the rest EXTEND it. This classification + the collision table
  # below REPLACE the retired flat D-B1 authority order (`category_precedence`)
  # — superseded 2026-07-29; the runtime already implements this model
  # (M-7, _RULE_CHANGE_RELEASE = "1.8.0"), so R-19 changes no behavior.
  # -------------------------------------------------------------------------
  category_layers:
    bindings.ro: concrete       # a mount is emitted from NOTHING ELSE —
    bindings.rw: concrete       #   this is what makes bindings the source of truth
    masks: concrete_separate    # a COUSIN of bindings.{ro,rw}, not a sibling:
                                #   bindings.* says PUT THIS HERE, masks says
                                #   NOTHING MAY BE HERE. Different shape (dest-
                                #   keyed 3-state), different conflict rule.
    common: abstract            # ROOTED declarations (declaration_roots below)
    caches: abstract            #   that EXTEND bindings.rw. Still real, declared
    seeded: abstract            #   keys — TERMINAL and dest-keyed since 2026-08-07f,
                                #   and YAML-only (cli_set: false); seeded derives a
                                #   COPY, not a mount.
    synced: derived             # derives a binding PLUS extra lifecycle (file
                                #   COPY, credential-delivery gate, inode-swap
                                #   writeback); takes NO root — both sides fully spelled.
  abstract_extends: bindings.rw
  # The derived binding is MATERIALISED beside the declaration (--effective shows
  # BOTH, so a user can see WHY a mount exists) — but the derivation is NOT a
  # key: it rides in the launch snapshot as the reserved internal node
  # `binding_derivations` (see not_keys.reserved_internal; R-8).
  category_layers_spec: "§0 (TWO LAYERS; R-19)"

  # CATEGORY COLLISIONS (R-19) — keyed on the resolved `box_dest`, NEVER on an
  # entry name. ⚑ THERE ARE NO ENTRY NAMES LEFT in any bind-shaped category:
  # bindings.{ro,rw} lost theirs 2026-08-06c (R-10) and caches/seeded/common/
  # synced lost theirs 2026-08-07f. All six are dest-keyed maps, so a
  # same-spelling duplicate inside ONE map at ONE level is now structurally
  # impossible. The resolved-box_dest check below is NOT thereby
  # removed and MUST STAY — files store entries UNRESOLVED
  # (policy.files_store_unresolved), so `@meta.box.path/home` and a literal
  # spelling of that same path are two distinct dict keys resolving to ONE
  # destination, and the ro/rw arms are two separate maps. Dest-keying SIMPLIFIES
  # the check; it does not eliminate it.
  category_collisions:
    keyed_on: resolved_box_dest
    table:
      - case: "bindings.{ro,rw} vs bindings.{ro,rw} at one dest"
        outcome: error
        qualifier: "always — any scope, any mode. ro/rw is the serious case: two
                    bindings at one dest disagreeing on MODE is a semantic
                    disagreement, not just a source disagreement — silently
                    picking one hands the user a read-only mount where they
                    expected writable, invisibly."
      - case: "masks at a dest a binding occupies"
        outcome: override
        qualifier: "by design — hiding a bound path is the whole job"
      - case: "an abstraction EXTENDING onto a dest the base already occupies"
        outcome: error
        qualifier: "refuse the EXTENSION. The explicit bindings.* are the BASE
                    and abstractions apply AFTER, so the explicit binding
                    survives and the colliding extension is what is refused —
                    'I wrote it down literally' wins. The error names the
                    extending entry, the occupant, and the dest."
      - case: "abstraction vs abstraction, DIFFERENT scopes"
        outcome: scope_precedence
        qualifier: "silent"
      - case: "abstraction vs abstraction, SAME scope (same or different category)"
        outcome: proceed_and_warn
        qualifier: "proceed on the existing ordering + WARN, EVERY LAUNCH (not
                    deduplicated, not once-ever — a same-scope collision is a
                    real ambiguity and stays visible until fixed)"
        winning_scope_qualifier: "The warn applies to the WINNING scope's own
                    ambiguity: a LOSING scope's internal tie is wholly masked by
                    the cross-scope rule above — its 'winner' changed nothing —
                    and warning about a decision with no consequence trains the
                    user to ignore the warning that matters. (Qualified 2026-07-31.)"
    # With conflicts strict, present-None-ing the inherited entry and then
    # declaring the new one is the ONLY way to change what occupies a dest.
    # That is the non-obvious part — so the refusal must teach it.
    error_text_must_point_at: suppress_then_add
  category_collisions_spec: "§0 (Category collisions; R-19, qualified 2026-07-31)"

  # The assembler's two reconciliations — the halves of D-B1 that STAND (its
  # flat authority ORDER is what R-19 retired).
  category_reconcile:
    nested_paths: deepest_wins        # depth-ordered, matches podman mount depth-sort
    copies: [seeded, synced]          # file COPIES, not mounts; mounts physically
                                      #   shadow a copied file at the same path
                                      #   regardless of order
    synced_vs_binding_same_dest: error   # a copy can't override a live mount —
                                         #   the assembler flags a config error,
                                         #   not a silent no-op
  category_reconcile_spec: "§0 (Two reconciliations for the assembler)"

  # Collision-safety floor on the resolved data structure.
  # R-25 (RECORD, acknowledged 2026-08-01): checked at ratification — this
  # entry, spec §0 and code AGREE; code pins the agreement at import time
  # (settings_keyspace asserts equality with settings_store._RESERVED_KEY_NAMES).
  reserved_leaf_names: [get, keys, values, items, pop, popitem, setdefault,
                        update, clear, copy, fromkeys]
  reserved_dunder: true             # a leaf key may not match __x__
  key_match: case_sensitive
  reserved_spec: "§0 (Reserved key names) / §2a (R-25: recorded as checked)"

  # XDG: use the env var iff set AND absolute, else the spec default. ONE canonical
  # map builder supplies $XDG_* to EVERY host-side resolution context.
  xdg:
    canonical_builder_required: true
    defaults:
      XDG_DATA_HOME: "~/.local/share"
      XDG_CONFIG_HOME: "~/.config"
      XDG_STATE_HOME: "~/.local/state"
      XDG_CACHE_HOME: "~/.cache"
      XDG_RUNTIME_DIR: null           # NO spec default — fall back + WARN, never silent
    box_side_deferred: true           # host pass MUST NOT expand a box-side $XDG/~
    escapes:                          # deferred residue escape contract
      carried_verbatim: ['\$', '\~', '\\']
      unescaped_by_host: ['\@']
  xdg_spec: "§1 (clause 3′ bless, Jei 2026-07-02)"

  # CLI LEVEL (§1A; R-11): the command line is its OWN level — the highest, above
  # every settings file and every pref. ANY flag that shadows a key overrides that
  # key for the launch (a GENERAL rule, not a carve-out for particular flags).
  cli_level:
    level: own_highest              # NOT a cascade scope and NOT a pref: a separate
                                    #   input level outranking every settings file
                                    #   AND every pref
    level_spec: "§1A (R-11)"
    generality: any_shadowing_flag  # the flag table below ENUMERATES the declared
                                    #   instances; it does not LIMIT the rule
    generality_spec: "§1A (R-11)"
    # Per-launch CLI flags are EPHEMERAL: override for that launch, never mutate
    # an EXISTING stored value (create_exception below is the ONE exception).
    # Absorbed from the former top-level `cli_flags_ephemeral` field — one
    # spelling of one policy.
    flags_ephemeral: true
    flags_ephemeral_spec: "§1A (Jei ratified 2026-07-08)"
    # CREATE EXCEPTION (R-11a, Jei 2026-08-01): at box CREATION only, a shadowing
    # flag's value PERSISTS — it INITIALIZES the box's stored config (e.g.
    # `create -i` durably writes box.image). Ephemerality governs every other
    # invocation; ALL shadowing flags act UNIFORMLY; create is the ONLY exception.
    create_exception: true
    create_exception_spec: "§1A (CREATE EXCEPTION)"
    # PROJECTED-SURFACE EXCEPTION stands as a STRUCTURAL CLASS RULE (R-11a
    # collision RULED (i)) — not counted as a flag exception; where it applies it
    # WINS over the CLI level (-S/-A; -M barred from the codex projection resolve).
    # Backlogged fix: per-launch idempotent projections would dissolve it.
    projected_surface_exception: structural_class_rule
    projected_surface_exception_spec: "§1A (PROJECTED-SURFACE EXCEPTION)"
    # THE WIRED-FLAG TABLE AS DATA (R-11). `status:` is the A4-time truth:
    #   wired                      — installed at its canonical key name, level-
    #                                tagged, inside the resolve (settings_cli_level)
    #   pending_wire               — RULED a CODE GAP (R-11a(a)): the spec's general
    #                                rule stands; wiring is implementation work on
    #                                this version's plate (plan step B6). Listing an
    #                                unwired entry as `wired` would assert a contract
    #                                the code does not honour — hence the marker.
    #                                (B6 LANDED: no entry carries this status now;
    #                                the marker is kept for any future ruled gap.)
    #   projected_surface_excluded — folded at its EPHEMERAL consumer (the launch
    #                                argv); never enters the CLI level, because the
    #                                projection outlives the launch (the structural
    #                                class rule above).
    shadowed_flags:
      "--agent":
        key: system.agent
        status: wired
      "-M/--model":
        key: "agent.<agent>.model"
        status: wired
        note: "spelled against the ACTIVE agent. Barred from the codex
               config-projection RESOLVE (that consumer reads the cascade, not
               the CLI level — projected-surface class, §1A)."
      "-N/-C/-R":
        key: "agent.<agent>.continue_mode"
        status: wired
      "--image":
        key: box.image
        status: wired               # B6 (R-11a(a)): keyspace-resolved via the
                                    #   box-scalar resolve (config.load_merged_config)
      "--share-images":
        key: box.share_images
        status: wired               # B6 (R-11a(a)): same resolve; store_true, so
                                    #   only a GIVEN flag installs (True)
      "-S/-A":
        key: "agent.<agent>.access"
        status: projected_surface_excluded
        note: "R-41 successor spelling (supersedes auto_approve). The access
               projection is written onto the box's persisted agent-config
               surfaces; a level entry would make an ephemeral flag mutate
               persisted state."
    shadowed_flags_spec: "§1A (flag enumeration; R-11 + R-11a)"

  # DECLARATION ROOTS (R-21) — the ABSTRACT categories (common/caches/seeded)
  # let an author write a bare LEAF; the root is supplied at DECLARATION-LOAD
  # time, so what is STORED is the full self-resolving @-ref (author writes
  # `plugins`; the loader stores `@meta.<scope>.path/common/plugins`).
  # Assembly-time prepend is FORBIDDEN — a stored bare relative that only works
  # because a layer prepends a root is the retired `scope_roots` defect (code
  # deleted; absence pinned by tests). Author ergonomics are identical; only
  # the ARTIFACT differs — which is the whole of the difference.
  declaration_roots:
    applies_to: [common, caches, seeded]   # synced takes NO root; bindings take NO root
    rooted_at: declaration_load            # REQUIRED
    assembly_prepend: forbidden            # `scope_roots` — no longer exists
    # ⚑ The trailing segment is the AUTHOR'S RELATIVE host_src, NOT an entry name
    # (entry names are gone since 2026-08-07f). `key` and `host_src` were always
    # INDEPENDENT; dropping the key segment does not touch source derivation.
    subdir_pattern: "<scope-root>/<category>/<relative_host_src>"
    roots:
      system: "@config.data"
      agent: "@meta.agent.<agent>.path"    # = @config.agents/<agent>
      workset: "@meta.workset.path"
      box: "@meta.box.path"                # per mode (§2c) — so standalone roots too
    # An ABSOLUTE host_src in an abstract category is LEGAL — it is simply NOT
    # root-joined. The root is a DEFAULT FOR RELATIVE SOURCES, not a universal law.
    absolute_host_src: legal_not_root_joined
    # HOST root ONLY — the guest dest is ALWAYS spelled out (kanibako owns the
    # host layout, never the guest layout). The root dirname is FIXED MACHINERY,
    # not a key: every "override it" want is served better by a concrete
    # bindings.rw entry (one entry elsewhere) or by moving the SCOPE ROOT, which
    # is already a key (config.agents, workset.boxes).
    guest_root: none
    root_dirname_is_a_key: false
  declaration_roots_spec: "§2a (DECLARATION ROOTS; R-21, ruled 2026-08-01)"

  # SEED WHITELISTS (R-24) — per-scope, DENY BY DEFAULT: anything not listed is
  # refused. The enumeration IS an allowlist — a correctness property, not a
  # style choice (a wholesale template copy could plant settings.yaml — the LAST
  # cascade level — or a templated registry.yaml corrupting box membership).
  # Severity is recorded ONLY where the spec states it: correctness = silently
  # override the cascade / corrupt box membership; user_data_and_secrets = the
  # user's credentials/code. STANDALONE is where this matters most: the workset
  # root IS the user's project directory.
  seed_whitelists:
    default: deny
    box:
      root: "<box_dir>"                    # @meta.box.path
      allow: ["home/", "canon/handbook/"]
      deny:
        "settings.yaml": "correctness — = meta.box.settings, the LAST cascade level"
        "<box_name>.jsonl": "standalone helper log"
    agent:
      root: "agents/<agent>"               # @meta.agent.<agent>.path
      allow: ["template/", "canon/handbook/", "common/"]
      deny:
        "settings.yaml": "correctness — = meta.agent.<agent>.settings"
        "caches/": "denied by default"
    workset:
      root: "<workset_path>"               # @meta.workset.path
      allow: ["template/", "canon/handbook/"]
      deny:
        "settings.yaml": "correctness — = meta.workset.settings"
        "registry.yaml": "correctness — = workset.registry, the AUTHORITATIVE
                          store of box membership + names"
        "auth/": "user_data_and_secrets — CREDENTIALS"
        "vault/": "user_data_and_secrets"
        "workspaces/": "user_data_and_secrets — THE USER'S CODE"
        "boxes/": "denied by default"
        "logs/": "denied by default"
        "channels/": "denied by default"
    # ONLY canon/handbook/ is seedable, never canon/ wholesale: no other canon
    # subtree has a justified seed today, and deny-by-default means any future
    # one needs an explicit decision rather than inheriting permission.
    # The whitelists are NOT one uniform rule — common/ is allowed at agent
    # scope (there are use cases) and behaves differently from its siblings:
    # canon/ is delivered RO and template/ is inert until a box is created,
    # whereas common/ is bound RW, SHARED by every box running that agent, and
    # box-writable — seeded starter content there is live data, not a template
    # (create-if-absent still applies, so it cannot clobber).
    # ENFORCEMENT: dests are fixed by keys, so a template cannot CHOOSE where it
    # writes. The residual escape is traversal in template CONTENT — the copier
    # MUST reject `..` components and MUST NOT follow symlinks out of the
    # destination subtree. Those TRAVERSAL DEFENCES are an algorithm, not a
    # table: they stay in CODE (R-24's explicit split).
    traversal_defences: code
  seed_whitelists_spec: "§2a (seed whitelists, ruled Jei 2026-07-30; R-24 — data
                         into the manifest, defences stay code)"

  # OUT-OF-BOX TEMPLATES (R-24) — the HOST STORES are stamped from the PACKAGES:
  # the step before the box seed, filling the store the box layers copy from.
  # ONE mechanism (the same layered create-if-absent copy), fired at FIVE
  # lifecycle moments. ⚑ ONLY the box-HOME row is a KEY SET (the §2a `seeded`
  # category); every other row — including the box's own handbook chapter — is an
  # out-of-box TEMPLATE copy with NO keys at all, never addressed by the keyspace.
  seeded_seeds_moments:
    - moment: "install / setup"
      from: "core package"
      into: ["global/template/*", "agents/default", "global/canon/handbook"]
    - moment: "agent install"
      from: "plugin package + global/template/agent (the PLUGIN wins)"
      into: ["agents/<agent>"]
    - moment: "workset create"
      from: "global/template/workset"
      into: ["<workset_path>"]
    - moment: "box create"
      from: "the three */template/box/home layers"
      into: ["<box_dir>/home"]              # the §2a seeded KEYS
    - moment: "box create"
      from: "the three */template/box/canon/handbook layers"
      into: ["<box_dir>/canon/handbook"]    # an out-of-box TEMPLATE — NO key
    # ⚑ The box-handbook row is listed and is explicitly KEYLESS — that is the
    # 2026-08-07g ruling: those three layers are HOST templates, not GUEST
    # templates, so they left the `seeded` category (no `seeded` entry names that
    # dest now) and are copied host-side at create by
    # launch.templates.install_box_handbook_template, exactly as the agent and
    # workset rows above are copied. @box.canon/handbook remains the SOURCE of the
    # ro box.bindings.ro[~/canon/handbook/box] bind — that bind is untouched and is
    # still an ordinary key.
  # Create-if-absent per FILE, never overwrite — once a file exists it belongs
  # to whoever owns that store; a package upgrade must not silently revert their
  # edits. Report a skip ONLY where the packaged file DIFFERS from the one on
  # disk. The whitelists and the (code-side) traversal defences apply here too.
  seeded_seeds_moments_spec: "§2a (OUT-OF-BOX TEMPLATES, five lifecycle moments; R-24)"

  # Set-time validation: full resolution in error-collecting/lenient mode.
  set_validation:
    mode: full_resolution_lenient
    error: [malformed_syntax, colon_src_dest_notation, type_mismatch,
            edited_value_upstream_unresolvable]
    allow: [unrelated_defect, downstream_defect, defect_the_edit_resolves]
    warn: [host_source_path_missing]
    rule: "allow iff the edited value resolves cleanly post-edit"
  set_validation_spec: "§2a (ruling 2026-06-29, E3)"

  # ANTI-FABRICATION GATE — the reason this file exists.
  # A key not in this table cannot be read, set, or resolved; an unrecognized
  # `policy:` field is likewise refused (keeps this block from becoming a junk drawer).
  unknown_key: error
  unknown_policy_field: error
  unknown_spec: "§0 \"The keyspace is CLOSED — an undeclared key is NOT a key\" (folded into the
                 spec 2026-07-28). Rulings: 2026-06-27 walkthrough + Jei 2026-07-27."

## ---------------------------------------------------------------------------
## CATEGORIES — the unified primitive (§2a). Available at EVERY scope, so they are
## declared ONCE here rather than enumerated scope×category (would be 4×9 entries).
## TWO SHAPES, do not conflate. (1) The <VAR>-PARAMETRIC SCALAR categories
## (env, secret_path) expand to `<scope>.<category>.<VAR>`. (2) EVERY BIND-SHAPED
## category — masks, bindings.ro, bindings.rw, caches, seeded, common, synced — is
## DEST-KEYED and does NOT expand: the key ends at the category (at the ro/rw ARM
## for bindings) and its value is a map whose keys are DESTINATIONS, which are DATA
## and never keyspace segments. The four that were name-keyed (caches, seeded,
## common, synced) joined shape (2) on 2026-08-07f; there is no name-keyed
## bind-shaped category left.
## ---------------------------------------------------------------------------
categories:
  scopes: [system, agent.default, agent.active, workset, box]
  scopes_spec: "§2a"

  masks:
    value: "dict[box_dest -> bool|None]"
    tri_state: {present: mask, "null": unmask, absent: inherit}
    cli_set: false              # YAML only — list/dict mutation via set is awkward
    default: {}
    spec: "§2a (KeyStore fold-in 2026-06-27)"
  # ⚑ DEST-KEYED + TERMINAL since 2026-08-06c (R-3/R-5/R-6/R-9/R-10). The ARM is
  # the whole of the key; the inner dict's keys are DATA, not keyspace segments,
  # so `<scope>.bindings.<arm>.<name>` is NOT a key and is refused (unknown_key).
  # There is no entry `name` — the DESTINATION is the identity. NO MIGRATION (R-4).
  bindings.ro:
    value: bindmap              # dict[box_dest -> [host_src] | [host_src, options]]
    terminal_key: true          # the value is the whole map; inner keys are data
    dest_keyed: true
    mount_options: "ro"
    cli_set: false              # YAML only — a terminal dict, exactly like masks.
                                #   The former `source_only` name-keyed repoint is a
                                #   KNOWN, ACCEPTED LOSS (R-9; DS-BL1 answered (a),
                                #   Jei 2026-08-07g — accept the loss UNIFORMLY
                                #   across all six bind-shaped categories).
    default: {}
    spec: "§2a (REPRESENTATION; dest-keyed 2026-08-06c, R-5/R-6/R-9/R-10)"
  bindings.rw:
    value: bindmap
    terminal_key: true
    dest_keyed: true
    mount_options: "Z,U"
    cli_set: false              # see bindings.ro above (DS-BL1 (a))
    default: {}
    spec: "§2a (REPRESENTATION; dest-keyed 2026-08-06c, R-5/R-6/R-9/R-10)"
  # ⚑ DEST-KEYED + TERMINAL since 2026-08-07f. The CATEGORY is the whole of the
  # key; the inner dict's keys are DATA, not keyspace segments, so
  # `<scope>.<category>.<name>` is NOT a key for any of the four below and is
  # refused (unknown_key). There is no entry `name` — the DESTINATION is the
  # identity. ⚑⚑ THIS IS A KEY-SHAPE CHANGE ONLY: `kind: copy` on seeded and
  # synced is UNCHANGED — they were copies before and are copies after.
  caches:
    value: bindmap              # dict[box_dest -> [host_src] | [host_src, options]]
    terminal_key: true          # the value is the whole map; inner keys are data
    dest_keyed: true
    mount_options: "Z,U"
    cli_set: false              # YAML only — a terminal dict, exactly like masks.
                                #   The former `source_only` name-keyed repoint is a
                                #   KNOWN, ACCEPTED LOSS (R-9; DS-BL1 answered (a),
                                #   Jei 2026-08-07g — accept the loss UNIFORMLY
                                #   across all six bind-shaped categories).
    default: {}
    note: "GLOBAL at system, per-agent at agent.<agent>. ⚑ It holds the patched-binary
           OUTPUT as an ENTRY — it did NOT absorb the KEY `agent.<agent>.transform`, which
           is live and declared (that 2026-06-27 reading was superseded 2026-08-08c)."
    spec: "§2a / §2d (dest-keyed 2026-08-07f)"
  seeded:
    value: bindmap
    terminal_key: true
    dest_keyed: true
    kind: copy                  # one-time copy at init, NOT a mount — UNCHANGED by
                                #   the 2026-08-07f key-shape move
    cli_set: false              # see caches above (DS-BL1 (a))
    default: {}
    spec: "§2a (dest-keyed 2026-08-07f)"
  common:
    value: bindmap
    terminal_key: true
    dest_keyed: true
    mount_options: "Z,U"
    cli_set: false              # see caches above (DS-BL1 (a))
    default: {}
    note: "RENAMED from `shared` (2026-07-29; R-5). Category `common` vs channel
           type-root `common` is unambiguous — the `channels.` segment is the
           discriminator. Host dirs move to agents/<agent>/common/<host_src>:
           migration M-3."
    spec: "§2a (R-5; migration M-3; dest-keyed 2026-08-07f)"
  synced:
    value: bindmap
    terminal_key: true
    dest_keyed: true
    kind: copy                  # two-way synced by the agent plugin; mtime-gated —
                                #   UNCHANGED by the 2026-08-07f key-shape move
    cli_set: false              # see caches above (DS-BL1 (a))
    default: {}
    suppressed_when: "box shares no credentials (auth tier private)"
    spec: "§2a (D-M4; auth-level redesign 2026-07-01; dest-keyed 2026-08-07f)"
  env:
    value: scalar               # env.<VAR>
    parametric: [VAR]
    cli_set: true
    reserved_names_apply: true
    spec: "§2a"
  secret_path:
    value: path                 # secret_path.<VAR> — a PATH to secret material
    parametric: [VAR]
    cli_set: true               # scalar ⇒ full set/create (unlike source-only binds)
    never_read_by_kanibako: true    # value NEVER enters snapshot/keystore/argv/logs
    fail_soft: true                 # missing/unreadable/empty ⇒ WARN + VAR unset
    agent_independent: true
    spec: "§2a (2026-07-06, Jei)"

# The entry VALUE shape is load-bearing (§2a REPRESENTATION): a YAML list / Python
# tuple, NEVER a colon-joined "host:box" string. THERE IS NOW ONE BIND SHAPE.
#
# bindings.{ro,rw} — DEST-KEYED 2026-08-06c — plus caches / seeded / common /
# synced, which joined the SAME shape on 2026-08-07f. The dest is the dict KEY.
# 1 element = (host_src). The SECOND element is arity-legal for every category
# here, but what it MEANS is per-DELIVERY and only the MOUNT categories have an
# answer — see second_element below.
bindmap_shape:
  applies_to: [bindings.ro, bindings.rw, caches, seeded, common, synced]
  form: dict_of_list            # dict[box_dest -> list]
  key_is: box_dest              # DATA, never a keyspace segment
  min_elements: 1
  max_elements: 2
  # ⚑ ONE SHAPE, TWO DELIVERIES — the arity is uniform, the MEANING is not.
  second_element:
    mounts: options             # bindings.ro / bindings.rw / caches / common:
                                #   the options string OVERRIDES the category
                                #   default (mount_options) for THIS entry only.
    copies: reserved            # seeded / synced: a COPY has no mount to carry
                                #   options, so the category has NO default for
                                #   the slot and the slot has NO meaning today.
                                #   RESERVED DELIBERATELY, not vestigial —
                                #   Jei 2026-08-07g, asked what opts means for a
                                #   copy: "Right now, nothing; but it's a good
                                #   placeholder that we might need in the
                                #   future." The spec declines to rule it
                                #   (§2a REPRESENTATION, the 1-element bullet);
                                #   this node MUST NOT rule it either.
  colon_string: forbidden
  # ⚑ REFUSE STALE SHAPES LOUDLY (R-8; Code Convention 0) — never a silent accept.
  # A 3-element entry, or a name-keyed sub-dict under a category (or under a
  # bindings ARM), is the RETIRED
  # `name -> (host_src, box_dest[, options])` form: ERROR naming the category and
  # the offending entry. This validation is LOAD-BEARING because the retired 2-element
  # (host_src, box_dest) and the current 2-element (host_src, options) have the
  # SAME ARITY, so a stale value would otherwise be read with its DESTINATION
  # silently reinterpreted as mount OPTIONS. No migration, no compat window (R-4).
  refuse_stale: [three_element_entry, name_keyed_subdict]
  # Merges PER ENTRY across cascade levels, exactly as masks does: a lower level
  # does not wipe inherited entries; a present-None entry unsets that dest; a
  # present-None at the ARM omits the whole category.
  merge: per_entry
  spec: "§2a (REPRESENTATION — do NOT re-derive; R-5/R-6/R-8; extended to all six
         bind-shaped categories 2026-08-07f)"
#
# ⚑ `bind_shape` IS DELETED, NOT RETIRED-IN-PLACE (2026-08-07f). It declared the
# NAME-KEYED `name -> (host_src, box_dest[, options])` form for caches / seeded /
# common / synced; all four moved to `bindmap_shape` above, so the node had no
# members left, and a node whose `applies_to` is empty declares nothing. The
# retired SPELLING is recorded where every other retired spelling is recorded —
# not_keys.illegal_shapes `<scope>.{caches,common,seeded,synced}.<name>` — and the
# retired VALUE form is refused by bindmap_shape.refuse_stale above. One record,
# in the place that already exists for it.

## ---------------------------------------------------------------------------
## KEYS
##
## `set:` — cli+file (normal) · file (human-edited only) · never (derived/RO)
##   Design property (§0, 2026-07-04): set == never IFF the key is `meta.*`.
##   The conformance test should ASSERT that property rather than trust each entry.
## `scope:` — the key's OWN scope, for the directional write rule.
## `default:` — a mapping keyed by mode when the default is mode-dependent.
## ---------------------------------------------------------------------------
keys:

  ## ---- LAYER 1: config keys (§1) -----------------------------------------
  ## Bootstrap paths, resolved by the FLAT foundation (not the KeyStore pipeline).
  ## Live ONLY in kanibako_config.yaml / /etc/kanibako/config_base.yaml.
  ## NOT CLI-settable from ANY command scope — refused BEFORE the scope guard.
  config.data:
    layer: 1
    type: path
    set: file
    default: "$XDG_DATA_HOME/kanibako"
    why: "root of the persistent data tree; @-referenced across the keyspace"
    spec: "§1"
  config.settings:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/settings.yaml"
    why: "THE system settings FILE — the cascade `system` level input"
    spec: "§1"
  config.agents:
    layer: 1
    type: path
    set: file
    default: "@config.data/agents"
    why: "per-agent store; agent cascade files at <agent>/settings.yaml"
    spec: "§1"
  config.primary_workset:
    layer: 1
    type: path
    set: file
    default: "@config.data/primary_workset"
    why: "PRIMARY workset root"
    spec: "§1"
  config.registry:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/registry.yaml"
    why: "name→path resolution; needed before loading named workset/box files"
    spec: "§1"
  config.journal:
    layer: 1
    type: path
    set: file
    default: "@config.data/global/journal.yaml"
    why: "lifecycle journal (crash-recovery write-ahead log); normally EMPTY"
    spec: "§1 (added 2026-06-30b)"
    # ⚑ DRIFT RESOLVED (Jei 2026-07-27): §1 prose claimed the Layer-1 set was
    #   'finalized at FIVE config keys' while the table listed SIX. Ruling: strike
    #   the count — it is a moving target. Spec edited; the 1.6.0 spec is archived
    #   at ~/canon/notebook/archives/specs/settings-keyspace-1.6.0-target.md (the
    #   pre-strike .bak-2026-07-27-pre-five-strike snapshot sits in archives/reference/).

