    spec: "§2c (R-6; migration M-9)"
  workset.channels.chat:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/chat", named: "@workset.channelroot/chat",
              standalone: null}
    spec: "§2c"
  workset.channels.broadcast:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channels.chat/broadcast.md",
              named: "@workset.channels.chat/broadcast.md", standalone: null}
    spec: "§2c"
  workset.channels.share:
    scope: workset
    type: path
    set: cli+file
    default: {primary: "@workset.channelroot/share", named: "@workset.channelroot/share",
              standalone: null}
    spec: "§2c"
  workset.channels.mailboxes:
    scope: workset
    type: path
    set: cli+file
    default: "@system.channels.mailboxes/@meta.workset.name"
