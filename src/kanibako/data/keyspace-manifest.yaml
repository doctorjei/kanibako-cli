    note: "the system TEMPLATE ROOT. RENAMED from system.base_template (R-1;
           default global/base_template → global/template; migration M-11).
           Holding the ROOT leaves room for further template subtrees without
           new keys — same indirection as <scope>.canon. ⮕ The box-home seed is
           box/home (@system.template/box/home, §2a layer 1), NOT the root and
           NOT box/ — box/ is the box TEMPLATE root, holding home/ (the §2a seed
           source) beside canon/handbook/, which is the box HANDBOOK HOST TEMPLATE:
