# kanibako SYSTEM/CORE category defaults — the declarative source of truth for
# the STATIC, non-agent-specific launch-path defaults (P6b coalesce).
#
# This file holds the defaults that the box-launch path injects through the
# category resolver as the AGENT-level declared `default_categories`.  Everything
# here is non-agent-specific (per-agent defaults live in each plugin package).
# It is read by the thin loader :mod:`kanibako.core_defaults`, which emits these
# entries through the existing category seam exactly as the old in-code emitters
# did — so the resolver still expands `@`-refs / `$vars` and applies the D-B1
# precedence + depth-sort + L7 guarantee-create.
#
# What lives here (STATIC) vs what stays code-injected at the seam (DYNAMIC):
#   * STATIC  — the box-side destinations + the structural shape of each default
#     (which keys exist, their category, their per-mode scope).  These are pure
#     literals/structure, so they belong in this declarative file.
#   * DYNAMIC — host SOURCES that are runtime-PROBED (the channel host roots come
#     from `StandardPaths`/`channels.box_channel_addresses`, resolved at launch).
#     The loader injects each probed source into its keyed entry; the file names
#     the source SYMBOLICALLY (`source:` below) so the structure stays declarative
#     while the value is filled in at the seam.
#   * CONDITIONAL gating stays at the injection site, NOT here: the workset-local
#     channel binds are emitted only for PRIMARY/NAMED boxes (standalone omits
#     them) — the loader applies that gate when the workset channel paths exist.

# box.masks default (decision B): EMPTY — there is no default tmpfs mask.  The
# vault moved OUT of ~/workspace in 1.6.0, so there is nothing in the workspace
# to hide; the old vestigial ~/workspace/vault mask is DROPPED.  A real
# list[box_dest] (spec §2a) — a box may still declare masks via box.masks /
# <scope>.masks to hide a guest path behind a read-only tmpfs.
masks: []

# Channel binds (§2c/§2f).  Each entry becomes a `box.bindings.rw.<key>` default
# whose VALUE is the structured pair (<probed host_src>, <box_dest>).  `source`
# names the runtime-probed host root the loader injects; `scope` is `system`
# (every mode) or `workset` (PRIMARY/NAMED only — standalone omits these).
#
# In-box channel mount roots: system channels under ~/channels/; workset-local
# channels (primary/named only) under ~/channels/workset/; own inbox surfaced at
# ~/channels/inbox.
channels:
  # System channel type roots (every mode).
  # B2b: routed through @system.channels.* (spec §2c ALL PROJECTS L471-474) — the
  # host_src is the @system.* REF (not the runtime-probed literal), which `expand`
  # resolves to the SAME resolved system channel root (`std.channels_* ==
  # resolved["system.channels.*"]`; the same flat foundation, byte-identical). The
  # `source` symbolic name is kept for documentation; the loader emits `meta_ref`
  # as the host_src and folds the resolved system.channels.* literal into the floor.
  - key: global_common
    source: channels_common
    meta_ref: "@system.channels.common"
    box_dest: "~/channels/common"
    scope: system
  - key: global_chat
    source: channels_chat
    meta_ref: "@system.channels.chat"
    box_dest: "~/channels/chat"
    scope: system
  - key: global_share
    source: channels_share
    meta_ref: "@system.channels.share"
    box_dest: "~/channels/share"
    scope: system
  - key: mailboxes
    source: channels_mailboxes
    meta_ref: "@system.channels.mailboxes"
    box_dest: "~/channels/mailboxes"
    scope: system
  # Own inbox alias (A2): same host dir as mailboxes/<ws>/<self>, surfaced at the
  # (C)-stable path ~/channels/inbox.  The depth-sort lands this deeper dest
  # after ~/channels/mailboxes — both binds are kept.
  #
  # B2: routed through @meta.box.inbox (spec §2c L475) — the host_src is the @meta.*
  # REF (not the runtime-probed literal), which `expand` resolves to the SAME
  # materialized inbox address (byte-identical, JC-B2-4). `source: inbox` is kept
  # for the standalone-omit gate (a standalone box still has an inbox, so it is NOT
  # gated — but the loader maps `meta_ref` to the @-ref host_src for this entry).
  - key: inbox
    source: inbox
    meta_ref: "@meta.box.inbox"
    box_dest: "~/channels/inbox"
    scope: system
  # Workset-local channels (PRIMARY/NAMED only; standalone omits — gated at the
  # seam by the presence of the workset channel paths).  B2b: routed through
  # @workset.channels.* (spec §2c ALL WORKSETS L452-454) — the loader folds the
  # resolved workset channel literal into the floor under that key and emits the
  # @-ref as the host_src (byte-identical to the runtime-probed `wch.*`).  The
  # `source` gate still drops these entries for a standalone box (no workset paths).
  - key: workset_common
    source: workset_common
    meta_ref: "@workset.channels.common"
    box_dest: "~/channels/workset/common"
    scope: workset
  - key: workset_chat
    source: workset_chat
    meta_ref: "@workset.channels.chat"
    box_dest: "~/channels/workset/chat"
    scope: workset
  - key: workset_share
    source: workset_share
    meta_ref: "@workset.channels.share"
    box_dest: "~/channels/workset/share"
    scope: workset

# Core box mounts (step 3).  Each entry becomes a `box.bindings.{ro,rw}.<key>`
# default whose VALUE is the structured triple (<probed host_src>, <box_dest>,
# <options>) — the per-entry mount OPTIONS are the OPTIONAL 3rd slot of the
# binding tuple (spec §2a), consumed by `settings_resolve.unpack_bind`.  These
# are the box's own home + workspace + vault binds — TODAY's hardwired podman
# `-v` (container.py) routed through the category resolver so NOTHING is bound
# into a box except through the keyspace.
#
# What lives here (STATIC) vs what stays code-injected at the seam (DYNAMIC):
#   * STATIC  — the box-side destinations + per-entry `options` + the structural
#     shape (which keys exist, their category).  Pure literals; they belong here.
#   * DYNAMIC — the host SOURCES are runtime-PROBED from `ProjectPaths`
#     (`proj.shell_path` → home, `proj.project_path` → workspace,
#     `proj.vault_ro_path`/`proj.vault_rw_path` → vault); the loader injects each
#     probed source into its keyed entry (the file names it SYMBOLICALLY via
#     `source:`).
#   * CONDITIONAL gating stays at the injection site, NOT here: the vault binds
#     are UNIVERSAL unless explicitly disabled — emitted whenever vault is
#     enabled, with the vault source dir CREATED IF MISSING so the bind is always
#     present (rather than silently dropped when the source happens to be absent).
#     Only a disabled vault omits them — see
#     `core_defaults.core_default_categories`.  home + workspace are
#     UNCONDITIONAL (every box mode).
core:
  # Persistent agent home — host shell_path bound rw at ~ (/home/agent).  ``~``
  # (not ``~/``) so the dest is exactly ``/home/agent`` — no trailing slash, byte-
  # identical to the old hardwired ``{shell_path}:/home/agent:Z,U`` bind.
  #
  # Routed through the RO per-mode BOX ROOT `@meta.box.path` — ONE declaration for
  # EVERY mode (spec §2c ALL PROJECTS: `box.bindings.rw.home | (@meta.box.path/home,
  # ~/)`).  This REPLACES the old 3-arm `mode_meta_ref` map: the per-mode variation
  # now lives in `meta.box.path` itself (settings_launch.workset_anchor_floor) and
  # nowhere downstream, which is the whole point of the anchor.  It resolves to the
  # SAME literal `proj.shell_path` produces in every mode (byte-identical — gated by
  # a launch-path before/after comparison of the resolved mount).
  # `source: shell_path` is kept as the documentary symbolic name.
  - key: home
    category: bindings.rw
    source: shell_path
    meta_ref: "@meta.box.path/home"
    box_dest: "~"
    options: "Z,U"
    scope: system
  # Project workspace — bound rw at ~/workspace.  B2: routed through
  # @meta.box.workspace (spec §2c L476) — the host_src is the @meta.* REF, which
  # `expand` resolves to the SAME materialized workspace source (= str(proj.
  # project_path); byte-identical, JC-B2-4).  `source: project_path` is kept as the
  # documentary symbolic name; the loader emits `meta_ref` as the host_src.
  - key: workspace
    category: bindings.rw
    source: project_path
    meta_ref: "@meta.box.workspace"
    box_dest: "~/workspace"
    options: "Z,U"
    scope: system
  # Read-only vault (only when vault enabled; source is created if missing).
  # Routed per-mode (spec §2c) — BOTH arms now root at the SAME `@workset.vault_ro`
  # anchor, which is UNIFORM across modes (§2c ALL PROJECTS: `workset.vault_ro |
  # @meta.workset.path/vault/ro`).  Only the BIND differs, and it differs for a real
  # reason: primary/named get the per-box `/@meta.box.name` subdir (§2c ALL WORKSETS)
  # that a lone standalone box does not need (§2c STANDALONE).  The standalone arm
  # used to spell `@meta.workset.path/vault/ro` — a SECOND spelling of the same root;
  # that duplication is what this collapses.
  - key: vault
    category: bindings.ro
    source: vault_ro_path
    mode_meta_ref:
      primary: "@workset.vault_ro/@meta.box.name"
      named: "@workset.vault_ro/@meta.box.name"
      standalone: "@workset.vault_ro"
    box_dest: "~/vault/ro"
    options: "ro"
    scope: vault
  # Read-write vault (only when vault enabled; source is created if missing).
  # Same shape as the ro vault above: both arms root at the UNIFORM
  # `@workset.vault_rw`; only the per-box `/@meta.box.name` subdir is per-mode.
  - key: vault
    category: bindings.rw
    source: vault_rw_path
    mode_meta_ref:
      primary: "@workset.vault_rw/@meta.box.name"
      named: "@workset.vault_rw/@meta.box.name"
      standalone: "@workset.vault_rw"
    box_dest: "~/vault/rw"
    options: "Z,U"
    scope: vault

# kanibako CLI binds (Phase B).  The in-box kanibako package + entry script,
# routed through the category resolver instead of the hardwired `_kanibako_mounts`
# `-v` list.  Both are UNCONDITIONAL ro binds in every box mode; their host
# SOURCES are import-resolved at the seam (`kanibako.__file__` parent +
# `importlib.resources` `kanibako-entry`) and injected into each keyed entry (the
# file names them SYMBOLICALLY).  box-side destinations + options are STATIC here.
kani:
  # Package dir → /opt/kanibako/kanibako (ro).  Must equal
  # KANIBAKO_PKG_MOUNT_ROOT + "/kanibako" (kanibako.box_supervisor): the launcher
  # injects that root as PYTHONPATH so PID-1 imports the supervisor from THIS
  # mount — YAML cannot reference the constant, so keep the literal in sync
  # (drift = supervisor import fails = silent bare-shell degradation).
  - key: kani_pkg
    category: bindings.ro
    source: kani_pkg
    box_dest: "/opt/kanibako/kanibako"
    options: "ro"
  # Entry script → ~/.local/bin/kanibako (ro).
  - key: kani_bin
    category: bindings.ro
    source: kani_bin
    box_dest: "~/.local/bin/kanibako"
    options: "ro"
  # Universal secret export → /etc/profile.d/kanibako-secrets.sh (ro).  A generic,
  # self-adapting profile.d snippet that every LOGIN shell sources; it exports each
  # mounted secret from SECRET_MOUNT_DIR (/run/kanibako/secrets) in-box, so a
  # `podman exec` login shell (VS Code integrated terminal, codex panel app-server)
  # sees $API_KEY etc. — the paths the PID-1 `_secret_export_shim` cannot reach
  # (those non-login execs never inherit its env).  UNCONDITIONAL/universal: the
  # snippet no-ops when nothing is mounted, so it is safe on every box.  The value
  # is still read IN-BOX from the ro mount — kanibako only binds the snippet PATH,
  # never the token (arm's-length preserved; nothing leaks to `podman inspect`).
  - key: secret_export
    category: bindings.ro
    source: secret_export
    box_dest: "/etc/profile.d/kanibako-secrets.sh"
    options: "ro"
  # NOTE: the read-only packaged CANON is not a hand-declared entry here either.
  # ``core_defaults.rom_default_categories`` emits FIVE SIBLING binds from the
  # packaged rom root (``global/rom``, which is FLAT — no ``canon/`` wrapper):
  # ``canon_collection`` + ``canon_bible_contents`` as FILE binds (file-onto-file
  # over the 0-byte mountpoints box create materialises), and one whole-directory
  # bind per packaged bible chapter — ``canon_bible_{general,workset,box}``.
  # ``rom_agent_default_categories`` adds the resolved plugin's own chapter at
  # ``~/canon/bible/agent`` when it ships one.  All six are INTERNAL/generated
  # (spec §2c): not user keys, in no set-time floor, not repointable.
  # ⚑ SIBLINGS, NOT A WHOLE-DIR BOOK (J-7, 2026-07-31).  Neither ``~/canon`` nor
  # ``~/canon/bible`` is ever bound: every bind lands on a mountpoint that already
  # exists in the box home (``core_defaults.materialize_canon_skeleton``, run at box
  # create and made root-owned), so nothing nests and no mountpoint has to live
  # inside a bind SOURCE.  R1's whole-dir ``canon_bible`` key is RETIRED.
  # ⚑ The flattener (``import-directives.py``) is MACHINERY, not canon: it ships in
  # the package and reaches the box through the ``kani_pkg`` bind above, at
  # ``/opt/kanibako/kanibako/scripts/import-directives.py``.
  # NOTE: the KICKOFF loader (spec §2c ``box.bindings.ro.kickoff``) is declared in its
  # own ``kickoff:`` block below rather than as a fourth entry here — it is the one
  # core bind with a TRANSITION GATE, and ``kani_default_categories`` must stay the
  # unconditional trio.

# The KICKOFF LOADER (spec §2c ``box.bindings.ro.kickoff``; P-5, C-CANON R2) — the
# directive-chain ENTRY SLOT.  A tiny core-shipped static file whose whole content is
# the canon entry import ``@~/canon/COLLECTION.md``; the box-start flattener follows
# that chain and writes the flattened result to each harness's native instruction slot
# (``KANIBAKO_DIRECTIVE_FINAL``).  INTERNAL like ``kani_pkg``: not a user key, in no
# set-time floor, not repointable.
#
# ⚑ SAME SHAPE AS EVERY OTHER FAMILY BLOCK (a LIST of entries whose ``source`` is a
# SYMBOLIC name the loader resolves to a probed/packaged host path) — it just happens
# to hold exactly ONE entry, which the loader enforces.  It is its own family rather
# than a fourth ``kani:`` entry because it is the one core bind with a TRANSITION GATE:
# see ``core_defaults.kickoff_default_categories`` for the gate (core YIELDS to a plugin
# that still ships its own kickoff delivery) and the condition for removing it.
#
# The box_dest here is the SINGLE SOURCE OF TRUTH for the kickoff slot: the
# ``KANIBAKO_DIRECTIVE_SEED`` container env var and the gate's dest comparison both
# read it back through ``core_defaults.kickoff_box_dest()``.
kickoff:
  # Packaged loader (``data/global/KICKOFF.md``) → ~/.config/kanibako/kickoff.md (ro).
  - key: kickoff
    category: bindings.ro
    source: kickoff
    box_dest: "~/.config/kanibako/kickoff.md"
    options: "ro"

# Helper hub binds (Phase B).  The live helper unix SOCKET + the per-box helper
# message LOG, routed through the category resolver instead of the hardwired
# `_HMount` appends inside the `helpers_enabled` block.  Both box-side
# destinations are DYNAMIC (derived from the box's `box_state_home(container_env)`
# at launch) and injected at the seam; the host SOURCES (socket_path / log_path)
# are runtime-probed and gated on `.exists()` at the seam too.
#
# ⚠ helper_sock options MUST be "" (empty) — it is a LIVE unix socket the hub
# listens on; a Z/U relabel/chown would break the shared socket topology.  The
# per-entry empty-options 3rd slot is exactly what makes this routable.
helpers:
  # Live helper unix socket → <box_state_kanibako>/helper.sock (rw, options="").
  - key: helper_sock
    category: bindings.rw
    source: helper_sock
    options: ""
  # Per-box helper message log → <box_state_kanibako>/helpers.jsonl (ro).
  # THE SPEC'S OWN SPELLING (§2c ALL PROJECTS): @workset.logs/@{meta.box.name}.jsonl
  # — ONE row for every mode, because `workset.logs` carries the per-mode variation
  # (primary/named @meta.workset.path/logs · standalone @meta.box.path).
  #
  # ⚑ THE BRACES ARE LOAD-BEARING, do not "simplify" them away.  A literal `.jsonl`
  # follows a dotted @-ref here, and the BARE form cannot express that: an @-ref name
  # is a GREEDY dotted run, so `@meta.box.name.jsonl` parses as the single ref name
  # `meta.box.name.jsonl`, which resolves ABSENT and then coerces to "" under the
  # embedded rule — silently yielding a host_src that has lost both the box name and
  # the extension.  `@{...}` delimits the name explicitly so the suffix stays a
  # literal (resolver: settings_resolve.match_ref; ruled by Jei 2026-07-30b, PHASE R).
  # This row was ASPIRATIONAL until that landed; the code used an equivalent single
  # key `@meta.box.helper_log`, now retired.
  - key: helper_log
    category: bindings.ro
    source: helper_log
    meta_ref: "@workset.logs/@{meta.box.name}.jsonl"
    options: "ro"

# Image-sharing bind (Phase B, D-M8).  The host image graph root + the GENERATED
# `storage.conf` (additionalImageStores), routed through the category resolver
# instead of the hardwired Mounts that `image_sharing.build_image_sharing_mounts`
# returned.  GATED: emitted only when image-sharing applies AND the host graph
# root is detectable.  box-side destinations + options are STATIC; the host
# SOURCES (probed graph root + generated conf path) are injected at the seam.
images:
  # Host graph root → /var/lib/shared-images (ro).
  - key: images_store
    category: bindings.ro
    source: images_store
    box_dest: "/var/lib/shared-images"
    options: "ro"
  # Generated storage.conf → ~/.config/containers/storage.conf (ro).
  - key: images_conf
    category: bindings.ro
    source: images_conf
    box_dest: "~/.config/containers/storage.conf"
    options: "ro"
