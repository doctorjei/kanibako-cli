# kanibako SYSTEM/CORE category defaults — the declarative source of truth for
# the STATIC, non-agent-specific launch-path defaults (P6b coalesce).
#
# This file holds the defaults that the box-launch path injects through the
# category resolver as the AGENT-level declared `default_categories`.  Everything
# here is non-agent-specific (per-agent defaults live in each plugin package).
# It is read by the thin loader :mod:`kanibako.settings.core_defaults`, which emits these
# entries through the existing category seam exactly as the old in-code emitters
# did — so the resolver still expands `@`-refs / `$vars` and applies the D-B1
# precedence + depth-sort + L7 guarantee-create.
#
# What lives here (STATIC) vs what stays code-injected at the seam (DYNAMIC):
#   * STATIC  — the box-side destinations + the structural shape of each default
#     (which keys exist, their category, their per-mode scope).  These are pure
#     literals/structure, so they belong in this declarative file.
#   * DYNAMIC — host SOURCES that are runtime-PROBED (the channel host roots come
#     from `StandardPaths`/`channels.box_channel_addresses`, resolved at launch).
#     The loader injects each probed source into its keyed entry; the file names
#     the source SYMBOLICALLY (`source:` below) so the structure stays declarative
#     while the value is filled in at the seam.
#   * CONDITIONAL gating stays at the injection site, NOT here: the workset-local
#     channel binds are emitted only for PRIMARY/NAMED boxes (standalone omits
#     them).  The gate is a MODE test, not a filesystem test — the loader adds the
#     `workset_*` source names only when `proj.mode` is not standalone, then drops
#     any entry whose `source:` is missing from that map.  Nothing stats a path.

# box.masks default (decision B): EMPTY — there is no default tmpfs mask.  The
# vault moved OUT of ~/workspace in 1.6.0, so there is nothing in the workspace
# to hide; the old vestigial ~/workspace/vault mask is DROPPED.  A box may still
# declare masks via box.masks / <scope>.masks to hide a guest path behind an
# empty tmpfs.
#
# THE SHAPE IS A MAP KEYED BY BOX DESTINATION — dict[box_dest -> bool|null], the
# 3-state of spec §2a (present = mask · null = unmask · absent = inherit).  It is
# NOT a list: a list at <scope>.masks in a settings file is refused by name, so
# the shipped default is spelled in the shape a user must write.
masks: {}

# Channel binds (§2c/§2f).  Each entry becomes a `box.bindings.rw.<key>` default
# whose VALUE is the structured pair (<probed host_src>, <box_dest>).  `source`
# names the runtime-probed host root the loader injects, and IS the gate that
# omits an entry on a standalone box.  `scope` is DESCRIPTIVE on a channel entry —
# `system` (every mode) / `workset` (PRIMARY/NAMED only) records that policy but no
# loader reads it here; the field is live only on `core:` rows, where `scope: vault`
# gates the vault binds.
#
# In-box channel mount roots: system channels under ~/channels/; workset-local
# channels (primary/named only) under ~/channels/workset/; own inbox surfaced at
# ~/channels/inbox.
channels:
  # System channel type roots (every mode).
  # B2b: routed through @system.channels.* (spec §2c ALL PROJECTS) — the
  # host_src is the @system.* REF (not the runtime-probed literal), which `expand`
  # resolves to the SAME resolved system channel root (`std.channels_* ==
  # resolved["system.channels.*"]`; the same flat foundation, byte-identical). The
  # `source` symbolic name is kept for documentation; the loader emits `meta_ref`
  # as the host_src and folds the resolved system.channels.* literal into the floor.
  - key: global_common
    source: channels_common
    meta_ref: "@system.channels.common"
    box_dest: "~/channels/common"
    scope: system
  - key: global_chat
    source: channels_chat
    meta_ref: "@system.channels.chat"
    box_dest: "~/channels/chat"
    scope: system
  - key: global_share
    source: channels_share
    meta_ref: "@system.channels.share"
    box_dest: "~/channels/share"
    scope: system
  - key: mailboxes
    source: channels_mailboxes
    meta_ref: "@system.channels.mailboxes"
    box_dest: "~/channels/mailboxes"
    scope: system
  # Own inbox alias (A2): same host dir as mailboxes/<ws>/<self>, surfaced at the
  # (C)-stable path ~/channels/inbox.  The depth-sort lands this deeper dest
  # after ~/channels/mailboxes — both binds are kept.
  #
  # B2: routed through @meta.box.inbox (spec §2c) — the host_src is the @meta.*
  # REF (not the runtime-probed literal), which `expand` resolves to the SAME
  # materialized inbox address (byte-identical, JC-B2-4). `source: inbox` is kept
  # for the standalone-omit gate (a standalone box still has an inbox, so it is NOT
  # gated — but the loader maps `meta_ref` to the @-ref host_src for this entry).
  - key: inbox
    source: inbox
    meta_ref: "@meta.box.inbox"
    box_dest: "~/channels/inbox"
    scope: system
  # Workset-local channels (PRIMARY/NAMED only; standalone omits — gated at the
  # seam by `proj.mode`, via the `source:` names below).  B2b: routed through
  # @workset.channels.* (spec §2c ALL WORKSETS) — the loader folds the
  # resolved workset channel literal into the floor under that key and emits the
  # @-ref as the host_src (byte-identical to the runtime-probed `wch.*`).  The
  # `source` gate still drops these entries for a standalone box (no workset paths).
  - key: workset_common
    source: workset_common
    meta_ref: "@workset.channels.common"
    box_dest: "~/channels/workset/common"
    scope: workset
  - key: workset_chat
    source: workset_chat
    meta_ref: "@workset.channels.chat"
    box_dest: "~/channels/workset/chat"
    scope: workset
  - key: workset_share
    source: workset_share
    meta_ref: "@workset.channels.share"
    box_dest: "~/channels/workset/share"
    scope: workset

# Core box mounts (step 3).  Each entry becomes a `box.bindings.{ro,rw}` default
# that is DEST-KEYED: the box destination is the map KEY, and the VALUE is
# [<probed host_src>[, <options>]] — so the per-entry mount OPTIONS are the
# OPTIONAL 2nd slot of the VALUE (spec §2a), consumed by
# `settings_resolve.unpack_bind_entry`.
# ⚑ NOT the retired name-keyed triple (<host_src>, <box_dest>, <options>) and NOT
# `unpack_bind`: that pair is the pre-2026-08-07f shape and now survives only to
# report a MALFORMED node.  Do not copy it from here.  These
# are the box's own home + workspace + vault binds — TODAY's hardwired podman
# `-v` (container.py) routed through the category resolver so NOTHING is bound
# into a box except through the keyspace.
#
# What lives here (STATIC) vs what stays code-injected at the seam (DYNAMIC):
#   * STATIC  — the box-side destinations + per-entry `options` + the structural
#     shape (which keys exist, their category).  Pure literals; they belong here.
#   * DYNAMIC — the host SOURCES are runtime-PROBED from `ProjectPaths`
#     (`proj.project_path` → workspace, `proj.vault_ro_path`/`proj.vault_rw_path`
#     → vault); the loader injects each probed source into its keyed entry (the
#     file names it SYMBOLICALLY via `source:`).
#   * CONDITIONAL gating stays at the injection site, NOT here: the vault binds
#     are UNIVERSAL unless explicitly disabled — emitted whenever vault is
#     enabled, with the vault source dir CREATED IF MISSING so the bind is always
#     present (rather than silently dropped when the source happens to be absent).
#     Only a disabled vault omits them — see
#     `core_defaults.core_default_categories`.  workspace is UNCONDITIONAL (every
#     box mode).
#
# ⚑⚑ THERE IS NO `home` ROW HERE, AND ONE MUST NOT BE ADDED.  The box home does NOT
# route through `bindings.rw` (spec `:1015`, amendment 2026-08-08a / A9): it is pid
# 0, the FOUNDATION the whole mount set folds over, and it is constructed at the
# assembly seam (`commands/start.py._install_assembly_collapse`) from the RO DERIVED
# key `meta.box.home` — the ONE spelling of the box-home source, declared in
# `settings_launch.workset_anchor_floor`.  Its mount options are SEAM MACHINERY and
# live with the seam, not in any key.  A row here would be a SECOND bind at home,
# which the collapse refuses by name.
core:
  # Project workspace — bound rw at ~/workspace.  B2: routed through
  # @meta.box.workspace (spec §2c) — the host_src is the @meta.* REF, which
  # `expand` resolves to the SAME materialized workspace source (= str(proj.
  # project_path); byte-identical, JC-B2-4).  `source: project_path` is kept as the
  # documentary symbolic name; the loader emits `meta_ref` as the host_src.
  - key: workspace
    category: bindings.rw
    source: project_path
    meta_ref: "@meta.box.workspace"
    box_dest: "~/workspace"
    options: "Z,U"
    scope: system
  # Read-only vault (only when vault enabled; source is created if missing).
  # Routed per-mode (spec §2c) — BOTH arms now root at the SAME `@workset.vault_ro`
  # anchor, which is UNIFORM across modes (§2c ALL PROJECTS: `workset.vault_ro |
  # @meta.workset.path/vault/ro`).  Only the BIND differs, and it differs for a real
  # reason: primary/named get the per-box `/@meta.box.name` subdir (§2c ALL WORKSETS)
  # that a lone standalone box does not need (§2c STANDALONE).  The standalone arm
  # used to spell `@meta.workset.path/vault/ro` — a SECOND spelling of the same root;
  # that duplication is what this collapses.
  - key: vault
    category: bindings.ro
    source: vault_ro_path
    mode_meta_ref:
      primary: "@workset.vault_ro/@meta.box.name"
      named: "@workset.vault_ro/@meta.box.name"
      standalone: "@workset.vault_ro"
    box_dest: "~/vault/ro"
    options: "ro"
    scope: vault
  # Read-write vault (only when vault enabled; source is created if missing).
  # Same shape as the ro vault above: both arms root at the UNIFORM
  # `@workset.vault_rw`; only the per-box `/@meta.box.name` subdir is per-mode.
  - key: vault
    category: bindings.rw
    source: vault_rw_path
    mode_meta_ref:
      primary: "@workset.vault_rw/@meta.box.name"
      named: "@workset.vault_rw/@meta.box.name"
      standalone: "@workset.vault_rw"
    box_dest: "~/vault/rw"
    options: "Z,U"
    scope: vault

# kanibako CLI binds (Phase B).  The in-box kanibako package + entry script,
# routed through the category resolver instead of the hardwired `_kanibako_mounts`
# `-v` list.  Both are UNCONDITIONAL ro binds in every box mode; their host
# SOURCES are import-resolved at the seam (`kanibako.__file__` parent +
# `importlib.resources` `kanibako-entry`) and injected into each keyed entry (the
# file names them SYMBOLICALLY).  box-side destinations + options are STATIC here.
kani:
  # Package dir → /opt/kanibako/kanibako (ro).  Must equal
  # KANIBAKO_PKG_MOUNT_ROOT + "/kanibako" (kanibako.box_supervisor): the launcher
  # injects that root as PYTHONPATH so PID-1 imports the supervisor from THIS
  # mount — YAML cannot reference the constant, so keep the literal in sync
  # (drift = supervisor import fails = silent bare-shell degradation).
  - key: kani_pkg
    category: bindings.ro
    source: kani_pkg
    box_dest: "/opt/kanibako/kanibako"
    options: "ro"
  # Entry script → ~/.local/bin/kanibako (ro).
  - key: kani_bin
    category: bindings.ro
    source: kani_bin
    box_dest: "~/.local/bin/kanibako"
    options: "ro"
  # Universal secret export → /etc/profile.d/kanibako-secrets.sh (ro).  A generic,
  # self-adapting profile.d snippet that every LOGIN shell sources; it exports each
  # mounted secret from SECRET_MOUNT_DIR (/run/kanibako/secrets) in-box, so a
  # `podman exec` login shell (VS Code integrated terminal, codex panel app-server)
  # sees $API_KEY etc. — the paths the PID-1 `_secret_export_shim` cannot reach
  # (those non-login execs never inherit its env).  UNCONDITIONAL/universal: the
  # snippet no-ops when nothing is mounted, so it is safe on every box.  The value
  # is still read IN-BOX from the ro mount — kanibako only binds the snippet PATH,
  # never the token (arm's-length preserved; nothing leaks to `podman inspect`).
  - key: secret_export
    category: bindings.ro
    source: secret_export
    box_dest: "/etc/profile.d/kanibako-secrets.sh"
    options: "ro"
  # NOTE: the read-only packaged CANON is not a hand-declared entry here either.
  # ``core_defaults.rom_default_categories`` emits FIVE SIBLING binds from the
  # packaged rom root (``global/rom``, which is FLAT — no ``canon/`` wrapper):
  # ``canon_collection`` + ``canon_bible_contents`` as FILE binds (file-onto-file
  # over the 0-byte mountpoints box create materialises), and one whole-directory
  # bind per packaged bible chapter — ``canon_bible_{general,workset,box}``.
  # ``rom_agent_default_categories`` adds the resolved plugin's own chapter at
  # ``~/canon/bible/agent`` when it ships one.  All six are INTERNAL/generated
  # (spec §2c): not user keys, in no set-time floor, not repointable.
  # ⚑ SIBLINGS, NOT A WHOLE-DIR BOOK (J-7, 2026-07-31).  Neither ``~/canon`` nor
  # ``~/canon/bible`` is ever bound: every bind lands on a mountpoint that already
  # exists in the box home (``core_defaults.materialize_canon_skeleton``, run at box
  # create and made root-owned), so nothing nests and no mountpoint has to live
  # inside a bind SOURCE.
  # ⚑ The flattener (``import-directives.py``) is MACHINERY, not canon: it ships in
  # the package and reaches the box through the ``kani_pkg`` bind above, at
  # ``/opt/kanibako/kanibako/scripts/import-directives.py``.
  # NOTE: the KICKOFF loader (spec §2c ``box.bindings.ro.kickoff``) is declared in its
  # own ``kickoff:`` block below rather than as a fourth entry here — it is the one
  # core bind with a TRANSITION GATE, and ``kani_default_categories`` must stay the
  # unconditional trio.

# The KICKOFF LOADER (spec §2c ``box.bindings.ro.kickoff``; P-5, C-CANON R2) — the
# directive-chain ENTRY SLOT.  A tiny core-shipped static file whose whole content is
# the canon entry import ``@~/canon/COLLECTION.md``; the box-start flattener follows
# that chain and writes the flattened result to each harness's native instruction slot
# (``KANIBAKO_DIRECTIVE_FINAL``).  INTERNAL like ``kani_pkg``: not a user key, in no
# set-time floor, not repointable.
#
# ⚑ SAME SHAPE AS EVERY OTHER FAMILY BLOCK (a LIST of entries whose ``source`` is a
# SYMBOLIC name the loader resolves to a probed/packaged host path) — it just happens
# to hold exactly ONE entry, which the loader enforces.  It is its own family rather
# than a fourth ``kani:`` entry because it is the one core bind with a TRANSITION GATE:
# see ``core_defaults.kickoff_default_categories`` for the gate (core YIELDS to a plugin
# that still ships its own kickoff delivery) and the condition for removing it.
#
# The box_dest here is the SINGLE SOURCE OF TRUTH for the kickoff slot: the
# ``KANIBAKO_DIRECTIVE_SEED`` container env var and the gate's dest comparison both
# read it back through ``core_defaults.kickoff_box_dest()``.
kickoff:
  # Packaged loader (``data/global/KICKOFF.md``) → ~/.config/kanibako/kickoff.md (ro).
  - key: kickoff
    category: bindings.ro
    source: kickoff
    box_dest: "~/.config/kanibako/kickoff.md"
    options: "ro"

# CANON — the HANDBOOK book's five SIBLING binds (spec §2c, J-7).  Sources are the
# four `<scope>.canon` KEYS (host-side, and user-repointable THROUGH those keys —
# `config set system.canon /path` is the blessed route); the guest dests carry NO
# agent segment ("storage is varied, binding is not", §2d).
#
# ⚑⚑ SIBLINGS, NOT NESTED (J-7).  Every entry lands on a mountpoint the box-create
# skeleton (`core_defaults.materialize_canon_skeleton`) already made in the box home,
# so nothing nests inside another bind and no mountpoint ever lives inside a bind
# SOURCE.  Consequence, and it is DELIBERATE: there is NO system-supplied fallback
# for the agent/workset/box chapters — the system store ships only `general/` +
# `SYS_CONTENTS.md` (the D2 cut), so an absent scope chapter shows an EMPTY
# root-owned mountpoint, not the system's copy.
#
# ⚑ `optional: true` = SKIP-IF-ABSENT (spec §2c): the bind is DROPPED SILENTLY when
# its source dir does not exist.  A workset or box that has written no chapter is
# the NORMAL case; without this, almost every box would print two ro-drop WARNINGS
# on every launch, which is exactly the noise that teaches users to ignore warnings.
# `canon_hb_contents` + `canon_hb_general` are NOT optional: the system store is
# materialised by install/setup, so a missing one means something is genuinely wrong.
#
# ⚑⚑ THE NAMING TRAP, stated here because this is where both spellings meet: a box
# store holds TWO different `canon` dirs.  `<box_dir>/home/canon` is the ASSEMBLED
# GUEST VIEW (`~/canon`, delivered by the home bind).  `<box_dir>/canon` (= the key
# `@box.canon`, this file's `canon_hb_box` source) is the box's CONTRIBUTION root.
# **`@box.canon` is NOT `~/canon`.**  Same word, adjacent paths, opposite directions.
#
# `@agent.<active>.canon` is NOT spellable statically — the discriminator is the
# ACTIVE AGENT NODE, known only at the seam — so the loader interpolates it (and
# omits the whole entry for a NO-AGENT box).  These keys are not `config set`-
# repointable (R-9 retired the `bindings.{ro,rw}` write route at every scope),
# exactly like the channel / helper / kani_pkg / images_conf binds: the user's repoint route is
# the `<scope>.canon` KEY, and shipping two spellings for one repoint is the shape
# convention 0 forbids.
#
# ⚑ THE REPOINT ROUTES ARE NOT UNIFORM, and saying "just `config set <scope>.canon`"
# would be a half-truth.  `workset.canon` and `box.canon` ARE CLI-settable (wired
# exactly like `workset.template`); `agent.<a>.canon` is settable at the SYSTEM scope
# only (the per-persona agent-leaf rule, same as `agent.<a>.template`); and
# `system.canon` is CLI-REFUSED as a structural path key — it lives in the `[system]`
# table of `kanibako_config.yaml`, hand-edited, exactly like `system.template` and
# every other `SYSTEM_PATH_DEFAULTS` member.  That split is pre-existing convention,
# not something this section chose.
canon:
  # The handbook's table of contents — a FILE bind over the 0-byte mountpoint.
  - key: canon_hb_contents
    category: bindings.ro
    meta_ref: "@system.canon/handbook/SYS_CONTENTS.md"
    box_dest: "~/canon/handbook/SYS_CONTENTS.md"
    options: "ro"
  # The GENERAL chapter — the global handbook IS the general chapter.
  - key: canon_hb_general
    category: bindings.ro
    meta_ref: "@system.canon/handbook/general"
    box_dest: "~/canon/handbook/general"
    options: "ro"
  # The three per-scope chapters (skip-if-absent).  `<active>` is interpolated.
  - key: canon_hb_agent
    category: bindings.ro
    meta_ref: "@agent.<active>.canon/handbook"
    box_dest: "~/canon/handbook/agent"
    options: "ro"
    optional: true
  - key: canon_hb_workset
    category: bindings.ro
    meta_ref: "@workset.canon/handbook"
    box_dest: "~/canon/handbook/workset"
    options: "ro"
    optional: true
  - key: canon_hb_box
    category: bindings.ro
    meta_ref: "@box.canon/handbook"
    box_dest: "~/canon/handbook/box"
    options: "ro"
    optional: true

# Helper hub binds (Phase B).  The live helper unix SOCKET + the per-box helper
# message LOG, routed through the category resolver instead of the hardwired
# `_HMount` appends inside the `helpers_enabled` block.  Both box-side
# destinations are STATIC and DECLARED HERE, under the FIXED pinned root
# `~/.kanibako/state/` — the resolve-before-liveness root (single source of truth:
# `settings_resolve.BOX_PINNED_ROOT_RELPATH`).  They deliberately do NOT carry a
# `$XDG_STATE_HOME` token: a mount destination is written into the container
# runtime's arguments before the box is live, so honoring the box's XDG settings
# host-side meant four resolvers kept in agreement by hand — and they had already
# drifted (`start.py` derived the dest from `$XDG_STATE_HOME` while hardcoding the
# matching `mkdir` at `~/.local/state`).  XDG compliance is restored AFTER boot by
# `box_supervisor.project_pinned_xdg`, which symlinks `$XDG_STATE_HOME/kanibako`
# onto this pinned dir.  Only the host SOURCES (socket_path / log_path) are
# runtime-probed and injected at the seam, gated on `.exists()` there.
#
# ⚠ helper_sock options MUST be "" (empty) — it is a LIVE unix socket the hub
# listens on; a Z/U relabel/chown would break the shared socket topology.  The
# per-entry empty-options 2nd slot is exactly what makes this routable.
helpers:
  # Live helper unix socket → ~/.kanibako/state/helper.sock (rw, options="").
  - key: helper_sock
    category: bindings.rw
    source: helper_sock
    box_dest: "~/.kanibako/state/helper.sock"
    options: ""
  # Per-box helper message log → ~/.kanibako/state/helpers.jsonl (ro).
  # THE SPEC'S OWN SPELLING (§2c ALL PROJECTS): @workset.logs/@{meta.box.name}.jsonl
  # — ONE row for every mode, because `workset.logs` carries the per-mode variation
  # (primary/named @meta.workset.path/logs · standalone @meta.box.path).
  #
  # ⚑ THE BRACES ARE LOAD-BEARING, do not "simplify" them away.  A literal `.jsonl`
  # follows a dotted @-ref here, and the BARE form cannot express that: an @-ref name
  # is a GREEDY dotted run, so `@meta.box.name.jsonl` parses as the single ref name
  # `meta.box.name.jsonl`, which resolves ABSENT and then coerces to "" under the
  # embedded rule — silently yielding a host_src that has lost both the box name and
  # the extension.  `@{...}` delimits the name explicitly so the suffix stays a
  # literal (resolver: settings_resolve.match_ref; ruled by Jei 2026-07-30b, PHASE R).
  - key: helper_log
    category: bindings.ro
    source: helper_log
    meta_ref: "@workset.logs/@{meta.box.name}.jsonl"
    box_dest: "~/.kanibako/state/helpers.jsonl"
    options: "ro"

# Image-sharing bind (Phase B, D-M8).  The host image store + the GENERATED
# `storage.conf` (additionalImageStores), routed through the category resolver
# (the seam is `image_sharing.detect_graph_root` + `image_sharing.
# write_storage_conf` feeding `core_defaults.image_default_categories`).  GATED:
# the table is injected only when image-sharing applies (the caller's conditional
# gate realizes the spec's `%if @box.share_images%` condition).  ⚑ 11a
# (2026-08-02): the PROBE feeds ONLY the `box.images_store` DEFAULT, so a failed
# probe does not gate the table — the RESOLVED key decides, and probe-fail with
# no set value leaves `@box.images_store` absent (the seam then warns and skips).
# box-side destinations + options are STATIC; the host SOURCES (the probed store
# default + the generated conf path) are injected at the seam.
images:
  # Host graph root → /var/lib/shared-images (ro).
  # THE SPEC'S OWN SPELLING (§2c ALL PROJECTS row `images`, D-M8): the host_src
  # is the @-ref `@box.images_store` — the USER KEY whose DEFAULT is the
  # runtime-probed podman graph root, injected as a floor scalar at the same
  # seam (`image_default_categories`).  Repointing `box.images_store` at any
  # cascade tier (box > workset > system file) moves this mount.  ⚑ Entry
  # RENAMED `images_store` → `images` (B3 rider): the bind row and the scalar
  # key no longer share a name.  `source:` stays the symbolic probe pointer
  # (helper_log parity); `meta_ref` is what the loader emits as host_src.
  - key: images
    category: bindings.ro
    source: images_store
    meta_ref: "@box.images_store"
    box_dest: "/var/lib/shared-images"
    options: "ro"
  # Generated storage.conf → ~/.config/containers/storage.conf (ro).
  # INTERNAL bind, NOT a key (not_keys.never_a_key): fixed location, generated
  # content — nothing for a user to configure (spec §0's test).
  - key: images_conf
    category: bindings.ro
    source: images_conf
    box_dest: "~/.config/containers/storage.conf"
    options: "ro"

# ---------------------------------------------------------------------------
# `agent.default.*` BEHAVIOR defaults (spec §2d) — the ALL-AGENTS backstop.
#
# ⚑ THE FIRST BEHAVIOR SECTION IN THIS FILE.  Everything above declares a
# bind/seed/mask CATEGORY family, keyed by box destination; this one declares
# agent-scope BEHAVIOR SCALARS, keyed by setting name.
# `core_defaults.behavior_defaults()` reads it verbatim and `start.py` merges it
# UNDER the plugin descriptor floor (descriptor last ⇒ a plugin's declared
# default still wins).
#
# ⚑ VALUES ARE STRINGS, INCLUDING THE BOOLEANS.  The floor is consumed through
# `coerce_bool` and `effective_behavior` STRINGIFIES what it returns, so a YAML
# `true` here would reach a consumer as `"True"`.  Quote them.
#
# `access` (spec :1244) is DECLARED HERE like the rest, and it is the one whose
# consumers do NOT share a clock: `config_keys.access_value_error` runs at SET time
# and `targets.assembly.resolve_access_tier` at LAUNCH.  Both read this one
# declaration through the single lazy accessor `settings_keyspace.access_default()`
# — there is no `ACCESS_DEFAULT` constant any more.
# ⚑ Its value set is CLOSED (`settings_keyspace.ACCESS_TIERS`): a spelling outside
# `restricted | editing | full` is REFUSED at read, never treated as permissive.
agent_default:
  access: "full"
  allow_helpers: "true"
  continue_mode: "true"
  bootstrap: "tmux"

# ---------------------------------------------------------------------------
# STATIC core `<scope>.env.<VAR>` defaults (spec §2d) — the file route for core
# environment variables whose value is a LITERAL.
#
# ⚑ SHAPE: scope-keyed sub-tables of `<VAR>: "<value>"`.
#
#   env:
#     system:
#       COLORTERM: "truecolor"
#     box:
#       EDITOR: "vi"
#
# ⚑ VALUES ARE STRINGS, exactly as in `agent_default:` above: an unquoted YAML
# `true`/`1` would reach the box as "True"/"1" rather than what the author wrote.
#
# ⚑ THIS IS NOT THE HOME OF THE `KANIBAKO_*` STAMPS.  Those are launch-DERIVED
# (a project name, a resolved agent, a computed path) and are spelled in exactly
# one place, `start._core_env_default_categories`.  A variable belongs here only
# when a file can hold its whole value; a variable that must be COMPUTED belongs
# there.  The derived table merges AFTER this one, so a stamp still wins a VAR
# this section also names — but naming one here is a bug, not an override.
#
# ⚑ CROSS-SCOPE TWINS REFUSE (spec §2d, `store_collapse.collapse_env`): a VAR
# declared here at one scope and written by a user at ANOTHER scope stops the
# launch naming both keys.  Pick the scope the value belongs to.
#
# EMPTY at landing, deliberately: the mechanism ships green and separately from
# any value moving into it.
env: {}
