[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kanibako-cli"
version = "1.7.2"
description = "Run AI coding agents in rootless containers with per-project isolation"
requires-python = ">=3.11"
dependencies = ["argcomplete>=3.0", "PyYAML>=6.0", "packaging>=20.0"]

[project.scripts]
kanibako = "kanibako.cli:main"

[project.entry-points."kanibako.agents"]
no_agent = "kanibako.targets.no_agent:NoAgentTarget"

[project.optional-dependencies]
# The three GATE tools (``ruff``, ``mypy``, ``pytest``) are PINNED, not floated.
# A floating gate makes a CI result ambiguous: an upstream release changes the
# verdict on source nobody touched, so a local green stops predicting CI (a
# floating ruff once reported 972 findings against a tree that was clean at the
# pinned version). Bumping a pin — and adopting whatever new rules or behaviour
# it brings — is a deliberate change of its own, made in its own commit, never a
# side effect of an unrelated install. The rest are not gate tools and float.
dev = [
    "pytest==9.0.2",
    "pytest-cov",
    "mypy==1.19.1",
    "ruff==0.15.5",
    "bump2version",
    "pexpect>=4.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kanibako" = ["py.typed"]
"kanibako.containers" = ["Containerfile.*", "tmux.conf"]
"kanibako.scripts" = ["*.sh", "kanibako-entry"]
# ⚑ THE DOT-DIR PATTERNS ARE LOAD-BEARING, even though core ships no dotfile today.
# setuptools' ``**/*`` does NOT recurse into hidden directories (the three plugin
# pyprojects document the same trap and carry the same set). ``global/template/box/
# home/`` is a BOX HOME seed: the moment a ``.claude/``, ``.config/`` or
# ``.claude.json`` lands there, a wheel built without these patterns ships it EMPTY
# and the seed delivers nothing — silently, with no build error and no launch
# warning. Added AHEAD of the first such file precisely because the trap is that the
# next person to drop one gets no signal.
"kanibako.data" = [
    "*.yaml",
    "templates/**/*", "templates/**/.*",
    "templates/.*/**/*", "templates/.*/*",
    "templates/**/.*/**/*", "templates/**/.*/*",
    "global/*", "global/**/*", "global/**/.*",
    "global/.*/**/*", "global/.*/*",
    "global/**/.*/**/*", "global/**/.*/*",
]

[tool.ruff]
target-version = "py311"
line-length = 99
# ``salvage/`` holds frozen, non-shipping reference snapshots (retired code kept
# for a possible future ``system recover``); it is not live code and is not
# linted. It is also outside ``src/`` so the wheel build never includes it.
extend-exclude = ["salvage"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
# kanibako is a namespace package split across distributions: the core ships
# kanibako/ (regular package) while each plugin contributes
# kanibako/plugins/<agent>/ with no __init__.py in kanibako/plugins/. To let
# `mypy packages/agent-<agent>/src` assign the full dotted module name (and
# thus resolve sibling imports like kanibako.plugins.claude.target), point
# mypy at every src base and enable explicit package bases.
namespace_packages = true
explicit_package_bases = true
# ``salvage/`` is a frozen non-shipping reference snapshot (see [tool.ruff]); it
# is not type-checked and is not on any src base.
exclude = ['^salvage/']
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/packages/agent-claude/src:$MYPY_CONFIG_FILE_DIR/packages/agent-goose/src:$MYPY_CONFIG_FILE_DIR/packages/agent-codex/src"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring a real container runtime (podman/docker)",
    "e2e: end-to-end tests requiring podman + kanibako-oci image",
    # Opt OUT of the KANI_TEST_SIM_UNSHARE=1 protected-canon simulation. For tests
    # OF ``unshare_chown``/``unshare_chmod`` themselves: patching the subject with
    # the stub turns real assertions into false reds.
    "no_unshare_sim: never apply the protected-canon unshare simulation",
]
addopts = "-m 'not integration and not e2e'"
