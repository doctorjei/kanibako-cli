name: Build Container Images

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push built images to GHCR (off = build-only test)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - variant: min
            base: ghcr.io/doctorjei/droste-seed:1.1.0
          - variant: oci
            base: ghcr.io/doctorjei/droste-fiber:1.1.0
          - variant: lxc
            base: ghcr.io/doctorjei/droste-thread:1.1.0
          - variant: vm
            base: ghcr.io/doctorjei/droste-hair:1.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve cli version
        id: ver
        run: echo "cli_version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push kanibako-${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: containers/
          file: containers/Containerfile.kanibako
          # Publish only on a manual dispatch with push=true. A push to main
          # builds (verifying the image) and warms the gha layer cache but does
          # NOT publish; the publish dispatch restores those cached layers
          # (cache-from below) and pushes without rebuilding.
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
          # Version-tag the manual build (e.g. :1.6.0.dev24) instead of :latest,
          # so a pre-release/dev cli pin never clobbers the prod :latest images.
          # :latest is owned by release.yml's promote path (digest copy from rc).
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/kanibako-${{ matrix.variant }}:${{ steps.ver.outputs.cli_version }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            VARIANT=${{ matrix.variant }}
            KANIBAKO_CLI_VERSION=${{ steps.ver.outputs.cli_version }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Guarded :edge advance. Only when this build was actually pushed. :edge
      # advances iff there is no current :latest, or the candidate cli_version
      # is >= the version :latest self-reports (compared on the base X.Y.Z, so a
      # .devN / -rcN suffix never blocks or confuses the sort). Digest copy of
      # the just-built version-tagged image — NO rebuild.
      - name: Advance :edge if candidate >= :latest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        env:
          REG: ${{ env.REGISTRY }}
          OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
          CAND_VER: ${{ steps.ver.outputs.cli_version }}
        run: |
          set -euo pipefail
          PKG="${REG}/${OWNER}/kanibako-${VARIANT}"
          base() { echo "$1" | sed -E 's/[-.]?(rc|dev)[0-9]+$//'; }
          latest_ver=$(docker buildx imagetools inspect "${PKG}:latest" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.version" }}' \
            2>/dev/null || true)
          if [ -z "$latest_ver" ] || \
             [ "$(printf '%s\n%s\n' "$(base "$latest_ver")" "$(base "$CAND_VER")" | sort -V | tail -n1)" = "$(base "$CAND_VER")" ]; then
            echo "Advancing :edge -> ${PKG}:${CAND_VER} (latest_ver='${latest_ver}', cand='${CAND_VER}')"
            docker buildx imagetools create --tag "${PKG}:edge" "${PKG}:${CAND_VER}"
          else
            echo "Holding :edge (cand '${CAND_VER}' < latest '${latest_ver}'); no advance."
          fi

