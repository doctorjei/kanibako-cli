# ---------------------------------------------------------------------------
# THE SHAPE RULES. `[[shape]]` reads only the declaration and asks whether it is
# the shape this project says it is -- the one mechanism here that compares the
# manifest to ITSELF rather than to the code. It is a REMINDER, not a catch: an
# agent can edit a row and the rule that governs it in one commit, exactly as it
# can with a `[[gate]]`.
#
# 🛑 A RULE THAT SELECTS NOTHING FAILS, and that is the property being bought.
# Every guard below is therefore a claim about how many rows it reaches, and the
# `examined` count the command prints is the part to read -- a rule that passes
# while narrowing to the wrong group is the failure this whole file exists to
# avoid. The counts stated in each comment were measured 2026-09-14, kanibako-cli
# `6126bae0`, kinemata `00044f2`.
#
# ⚑ THE HEADER LINE UNDERSTATES THE REGISTRY. `cli.py` prints `over N entry(s)`
# where N is `max(examined)` across the block's rules, NOT the registry's size --
# so `categories` (11 entries) prints "over 7". Read the per-rule counts.

[[shape]]
registry = "keyspace"

  # FACT: every row carries `set:`, one of exactly `file`, `cli+file`, `never`.
  # AUTHORITY: the legend at the head of the manifest's `keys:` table declares the
  # three-token vocabulary; spec §0's directional rule is what the tokens mean.
  # CATCHES: a fourth value, on ANY row.
  #
  # ⚑ IT IS NOT A SECOND COPY OF THE EXISTING TEST, AND THE DIFFERENCE IS THE
  # ELEVEN PARAMETRIC ROWS. `tests/test_settings/test_set_column_conformance.py`
  # already asserts `declared == {"cli+file", "file", "never"}` -- but over
  # `_static_rows()`, which drops every row whose id carries a `<placeholder>`.
  # Measured: 11 of the declared rows are parametric (`agent.<agent>.<key>`,
  # `meta.box.agent.<key>`, the six `meta.agent.<agent>.*` and three more), so a
  # bad `set:` cell on any of those eleven passes the suite today. This rule has no
  # guard and reaches every row.  (Re-derive, do not trust: `kinemata shape` prints
  # `set-vocabulary: N examined`.)
  [[shape.rule]]
  name = "set-vocabulary"
  field = "set"
  choices = ["file", "cli+file", "never"]

  # FACT: where a row declares `type:`, it is one of eight tokens.
  # AUTHORITY: the `type:` cells themselves; `_VALUE_FOR_TYPE` in
  # `tests/test_settings/test_set_column_conformance.py` is the code side that
  # must have a benign value per type, so a ninth token silently unexercises a row.
  # CATCHES: a typo'd or invented type, which nothing else reads until a set verb
  # does.
  #
  # ⚑ GUARDED BECAUSE THE COLUMN IS NOT UNIVERSAL, and the guard is the honest
  # statement of that: most rows carry `type:`; the ones that do not are
  # `agent.<agent>.<key>` plus the `meta.*` rows nothing here should type -- the BARE
  # MIRRORS, and those alone since the four composed `str` rows were typed.
  # (Re-derive, do not trust a figure here: `kinemata shape` prints
  # `type-vocabulary: N examined` against its own `N entry(s)` header. A count written
  # into this comment went stale twice in one day -- once when `system.state` landed
  # and once when the typing pass ran.)
  # ⚑ THE RULE ITSELF IS STATED ONCE, AT THE POINT OF USE -- the `##` header above the
  # `meta.*` group in `src/kanibako/data/keyspace-manifest.yaml`. Do not restate it
  # here: this comment drifted into a THIRD bucket the ratification never named, which
  # is the two-carriers defect the rule exists to prevent.
  # `when = { present = "type" }` makes this a rule ABOUT rows that have one, rather
  # than one naming 11 exceptions.
  [[shape.rule]]
  name = "type-vocabulary"
  when = { present = "type" }
  field = "type"
  choices = ["path", "str", "bool", "dict", "enum", "list", "int", "version_marker"]

  # FACT: `type: enum` and a `choices:` cell are the same fact, an exact IFF.
  # AUTHORITY: an enum with no members is not a type, and a member list on a row
  # of another type is a value space nothing enforces.
  # CATCHES: both halves of the drift -- an enum row that lost its members, and a
  # `choices:` list left behind on a row whose type was changed away from enum.
  #
  # ⚑ TWO GUARDED RULES, WHICH IS THE FORM `shape.py` NAMES FOR AN IFF ("an IFF is
  # two guarded rules"): each side guards on one half and claims the other. One
  # rule can express only one direction, and the direction it leaves out is the
  # one that goes unwatched. Measured: 3 rows each way, in agreement.
  [[shape.rule]]
  name = "enum-carries-choices"
  when = { field = "type", equals = "enum" }
  present = "choices"

  [[shape.rule]]
  name = "choices-means-enum"
  when = { present = "choices" }
  field = "type"
  equals = "enum"

  # FACT: every row is traced to a spec section.
  # AUTHORITY: the manifest's own header, verbatim -- "CONVENTION: every entry
  # carries `spec:` = the section it is traced from". It is stated in prose and
  # NOTHING ENFORCES IT, which is the gap this closes. The same cell is already
  # load-bearing elsewhere in this file: the registry above declares
  # `clause_field = "spec"`, so a row without one is also a row `claims` cannot link.
  # CATCHES: a row added without its clause -- the edit that is shorter, invisible
  # and rewarded, which is the spend test this mechanism is judged by.
  #
  # ⚑ `present` IS KEY-PRESENCE, NOT NON-BLANKNESS. A row carrying `spec: ""`
  # would pass. Measured today: all 100 rows carry the cell and none is blank, so
  # nothing is being papered over -- but do not read this rule as promising more
  # than it claims.
  [[shape.rule]]
  name = "spec-on-every-row"
  present = "spec"

# ---------------------------------------------------------------------------
# FACT: the nine delivery families split into TWO KEY SHAPES, and each shape is
# declared by a pair of flags. Seven are bind-shaped -- `masks`, `bindings.ro`,
# `bindings.rw`, `caches`, `common`, `seeded`, `synced` -- and carry
# `terminal_key: true` with `dest_keyed: true`: the key ends at the family and the
# destination is the sub-key. Two are parametric -- `env`, `secret_path` -- and
# carry NEITHER, because the sub-key is a name the user chooses.
# AUTHORITY: the `categories:` records are the SPEC side of the single-route
# invariant; the shape of a family's key is what `settings/settings_categories.py`
# resolves against.
# CATCHES: a family whose flags stop matching its shape -- a new bind-shaped family
# added without `dest_keyed`, or a parametric one that acquires a flag it cannot
# honour. A flag is one line in a record nobody reads until a launch does.
#
# 🛑 THE GUARD IS `cli_set`, AND THE OBVIOUS ALTERNATIVE IS WRONG. The
# `categories:` section also holds TWO NON-FAMILY records -- `scopes` (a list) and
# `scopes_spec` (a string) -- which the mapping adapter yields as `extra =
# {"value": ...}`. They carry no flags at all, so `when = { absent = "parametric" }`
# sweeps both into the bind-shaped group: measured, that guard selects 9 and
# reports `scopes` and `scopes_spec` as violations, rc=1. `cli_set` is present on
# the nine families and on neither of the two, so guarding on its VALUE partitions
# exactly the families -- 7 on `false`, 2 on `true`.
# ⚑ AND THE GUARD MUST NOT READ WHAT THE CLAIM ASSERTS, or the rule checks a row
# against itself. `cli_set` is a third, independent cell; `terminal_key` would not
# be. (The same two records are the KNOWN, accepted red in the `[[parity]]` table
# below -- 2 unproduced. They are metadata inside the table of categories, and
# whether that shape is right is a manifest question settled in neither place.)
#
# ⚑ FOUR RULES FOR TWO FACTS, because one rule carries one claim: asserting both
# flags on both sides is 2 x 2. Naming them separately is also what makes a
# finding actionable -- `bind-shaped-is-dest-keyed: synced` says which flag on
# which family, where one merged rule would say only "synced is mis-shaped".
[[shape]]
registry = "categories"

  [[shape.rule]]
  name = "bind-shaped-is-terminal-key"
  when = { field = "cli_set", equals = false }
  field = "terminal_key"
  equals = true

  [[shape.rule]]
  name = "bind-shaped-is-dest-keyed"
  when = { field = "cli_set", equals = false }
  field = "dest_keyed"
  equals = true

  [[shape.rule]]
  name = "parametric-is-not-terminal-key"
  when = { field = "cli_set", equals = true }
  absent = "terminal_key"

  [[shape.rule]]
  name = "parametric-is-not-dest-keyed"
  when = { field = "cli_set", equals = true }
  absent = "dest_keyed"

# ---------------------------------------------------------------------------
# FACT: every field of `policy.seed_whitelists` is a scope row (it carries
# `root`) or one of the two classified POLICY fields, and both of those are
# still there. `test_manifest_enforces` A2, both directions.
# AUTHORITY: the classification is the test's `POLICY_FIELDS`, stated here as a
# claim. `[[parity]] seed-scopes` pins the `root`-carrying rows to the code's
# scopes, so the two together are A2's `fields == scopes ∪ POLICY_FIELDS`.
# CATCHES: a new field that is neither (it lands in no parity, because
# `seed-scopes` selects on `root`); a policy field deleted or turned into a
# scope row.
# ⚑ THE STALE DIRECTION RIDES ON "A RULE THAT SELECTS NOTHING FAILS": one rule
# per policy field, guarded on its name, so a deleted field is a VACUOUS rule.
# Measured 2026-09-24, kinemata `0.3.0`: 3 rules, all satisfied, examined 2 / 1
# / 1. CONTROLS in a scratch copy, each rc=1:
#   `audit: strict` added:        `audit: a-rootless-field-is-a-classified-policy-field`
#   `traversal_defences` deleted: `VACUOUS 'traversal-defences-is-still-a-policy-field':
#                                 examined no entry, so it checked nothing`
#   `default` given a `root`:     `default: default-is-still-a-policy-field`
[[shape]]
registry = "seed-whitelist-fields"

  [[shape.rule]]
  name = "a-rootless-field-is-a-classified-policy-field"
  when = { absent = "root" }
  id_matches = '^(default|traversal_defences)$'

  [[shape.rule]]
  name = "default-is-still-a-policy-field"
  when = { id_matches = '^default$' }
  absent = "root"

  [[shape.rule]]
  name = "traversal-defences-is-still-a-policy-field"
  when = { id_matches = '^traversal_defences$' }
  absent = "root"

# ---------------------------------------------------------------------------
# THE GATE INVENTORY. `[[gate]]` is verified by the `claims` command, so a gate
# must sit in the config `claims` is run with -- which, since the 2026-09-14
# merge, is the only config there is.
#
# 🛑 THE GATES ARE LAST IN THE FILE ON PURPOSE, AND THIS REPOSITORY HAS ALREADY
# PAID FOR THE LESSON ONCE. These are TOML TABLES: every key after a `[[gate]]`
# header belongs to that gate, not to `[claims]`. Placed between `suffixes` and
# `historical` -- which is where they first went, in the claims config that has
# since merged into this one -- they silently adopted the `historical` list, the
# suppression stopped applying, and the claim count moved 1652 -> 1991 with
# nothing in the output saying a table had changed owner. Add a `[claims]` key
# up beside `[claims]` at the top of this file, never here.
#
# What this buys, stated honestly because the tool's own docs are blunt about it:
# deleting a step from CI now FAILS `claims` instead of passing quietly. An agent
# can still delete the step and this declaration in one commit. That turns silent
# removal into STATED removal -- a reminder, not a catch. What would make it a
# catch is branch protection with the job as a required status check, which lives
# outside this repo and is not ours to set.
#
# `where` is pinned rather than left to the default (any file under
# `.github/workflows`), because these commands live in the Tests workflow
# beside the suite, not in a workflow of their own.
[[gate]]
command = "kinemata check"
where = [".github/workflows/test.yml"]
note = "code that re-derives a declared fact"

[[gate]]
command = "kinemata parity"
where = [".github/workflows/test.yml"]
note = "a registry's declared identifiers against what the code prints"

[[gate]]
command = "kinemata claims"
where = [".github/workflows/test.yml"]
note = "documentation claims, and this inventory"

[[gate]]
command = "kinemata shape"
where = [".github/workflows/test.yml"]
note = "the manifest's shape against itself"

[[gate]]
command = "kinemata undeclared"
where = [".github/workflows/test.yml"]
note = "an identifier the tree uses that no closed registry declares"
