# ---------------------------------------------------------------------------
# THE PARITY ORACLES. Each one runs a command that prints what the CODE really
# produces and compares that set against what a registry above DECLARES.
#
# 🛑 NOTHING BELOW THIS LINE MAY BE A `[[registry]]`, AND THAT IS NOT COSMETIC.
# These are TOML TABLES: every key after a `[[parity]]` or `[[gate]]` header
# belongs to that table, not to the registry above it. Keep new `[[registry]]`
# tables ABOVE this line and new `[claims]` keys up beside `[claims]`.
#
# ⚑ AN ORACLE READS THE CODE, NEVER THE FILE IT IS BEING CHECKED AGAINST. One
# that parsed `keyspace-manifest.yaml` would compare that file with itself and
# pass for a tree in any state -- and a vacuous run is indistinguishable from a
# clean one, which is the failure mode this whole adoption exists to avoid.
#
# ⚑ `{python}` IS SUBSTITUTED WITH THE INTERPRETER KINEMATA IS RUNNING UNDER
# (`claims.run_oracle`), so the oracle cannot silently read a different
# environment's kanibako. It follows that kanibako must be IMPORTABLE beside
# kinemata: the `conformance` job installs the project for exactly this reason,
# and an oracle that cannot run is a FAILURE no baseline can accept.
#
# ⚑ `extract` NEEDS ITS OWN `(?m)`. The pattern is applied with `finditer` to
# stdout and stderr JOINED, not line by line, so a bare `^` anchors at the start
# of the whole output and matches once. Group 1 of each match is one identifier.

# FACT under test: the manifest's `categories:` section and `_DELIVERY` name the
# same delivery families AND agree on each family's DELIVERY MECHANISM. The prefix
# on each printed line is there so that nothing incidental on either stream -- a
# warning, a traceback -- can be read as a family name.
#
# ⚑ TWO HALVES, AND MEMBERSHIP STILL RUNS. `field = "delivery"` adds the VALUE
# half: for every family both sides name, the manifest's `delivery:` cell is
# compared with the `_DELIVERY` tag the oracle prints. Membership is unaffected --
# a family on one side only is still a finding, so the value half cannot be made
# vacuous by an oracle that goes quiet.
#
# ⚑ `authority = "declared"` -- THE MANIFEST CELL IS THE EXPECTED VALUE AND THE
# CODE IS ON TRIAL. That is the direction because the nine values were sourced
# from the SPECIFICATIONS, not read off `_DELIVERY`: seven from the five-arm fold
# table in the system design, `env` from its by-name exclusion from all five arms,
# `secret_path` from the system design's ARM'S-LENGTH rule. The spec is authority
# over the code here, so a divergence means the code moved away from the declared
# shape -- never that the manifest "has not kept up".
#
# ⚑ THE LITERALS ARE SPELLED UPPERCASE ON BOTH SIDES (`Delivery = Literal["COPY",
# "MOUNT", "ENV"]`), so this is a plain equality and needs NO `translate` -- a
# normalization that is wrong does not fail, it passes.
#
# ⚑ `extract` HAS TWO GROUPS BECAUSE IT MUST: group 1 the family, group 2 its
# value. A one-group extract beside a `field` does not report a divergence -- it
# BLOCKS. The identifier group excludes `=` so the greedy split lands in the one
