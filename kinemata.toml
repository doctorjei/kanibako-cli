# ---------------------------------------------------------------------------
# FACT: `self` is a FILE-SURFACE alias and nothing else. The per-agent file's
# root table is spelled in exactly one module.
# AUTHORITY: `settings/agent_file.py` is the boundary; every other site reaches
# the file through a slot, a level, or `file_spelling()`.
#
# ⚑ A SEPARATE REGISTRY BECAUSE OF `match_mode`, WHICH IS PER REGISTRY, NOT PER
# ENTRY. This entry MUST match inside string literals only. In the `code` mode
# the `seams` registry above uses, `self` matches the first parameter of every
# method in the tree -- thousands of sites, none of them the fact.
#
# 🛑 THE ANTIPATTERN IS WRITTEN TO FULL-MATCH ON PURPOSE. In `strings` mode
# kinemata grades a hit STRONG when the regex fullmatches the literal and WEAK
# when it merely occurs inside one, and only strong findings gate. A bare
# `self` pattern would grade `"self.model"` weak and the gate would not see it,
# so the pattern wraps itself in `.*` to fullmatch any literal CONTAINING the
# word -- which is what the census asserts.
#
# ⚑ THE PROCFS LOOKBEHIND IS THE TEST'S OWN EXEMPTION, NOT A NEW CARVE-OUT:
# `test_agent_file_boundary.py` skips any value containing `/proc/self`, the
# KERNEL's self-reference (`runtime/image_sharing.py`, `/proc/self/mountinfo`).
# `(?<!/proc/)` is narrower than the test -- it excuses that one occurrence
# rather than the whole literal it sits in.
#
# 🛑 ONE PLACE THIS IS WEAKER THAN THE TEST, MEASURED NOT ASSUMED: an F-STRING.
# The census walks `ast.Constant`, so `f"self.{agent}.model"` presents it the
# part `"self."` and it fires. kinemata's literal extractor does not hand the
# parts of a JoinedStr to the matcher, and the same line is NOT reported here.
# Planted and confirmed silent 2026-09-14. ⇒ THIS ENTRY DOES NOT RETIRE
# `test_census`; it is a second, wider-corpus arm of the same pin, and the
# f-string case is the test's alone.
[[registry]]
name = "file-surface"
kind = "code-patterns"
match_mode = "strings"

  [[registry.entry]]
  id = "AGENT_FILE_ROOT"
  antipatterns = ['(?s).*(?<![\w.])(?<!/proc/)self(?![\w-]).*']
  home = ["src/kanibako/settings/agent_file.py"]
  note = "the per-agent file's root section; a literal elsewhere is a leaked file address"

# ---------------------------------------------------------------------------
# THE PARITY ORACLES. Each one runs a command that prints what the CODE really
# produces and compares that set against what a registry above DECLARES.
#
# 🛑 NOTHING BELOW THIS LINE MAY BE A `[[registry]]`, AND THAT IS NOT COSMETIC.
# These are TOML TABLES: every key after a `[[parity]]` or `[[gate]]` header
# belongs to that table, not to the registry above it. Keep new `[[registry]]`
# tables ABOVE this line and new `[claims]` keys up beside `[claims]`.
#
# ⚑ AN ORACLE READS THE CODE, NEVER THE FILE IT IS BEING CHECKED AGAINST. One
# that parsed `keyspace-manifest.yaml` would compare that file with itself and
# pass for a tree in any state -- and a vacuous run is indistinguishable from a
# clean one, which is the failure mode this whole adoption exists to avoid.
#
# ⚑ `{python}` IS SUBSTITUTED WITH THE INTERPRETER KINEMATA IS RUNNING UNDER
# (`claims.run_oracle`), so the oracle cannot silently read a different
# environment's kanibako. It follows that kanibako must be IMPORTABLE beside
# kinemata: the `conformance` job installs the project for exactly this reason,
# and an oracle that cannot run is a FAILURE no baseline can accept.
#
# ⚑ `extract` NEEDS ITS OWN `(?m)`. The pattern is applied with `finditer` to
# stdout and stderr JOINED, not line by line, so a bare `^` anchors at the start
# of the whole output and matches once. Group 1 of each match is one identifier.

# FACT under test: the manifest's `categories:` section and `_DELIVERY` name the
# same delivery families AND agree on each family's DELIVERY MECHANISM. The prefix
# on each printed line is there so that nothing incidental on either stream -- a
# warning, a traceback -- can be read as a family name.
#
# ⚑ TWO HALVES, AND MEMBERSHIP STILL RUNS. `field = "delivery"` adds the VALUE
# half: for every family both sides name, the manifest's `delivery:` cell is
# compared with the `_DELIVERY` tag the oracle prints. Membership is unaffected --
# a family on one side only is still a finding, so the value half cannot be made
# vacuous by an oracle that goes quiet.
#
# ⚑ `authority = "declared"` -- THE MANIFEST CELL IS THE EXPECTED VALUE AND THE
# CODE IS ON TRIAL. That is the direction because the nine values were sourced
# from the SPECIFICATIONS, not read off `_DELIVERY`: seven from the five-arm fold
# table in the system design, `env` from its by-name exclusion from all five arms,
# `secret_path` from the system design's ARM'S-LENGTH rule. The spec is authority
# over the code here, so a divergence means the code moved away from the declared
# shape -- never that the manifest "has not kept up".
#
# ⚑ THE LITERALS ARE SPELLED UPPERCASE ON BOTH SIDES (`Delivery = Literal["COPY",
# "MOUNT", "ENV"]`), so this is a plain equality and needs NO `translate` -- a
# normalization that is wrong does not fail, it passes.
#
# ⚑ `extract` HAS TWO GROUPS BECAUSE IT MUST: group 1 the family, group 2 its
# value. A one-group extract beside a `field` does not report a divergence -- it
# BLOCKS. The identifier group excludes `=` so the greedy split lands in the one
# place the printed line puts it.
#
# ⚑ EXPECTED RED, AND THE RED IS THE FINDING RATHER THAN A FAULT IN THIS TABLE.
# Measured 2026-09-14 at `71c327e3`, kinemata `a365474`: 0 undeclared, 2
# unproduced -- `scopes` and `scopes_spec`. RE-MEASURED the same day at
# `366afce0`, kinemata `00044f2`: unchanged -- 11 declared, 9 produced, in
# agreement, the same 2 accepted by date. Those two are METADATA sitting
# inside the table of categories rather than categories themselves, so the
# manifest declares eleven keys under `categories:` where the code declares nine
# families. Whether that shape is right is a manifest-and-spec question and is
# NOT settled here: filtering the two out of the registry above would make the
# check agree with itself and report nothing, which is the same as not having
# it. They are accepted BY DATE in `.kinemata-baseline.json`.
[[parity]]
registry = "categories"
command = ["{python}", "-c", """
from kanibako.settings.settings_categories import _DELIVERY
for name, delivery in _DELIVERY.items():
    print(f"kanibako-category: {name}={delivery}")
"""]
extract = '(?m)^kanibako-category: ([^\s=]+)=(\S+)$'
field = "delivery"
authority = "declared"

# ---------------------------------------------------------------------------
# THE 0.1.0 TABLES. Five declarations landed 2026-09-15 on kinemata `0.1.0`, four
# of them offered by the kinemata box already run against this tree and adopted
# here only after being RE-RUN against it. Every number below is the tool's own
# output line and its exit code, `kinemata parity -c <probe>` from the repository
# root, probe configs under `/tmp` and gone.
#
# 🛑 EACH ONE CARRIES ITS NEGATIVE CONTROL, AND THE CONTROL IS THE EVIDENCE. A
# declaration that cannot be made to fail is not a check, it is a line that says
# there is one. The controls were run, not reasoned about; where a control is one
# key changed, the change is named so it can be repeated.
#
# 🛑 NONE OF THESE RETIRES A HAND-WRITTEN TEST, and that is not deferred tidying.
# Each reaches ONE of the claims its test makes -- see the per-table notes -- so
# deleting the test would remove a capability to satisfy a design. What a
# declaration actually replaces is a separate decision, made against the test.

# Measured 2026-09-15, kinemata `0.1.0`:
#   `# bind-shaped: 7 declared, 7 produced, in agreement.`  rc=0
# NEGATIVE CONTROL, same table with `where = { absent = "parametric" }` on the
# registry: rc=1, `FAIL: 2 disagreement(s)`, naming `scopes` and `scopes_spec`
# as "declared, produced by nothing" -- the two non-family records, which is the
# group the `cli_set` guard exists to exclude. The comparison discriminates.
# ⚑ THE UPSTREAM PREDICATE WAS RUN TOO and reports the identical line over the
# identical seven; the registry note above records why the guard is kept instead.
# ⚑ THIS IS THE `manifest == code` HALF OF `TestTheCategoriesBlockShape` ONLY.
[[parity]]
registry = "bind-shaped"
command = ["{python}", "-c", """
from kanibako.settings.settings_keyspace import TERMINAL_CATEGORY_TAILS
for tail in sorted(TERMINAL_CATEGORY_TAILS):
    print(".".join(tail))
"""]
extract = '(?m)^(\S+)$'

# Measured 2026-09-15, kinemata `0.1.0`:
#   `# workset-denials: 8 declared, 1 produced, every identifier the code
#   produces is declared.`  rc=0
# ⚑ `relation` IS WHAT MAKES THIS WRITABLE, and the alternative is measured, not
# assumed. The same table WITHOUT the `relation` line: rc=1, `FAIL: 7
# disagreement(s)`, every other deny row "declared, produced by nothing" -- seven
# findings that are not wrong about anything, that a baseline would have to
# accept, and that would have to be RE-ACCEPTED every time a deny row lands.
# NEGATIVE CONTROL, and it is a different question from that one: with the oracle
# printing `config.BOX_META_FILE` instead, rc=1, `FAIL: 1 disagreement(s)`,
# `box.yaml: produced, declared by nothing`. A containment that admits anything
# would have passed that; this one does not.
# ⚑ `declared_contains` FAILS A RUN WHOSE ORACLE PRODUCED NOTHING -- upstream's
# own rule, and the reason a vacuous run here cannot read as a clean one.
# 🛑 THIS REACHES THE `workset` ARM OF A THREE-SCOPE TEST.
# `TestTheSettingsFileDenialsNameRealFiles.test_the_deny_row_is_the_code_filename`
# is parametrized over `box`, `workset` and `agent` against `BOX_META_FILE`,
# `WORKSET_META_FILE` and `AGENT_META_FILE`; only the workset deny map is
# declared here, so the other two scopes stay with the test.
[[parity]]
registry = "workset-denials"
relation = "declared_contains"
command = ["{python}", "-c", """
from kanibako.settings import config
print(config.WORKSET_META_FILE)
"""]
extract = '(?m)^(\S+)$'

# Measured 2026-09-15, kinemata `0.1.0`:
#   `# standalone-absences: 9 declared, 9 produced, no identifier is both
#   declared and produced.`  rc=0
# NEGATIVE CONTROL, the oracle pointed at the PRIMARY floor instead: rc=1,
# `FAIL: 3 disagreement(s)` naming `workset.kuid`, `workset.registry` and
# `workset.template` as "declared and produced, where neither may be" -- the
# three that floor really does emit, which reproduces upstream's control on our
# data exactly.
# 🛑 THIS COVERS THE SECOND OF THE TEST'S TWO ASSERTIONS, NOT THE FIRST.
# `test_the_standalone_arm_is_an_absence_on_both_sides` asserts (1) the arm is
# `<None>` or a `<…>` placeholder and (2) the floor emits no key for it. The
# predicate SELECTS on (1), so a row whose arm became a real value drops out of
# the view rather than failing -- the selector limit stated at the head of the
# narrowed views. (2) is what this table checks. The test keeps (1).
[[parity]]
registry = "standalone-absences"
relation = "disjoint"
command = ["{python}", "-c", """
from kanibako.settings.settings_launch import workset_anchor_floor
for key in sorted(workset_anchor_floor(mode="standalone")):
    print(key)
"""]
extract = '(?m)^(\S+)$'

# Measured 2026-09-15, kinemata `0.1.0`:
#   `# never-settable-paths: 13 declared, 36 produced, no identifier is both
#   declared and produced.`  rc=0
# NEGATIVE CONTROL, the registry widened to `where = { field = "type", equals =
# "path" }` -- every path row, settable ones included: rc=1, `FAIL: 36
# disagreement(s)`, all "declared and produced, where neither may be". So the
# `set: never` half of the predicate is doing the work, and the disjointness is
# not true of path rows in general.
# ⚑ OUR NUMBERS ARE NOT UPSTREAM'S, AND THE DIFFERENCE IS THE DECLARATION. They
# report `1 declared, 39 produced` for this shape; re-run here it is 13 and 36.
# 39 is the floor the sibling test in `TestThePathTypeColumnHasOneCodeCarrier`
# pins on the SETTABLE path rows, parametric spellings included -- so their
# produced side was the manifest's settable rows handed to the predicate, which
# is the weakness they flag about their own version: the oracle is derived from
# the declaration.
# ⚑ THE ORACLE HERE ENUMERATES FROM THE CODE INSTEAD. `KEY_TYPES` is the code's
# own table, so the produced side owes the manifest nothing; the predicate is
# then run over it, which is the function the claim is about. 36 of its entries
# are claimed as paths.
# 🛑 WHAT THAT COSTS, SO THE GREEN IS NOT READ AS MORE THAN IT IS: `KEY_TYPES`
# holds FIXED spellings only. `is_path_valued_key` also claims three PARAMETRIC
# families no table enumerates, and the two never-settable parametric rows
# (`meta.agent.<agent>.{path,settings}`) carry a `<agent>` PLACEHOLDER that no
# oracle prints, so those two are in the declared side and could not collide with
# anything whatever this table did. The hand-written test substitutes a node and
# reaches them. It stays.
[[parity]]
registry = "never-settable-paths"
relation = "disjoint"
command = ["{python}", "-c", """
from kanibako.settings.config_keys import KEY_TYPES, is_path_valued_key
for key in sorted(KEY_TYPES):
    if is_path_valued_key(key):
        print(key)
"""]
extract = '(?m)^(\S+)$'

# ---------------------------------------------------------------------------
# THE FIRST VALUE COMPARISON THIS FILE MAKES AGAINST A MODE-KEYED ROW. A path
# `field` is new in `0.1.0`: `["default", "primary"]` reaches the `primary` arm of
# a row's `default:` map, where a bare `field = "default"` reaches the map.
#
# Measured 2026-09-15, kinemata `0.1.0`:
#   `# workset-auth-chain: 3 declared, 3 produced, in agreement, agreeing on
#   default.primary.`  rc=0
# NEGATIVE CONTROL, the oracle moved to `mode="standalone"` with the declaration
# still reading `default.primary`: rc=1, `FAIL: 3 disagreement(s)`, each naming
# the pair, e.g. `workset.auth.share_allowed: default.primary declared
# '@system.auth.share_allowed', code produces 'False'`. The values are compared,
# not merely the names.
# ⚑ SECOND CONTROL, AND IT IS THE MEMBERSHIP FIX UPSTREAM SHIPPED, SEEN RUNNING.
# The same table with `field = "default"` -- the bare key, reaching the mode map:
# rc=1, and the report is `BLOCKED: declares workset.auth.share_allowed with a
# 'default' holding dict, which is not a scalar or a list of them and has no
# spelling an oracle could be expected to print`. Under the build CI pinned until
# today that block ALSO threw away the membership result, so a run like this one
# reported nothing about a membership question it had never looked at. 18 of the
# 67 rows that carry a `default:` hold a dict (re-measured here 2026-09-15;
# upstream's mail says 66), so the silence was ours to inherit.
# ⚑ AND THE ONE `field` TABLE THIS FILE ALREADY HAD WAS NEVER AFFECTED, checked
# rather than assumed: `[[parity]] categories` compares `delivery`, a scalar on
# all nine families, so no cell of it could block. Re-run under `0.1.0` it reads
# `11 declared, 9 produced, in agreement, agreeing on delivery`, rc=0 -- the same
# line, and the same two by-date acceptances, as under the previous pin.
#
# 🛑 THE `standalone` ARM OF THESE ROWS IS NOT EXPRESSIBLE, and the reason is a
# real limit rather than an omission. `workset.auth.path` declares `standalone:
# null`, and on the declared side a null arm and a missing arm are the same claim
# ("no value declared"); on the produced side the floor emits the key with a
# `None` value. An oracle that prints it diverges, an oracle that skips it goes
# `unproduced`, and there is no third spelling. The `primary` arm is landed; the
# `standalone` arm stays with the hand-written test.
# 🛑 SO IS THE WIDER CORPUS, FOR A SHARPER REASON: 14 rows carry a per-mode
# `default:`, and the two floors together answer for 8 of them -- `workspaces`,
# `channelroot` and the four `channels.*` are resolved from a real workset root,
# not produced as formulas. Comparing values over the 8 needs `field` together
# with `relation = "declared_contains"`, and `0.1.0` refuses that combination by
# name ("a value comparison needs identifiers on both sides, which is the thing
# this relation is about"). Reported upstream rather than worked around.
[[parity]]
registry = "workset-auth-chain"
command = ["{python}", "-c", """
from kanibako.settings.settings_launch import auth_chain_floor
for name, value in sorted(auth_chain_floor(mode="primary", agent_name="default").items()):
    if name.startswith("workset.auth."):
        print(f"kanibako-auth: {name}={value}")
"""]
extract = '(?m)^kanibako-auth: ([^\s=]+)=(\S+)$'
field = ["default", "primary"]
authority = "declared"

# ---------------------------------------------------------------------------
# THE SHAPE RULES. `[[shape]]` reads only the declaration and asks whether it is
# the shape this project says it is -- the one mechanism here that compares the
# manifest to ITSELF rather than to the code. It is a REMINDER, not a catch: an
# agent can edit a row and the rule that governs it in one commit, exactly as it
# can with a `[[gate]]`.
#
# 🛑 A RULE THAT SELECTS NOTHING FAILS, and that is the property being bought.
# Every guard below is therefore a claim about how many rows it reaches, and the
# `examined` count the command prints is the part to read -- a rule that passes
# while narrowing to the wrong group is the failure this whole file exists to
# avoid. The counts stated in each comment were measured 2026-09-14, kanibako-cli
# `6126bae0`, kinemata `00044f2`.
#
# ⚑ THE HEADER LINE UNDERSTATES THE REGISTRY. `cli.py` prints `over N entry(s)`
# where N is `max(examined)` across the block's rules, NOT the registry's size --
# so `categories` (11 entries) prints "over 7". Read the per-rule counts.

[[shape]]
registry = "keyspace"

  # FACT: every row carries `set:`, one of exactly `file`, `cli+file`, `never`.
  # AUTHORITY: the legend at the head of the manifest's `keys:` table declares the
  # three-token vocabulary; spec §0's directional rule is what the tokens mean.
  # CATCHES: a fourth value, on ANY row.
  #
  # ⚑ IT IS NOT A SECOND COPY OF THE EXISTING TEST, AND THE DIFFERENCE IS THE
  # ELEVEN PARAMETRIC ROWS. `tests/test_settings/test_set_column_conformance.py`
  # already asserts `declared == {"cli+file", "file", "never"}` -- but over
  # `_static_rows()`, which drops every row whose id carries a `<placeholder>`.
  # Measured: 101 rows declared, 11 of them parametric (`agent.<agent>.<key>`,
  # `meta.box.agent.<key>`, the six `meta.agent.<agent>.*` and three more), so a
  # bad `set:` cell on any of those eleven passes the suite today. This rule has no
  # guard and reaches all 101.  (Re-derive, do not trust: `kinemata shape` prints
  # `set-vocabulary: N examined`.)
  [[shape.rule]]
  name = "set-vocabulary"
  field = "set"
  choices = ["file", "cli+file", "never"]

  # FACT: where a row declares `type:`, it is one of eight tokens.
  # AUTHORITY: the `type:` cells themselves; `_VALUE_FOR_TYPE` in
  # `tests/test_settings/test_set_column_conformance.py` is the code side that
  # must have a benign value per type, so a ninth token silently unexercises a row.
  # CATCHES: a typo'd or invented type, which nothing else reads until a set verb
  # does.
  #
  # ⚑ GUARDED BECAUSE THE COLUMN IS NOT UNIVERSAL, and the guard is the honest
  # statement of that: most rows carry `type:`; the ones that do not are
  # `agent.<agent>.<key>` plus the `meta.*` rows nothing here should type -- the BARE
  # MIRRORS and a handful of composed `str` rows the ratified pass did not reach.
  # (Re-derive, do not trust a figure here: `kinemata shape` prints
  # `type-vocabulary: N examined` against its own `N entry(s)` header. A count written
  # into this comment went stale twice in one day -- once when `system.state` landed
  # and once when the typing pass ran.)
  # ⚑ THE RULE ITSELF IS STATED ONCE, AT THE POINT OF USE -- the `##` header above the
  # `meta.*` group in `src/kanibako/data/keyspace-manifest.yaml`. Do not restate it
  # here: this comment drifted into a THIRD bucket the ratification never named, which
  # is the two-carriers defect the rule exists to prevent.
  # `when = { present = "type" }` makes this a rule ABOUT rows that have one, rather
  # than one naming 11 exceptions.
  [[shape.rule]]
  name = "type-vocabulary"
  when = { present = "type" }
  field = "type"
  choices = ["path", "str", "bool", "dict", "enum", "list", "int", "version_marker"]

  # FACT: `type: enum` and a `choices:` cell are the same fact, an exact IFF.
  # AUTHORITY: an enum with no members is not a type, and a member list on a row
  # of another type is a value space nothing enforces.
  # CATCHES: both halves of the drift -- an enum row that lost its members, and a
  # `choices:` list left behind on a row whose type was changed away from enum.
  #
  # ⚑ TWO GUARDED RULES, WHICH IS THE FORM `shape.py` NAMES FOR AN IFF ("an IFF is
  # two guarded rules"): each side guards on one half and claims the other. One
  # rule can express only one direction, and the direction it leaves out is the
  # one that goes unwatched. Measured: 3 rows each way, in agreement.
  [[shape.rule]]
  name = "enum-carries-choices"
  when = { field = "type", equals = "enum" }
  present = "choices"

  [[shape.rule]]
  name = "choices-means-enum"
  when = { present = "choices" }
  field = "type"
  equals = "enum"

  # FACT: every row is traced to a spec section.
  # AUTHORITY: the manifest's own header, verbatim -- "CONVENTION: every entry
  # carries `spec:` = the section it is traced from". It is stated in prose and
  # NOTHING ENFORCES IT, which is the gap this closes. The same cell is already
  # load-bearing elsewhere in this file: the registry above declares
  # `clause_field = "spec"`, so a row without one is also a row `claims` cannot link.
  # CATCHES: a row added without its clause -- the edit that is shorter, invisible
  # and rewarded, which is the spend test this mechanism is judged by.
  #
  # ⚑ `present` IS KEY-PRESENCE, NOT NON-BLANKNESS. A row carrying `spec: ""`
  # would pass. Measured today: all 100 rows carry the cell and none is blank, so
  # nothing is being papered over -- but do not read this rule as promising more
  # than it claims.
  [[shape.rule]]
  name = "spec-on-every-row"
  present = "spec"

# ---------------------------------------------------------------------------
# FACT: the nine delivery families split into TWO KEY SHAPES, and each shape is
# declared by a pair of flags. Seven are bind-shaped -- `masks`, `bindings.ro`,
# `bindings.rw`, `caches`, `common`, `seeded`, `synced` -- and carry
# `terminal_key: true` with `dest_keyed: true`: the key ends at the family and the
# destination is the sub-key. Two are parametric -- `env`, `secret_path` -- and
# carry NEITHER, because the sub-key is a name the user chooses.
# AUTHORITY: the `categories:` records are the SPEC side of the single-route
# invariant; the shape of a family's key is what `settings/settings_categories.py`
# resolves against.
# CATCHES: a family whose flags stop matching its shape -- a new bind-shaped family
# added without `dest_keyed`, or a parametric one that acquires a flag it cannot
# honour. A flag is one line in a record nobody reads until a launch does.
#
# 🛑 THE GUARD IS `cli_set`, AND THE OBVIOUS ALTERNATIVE IS WRONG. The
# `categories:` section also holds TWO NON-FAMILY records -- `scopes` (a list) and
# `scopes_spec` (a string) -- which the mapping adapter yields as `extra =
# {"value": ...}`. They carry no flags at all, so `when = { absent = "parametric" }`
# sweeps both into the bind-shaped group: measured, that guard selects 9 and
# reports `scopes` and `scopes_spec` as violations, rc=1. `cli_set` is present on
# the nine families and on neither of the two, so guarding on its VALUE partitions
# exactly the families -- 7 on `false`, 2 on `true`.
# ⚑ AND THE GUARD MUST NOT READ WHAT THE CLAIM ASSERTS, or the rule checks a row
# against itself. `cli_set` is a third, independent cell; `terminal_key` would not
# be. (The same two records are the KNOWN, accepted red in the `[[parity]]` table
# below -- 2 unproduced. They are metadata inside the table of categories, and
# whether that shape is right is a manifest question settled in neither place.)
#
# ⚑ FOUR RULES FOR TWO FACTS, because one rule carries one claim: asserting both
# flags on both sides is 2 x 2. Naming them separately is also what makes a
# finding actionable -- `bind-shaped-is-dest-keyed: synced` says which flag on
# which family, where one merged rule would say only "synced is mis-shaped".
[[shape]]
registry = "categories"

  [[shape.rule]]
  name = "bind-shaped-is-terminal-key"
  when = { field = "cli_set", equals = false }
  field = "terminal_key"
  equals = true

  [[shape.rule]]
  name = "bind-shaped-is-dest-keyed"
  when = { field = "cli_set", equals = false }
  field = "dest_keyed"
  equals = true

  [[shape.rule]]
  name = "parametric-is-not-terminal-key"
  when = { field = "cli_set", equals = true }
  absent = "terminal_key"

  [[shape.rule]]
  name = "parametric-is-not-dest-keyed"
  when = { field = "cli_set", equals = true }
  absent = "dest_keyed"

# ---------------------------------------------------------------------------
# THE GATE INVENTORY. `[[gate]]` is verified by the `claims` command, so a gate
# must sit in the config `claims` is run with -- which, since the 2026-09-14
# merge, is the only config there is.
#
# 🛑 THE GATES ARE LAST IN THE FILE ON PURPOSE, AND THIS REPOSITORY HAS ALREADY
# PAID FOR THE LESSON ONCE. These are TOML TABLES: every key after a `[[gate]]`
# header belongs to that gate, not to `[claims]`. Placed between `suffixes` and
# `historical` -- which is where they first went, in the claims config that has
# since merged into this one -- they silently adopted the `historical` list, the
# suppression stopped applying, and the claim count moved 1652 -> 1991 with
# nothing in the output saying a table had changed owner. Add a `[claims]` key
# up beside `[claims]` at the top of this file, never here.
#
# What this buys, stated honestly because the tool's own docs are blunt about it:
# deleting a step from CI now FAILS `claims` instead of passing quietly. An agent
# can still delete the step and this declaration in one commit. That turns silent
# removal into STATED removal -- a reminder, not a catch. What would make it a
# catch is branch protection with the job as a required status check, which lives
# outside this repo and is not ours to set.
#
# `where` is pinned rather than left to the default (any file under
# `.github/workflows`), because these commands live in the Tests workflow
# beside the suite, not in a workflow of their own.
[[gate]]
command = "kinemata check"
where = [".github/workflows/test.yml"]
note = "code that re-derives a declared fact"

[[gate]]
command = "kinemata parity"
where = [".github/workflows/test.yml"]
note = "a registry's declared identifiers against what the code prints"

[[gate]]
command = "kinemata claims"
where = [".github/workflows/test.yml"]
note = "documentation claims, and this inventory"
