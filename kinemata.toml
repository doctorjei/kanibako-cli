# THE SECOND TABLE HERE WHOSE ORACLE IMPORTS NOTHING, and the first whose two
# sides are two FILES. Nothing in the tree compared them before: packaging says
# `>=3.11`, eight jobs across two workflows say `"3.11"`, and the agreement
