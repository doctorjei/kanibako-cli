# The oracle for the reserved-name declaration above. It enumerates every agent
# name this repository registers, from two places because the product reads two:
# the `kanibako.agents` entry-point KEYS of the root `pyproject.toml` and of each
# `packages/*/pyproject.toml` (what `_register` is handed as `ep.name`), and the
# literal returned by the `name` property of every `Target` subclass under `src/`
# and `packages/*/src/` (what `_register` is handed by the module and file-drop
# scans, and what `_require_meta_name` validates).
#
# ⚑ IT READS THE TREE, NOT THE INSTALLED METADATA, and CI forces that rather
# than style. The conformance job installs `-e .` and DELIBERATELY not the three
# plugin packages -- its own comment says so at the install step -- so in that
# environment `importlib.metadata.entry_points(group="kanibako.agents")` yields
# exactly one entry, core's `no_agent`, and importing `kanibako.plugins.claude`
# raises `ModuleNotFoundError`. Both measured 2026-09-19 in the kinemata venv,
# which is installed the same way. An oracle built on the running environment
# would have enumerated one name out of four and read green over three
# unexamined distributions -- the vacuity this file keeps paying attention to,
# arriving as a partial rather than an empty set, where `disjoint`'s own
# empty-oracle refusal could not have caught it.
#
# ⚑ THE AST WALK SELECTS BY BASE CLASS, not by filename. `target.py` is where all
# three plugins put the class today; a plugin that moved it would drop out of a
# glob silently, and a produced side short by one is exactly the failure above.
# The abstract `name` on `Target` itself contributes nothing -- its body is `...`,
# so there is no returned constant -- and `class Target(ABC)` does not match a
# base named `Target` either.
#
# ⚑ ONLY A LITERAL IS ENUMERATED, AND THE DECLARATION'S `CATCHES:` LINE
# OVERSTATES ITSELF BY EXACTLY THAT MUCH. The walk reports an `ast.Return` whose
# value is an `ast.Constant`, so a `name` property returning `_AGENT_NAME`, or an
# f-string, or a lookup, contributes NOTHING to the produced side -- the AST half
# reads a spelling written in place, not a value. The ENTRY-POINT half is
# unaffected and still reaches every `packages/*` distribution, so the PRODUCT is
# not exposed by this: a plugin of that shape is answered by `_require_meta_name`
# at launch, which raises. It is the sentence "whose `Target.name` spells a
# reserved name" that reaches further than the mechanism does.
#
# Measured 2026-09-19 on this tree, kinemata `0.2.0`:
#   `# reserved-agent-names: 2 declared, 4 produced, no identifier is both
#   declared and produced.`  rc=0
# The 4 are `no_agent`, `claude`, `codex` and `goose`, printed over 8 lines --
# each names itself twice, once as an entry-point key and once as `Target.name`,
# core's `no_agent` included, because `NoAgentTarget.name` returns a literal and
# is walked like the rest. That the two agree is a different fact and is not what
# this table checks.
# NEGATIVE CONTROL, run against a scratch tree in /tmp carrying its own copy of
# this config, so this repository's config was never edited for it: a fourth
# package declaring `shell = "kanibako.plugins.rogue:RogueTarget"` and a
# `RogueTarget.name` returning `"default"` gives rc=1, `FAIL: 2 disagreement(s)`
# -- `default: declared and produced, where neither may be` and the same for
# `shell`, one reached through the TOML key and one through the AST, so both
# halves of the oracle are shown discriminating. `kinemata check` over the same
# tree: rc=1, `shell (1 site)`, naming
# `packages/agent-rogue/pyproject.toml:5` and quoting the line.
# VACUITY CONTROL, the same scratch config over a tree that declares no agent at
# all: rc=1, `BLOCKED: claims no identifier is both declared and produced, and
# its oracle produced no identifiers at all. Nothing can violate that, so the run
# would pass by looking at nothing`.
[[parity]]
registry = "reserved-agent-names"
relation = "disjoint"
command = ["{python}", "-c", """
import ast, pathlib, tomllib
for manifest in [pathlib.Path("pyproject.toml"), *sorted(pathlib.Path("packages").glob("*/pyproject.toml"))]:
    table = tomllib.loads(manifest.read_text()).get("project", {}).get("entry-points", {}).get("kanibako.agents", {})
    for key in table:
        # The reservation folds for comparison ([R172]), so the oracle folds what it produces.
        print(f"agent-name: {key.casefold()}")
for source in [*sorted(pathlib.Path("src").rglob("*.py")), *sorted(pathlib.Path("packages").glob("*/src/**/*.py"))]:
    for node in ast.walk(ast.parse(source.read_text())):
        if not (isinstance(node, ast.ClassDef) and any("Target" in ast.unparse(base) for base in node.bases)):
            continue
        for item in ast.walk(node):
            if isinstance(item, ast.FunctionDef) and item.name == "name":
                for leaf in ast.walk(item):
                    if isinstance(leaf, ast.Return) and isinstance(leaf.value, ast.Constant):
                        seen = leaf.value.value
                        print(f"agent-name: {seen.casefold() if isinstance(seen, str) else seen}")
"""]
