# ---------------------------------------------------------------------------
# THE SECOND TABLE HERE WHOSE ORACLE IMPORTS NOTHING, and the first whose two
# sides are two FILES. Nothing in the tree compared them before: packaging says
# `>=3.11`, eight jobs across two workflows say `"3.11"`, and the agreement
# between them was upheld by nobody.
#
# 🛑 `produced_contains`, NOT `equal`, AND A LATER READER WILL WANT TO TIGHTEN
# IT. The claim is that the floor is AMONG the pins -- never that the pins are
# exactly the floor. A matrix that legitimately adds 3.12 is a job testing MORE,
# not a drift, and an equality would report it every run until someone deleted
# the coverage to get the green back. The question worth asking is only whether
# the floor goes untested, and containment in this direction is that question
# and nothing else.
#
# ⚑ THE ORACLE GLOBS `.github/workflows/*.y*ml` rather than naming the three
# that exist, so a NEW workflow pinning an interpreter is in scope the day it
# lands. It reads the files as TEXT -- no YAML parse, no import -- which is what
# lets the produced side owe `pyproject.toml` nothing: the two sides really are
# the two files, and neither is derived from the other. The relative path is
# safe from any caller's directory: an oracle runs with the project root as its
# working directory (`claims.run_oracle`), not the shell's.
#
# 🛑 THE `y*` IS THE HALF THAT MAKES THAT SENTENCE TRUE, and the glob was
# `*.yml` until 2026-09-19. GitHub Actions reads a `.yaml` file in this
# directory exactly as it reads a `.yml` one, so half the legal namespace sat
# out of scope: a future `.yaml` workflow pinning a different interpreter would
# have been invisible, the oracle would still have produced `3.11` from the
# other files, and this gate would have read GREEN while checking less than it
# says. That is the silence the paragraphs above refuse everywhere else, and
# the sentence claiming a new workflow is in scope the day it lands was
# aspirational until the glob was widened. Measured 2026-09-19: `*.y*ml` and
# `*.yml` return the same three files on this tree, in the same order and with
# no duplicate, so this widens COVERAGE and does not move today's result.
#
# ⚑ `translate` IS ON THE DECLARED SIDE AND IS THE WHOLE NOTATION GAP. Packaging
# spells a floor as a CONSTRAINT (`>=3.11`); a job pins a VERSION (`3.11`).
# Stripping the operator is the one difference between the spellings, and it is
# declared here rather than done inside the command on purpose: an oracle taught
# to print `>=3.11` would hide the fact that the comparison is not literal.
#
# ⚑ AND IT IS FAIL-CLOSED, WHICH IS THE PROPERTY THAT ACTUALLY MAKES IT SAFE
# and is not visible from the sentence above. The pattern handles `>=` and
# nothing else, so any other notation survives translation unchanged and reds
# the gate -- there is no spelling this normalization quietly accepts. Measured
# 2026-09-19 under kinemata `0.2.0` against a scratch copy of this table in
# /tmp, swapping `requires-python` alone and leaving this repository's config
# untouched: `>=3.11` rc=0, and `>3.11`, `~=3.11`, `>=3.12`, `>= 3.11`,
# `>=3.11.0` and `>=3.11,<4` all rc=1.
# 🛑 THE COST IS THAT THE RED DOES NOT SAY WHICH FAULT IT FOUND. Three of those
# six -- `>= 3.11`, `>=3.11.0` and `>=3.11,<4` -- name the SAME floor 3.11 in a
# notation this pattern does not strip, and each fails as `declared, produced by
# nothing`, which is the identical message `>=3.12` produces when the floor has
# genuinely moved past what CI runs. So a red here means the floor moved OR the
# spelling did. Read `pyproject.toml` first: a reader who trusts the message
# alone goes looking in the workflows for a drift that is not there.
#
# Measured 2026-09-19 on this tree, kinemata `0.2.0`:
#   `# python-floor: 1 declared, 1 produced, every identifier declared is
#   produced by the code.`  rc=0
# NEGATIVE CONTROL, the same table with `replacement = "X"` so the declared
# floor renders as `X3.11`: rc=1, `X3.11: declared, produced by nothing`. The
# comparison is against what the workflows really say, not against itself.
# VACUITY CONTROL, the oracle's glob pointed at a directory that does not exist:
# rc=1, `BLOCKED: claims every identifier declared is produced by the code, and
# its oracle produced no identifiers at all. Nothing can violate that, so the
# run would pass by looking at nothing`. A containment whose produced side has
# gone silent cannot read as a clean tree.
[[parity]]
registry = "python-floor"
relation = "produced_contains"
translate = { pattern = '^>=', replacement = "" }
command = ["{python}", "-c", """
import pathlib, re
seen = set()
for wf in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
    for m in re.finditer(r'(?m)^\\s*python-version:\\s*"?([0-9.]+)"?\\s*$', wf.read_text()):
        seen.add(m.group(1))
for v in sorted(seen):
    print(f"ci-python: {v}")
"""]
extract = '(?m)^ci-python: (\S+)$'

# The oracle for the reserved-name declaration above. It enumerates every agent
# name this repository registers, from two places because the product reads two:
# the `kanibako.agents` entry-point KEYS of the root `pyproject.toml` and of each
# `packages/*/pyproject.toml` (what `_register` is handed as `ep.name`), and the
# literal returned by the `name` property of every `Target` subclass under `src/`
# and `packages/*/src/` (what `_register` is handed by the module and file-drop
# scans, and what `_require_meta_name` validates).
#
# ⚑ IT READS THE TREE, NOT THE INSTALLED METADATA, and CI forces that rather
# than style. The conformance job installs `-e .` and DELIBERATELY not the three
# plugin packages -- its own comment says so at the install step -- so in that
# environment `importlib.metadata.entry_points(group="kanibako.agents")` yields
# NO entry at all (the root `pyproject.toml` declares no built-in entry point;
# the plain-shell target is seeded in `targets.discover_targets`), and importing
# `kanibako.plugins.claude` raises `ModuleNotFoundError`. Both measured
# 2026-09-25 in a throwaway venv holding only `pip install -e .` of this tree,
# CI's install. An oracle built on the running environment would have
# enumerated none of the three plugin names and read green over three
# unexamined distributions -- the vacuity this file keeps paying attention to,
# arriving as a partial rather than an empty set (the `shell` literal would
# still be produced), where `disjoint`'s own empty-oracle refusal could not
# have caught it.
#
# ⚑ THE AST WALK SELECTS BY BASE CLASS, not by filename. `target.py` is where all
# three plugins put the class today; a plugin that moved it would drop out of a
# glob silently, and a produced side short by one is exactly the failure above.
# The abstract `name` on `Target` itself contributes nothing -- its body is `...`,
# so there is no returned constant -- and `class Target(ABC)` does not match a
# base named `Target` either.
#
# ⚑ ONLY A LITERAL IS ENUMERATED, AND THE DECLARATION'S `CATCHES:` LINE
# OVERSTATES ITSELF BY EXACTLY THAT MUCH. The walk reports an `ast.Return` whose
# value is an `ast.Constant`, so a `name` property returning `_AGENT_NAME`, or an
# f-string, or a lookup, contributes NOTHING to the produced side -- the AST half
# reads a spelling written in place, not a value. The ENTRY-POINT half is
# unaffected and still reaches every `packages/*` distribution, so the PRODUCT is
# not exposed by this: a plugin of that shape is answered by `_require_meta_name`
# at launch, which raises. It is the sentence "whose `Target.name` spells a
# reserved name" that reaches further than the mechanism does.
#
# Measured 2026-09-25 on this tree, kinemata `0.4.1`:
#   `# reserved-agent-names: 2 declared, 4 produced, no identifier is both
#   declared and produced.`  rc=0
# The 4 are `claude`, `codex`, `goose` and `shell`, printed over 7 lines. Each
# plugin names itself twice, once as an entry-point key and once as
# `Target.name`; core's `shell` names itself ONCE, through the AST half alone
# (`ShellTarget.name` returns a literal and is walked like the rest), because
# core declares no entry point. That the two halves agree for a plugin is a
# different fact and is not what this table checks.
# NEGATIVE CONTROL, run against a scratch tree in /tmp carrying its own copy of
# this config, so this repository's config was never edited for it: a fourth
# package declaring `shell = "kanibako.plugins.rogue:RogueTarget"` and a
# `RogueTarget.name` returning `"default"` gives rc=1, `FAIL: 2 disagreement(s)`
# -- `default: declared and produced, where neither may be` and the same for
# `shell`, one reached through the TOML key and one through the AST, so both
# halves of the oracle are shown discriminating. `kinemata check` over the same
# tree: rc=1, `shell (1 site)`, naming
# `packages/agent-rogue/pyproject.toml:5` and quoting the line.
# VACUITY CONTROL, the same scratch config over a tree that declares no agent at
# all: rc=1, `BLOCKED: claims no identifier is both declared and produced, and
# its oracle produced no identifiers at all. Nothing can violate that, so the run
# would pass by looking at nothing`.
# ⚑ THE ENTRY-POINT HALF READS THROUGH `kinemata_keyspace.in_tree_agents`
# (2026-09-25), the walk the keyspace adapter judges agent nodes by, under
# `agent_ref.AGENT_ENTRY_POINT_GROUP` -- one walk and one group name, not a copy
# of each here. Re-run under `0.4.1` on a `/tmp` copy: a `packages/agent-rogue`
# declaring `Default = '...:RogueTarget'` gives rc=1, `default: declared and
# produced, where neither may be`. A rogue `Shell` does NOT red there, and that
# is the baseline, not the oracle: the `shell` overlap is an accepted record
# (`parity:reserved-agent-names:overlapping`), so it masks a planted one.
# The record is LIVE: ShellTarget.name (targets/shell.py) produces shell through the AST half on a
# clean tree, so --prune keeps it (R181 (i)). A planted Shell entry point is still reported by
# check, whose reserved-agent-names pattern is (?mi).
[[parity]]
registry = "reserved-agent-names"
relation = "disjoint"
command = ["{python}", "-c", """
import ast, pathlib
from kanibako.settings.kinemata_keyspace import in_tree_agents
# The tree's entry-point declarations, from the ONE walk the keyspace adapter uses too.
for key in sorted(in_tree_agents(pathlib.Path("."))):
    # The reservation folds for comparison ([R172]), so the oracle folds what it produces.
    print(f"agent-name: {key.casefold()}")
for source in [*sorted(pathlib.Path("src").rglob("*.py")), *sorted(pathlib.Path("packages").glob("*/src/**/*.py"))]:
    for node in ast.walk(ast.parse(source.read_text())):
        if not (isinstance(node, ast.ClassDef) and any("Target" in ast.unparse(base) for base in node.bases)):
            continue
        for item in ast.walk(node):
            if isinstance(item, ast.FunctionDef) and item.name == "name":
                for leaf in ast.walk(item):
                    if isinstance(leaf, ast.Return) and isinstance(leaf.value, ast.Constant):
                        seen = leaf.value.value
                        print(f"agent-name: {seen.casefold() if isinstance(seen, str) else seen}")
"""]
extract = '(?m)^agent-name: (\S+)$'

# ---------------------------------------------------------------------------
# THE `KEY_TYPES` VALUE-VOCABULARY PIN. `relation = "declared_contains"` is the
# row's `<=` exactly: every kind the code produces is declared, and a kind the
# code stops producing is silent rather than a finding. An equality would
# report a removed kind every run until someone deleted the coverage to get
# the green back -- the tightening the `python-floor` table refuses for the
# same reason.
#
# ⚑ THE ORACLE PRINTS VALUES, NOT KEYS. `sorted(set(KEY_TYPES.values()))` is
# the whole of the vocabulary question: a new ROW of an old kind changes
# nothing, a new KIND is one produced identifier. The `kanibako-key-kind:`
# prefix is there so nothing incidental on either stream can be read as a kind.
#
# Measured 2026-09-22 on this tree, kinemata `0.3.0`:
#   `# key-kinds: 3 declared, 3 produced, every identifier the code produces is
#   declared.`  rc=0
# NEGATIVE CONTROL, the row's own injection in a scratch tree --
# `KEY_TYPES["meta.runtime.project_type"] = "enum"`: rc=1, `enum: produced,
# declared by nothing`. On the SAME mutant
# `test_the_code_types_every_key_the_registry_declares_it_at` passes -- the
# pair is genuinely in the registry -- so the pin reds exactly what the suite
# cannot see, which is the hole it was re-boarded to close.
# SECOND CONTROL, the declaration narrowed to `bool` and `path`: rc=1, `int:
# produced, declared by nothing` -- the legitimate third kind, and the reason
# the vocabulary is three rather than the row's two.
# VACUITY POSTURE, inherited rather than re-proved: `declared_contains` fails
# a run whose oracle produced nothing (upstream's own rule, cited on the
# `workset-denials` table), and an oracle that cannot import the tree exits
# nonzero, which BLOCKS rather than reporting a short list as a finding.
[[parity]]
registry = "key-kinds"
relation = "declared_contains"
command = ["{python}", "-c", """
from kanibako.settings.config_keys import KEY_TYPES
for kind in sorted(set(KEY_TYPES.values())):
    print(f"kanibako-key-kind: {kind}")
"""]
extract = '(?m)^kanibako-key-kind: (\S+)$'

