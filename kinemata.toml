# THE §4.3 TEN, THEIR ORACLES. Registries and the FACT each one states are
# above the banner, under the same heading. Every figure below was measured
# 2026-09-24 at `61ff5c36` plus the working tree, kinemata `0.3.0`, each control
# ONE edit in a scratch copy under /tmp run with `PYTHONPATH=<copy>/src` (so the
# oracle imports the copy, not the editable install), and every edited file
# byte-compared (`cmp`) against this tree afterwards.
#
# FACT: `policy.seed_whitelists`' scope rows ARE `SCOPE_WHITELISTS`' scopes
# (membership -- `test_manifest_enforces` B), and each row's `allow:` list IS
# that scope's code whitelist (the value -- D1).
# AUTHORITY: `declared`. The manifest is release authority for seed policy; a
# code entry it omits is a permission nobody declared.
# CATCHES: a scope on one side only; an allow entry added, dropped or respelled
# on either side.
# ⚑ ONE TABLE, TWO FAMILIES, because membership runs under every value
# comparison -- the scope set is exactly the identifier set this table pairs on.
# ⚑ `translate` IS THE TEST'S `_undirect`, MOVED INTO THE CONFIG WHERE A READER
# SEES IT: the manifest writes the directory notation `home/`, the code carries
# `home`, and `_check_whitelist` appends the separator itself. It strips ONE
# trailing `/` from declared values and touches nothing else. It does NOT
# replace `TestAllowNotation` (C): an entry written WITHOUT the slash passes
# through unchanged and still agrees.
#   `# seed-scopes: 3 declared, 3 produced, in agreement, agreeing on allow.`
#   (+ `set-valued: 3 declared cell(s) hold a list, compared as sets`) rc=0
# NEGATIVE CONTROLS, each rc=1:
#   code, box `"home"` -> `"homes"`: `box: allow declared 'home', code
#     produces 'homes'` -- a VALUE divergence
#   manifest, box `allow` gains `caches/`: `box: allow declared 'caches',
#     produced by nothing` -- a VALUE divergence
#   code, scope `"box"` -> `"boxes"`: `boxes: produced, declared by nothing` and
#     `box: declared, produced by nothing` -- the membership half (B)
# HOP CONTROL, `translate` removed: rc=1, 3 divergences, e.g. `box: allow
# declared 'canon/handbook/', 'home/', code produces 'canon/handbook', 'home'`.
# The notation hop is load-bearing.
# VACUITY CONTROL, the oracle's `print` removed: rc=1, all three scopes
# `declared, produced by nothing`.
# 🛑 WHAT THIS CANNOT SAY: an EMPTY allow list has no line to print. On the
# MANIFEST side it reads `declared, produced by nothing` (measured: box `allow: []`
# on both sides). On the CODE side it was INVISIBLE -- a code-only `"system": ()`
# passed this table green (measured) -- so the oracle refuses an empty whitelist
# and exits 1, which kinemata reports BLOCKED. Either way it reds rather than
# passes. None is empty today.
[[parity]]
registry = "seed-scopes"
command = ["{python}", "-c", """
from kanibako.launch.templates import SCOPE_WHITELISTS
for scope, allowed in sorted(SCOPE_WHITELISTS.items()):
    if not allowed:
        raise SystemExit(f"scope {scope!r} has an EMPTY whitelist, which this oracle cannot print")
    for entry in allowed:
        print(f"kanibako-seed-allow: {scope}={entry}")
"""]
extract = '(?m)^kanibako-seed-allow: ([^\s=]+)=(\S+)$'
field = "allow"
authority = "declared"
