#   settings/workset_dirkeys.py   0    settings/settings_launch.py    0
#   settings/agent_select.py      0    launch/creds_watcher.py        0
#   commands/flags.py             0    commands/box/_lifecycle.py     0
#   runtime/baseline.py           0    __init__.py                    0
#
# ⚑ THE ONE PRODUCTION FINDING THE FIVE CONSTANTS REGISTRIES MISS:
#   `proxy/server.py` declares `MESSAGES_PATH = "/v1/messages"` and
#   `packages/agent-claude/.../claude/target.py:448` spells it inline. That is a
