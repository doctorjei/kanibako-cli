#
# 🛑 `produced_contains`, NOT `equal`, AND A LATER READER WILL WANT TO TIGHTEN
# IT. The claim is that the floor is AMONG the pins -- never that the pins are
# exactly the floor. A matrix that legitimately adds 3.12 is a job testing MORE,
# not a drift, and an equality would report it every run until someone deleted
# the coverage to get the green back. The question worth asking is only whether
# the floor goes untested, and containment in this direction is that question
# and nothing else.
#
# ⚑ THE ORACLE GLOBS `.github/workflows/*.y*ml` rather than naming the three
# that exist, so a NEW workflow pinning an interpreter is in scope the day it
# lands. It reads the files as TEXT -- no YAML parse, no import -- which is what
# lets the produced side owe `pyproject.toml` nothing: the two sides really are
# the two files, and neither is derived from the other. The relative path is
# safe from any caller's directory: an oracle runs with the project root as its
# working directory (`claims.run_oracle`), not the shell's.
#
# 🛑 THE `y*` IS THE HALF THAT MAKES THAT SENTENCE TRUE, and the glob was
# `*.yml` until 2026-09-19. GitHub Actions reads a `.yaml` file in this
# directory exactly as it reads a `.yml` one, so half the legal namespace sat
# out of scope: a future `.yaml` workflow pinning a different interpreter would
# have been invisible, the oracle would still have produced `3.11` from the
# other files, and this gate would have read GREEN while checking less than it
# says. That is the silence the paragraphs above refuse everywhere else, and
# the sentence claiming a new workflow is in scope the day it lands was
# aspirational until the glob was widened. Measured 2026-09-19: `*.y*ml` and
# `*.yml` return the same three files on this tree, in the same order and with
# no duplicate, so this widens COVERAGE and does not move today's result.
#
# ⚑ `translate` IS ON THE DECLARED SIDE AND IS THE WHOLE NOTATION GAP. Packaging
# spells a floor as a CONSTRAINT (`>=3.11`); a job pins a VERSION (`3.11`).
# Stripping the operator is the one difference between the spellings, and it is
# declared here rather than done inside the command on purpose: an oracle taught
# to print `>=3.11` would hide the fact that the comparison is not literal.
#
# ⚑ AND IT IS FAIL-CLOSED, WHICH IS THE PROPERTY THAT ACTUALLY MAKES IT SAFE
# and is not visible from the sentence above. The pattern handles `>=` and
# nothing else, so any other notation survives translation unchanged and reds
# the gate -- there is no spelling this normalization quietly accepts. Measured
# 2026-09-19 under kinemata `0.2.0` against a scratch copy of this table in
# /tmp, swapping `requires-python` alone and leaving this repository's config
# untouched: `>=3.11` rc=0, and `>3.11`, `~=3.11`, `>=3.12`, `>= 3.11`,
# `>=3.11.0` and `>=3.11,<4` all rc=1.
# 🛑 THE COST IS THAT THE RED DOES NOT SAY WHICH FAULT IT FOUND. Three of those
# six -- `>= 3.11`, `>=3.11.0` and `>=3.11,<4` -- name the SAME floor 3.11 in a
# notation this pattern does not strip, and each fails as `declared, produced by
# nothing`, which is the identical message `>=3.12` produces when the floor has
# genuinely moved past what CI runs. So a red here means the floor moved OR the
# spelling did. Read `pyproject.toml` first: a reader who trusts the message
# alone goes looking in the workflows for a drift that is not there.
#
# Measured 2026-09-19 on this tree, kinemata `0.2.0`:
#   `# python-floor: 1 declared, 1 produced, every identifier declared is
#   produced by the code.`  rc=0
# NEGATIVE CONTROL, the same table with `replacement = "X"` so the declared
# floor renders as `X3.11`: rc=1, `X3.11: declared, produced by nothing`. The
# comparison is against what the workflows really say, not against itself.
# VACUITY CONTROL, the oracle's glob pointed at a directory that does not exist:
# rc=1, `BLOCKED: claims every identifier declared is produced by the code, and
# its oracle produced no identifiers at all. Nothing can violate that, so the
# run would pass by looking at nothing`. A containment whose produced side has
# gone silent cannot read as a clean tree.
[[parity]]
registry = "python-floor"
relation = "produced_contains"
translate = { pattern = '^>=', replacement = "" }
