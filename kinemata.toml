# kinemata config for kanibako-cli -- THE config. It drives every command this
# project runs: `check` (duplication), `parity`, `claims` (the DOCUMENTATION
# gate), `unused`, `ids`, and the `undeclared`, `review` and `clusters` commands
# that are not yet in CI.
#
# ⚑ THERE IS EXACTLY ONE CONFIG IN THIS REPOSITORY, and one baseline
# (`.kinemata-baseline.json`, the default name). Every command is run plainly --
# `kinemata check`, `kinemata claims` -- with no `-c` and no custom baseline.
#
# ---------------------------------------------------------------------------
# THERE WERE TWO FILES UNTIL 2026-09-14, AND THE REASON THEY SPLIT WAS WRONG.
# Recorded rather than dropped, because the reasoning was stated at length in
# both files and a reader who finds it quoted elsewhere must find its correction
# here.
#
# THE SPLIT: `kinemata.toml` held the registries and drove `check`;
# `kinemata-docs.toml` held `[claims]` and was run by name. THE ARGUMENT FOR IT:
# `exclude` is GLOBAL to a config -- it applies to every scan that config drives
# -- and the registry side excluded `api-docs/` and `llm-docs/`, which the
# documentation gate must NOT exclude. Merging, the argument ran, would silently
# weaken the documentation gate by the width of that difference.
#
# THE MEASUREMENT THAT RETIRED IT: a registry scan never reads a `.md` file. The
# suffix set is per registry and defaults to `.py` alone (`kinemata/config.py`,
# `suffixes: tuple[str, ...] = (".py",)`, verified at source 2026-09-14 against
# kinemata `a365474` and RE-VERIFIED the same day at `00044f2`, nine commits
# later, where the line is `config.py:137`), and no registry below declares
# `suffixes`. Counted the
# same day: `api-docs/` holds 136 `.md` and 0 `.py`, `llm-docs/` holds 55 `.md`
# and 0 `.py` -- 191 documents, no code. Those two excludes therefore suppressed
# NOTHING on the registry side. They were inert, and the difference the split
# existed to hold did not exist.
#
# ⚑ CONFIRMED BY RUNNING IT, not by reading the code alone. Measured 2026-09-14
# at `75f7da94` with the four-entry exclude replaced by `["tests/"]`: `kinemata
# check`, `kinemata unused` and `kinemata ids` each produced output BYTE-
# IDENTICAL to the same command under the old exclude, all rc=0. It follows that
# every `check`, `unused` and `ids` figure quoted in this file survived the
# narrowing unchanged -- they are not stale by reason of this merge.
#
# Merged 2026-09-14 from three drafts, none of which was in this repository
# before: the kinemata box's `kinemata-config-for-kanibako-cli-2026-09-12-r2.toml`
# (the `keyspace`, `constants` and `canonical` registries, plus `exclude`), this
# project's own `kinemata-registries.toml` (five `python-constants` registries),
# and `~/canon/notebook/resources/kinemata-adoption/kinemata-proposed.toml`
# (`[claims]`, first-run triage 2026-09-09). Where two drafts declared
# overlapping modules they are merged into one registry rather than declared
# twice -- see `store-layout` below.
#
# Governing rule: [R159]. "The adoption is judged by what it CATCHES, not by how
# clean it comes up." Every entry below carries a reason of kind. Nothing here
# exists to make a number smaller.
#
# ⚑ Every figure quoted in a comment below states the commit it was measured
# against. They are NOT re-measured at each commit, and several predate the tree
# you are reading. Run the command before quoting the number.
#
# This config is DELIBERATELY still red on the documentation side. See "WHAT IS
# DELIBERATELY *NOT* HERE" below.

[project]
# RELATIVE, deliberately: two of the source drafts carried an absolute path to
# one box's checkout, which means something different in CI and in any other
# clone. `root = "."` is resolved against the config's own directory.
root = "."

# `tests/` is excluded for the reason `tests/support/filenames.py` states about
# itself: its literals ARE the pin. A test that respells a constant on purpose
# is the check, not a bypass of it. ⚑ IT IS LOAD-BEARING, measured 2026-09-14 at
# `75f7da94`: with this line removed `kinemata check` goes rc=1 and reports
# WS_TOKEN_STANDALONE at 12 sites, CHAT_GENERAL_LEAF at 8 and more, all of them
# in `tests/` and all of them the deliberate respellings above.
#
# 🛑 THE FOUR FRAGMENTS ARE ONE DECISION. DO NOT COLLAPSE THEM BACK INTO ONE.
# A leading slash means anchored, and it anchors at the ROOT, not at a directory
# boundary anywhere along the path: `kinemata/exclusion.py`, `matches()`, keeps
# an anchored fragment only when the relative path IS the stem or begins with
# the stem plus a slash. So `/tests/` reaches this project's own `tests/` and
# nothing whatever under `packages/`; each plugin tree has to be named in full.
# They are named because the reason of kind above is exactly as true of a
# plugin's tests as of this project's own, and because dropping them changes
# what this line removes. Measured, not assumed, 2026-09-14: with `/tests/`
# alone `check` stays rc=0 and `claims` stays at 1652, and what moves is the
# weak-signal tally, 28 to 29. So the three are not inert -- but nothing this
# gate fails on rests on them today, and a reader who finds them silent should
# know that before deciding they are decoration.
#
# 🛑 THE LEADING SLASH IS A VERSION FLOOR, AND IT IS THE REASON THIS LINE AND
# THE CI PIN MOVED IN ONE COMMIT. It needs kinemata >= `0.1.0a2.dev1` (upstream
# `a26ab29`); an earlier build has no `exclusion.py` at all, reads `/tests/` as
# a literal substring, matches NOTHING, and scans all four test trees. Measured
# 2026-09-14 against `00044f2` -- the build CI pinned until this config changed
# -- with the four fragments below: `kinemata check` goes rc=1 with "FAIL: 92
# new bypass(es) of declared things", and 24 baseline records read as no longer
# present. Those 92 are the deliberate respellings this exclusion exists to
# suppress. ⇒ LOWERING THE PIN IN `.github/workflows/test.yml` BELOW THAT
# VERSION REDS THE CONFORMANCE JOB UNTIL THIS LINE IS UNANCHORED TOO.
#
# ⚑ AN UNANCHORED FRAGMENT ALSO MEANS TWO THINGS AT ONCE, which is the second
# reason not to go back: `claims` strips its trailing slash before matching and
# the scans do not, so one line removes two different sets depending on which
# command is running. That is "a real defect and is deliberately not fixed"
# upstream (`exclusion.py`, `_widest`), because repairing it would narrow every
# config already written. An anchored fragment is immune to it.
#
# ⚑ THEY WERE ONE FRAGMENT, `["tests/"]`, UNTIL 2026-09-14. Unanchored, it
# matched every relative path CONTAINING "tests", which besides the four test
# trees caught `docs/plans/2026-03-07-smoke-tests-design.md` and `-plan.md` by
# their filenames. That was ACCEPTED here, and cheaply: both documents are also
# matched by `historical = ["docs/plans/"]` below, so their path claims were
# suppressed either way, and the one live claim lost was a single
# `https://github.com` link that `external = false` does not fetch. It was
# accepted because there was no anchored form to write -- the fragment was a
# substring by construction, and a narrower one ("tests/support", say) stops
# excluding the trees the line exists for. The lever this comment named instead
# was an upstream request for anchored excludes. It was made and it was granted:
# upstream `a26ab29` added the leading-slash spelling, and the old spelling is
# unchanged, so nothing already written moved underneath us.
#
# ⚑ WHAT ANCHORING RECOVERED, measured 2026-09-14 under kinemata
# `0.1.0a2.dev1` (the published wheel, file-identical to upstream `f6fc5f7`):
# the documentation gate checks 1652 claims against these four fragments and
# 1650 against the old `["tests/"]`, the 2 being those two plan documents.
# `unused` and `ids` are byte-identical across the change, and `check` differs
# by exactly one line -- the advisory the new build prints when a fragment
# removes paths by substring rather than by directory, which named nine such
# paths on every run and is now gone.
# ⚑ IT DID NOT UN-SUPPRESS THOSE DOCUMENTS' PATH CLAIMS. `historical =
# ["docs/plans/"]` below still matches both, exactly as it did when they were
# excluded outright; a narrower `historical` remains the lever if they ever need
# checking in full.
#
# ⚑ `api-docs/` AND `llm-docs/` ARE NO LONGER EXCLUDED, and the inherited
# reasoning for excluding them is recorded here because it is TRUE ABOUT THE
# TEXT and IRRELEVANT TO THE SCAN. It ran: `api-docs/` carries a "GENERATED --
# do not hand-edit" banner and mirrors every signature in the tree, so it
# respells every declared value by construction; `llm-docs/` is hand-written
# prose, and prose naturally spells values while describing them. Both
# observations hold. Neither reaches a duplication scan, which reads `.py` and
# those directories contain none -- see the merge note above for the counts. An
# exclude that suppresses nothing is not a scope decision, it is a line.
#
# 🛑 `salvage/` IS DELIBERATELY NOT EXCLUDED, AND THIS IS THE ONE JUDGMENT HERE
# THAT THE NEXT PERSON WILL WANT TO REVERSE. The upstream reason for excluding
# it is a genuine reason of kind: salvage/README.md says the directory is
# dormant source, deliberately carrying "frozen local copies of logic since
# deleted from the live path", and this project already excludes it from ruff,
# mypy and pytest. A duplication checker pointed at a holding pen for deliberate
# duplicates reports the pen. That argument is sound -- it is simply not what
# [R159] measures by, which is what a check CATCHES. Measured 2026-09-14 at
# `75f7da94`: excluding `salvage/` removes ZERO findings from `check`, `unused`
# and `ids` (byte-identical output either way), and removes 17 claims from the
# documentation gate by way of salvage/README.md. Anchoring the `exclude` above
# moved the pair those 17 sit in, so it is re-measured under it the same day:
# 1652 claims checked with the directory in, 1635 with it out. So the exclusion
# buys nothing and costs seventeen claims' worth of coverage.
# ⇒ IF IT EVER LIGHTS UP, EXAMINE THE FINDING. Do not reflexively restore the
# exclude line: a finding out of `salvage/` is either a real second spelling in
# live code or a genuine dormant-copy report, and only reading it says which.
#
# ⚑ `kinemata-registries.toml` excluded NOTHING and said so as a position: a
# test that respells a constant is a test that keeps passing after the constant
# changes. That position is OVERRULED for `tests/` by the reason of kind above.
# It is recorded rather than dropped, because the next person to widen this line
# should know it was once empty.
#
# ⚑ `build/` and `dist/` are absent on purpose: the scanner prunes both in
# `SKIP_DIRS` before descending, so naming them here would be ceremony. The
# claims config that merged into this one named them anyway, belt and braces;
# the line is dropped rather than carried, because a config that lists what the
# tool already does invites a reader to believe the list is the mechanism.
exclude = [
  "/tests/",
  "/packages/agent-claude/tests/",
  "/packages/agent-codex/tests/",
  "/packages/agent-goose/tests/",
]

# ---------------------------------------------------------------------------
# THE DOCUMENTATION GATE. `[claims]` and its keys sit HERE, above every
# `[[registry]]` and `[[parity]]` and `[[gate]]` table, and that placement is
# load-bearing -- see the ordering warning above the gates at the END of this
# file.
[claims]
suffixes = [".md"]

historical = [
  # REASON OF KIND: a changelog is by definition a record of what was true at
  # each release. Verified, not assumed: its repo-shaped claims are the pre-1.0
  # flat layout (`paths_defaults.py`, renamed to messages.py by 10390ce4), the
  # `worksets.toml` -> `working_sets.toml` rename entry, and the host
  # provisioning kit (`host-definitions/`, `lint-vm.yml`,
  # `docs/host-deployment.md`) that left for the kanibako-images repo at the
  # 2026-06-12 split. Every one was correct when written.
  "CHANGELOG.md",

  # REASON OF KIND: eight dated implementation/design plans, 2026-03-06..08, for
  # work that has since shipped (the CLI restructure, the droste image rebase).
  # Verified: they cite the pre-split FLAT module layout -- `src/kanibako/paths.py`,
  # `src/kanibako/config.py`, `src/kanibako/templates_image.py`,
  # `src/kanibako/commands/status.py` -- which v1.8.0 replaced with the
  # settings/ and runtime/ packages, plus `host-definitions/` which moved repos.
  # These are the record of a plan, not a claim about today's tree.
  # NOTE: the LIVE plan set lives in ~/canon/workbook/plans/, not here.
  "docs/plans/",
]

# Before/after, measured 2026-09-09 against an older tree: 929 failing claims ->
# 769. The 160 suppressed are ALL positively classified as historicity false
# positives. Nothing is suppressed that could not be classified.
# ⚑ NOT re-measured at each commit. Run the command before quoting the number.

# ---------------------------------------------------------------------------
# THE COST `historical` USED TO PAY, AND WHY IT NO LONGER DOES. Kept because the
# entries above were adopted while the cost was live, and a reader who finds the
# old warning elsewhere should find its resolution here.
#
# Until kinemata's 2026-09-09 change, `historical` silenced URL claims as well
# as path claims: the `url` kind was `current_only`, and every `current_only`
# kind was skipped on a file matched by `historical`. Measured here: the two
# entries above removed 17 of this repository's 36 external links from the check
# -- including BOTH of its genuine 404s.
#
# ✅ FIXED UPSTREAM, verified at source 2026-09-14 against kinemata `a365474`:
# `claims.py` now declares the `url` kind `current_only=False`, with the reason
# this project argued -- a URL is a claim about the world, not about the tree,
# so there is nothing for a record to have been right about at the time. A dead
# link in a changelog is a dead link. The measurement above is quoted in
# kinemata's own source as the case that forced it.
#
# ⇒ THE BLIND SPOT IS CLOSED and needs no countermeasure here. The two known
# 404s -- `compare/v1.8.0...HEAD` and `compare/v1.7.2...v1.8.0` -- are back in
# the check, and they 404 because `v1.8.0` is not tagged on origin (verified
# 2026-09-14 by `git ls-remote --tags origin`: only `-rc1` and `-rc2` exist).
# That is the honest Keep-a-Changelog shape and it resolves at the cut. Expect
# them red until then; `external` is off in this config, so they are not fetched
# unless it is turned on.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY *NOT* HERE, and why. Each of these would cut the failure
# count substantially and each was refused. ⚑ These refusals are binding, not
# commentary: adding any of them needs a reason of kind, not a smaller number.
#
# 1. historical = ["MIGRATION.md"]  -- REFUSED. The largest single file by
#    findings -- 188 measured 2026-09-09 against an older tree, 197 measured
#    2026-09-14 at `75f7da94` -- and the temptation is obvious. But MIGRATION.md
#    is the LIVE user-facing guide whose readiness gates the release cut, not a
#    record. Marking it historical would have suppressed MIGRATION.md:4871, the
#    one genuine defect the 2026-09-09 run found. Proof by construction that
#    "reason of kind" is not a formality.
#    ⚑ That LINE NUMBER is stale and is kept only as the record of why the
#    refusal was made: the file has been edited since and nothing is reported at
#    4871 today. The defect was not re-identified at its new line, and this
#    refusal does not rest on it -- the reason is of kind.
#
# 2. resolve_in = ["../../canon"] -- REFUSED, twice over.
#    (a) It is a ROT SUPPRESSOR. ~/canon held
#        notebook/archives/temp-20260819/p5-editor/pristine/, a full snapshot of
#        an OLDER kanibako-cli tree. Measured: it silently resolved 5 repo-shaped
#        claims (src/kanibako/config_interface.py, tests/test_config_interface.py,
#        tests/test_templates_image.py, src/kanibako/templates_image.py,
#        tests/test_commands/test_install.py) against stale copies. That is
#        exactly the defect class kinemata was adopted to catch.
#        ⚑ PAST TENSE, verified 2026-09-14: that snapshot directory no longer
#        exists anywhere under ~/canon. The refusal is NOT relaxed on that
#        account -- a suppressor whose current occupant happens to have been
#        deleted is still a suppressor, and the next archived tree lands under
#        the same knob. Reason (b) is independently sufficient.
#    (b) It FAILS OPEN. claims.py guards with `if elsewhere.is_dir()`, so on any
#        machine without ~/canon -- i.e. CI -- it silently does nothing and 255
#        findings return. A config that means something different in CI than it
#        does locally is not a config.
#
# 3. exclude = ["llm-docs/", "api-docs/"] -- REFUSED as tuning-to-green. Their
#    findings are real (see the api-docs generator defect in the report).
#    ⚑ MEASURED 2026-09-14 at `75f7da94`, so the size of the refusal is on the
#    record rather than implied: of 772 failing claims, 336 are in `llm-docs/`
#    and 217 in `api-docs/`. That is 553 -- 72% -- and by a wide margin the
#    largest cut available anywhere in this file. It is refused anyway.
#    🛑 THIS REFUSAL WAS ONCE ALSO THE REASON FOR A SECOND CONFIG, and it is not
#    any more. The claims config argued that the registry side's exclusion of
#    those two directories was legitimate for a DUPLICATION scan while being
#    fatal for a documentation scan, so the two positions could not live in one
#    `exclude`. The premise was false: the registry scan reads `.py` and those
#    directories hold none, so the registry-side exclude was inert and there was
#    never a second position to hold. One `exclude` now serves both scans and
#    this refusal is the only position either of them takes on the two
#    directories -- they are scanned, and they are red.
#
# 4. [[promise]] for docs/architecture.md:71 -- NOT ADDED. The path
#    `src/kanibako/deprecation.py` is conditional on an EVENT ("when the first
#    real deprecation is declared"), not a date. `until` is required and there is
#    no honest date to write. Inventing one would be a fabricated deferral.
#    Left red, and reported as a gap in what the tool can express.
#    ⚑ Re-verified 2026-09-14: the section still reads that way, the machinery
#    still sits in `salvage/`, and `src/kanibako/deprecation.py` is still absent.
#
# 5. Nothing addresses the ~474 RUNTIME/HOST-STORE path claims (box_data/,
#    workset.yaml, box.yaml, agent.yaml, registry.yaml, kanibako.cfg, vault/ ...).
#    There is no principled knob for them: they name paths in the tree kanibako
#    CREATES for a user, not in this repo, and they are spread across live docs.
#    They are not history and they are not excludable by file. This is the
#    "check cannot be made to mean something here" outcome R159 allows.
#    The tool's own designed answer is `kinemata baseline --record --until <date>`,
#    which dates them rather than pretending they are false. That is a decision
#    for the director, not for this config.
#
# 6. external = true -- NOT SET, and this is a scope decision rather than a
#    judgment. Turning it on reaches the network on every run, which an
#    air-gapped CI would fail with nothing wrong. The two links it would flag
#    today are the known untagged-version pair named above.
# ---------------------------------------------------------------------------

# The keyspace: each key carries the spec section it traces to, which is exactly
# the clause linkage the registry contract asks for.
#
# ⚑ DELIBERATELY NOT `closed = true`, and this is the measurement rather than
# caution. Closing it makes an identifier no entry declares a hard failure, and
# run that way this tree reports 24 distinct identifiers across 48 sites --
# ALL of them false. Every one is declared, just not in `keys:`:
#
#   system._boxes, system._primary_*   -> not_keys.code_residue
#   box.agent, box.agent_name          -> not_keys.renamed
#   workset.seeded, system.seeded      -> category_default_entries
#   agent.claude.common                -> plugin_contributed
#
# That is this project's own audit finding measured from the other side: the
# keyspace is CLOSED BUT NOT FLAT, and membership is answered by six manifest
# sections rather than one. `kind = "yaml-mapping"` reads a single section, so
# it cannot answer the closed-world question here however it is configured.
#
# The fix is `kind = "import"`, which exists for this case -- a project-authored
# class answering `declared()` across all six sections. Until that adapter is
# written this registry stays open, and the catch it would buy stays unbought.
# An advisory list of 24 false positives is not a weaker catch, it is a habit of
# skimming red.
#
# ⚑ IT CONTRIBUTES NOTHING TO `check`, and that is not a defect. Verified at
# source: `adapters/mapping.py` yields entries with no `antipatterns`, so the
# duplication gate has nothing to match. This registry pays for itself through
# `ids` and `unused` -- measured 2026-09-14 at `75f7da94`: `kinemata ids` exits
# 0 and projects 100 entries, `kinemata unused` exits 0 and names 8 keys nothing
# mentions outside the `machinery` below.
#
# 🛑 BUT IT DOES NOT PAY THROUGH `undeclared`, WHICH REFUSES OUTRIGHT. Measured
# 2026-09-14 at `75f7da94`, kinemata `a365474` -- `kinemata undeclared`, exit 2:
#
#   error: no declared registry can recognize its own identifiers, so none can
#   say what is undeclared. This needs a registry with an identifier syntax
#   (today: kind = "yaml-mapping" with `syntax`). Running anyway would report
#   nothing and mean nothing.
#
# The r2 config claimed this registry answers `undeclared`, and as written it
# cannot: `syntax` -- the pattern recognizing anything SHAPED LIKE a kanibako key
# -- is not declared. That is not repaired here on purpose. Choosing the pattern
# decides what counts as a key MENTION across the whole tree, which is a
# declaration in its own right and a larger decision than a merge; writing a
# plausible one to clear an exit code is how a gate comes to report a number
# nobody derived. The refusal is correct behavior and is recorded rather than
# worked around. ⚑ The `closed = true` discussion above is downstream of this:
# `adapters/mapping.py` refuses `closed` without `syntax` too, so the 24-false-
# positive measurement was made under a config this one does not yet reproduce.
[[registry]]
name = "keyspace"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "keys"
clause_field = "spec"

# The files that DECLARE keys rather than use them. Without this, `unused`
# refuses outright: every entry is mentioned by its own declaring machinery, so
# the check has nothing to report. It is a review list and never a cut list --
# it detects mention, not use.
machinery = [
  "src/kanibako/settings/keyspace_manifest.py",
  "src/kanibako/settings/settings_keyspace.py",
  "src/kanibako/settings/config_keys.py",
]

# ---------------------------------------------------------------------------
# FACT: the NINE delivery families -- the whole of what may be bound, copied,
# shared or synced into a box, which is the single-route invariant written down.
# AUTHORITY: the manifest's `categories:` section is the SPEC side of that list;
# `settings/settings_categories.py` is the CODE side, where `_DELIVERY` is, in
# that module's own words about it, "the ONE table naming every family, because
# every family is delivered".
# CATCHES: a family declared on one side and not the other, AND a family whose
# declared delivery MECHANISM disagrees with what the code produces. See `[[parity]]`
# near the END of this file.
# ⚑ TWO MECHANISMS READ THIS REGISTRY, corrected 2026-09-15: that table, and the
# second `[[shape]]` block, which arrived after this comment said "nothing else
# here". A THIRD reads the same SECTION through a different registry -- the
# `bind-shaped` view below, which is a narrowing of these rows and not of this
# registry.
#
# ⚑ IT EARNS ITS PLACE THROUGH `parity` AND `shape`, NEVER `check`, and a reader
# must not take a green `check` as covering it. A `yaml-mapping` registry
# contributes NOTHING to the duplication gate: verified at source against
# kinemata `a365474` and
# RE-VERIFIED at `00044f2` (`adapters/mapping.py` is byte-unchanged across those
# nine commits), `adapters/mapping.py` yields entries with no `antipatterns`, so `check` has
# nothing to match -- the same published limit already recorded against
# `keyspace` above. Every row here is a row `check` never looks at.
#
# ⚑ `clause_field = "spec"` IS MEASURED, not copied from `keyspace` above. The
# records under `categories:` are heterogeneous -- `scopes` is a list and
# `scopes_spec` is a string, so neither has a field to read -- and the question
# was whether the loader errors on them. It does not: `_clauses_of` returns an
# empty tuple for any record that is not a mapping. Measured 2026-09-14 at
# `71c327e3` through the loader itself: all nine families read their `spec`
# value, the two above read `()`. The linkage is kept for the nine that have one.
[[registry]]
name = "categories"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "categories"
clause_field = "spec"

# ---------------------------------------------------------------------------
# THE NARROWED VIEWS. The four registries below arrived 2026-09-15 with kinemata
# `0.1.0`, and three of them are the SAME YAML section a registry above already
# declares, narrowed by `where` to a group. That is not a second copy of the
# declaration: `where` makes the registry BE the subset, so membership keeps its
# meaning ("and there is nothing else") over the group rather than over the file,
# which is the whole reason the key sits on the registry and not on the check.
#
# ⚑ A NARROWED VIEW DECLARES NO `clause_field`, and the omission is deliberate.
# `clause_field = "spec"` links a row to the specification clause it is traced
# from, and `claims` reads that link; declaring it on a view of rows another
# registry already links would state the same linkage twice for one row.
#
# 🛑 WHAT A `where` CANNOT DO, AND IT IS THE LIMIT TO KNOW: a selector SELECTS. A
# row that stops satisfying the guard leaves the view SILENTLY -- it does not
# become a finding. So each of these declarations claims something about the rows
# that are in the group, never that the group still has the members it had. The
# hand-written tests these mirror claim BOTH, which is why none of them is
# retired here; see the note on each `[[parity]]` table below for which half a
# declaration reaches.
#
# ⚑ A `where` IS EVALUATED AT CONFIG LOAD, so a predicate that will not import
# refuses the config for EVERY command, not just the one reading the view.
# `src/kinemata_views.py` carries the measurement of where such a predicate can
# live in this repository and what that costs; read its header before moving it.
#
# ⚑ `kinemata unused` SKIPS ALL FIVE, and it skipped `categories` before them.
# Measured 2026-09-15, `0.1.0`: the command prints one `skipped:` line per
# registry that declares no `machinery` and no `home`, because every entry is
# mentioned by the file that declares it and the check would have nothing to
# report. That is the SAME condition `categories` has always been in, it is not
# new, and `unused` is not a CI gate. Declaring `machinery` on these would be
# declaring it a second time for rows the `keyspace` registry already covers;
# adding it is the lever if `unused` is ever turned on.
#
# ⚑ AND `kinemata check`'s `silent:` TALLY MOVED 115/206 TO 155/246 BY ADDING
# THEM -- exactly the 40 entries the five declare, and no finding either way
# (rc=0 before and after, 2026-09-15). A `yaml-mapping` registry yields entries
# with no `antipatterns`, so every row it declares is silent to the duplication
# scan by construction; the `keyspace` registry's own note above says the same
# thing about itself. The tally is arithmetic, not a signal.

# FACT: seven of the nine delivery families are BIND-SHAPED -- the key ends at
# the family and the destination is the sub-key -- and the code's terminal tails
# are the same seven.
# AUTHORITY: `settings_keyspace.TERMINAL_CATEGORY_TAILS` is the code side; the
# manifest's `categories:` records are the spec side, as they are for the
# `[[parity]]` on `categories` above.
# CATCHES: a family that is bind-shaped on one side and not the other -- the
# `manifest == code` half of `TestTheCategoriesBlockShape`.
#
# 🛑 THE GUARD IS `cli_set`, AND THE ALTERNATIVES ARE MEASURED, NOT ARGUED. The
# `categories:` section holds two NON-FAMILY records, `scopes` (a list) and
# `scopes_spec` (a string), which the mapping adapter yields as
# `extra = {"value": ...}`; `cli_set` is present on all nine families and on
# neither of those, so guarding on its VALUE partitions exactly the families --
# the same reasoning, and the same cell, the `[[shape]]` block on `categories`
# already rests on. It is a THIRD, independent cell: the claim this view makes is
# about the terminal tails, so the guard reads neither side of its own comparison.
#
# ⚑ UPSTREAM PROPOSED A PROJECT-SUPPLIED PREDICATE HERE AND IT IS DECLINED, by
# running both rather than by reading them. Their `bind_shaped(entry)` is
# `set(entry.extra) != {"value"} and not entry.extra.get("parametric")` -- two
# filters, which is why it could not be a guard in the vocabulary they had.
# Measured 2026-09-15 under `0.1.0`, both spellings against this tree: the
# predicate reports `7 declared, 7 produced, in agreement` and `cli_set` reports
# the identical line, over the identical seven. The declarative guard is kept
# because it needs no import and therefore cannot refuse the config.
# ⚑ AND IT SIDESTEPS A ROUGH EDGE UPSTREAM FLAGGED AND WE AGREE IS REAL: a
# `yaml-mapping` row that is not a mapping arrives as `extra = {"value": <raw>}`,
# and a mapping row carrying its own `value:` field is spread in with `value`
# among the others -- every family here carries `value:` -- so the two shapes are
# indistinguishable by that key and their predicate has to discriminate on the
# FIELD SET instead. That is a heuristic standing in for a type test, exactly as
# they say; it happens to be right on this data and nothing makes it stay right.
# Not filed as a defect upstream by us either: the guard below does not need it.
[[registry]]
name = "bind-shaped"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "categories"
where = { field = "cli_set", equals = false }

# FACT: the workset seed DENY list names the workset metadata file.
# AUTHORITY: `settings/config.py`'s `WORKSET_META_FILE` is the code side; the
# manifest's `policy.seed_whitelists.workset.deny` map is the declared side.
# CATCHES: the file being renamed on one side -- a deny row that stops naming the
# real metadata file denies nothing, silently, at seed time.
#
# ⚑ THE REGISTRY IS NOT NARROWED; the `relation` on its `[[parity]]` is what
# makes this expressible. The deny map legitimately names MORE than this one file
# (eight rows), so an equality would report the other seven forever.
[[registry]]
name = "workset-denials"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = ["policy", "seed_whitelists", "workset", "deny"]

# FACT: where the manifest declares a row's `standalone` arm as NOTHING, the
# standalone anchor floor must emit NO KEY for it.
# AUTHORITY: `settings_launch.workset_anchor_floor(mode="standalone")` is the code
# side; the `default:` map's `standalone` arm is the declared side.
# CATCHES: a floor literal appearing for a row declared empty -- which would
# shadow nothing on a finished standalone box and FABRICATE an identity on a
# half-created one, in the words of the test this mirrors.
#
# ⚑ THE PREDICATE IS REQUIRED AND THE REASON IS IN ITS DOCSTRING: "the arm is
# declared empty" and "the row has no arm at all" collapse to the same value in a
# declarative guard, so `matches` would sweep in every row that never had one.
[[registry]]
name = "standalone-absences"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "keys"
where = { holds = "kinemata_views:standalone_is_absent" }

# FACT: a `type: path` row that is `set: never` is DERIVED, has no set route, and
# must NOT be claimed by the set-time path predicate.
# AUTHORITY: `config_keys.is_path_valued_key` is the code side -- [R147]'s
# SET-TIME half, by its own header; the manifest's `type:`/`set:` columns are the
# declared side.
# CATCHES: `KEY_TYPES` quietly growing a `meta.*` entry, which would advertise a
# set-time refusal that can never fire and hand `path_key_anchor` a key with no
# anchor to name.
[[registry]]
name = "never-settable-paths"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "keys"
where = { holds = "kinemata_views:never_settable_path" }

# FACT: the three `workset.auth.*` rows declare a PER-MODE default, and their
# `primary` arm is what the auth chain floor emits.
# AUTHORITY: `settings_launch.auth_chain_floor` is the code side; the `primary`
# arm of each row's `default:` map is the declared side, and it is the authority
# -- the arms are `@`-ref FORMULAS sourced from the spec, so a divergence means
# the code moved.
# CATCHES: a floor formula edited away from the declared one -- a value question,
# which every mechanism in this file before 2026-09-15 was unable to ask of a
# mode-keyed row at all.
#
# ⚑ `id_matches` RATHER THAN `matches`: a guard's `matches` needs a field, and
# the operator that claims something about the entry's own identifier is spelled
# separately. (`0.1.0` says so in the refusal, which is how this was found.)
# ⚑ THE ORACLE FILTERS ON THE SAME PREFIX THE VIEW DOES, and it has to: the floor
# emits eight keys, five of which are not `workset.auth.*` rows. Both sides scoped
# by one rule, spelled twice, is the cost of a narrowed view whose code side
# answers for more than the view holds.
[[registry]]
name = "workset-auth-chain"
kind = "yaml-mapping"
source = "src/kanibako/data/keyspace-manifest.yaml"
section = "keys"
where = { id_matches = "^workset\\.auth\\." }

# ---------------------------------------------------------------------------
# FACT: the channel system's wire vocabulary -- the two synthesized workset
# tokens, the default chat leaf, and where helper scripts live inside a box.
# AUTHORITY: `channels.py` is the module every other package imports these from;
# `helpers.py` owns the helper-script side of the same subject. Nothing else in
# the tree declares a workset token.
# CATCHES: the known finding -- `project/workset.py:377` spelling "__PRIMARY__"
# and "__STANDALONE__" as literals beside `channels/channels.py:26-27`.
[[registry]]
name = "channels"
kind = "python-constants"
modules = [
  "src/kanibako/channels/channels.py",
  "src/kanibako/channels/helpers.py",
]

# ---------------------------------------------------------------------------
# ⚑ MERGED 2026-09-14. Two drafts declared overlapping modules over this
# subject: `kinemata-registries.toml`'s `store-layout` (`bootstrap.py`) and the
# r2 config's `constants` (`bootstrap.py` + `kb_store.py`). Two registries over
# one module is two carriers of one declaration, so this is the union, and BOTH
# stated reasons are kept below rather than one being chosen.
#
# THE NAME `constants` WAS DROPPED. It names the ADAPTER KIND, not the fact, and
# the rule the registry comments here follow -- state the FACT and the AUTHORITY
# -- cannot be satisfied by it. `store-layout` names a fact, so it survives.
# Anything quoting a figure "from the `constants` registry" is quoting this one.
#
# FACT (from `store-layout`): the on-disk store layout and the XDG environment it
# is derived from -- every directory name under the kanibako store, the config
# filenames, the site config location, the shell files seeded into a box home.
# AUTHORITY: `bootstrap.py` is where the store is laid out before anything else
# runs; it is the module the layout tier is built on, so a directory name spelled
# anywhere else is a second copy of the layout. Its own docstring states the rule
# ([R157]): every path literal in the tree belongs here and nowhere else.
#
# FACT (from `constants`): the key store's own reserved node names, alongside the
# path leaves and XDG variable names above. AUTHORITY: `kb_store.py` declares the
# value space a `KeyStore` holds.
#
# ⚑ `kb_store.py` was ADDED after scoring the r2 config against `f26b70e1`, and it
# is the whole of the one miss. The first draft declared `bootstrap.py` alone and
# missed `settings_views.py:190`, which defaulted a parameter to
# "binding_derivations" rather than reading `kb_store.BINDING_DERIVATIONS_NODE`
# -- the one site of the ten that commit enumerates which that config did not
# reach. It was a module absent from a declaration, not a mechanism that failed:
# adding the file catches the site with no other change. (That particular site is
# HISTORY as of `f26b70e1`, which fixed it; the module stays declared because it
# is the authority, not because of one site.)
[[registry]]
name = "store-layout"
kind = "python-constants"
modules = [
  "src/kanibako/settings/bootstrap.py",
  "src/kanibako/settings/kb_store.py",
]

# ---------------------------------------------------------------------------
# FACT: the settings tier's own filenames and the two key/subkey tokens the
# config engine reserves -- `box.yaml` / `workset.yaml` / `agent.yaml` ([R140]),
# the setup marker key, and the `default` agent sub-scope.
# AUTHORITY: `config.py` declares the three meta filenames the whole config
# engine opens; `config_keys.py` declares the key tokens that engine reserves.
# This pair is the config file layer's single declared place.
# NOTE: `WORKSET_META_FILE = "workset.yaml"` is the example kinemata's own
# introduction.md uses for this adapter, taken from this very module.
#
# ⚑ IT WAS MEASURED SILENT at `f26b70e1` under the 2026-09-09 config: every one
# of its five entries exceeded the default frequency suppression of 20 sites
# (`workset.yaml` alone had 160), so it reported zero, and per [R159] that was
# reported rather than tuned away.
# ⚑ NO LONGER SILENT, re-measured 2026-09-14 at `75f7da94` under THIS file:
# `kinemata check` reports SETUP_MARKER_KEY at 1 site,
# `settings/defaults_inventory.py:201`. Do not carry the old sentence forward --
# the difference is at least partly this file's `exclude`, which the 2026-09-09
# config did not have, so the two figures are not a before-and-after of the tree.
[[registry]]
name = "meta-files"
kind = "python-constants"
modules = [
  "src/kanibako/settings/config.py",
  "src/kanibako/settings/config_keys.py",
]

# ---------------------------------------------------------------------------
# FACT: user-facing text -- status tokens, one-time-setup progress lines,
# warnings, and the error strings the settings layer and the key store raise.
# AUTHORITY: `messages.py` is the settings tier's declared string table;
# `keystore_strings.py` is the same thing for the key store, split out because
# the store is imported by code that must not import the settings package.
# A printed line respelled inline is invisible to a test tally, which is exactly
# the class this catches.
[[registry]]
name = "messages"
kind = "python-constants"
modules = [
  "src/kanibako/settings/messages.py",
  "src/kanibako/settings/keystore_strings.py",
]

# ---------------------------------------------------------------------------
# FACT: the canon skeleton and the template store -- the guest-side canon tree
# (bible/handbook/directives layout, the ROM guide path, skeleton modes) and the
# names of the packaged template moulds.
# AUTHORITY: `core_defaults.py` declares the canon layout that the defaults files
# and the seeding path both read; `launch/templates.py` declares the template
# store's own directory names. Both sides of one subject: what gets laid into a
# box's canon and template trees at create.
[[registry]]
name = "canon-layout"
kind = "python-constants"
modules = [
  "src/kanibako/settings/core_defaults.py",
  "src/kanibako/launch/templates.py",
]

# ---------------------------------------------------------------------------
# Canonical values that are NOT module-level strings, so `python-constants`
# cannot reach them. Each of these is a collection literal or an enum, and the
# duplication is a second literal spelling the same sequence.
#
# ⚑ This registry is the reason `kb_store.py` and `core-defaults.yaml` appear
# both here and in a `python-constants` registry above WITHOUT being a second
# declaration of one fact: a `home` is per ENTRY and says where that entry is
# defined, while `modules` is what the constants adapter derives antipatterns
# FROM. The two adapters reach different values in the same file -- that is the
# stated reason this registry exists at all.
[[registry]]
name = "canonical"
kind = "code-patterns"

  # kb_store.py:11 calls itself the single source for every directional
  # derivation. Seven sites respell the sequence anyway, two of them as a
  # superset with `config` prepended and two as an order-carrying dict.
  [[registry.entry]]
  id = "SCOPE_CONTAINMENT"
  antipatterns = [
    '"system",\s*"agent",\s*"workset",\s*"box"',
    '"system":\s*0,\s*"agent":\s*1',
  ]
  home = ["src/kanibako/settings/kb_store.py"]
  clauses = ["§2"]
  note = "containment order; one declared sequence, not a literal per site"

  # The box.mode tokens. The enum at paths.py:55 is the home.
  #
  # ⚑ Two sites match and they are NOT the same finding.
  # `defaults_inventory.py:65` is a plain copy. `settings_launch.py:459` is a
  # deliberate exception -- a floor module with no module-level kanibako
  # imports -- and belongs in the baseline with that reason, not in an
  # `exclude` line that would also hide the next real one.
  [[registry.entry]]
  id = "BoxMode"
  antipatterns = ['"primary",\s*"named",\s*"standalone"']
  home = ["src/kanibako/settings/paths.py"]
  note = "the box.mode tokens; the enum is the home"

  # The canon chapter leaf. `core-defaults.yaml` spells `@<scope>.canon/handbook`
  # for all four scopes, so the destination is a CHAPTER fact.
  #
  # ⚑ `PACKAGED_HANDBOOK` in templates.py is a different fact that happens to
  # share the spelling -- the packaged SOURCE subtree -- which is why the home
  # here is the YAML rather than that constant. The two call sites pair them in
  # one expression: `base_src / PACKAGED_HANDBOOK, std.canon / "handbook"`,
  # constant for the source and a bare literal for the destination.
  [[registry.entry]]
  id = "CANON_CHAPTER_LEAF"
  antipatterns = ['canon\s*/\s*"handbook"', '"canon/handbook"']
  home = ["src/kanibako/data/core-defaults.yaml"]
  note = "the chapter destination -- a chapter fact, not a packaging fact"

  # FACT: `settings_categories.py` is the declaring authority for the
  # bind-category name; a second declaration of that name elsewhere is a
  # collision. CATCHES: a module that redeclares `_BIND_CATEGORIES` instead of
  # importing it or naming its own subject.
  #
  # 🛑 THE r2 CONFIG'S COMMENT ON THIS ENTRY IS STALE AND IS NOT CARRIED. It
  # said the rename was "OPEN on this project's own board as an undecided
  # rename" and that "a finding here is correct behavior and must NOT be
  # exempted". The rename LANDED in `75f7da94`: the 5-member frozenset of path
  # segments in `settings_assemble.py` became `BIND_CATEGORY_TOKENS` (and lost
  # its underscore, because `settings_merge.py` imports it across a module
  # boundary). The 6-member tuple of category key tails here kept the name.
  #
  # ⚑ SO THERE IS NO SPELLING TO UPDATE, and that is the measurement rather than
  # an omission: the symbol at the declared home is still `_BIND_CATEGORIES`.
  # What the rename removed was the SECOND spelling -- which is the finding this
  # entry existed to report. The entry is therefore CURRENTLY SILENT, by the
  # defect being fixed rather than by the check being weakened.
  #
  # 🛑 `BIND_CATEGORY_TOKENS` is deliberately NOT added as an antipattern. It is
  # now a distinct name for a distinct fact with its own home, and
  # `settings_merge.py` names it four times as an IMPORT and its uses -- which
  # is the correct behavior. Adding it would report four correct lines to make
  # this entry fire, which is inventing a pattern rather than repairing one.
  #
  # ⚑ SILENCE CONFIRMED BY MEASUREMENT, not by reading. 2026-09-14 at
  # `75f7da94`: `kinemata -r canonical check` reports 6 bypasses across
  # CANON_CHAPTER_LEAF, SCOPE_CONTAINMENT and BoxMode, and none for this entry;
  # `kinemata unused` lists `_BIND_CATEGORIES` among the entries nothing mentions
  # outside the file that declares it, which is the same fact from the other
  # side. KEPT ANYWAY -- the entry is what makes a future second declaration a
  # finding, and deleting a check because the defect it caught was fixed is how
  # the defect comes back unobserved.
  [[registry.entry]]
  id = "_BIND_CATEGORIES"
  antipatterns = ['_BIND_CATEGORIES']
  home = ["src/kanibako/settings/settings_categories.py"]
  note = "the category-declaration authority; a second declaration is a collision"

# ---------------------------------------------------------------------------
# CONSIDERED AND NOT DECLARED, recorded so the next rebuild does not re-derive it
# from scratch. NEITHER is an exclusion: no finding is suppressed by their
# absence, because no registry here claims their subject.
#
# 1. guest paths -- `settings/settings_resolve.py` (GUEST_HOME, and the workspace
#    / vault / pinned-root relpaths) plus `box_supervisor.py`. NOT declared
#    because the two modules are NOT one authority: `box_supervisor.py` is half
#    the PID-1 pair, pinned flat and stdlib-only, and it re-declares
#    `.kanibako` because it CANNOT import the settings package. A registry over
#    both reports that documented, deliberate duplication as its principal
#    output. Declaring `settings_resolve.py` alone is defensible and was measured
#    separately; it is left out here so this file matches the five-registry shape
#    the 2026-09-09 run used.
# 2. `commands/flags.py`, `commands/start.py`, `runtime/image_sharing.py`,
#    `project/workset.py`, `settings/agent_config.py` -- each holds two or three
#    constants that are local to one command or one module. Command-local
#    constants are not "information used broadly across the project"
#    (design.md ss6), so they are not registry material.
#
# MEASURED YIELD OF EVERY OTHER CONSTANT-CARRYING MODULE IN THE TREE, so the
# next person deciding this does it with numbers instead of re-deriving them.
# One registry per module, `check` at default suppression, f26b70e1 -- and
# ⚑ NOT re-measured since, nor under this file's `exclude`, which the 2026-09-09
# config did not have. Treat them as the shape of the answer, not the answer:
#
#   settings/bootstrap.py        39   (declared above, in store-layout)
#   settings/messages.py         13   (declared above)
#   settings/core_defaults.py    11   (declared above, in canon-layout)
#   runtime/image_sharing.py      8
#   launch/templates.py           6   (declared above, in canon-layout)
#   commands/start.py             4
#   project/workset.py            3
#   vscode/vscode_config.py       2
#   settings/agent_config.py      2
#   proxy/server.py               2
#   box_supervisor.py             2
#   settings/keyspace_manifest.py 1
#   runtime/rig_bundle.py         1
#   settings/config.py            0    settings/config_keys.py        0
#   settings/keystore_strings.py  0    settings/settings_resolve.py   0
#   settings/workset_dirkeys.py   0    settings/settings_launch.py    0
#   settings/agent_select.py      0    launch/creds_watcher.py        0
#   commands/flags.py             0    commands/box/_lifecycle.py     0
#   runtime/baseline.py           0    __init__.py                    0
#
# ⚑ THE ONE PRODUCTION FINDING THE FIVE CONSTANTS REGISTRIES MISS:
#   `proxy/server.py` declares `MESSAGES_PATH = "/v1/messages"` and
#   `packages/agent-claude/.../claude/target.py:448` spells it inline. That is a
#   genuine duplication across the distribution boundary. It is left undeclared
#   here only because two sites is not "used broadly"; if that judgment is wrong,
#   this is the registry to add, and it is worth one finding.
#
# OVERLAP AUDIT, 2026-09-14 -- every pair checked before the merge above was
# called the only one. By declared module:
#   store-layout x constants        bootstrap.py         -> MERGED (above)
#   constants x channels/meta-files/messages/canon-layout  none
#   store-layout x channels/meta-files/messages/canon-layout  none
#   channels x meta-files/messages/canon-layout          none
#   meta-files x messages/canon-layout                   none
#   messages x canon-layout                              none
# Two near-misses that are NOT overlaps, checked and recorded so they are not
# re-checked:
#   * `keyspace.machinery` names `settings/config_keys.py`, which `meta-files`
#     declares as a module. Different roles over one file: `machinery` is read
#     ONLY by `unused` and means "this file mentions keys because it declares
#     them", while `modules` is what the constants adapter derives antipatterns
#     from. Neither declares the other's fact, and the kinds differ.
#   * `canonical` homes `kb_store.py` (in store-layout) and
#     `src/kanibako/data/core-defaults.yaml` -- which is the DATA file, not
#     `settings/core_defaults.py`, the module `canon-layout` declares. Different
#     files with adjacent names; checked rather than assumed.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# FACT: the CALL SEAMS and the RETIRED NAMES -- identifiers that may be written
# only at a named set of sites, and identifiers that may be written nowhere.
# AUTHORITY: each entry's `home` IS the sanctioned set; an entry with no `home`
# names a mechanism that was removed and must not come back.
#
# ⚑ WHY A SECOND `code-patterns` REGISTRY AND NOT ROWS IN `canonical`: that one
# holds canonical VALUES that `python-constants` cannot reach (collection
# literals, enums). These are not values at all -- they are function names and
# call shapes -- and the two facts want different comments, not one heap.
#
# 🛑 EACH `home` IS A LITERAL REPO-RELATIVE PATH FRAGMENT. The tests these come
# from find the same carrier through `inspect.getfile` on the imported module,
# so a module MOVE keeps the test green and silently empties the declaration
# here. Re-read every `home` below when a module moves.
# ⚑ WHICH MOVES SURVIVE, EXACTLY: `bypass._is_home` compares path PARTS by
# SUFFIX, in both directions. A move that changes only LEADING directories
# still matches, so the trailing parts are the whole of what is pinned. A
# RENAME, or a package move that changes a trailing directory, does not -- and
# it fails SILENT: the entry keeps scanning, its sanctioned site stops being
# recognized, and the failure is visible only as a finding nobody expected.
#
# 🛑 EVERY ENTRY IN THIS BLOCK IS INERT ON A CLEAN TREE, AND THAT IS WHAT A
# PROHIBITION LOOKS LIKE. Measured 2026-09-14 under kinemata `0.1.0a2.dev1`:
# `check` reports ZERO sites for all fourteen and stays rc=0, because the pytest
# families they come from are green. They were proved LIVE rather than assumed,
# by planting one mutant per entry in a throwaway tree: `check` went rc=1 with
# 17 bypasses, all fourteen entries firing, and `home` suppressed every
# sanctioned site. A zero here is the claim holding.
# 🛑 THAT MUTATION HARNESS IS THE ORACLE FOR THIS GREEN, AND NOTHING ELSE IS.
# A prohibition that matched nothing because it was misspelled reports exactly
# what a prohibition that holds reports. Re-plant before trusting a zero here:
# unmeasured, the green is silence.
# 🛑 THE COST, STATED UP FRONT: `kinemata unused` goes from 25 entries to 39,
# every one of the fourteen on its list. That command is "a review list, never a
# cut list" in its own words, and these are the entries it is most wrong about --
# an entry nothing mentions is the POINT of a prohibition. Do not cut them on
# its say-so.
#
# 🛑 EACH ENTRY IS BROADER THAN THE TEST IT COMES FROM, and deliberately so:
# kinemata scans the whole tree and `home` is an ALLOWLIST, where the tests name
# a handful of files to scan and assert absence there. There is no way to say
# "fires only inside these three files". Every entry below therefore bans the
# spelling EVERYWHERE except its `home`, which is the stronger claim. Where that
# is not the invariant we mean, the entry is marked.
# 🛑 THE WIDENING IS A DECISION, NOT AN ARTEFACT OF THE TOOL. The broader claim
# -- this spelling belongs to its `home` and nowhere else -- is the invariant we
# actually mean; the source tests name one to three files only because that is
# what a pytest scan could reach. IT FOLLOWS THAT A RED HERE ON A SITE NO TEST
# COVERS IS A FINDING TO EXAMINE, NOT A REASON TO NARROW THE ENTRY BACK. Narrow
# one only by deciding, on the record, that the wider claim was wrong.
[[registry]]
name = "seams"
kind = "code-patterns"

  # ⚑ THE ALLOWLIST IS THE WHOLE POINT, and it is the one family in this block
  # whose test and this entry say EXACTLY the same thing:
  # `tests/test_settings/test_defaults_enforcement.py` keeps `_SANCTIONED` (four
  # files) plus an empty `_QUARANTINED`, and `home` below is that list plus the
  # definition site. The test's OTHER direction -- every allowlist entry still
  # HAS a call site -- is NOT expressible here and stays in pytest.
  [[registry.entry]]
  id = "write_nested_key"
