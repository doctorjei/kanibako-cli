# ---------------------------------------------------------------------------
# THE FIRST TABLE HERE THAT TRANSLATES BOTH THE KEY AND THE VALUE, and it needs
# `0.3.0`: `translate_identifier` does not exist before it. The row declares
# `agent.<agent>.template = @meta.agent.<agent>.path/template`, and the code
# emits `agent.<node>.template = @config.agents/<dirname>/template`. That is a
# hop on the KEY and a hop on the VALUE, and on a value comparison `translate`
# is spent on the values -- so before `0.3.0` the key hop had no spelling.
#
# ⚑ WHAT THE ONE-HOP RUN REPORTED, reproduced 2026-09-24 on this table with
# `translate_identifier` removed: rc=1, `FAIL: 2 disagreement(s)` --
# `agent.gemma℘claude.template: produced, declared by nothing` and
# `agent.<agent>.template: declared, produced by nothing`. Two membership
# findings, and NO VALUE COMPARED for the node arm, because a value is compared
# only for an identifier both sides carry. (`agent.default.template` needs no
# hop and was compared.)
# 🛑 THE ORACLE COULD HAVE MADE THAT GREEN BY PRINTING `agent.<agent>.template`
# ITSELF, and that is the route this table refuses. Re-keying the oracle's
# output to the declaration's spelling hides the hop where no reader of this
# config can see it; a capability you can route around silently is not absent,
# it is undeclared. Both hops are therefore HERE, one key each, and the oracle
# prints what the code returns and nothing else.
#
# ⚑ THE TWO HOPS ARE THE SPEC'S OWN COMPOSITION, NOT OURS.
# `translate` is `meta.agent.<agent>.path` -- keyspec §2d
# `@config.agents/%tolower(@meta.agent.<agent>.name)%`, a no-op fold on a
# canonical node -- with the node's store name substituted;
# `translate_identifier` is the parametric `<agent>` segment
# substituted with the same node. Each touches the placeholder and nothing
# else, so the `template` leaf is compared literally on both rows.
#
# 🛑 THE NODE IS A PERSONA, AND A BARE AGENT WOULD HIDE A DEFECT. For a persona
# the key segment is the canonical `℘` node and the store dirname is the `+`
# spelling (`agent_config.store_dirname`); for a bare agent the two are one
# string. Measured, not reasoned: with the node arm's `store_dirname(agent_id)`
# replaced by a bare `agent_id`, this table with node `claude` stays rc=0,
# `2 declared, 2 produced, in agreement` -- blind to exactly the KEY vs
# DIRECTORY split the node arm's own comment states.
#
# Measured 2026-09-24 on this tree, kinemata `0.3.0`:
#   `# agent-template-source: 2 declared, 2 produced, in agreement, agreeing on
#   default.`  rc=0
# FOUR NEGATIVE CONTROLS, each one edit in a scratch copy under /tmp, each
# restored to green afterwards, each rc=1 with `FAIL: 1 disagreement(s)` naming
# BOTH values:
#   node arm, `store_dirname(agent_id)` -> `agent_id` (code):
#     `agent.gemma℘claude.template: default declared
#     '@config.agents/gemma+claude/template', code produces
#     '@config.agents/gemma℘claude/template'`
#   node arm leaf -> `canon` (code):
#     `... code produces '@config.agents/gemma+claude/canon'`
#   `agent.<agent>.template` default leaf -> `canon` (manifest):
#     `... default declared '@config.agents/gemma+claude/canon', code produces
#     '@config.agents/gemma+claude/template'`
#   fallback arm node `default` -> `shell` (code):
#     `agent.default.template: default declared
#     '@config.agents/default/template', code produces
#     '@config.agents/shell/template'`
# HOP CONTROL, `translate` removed and `translate_identifier` kept: rc=1,
# `agent.gemma℘claude.template: default declared
# '@meta.agent.<agent>.path/template', code produces
# '@config.agents/gemma+claude/template'`. So the value hop is load-bearing too.
# VACUITY CONTROL, the oracle's `print` removed: rc=1, both rows `declared,
# produced by nothing`. `equal` needs no vacuity guard, and this is why.
#
# 🛑 WHAT THIS DOES NOT REACH: the node arm's `@config.agents/...` is an
# UNROLLED hop -- `meta.agent.<a>.path` itself is never consulted by
# `agent_template_defaults` -- so a change to how `settings_launch` builds that
# anchor would not red here. The `meta.*` rows are `set: never` and belong to
# their own floor.
[[parity]]
registry = "agent-template-source"
command = ["{python}", "-c", """
from kanibako.launch.templates import agent_template_defaults
for key, value in sorted(agent_template_defaults("gemma℘claude").items()):
    print(f"kanibako-template-source: {key}={value}")
"""]
extract = '(?m)^kanibako-template-source: ([^\s=]+)=(\S+)$'
field = "default"
authority = "declared"
translate = { pattern = '^@meta\.agent\.<agent>\.path/', replacement = "@config.agents/gemma+claude/" }
translate_identifier = { pattern = '^agent\.<agent>\.', replacement = "agent.gemma℘claude." }

# ⚑ THE ORACLE PRINTS EVERY KEY EXCEPT THE FALLBACK ARM: `agent.default.template`
# is `agent-template-source`'s row, and this one-row view's `equal` would red it
# as undeclared here. Printing every other key, rather than `agent.shell.template`
# alone or only `agent.shell.*`, keeps "and nothing else" over the whole shell
# arm: a stray key of ANY name reds as produced but not declared (the last two
# controls below).
# ⚑ `json.dumps` IS THE SPELLING `format = "json"` PARSES BACK, so the `None`
# prints as `null` and a string prints quoted. The extract's value group is
# `(.+)`, not `\S+`, so a JSON string holding a space would still be captured
# whole.
#
# Measured 2026-09-24 on this tree, kinemata `0.4.0`, `PYTHONPATH=src`:
#   `# shell-template-none: 1 declared, 1 produced, in agreement, agreeing on
#   default.`  rc=0
# Under `0.3.0` this was a membership view and read `1 declared, 1 produced, in
# agreement.` -- the value half is what `format = "json"` added. `check`,
# `shape`, `undeclared` and `claims` print byte-identical output against the
# membership view (claims compared in a git clone, since outside a repository it
# prints `NOT CHECKED: commit hashes` and a different `unsettled:` tally).
# SIX NEGATIVE CONTROLS, each one edit in a fresh `mktemp` copy under /tmp run
# with `PYTHONPATH=<copy>/src`, each rc=1 with `FAIL: 1 disagreement(s)`:
#   manifest cell -> `"@config.agents/shell/template"`:
#     `agent.shell.template: default declared '"@config.agents/shell/template"',
#     code produces 'null'`
#   manifest cell `default: null` removed:
#     `agent.shell.template: the declaration records no default, and the code
#     produces 'null'`
#   the key OMITTED for node `shell` (the shape [R177] rejects):
#     `agent.shell.template: declared, produced by nothing`
#   the node arm floored as a store path (the pre-`26db59aa` code):
#     `agent.shell.template: default declared 'null', code produces
#     '"@config.agents/shell/template"'`
#   a stray key added to the shell arm, `agent.shell.extra = None`:
#     `agent.shell.extra: produced, declared by nothing`
#   a stray NON-shell key added to the shell arm, `agent.claude.template = "x"`
#   (rc 0 while the oracle printed only `agent.shell.*`):
#     `agent.claude.template: produced, declared by nothing`
# VACUITY: `equal` over a one-row view reds a silent oracle as "produced by
# nothing" -- the omission control above is that case -- so it needs no guard
# of its own.
[[parity]]
registry = "shell-template-none"
command = ["{python}", "-c", """
import json
from kanibako.launch.templates import agent_template_defaults
for key, value in sorted(agent_template_defaults("shell").items()):
    if key != "agent.default.template":
        print(f"kanibako-shell-template: {key}={json.dumps(value)}")
"""]
extract = '(?m)^kanibako-shell-template: ([^\s=]+)=(.+)$'
